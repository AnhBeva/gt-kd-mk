Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 1. Sales Là Gì?\n\n## Câu hỏi bản chất\n\n> Sales thật sự làm việc gì?\n\n## Tình huống mở bài\n\nMột founder làm app AI học tập gọi cho phụ huynh và nói rất nhiều về thuật toán, bài tập tự động, giao diện đẹp và tương lai của AI giáo dục. Phụ huynh nghe lịch sự nhưng cuối cùng nói \"để tôi suy nghĩ thêm\". Founder kết luận khách chưa hiểu sản phẩm nên cần nói kỹ hơn.\n\nVấn đề có thể không nằm ở việc nói chưa đủ. Có thể founder chưa hiểu phụ huynh đang lo gì, con học ra sao, ai quyết định trả tiền, phụ huynh cần bằng chứng nào và sản phẩm có phù hợp với bối cảnh gia đình đó không.\n\n## Vì sao bài này quan trọng\n\nNếu hiểu sai sales, người học sẽ biến bán hàng thành thao túng, spam, nói quá hoặc giảm giá. Nếu hiểu đúng, sales là năng lực thương mại hóa giá trị: chọn đúng khách, hỏi đúng, tư vấn đúng, đặt kỳ vọng đúng và tạo doanh thu không phá hỏng niềm tin.\n\n## Nguyên lý first principles\n\nSales tồn tại vì khách hàng không tự động chuyển từ \"biết sản phẩm\" sang \"mua sản phẩm\".\n\nKhách cần đi qua 6 ngưỡng:\n\n1. Tôi có vấn đề này không?\n2. Vấn đề này có đủ quan trọng không?\n3. Giải pháp này có phù hợp với tôi không?\n4. Tôi có tin người bán và doanh nghiệp không?\n5. Rủi ro mua có chấp nhận được không?\n6. Bước tiếp theo có rõ và đáng làm không?\n\nSales tốt giúp khách đi qua các ngưỡng này bằng sự thật, câu hỏi, bằng chứng và đề xuất phù hợp.\n\n## Kiến thức nền chi tiết\n\nSales là quá trình chuyển giá trị tiềm năng thành cam kết thực tế. Giá trị tiềm năng nằm trong sản phẩm, thông điệp, năng lực doanh nghiệp hoặc lời hứa giải quyết vấn đề. Cam kết thực tế có thể là khách đồng ý demo, dùng thử, trả tiền, ký hợp đồng, triển khai, gia hạn hoặc giới thiệu.\n\nSales khác marketing ở điểm tiếp xúc. Marketing làm nhiều người biết, hiểu, tin và quan tâm ở quy mô rộng. Sales làm việc sâu hơn với từng cơ hội cụ thể: khách này có phù hợp không, vấn đề của họ là gì, ai quyết định, rào cản nào còn tồn tại, giá trị đủ lớn không, bước tiếp theo là gì.\n\nSales cũng khác chăm sóc khách hàng. Chăm sóc khách hàng xử lý trải nghiệm sau mua, hỗ trợ và giữ quan hệ. Nhưng sales có trách nhiệm đặt kỳ vọng đúng từ trước khi mua. Nếu sales hứa quá mức, CS sẽ phải trả giá. Nếu sales bán cho khách không phù hợp, retention và thương hiệu sẽ bị ảnh hưởng.\n\nNgười mới thường nghĩ sales là thuyết phục bằng lời nói. Thực ra sales bắt đầu bằng nghe và chẩn đoán. Một người bán giỏi không hỏi \"làm sao để tôi nói cho khách tin\", mà hỏi \"khách này có vấn đề gì, vấn đề đó đáng giải quyết không, giải pháp của mình có thật sự phù hợp không, điều gì khiến khách chưa hành động\".\n\nSales có đạo đức khi người bán giúp khách ra quyết định tốt hơn. Điều này không có nghĩa sales thụ động. Sales vẫn cần chủ động tìm cơ hội, dẫn dắt cuộc trò chuyện, làm rõ tác động, đề xuất bước tiếp theo và yêu cầu cam kết. Nhưng mọi hành động đó phải dựa trên giá trị thật và kỳ vọng đúng.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Sales | Bán hàng | Giúp khách phù hợp ra quyết định mua | Chuyển giá trị thành cam kết | Tư vấn gói học sau khi hiểu vấn đề của con | Đọc kịch bản ép phụ huynh mua | Marketing |\n| Deal | Cơ hội bán hàng | Một trường hợp có khả năng tạo doanh thu | Đơn vị quản trị quyết định mua | Một phụ huynh đang dùng thử và cân nhắc trả tiền | Mọi số điện thoại trong danh sách | Lead |\n| Commitment | Cam kết | Bước khách đồng ý làm tiếp | Tín hiệu khách thật sự tiến về quyết định | Hẹn lịch demo với cả vợ/chồng | \"Em cứ gửi thông tin\" | Sự quan tâm |\n| Sales ethics | Đạo đức bán hàng | Bán đúng khách, đúng giá trị, đúng kỳ vọng | Bảo vệ niềm tin dài hạn | Nói rõ AI chưa thay thế giáo viên | Hứa con sẽ giỏi toán sau 1 tháng | Chốt đơn bằng mọi giá |\n\n## Khung tư duy trực quan\n\n```text\nKhách phù hợp\n-> Vấn đề đủ quan trọng\n-> Giải pháp phù hợp\n-> Niềm tin đủ lớn\n-> Rủi ro chấp nhận được\n-> Cam kết bước tiếp theo\n```\n\n## Ví dụ đời thường\n\nMột người bán máy lọc nước giỏi không bắt đầu bằng 20 tính năng. Họ hỏi gia đình dùng nước máy hay nước giếng, có trẻ nhỏ không, đã từng gặp vấn đề mùi vị hay cặn chưa, ngân sách thế nào, ai dùng và ai quyết định. Khi hiểu bối cảnh, lời tư vấn mới có ý nghĩa.\n\n## Use case 1: Công ty mới\n\nVới app AI giáo dục, sales không nên mở đầu bằng \"sản phẩm dùng AI\". Sales nên hỏi phụ huynh đang gặp khó khăn gì khi kèm con học, con có học đều không, phụ huynh có biết con yếu phần nào không, đã thử học thêm hay app nào chưa, vì sao chưa hài lòng.\n\nNếu phụ huynh không có nỗi đau rõ, chưa sẵn sàng cho con dùng app hoặc không muốn trả tiền, đó không phải deal tốt. Nếu phụ huynh lo con mất gốc, không có thời gian kèm và muốn thấy báo cáo tiến bộ hằng tuần, đó là cơ hội cần tư vấn sâu.\n\n## Use case 2: Công ty đã có\n\nVới loa thông minh, sales và đại lý không nên bán như \"trợ lý AI toàn năng\". Nên xác định khách đã có hệ sinh thái smart home chưa, nhà có thiết bị tương thích không, ai trong gia đình dùng giọng nói nhiều nhất, kỳ vọng về tiếng Việt là gì và khách chấp nhận phạm vi tính năng hiện tại không.\n\nSales tốt giúp khách mua đúng bối cảnh: điều khiển nhà bằng tiếng Việt tự nhiên hơn, không phải một AI hiểu mọi câu hỏi.\n\n## Lỗi người mới thường mắc\n\n- Nghĩ sales là nói nhiều hơn khách.\n- Bán cho mọi người có vẻ quan tâm.\n- Hứa quá mức để chốt nhanh.\n- Nhầm khách thích sản phẩm với khách sẵn sàng mua.\n- Không ghi lại dữ liệu sau mỗi cuộc trao đổi.\n\n## Bài tập ứng dụng\n\nViết bản mô tả vai trò sales cho một sản phẩm:\n\n| Câu hỏi | Trả lời |\n|---|---|\n| Khách phù hợp là ai? |  |\n| Sales cần giúp khách hiểu điều gì? |  |\n| Sales cần kiểm chứng điều gì trước khi tư vấn? |  |\n| Sales không được hứa điều gì? |  |\n| Một cam kết tốt sau cuộc gọi là gì? |  |\n\n## Bài tập review\n\nReview câu nói:\n\n> \"Sales giỏi là người bán được cho bất kỳ ai.\"\n\nChỉ ra vì sao câu này nguy hiểm cho sản phẩm mới, thương hiệu, retention và đội hỗ trợ sau bán.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Xem sales là chốt đơn bằng mọi cách |\n| Đạt | Hiểu sales là tư vấn và tạo doanh thu |\n| Tốt | Biết sales phải chọn đúng khách, đặt kỳ vọng đúng |\n| Xuất sắc | Nhìn sales như một hệ thống tạo doanh thu bền vững và feedback cho doanh nghiệp |\n\n## Checklist tự review\n\n1. Tôi có đang bán cho đúng khách không?\n2. Tôi đã hiểu vấn đề trước khi tư vấn chưa?\n3. Tôi có hứa quá năng lực sản phẩm không?\n4. Khách có cam kết bước tiếp theo rõ không?\n5. Cuộc bán hàng có tạo dữ liệu học hỏi không?\n\n## Hành động 30-90 phút\n\nChọn một sản phẩm thật. Viết 5 điều sales cần hỏi trước khi giới thiệu sản phẩm và 3 điều sales không được hứa.\n\n## Liên hệ với bài trước và bài sau\n\nBài tổng quan đặt mạch học sales từ gốc. Bài sau đi vào câu hỏi quan trọng nhất: khách hàng ra quyết định mua như thế nào.\n"},{"sourcePath":"Sales/02_khach_hang_ra_quyet_dinh_mua_nhu_the_nao.md","title":"Bài 2. Khách Hàng Ra Quyết Định Mua Như Thế Nào?","category":"sales","categoryLabel":"Sales","order":3,"sha256":"b33d614504c2045cdcf75ae7f7f20320f3dc4f213c6b114220c7b1931587fd12","lineCount":131,"headings":[{"level":1,"text":"Bài 2. Khách Hàng Ra Quyết Định Mua Như Thế Nào?","id":"bài-2-khách-hàng-ra-quyết-định-mua-như-thế-nào"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 2. Khách Hàng Ra Quyết Định Mua Như Thế Nào?\n\n## Câu hỏi bản chất\n\n> Vì sao khách quyết định mua hoặc không mua?\n\n## Tình huống mở bài\n\nMột phụ huynh nghe demo app AI học tập và nói sản phẩm \"có vẻ hay\". Họ thích báo cáo tiến bộ, thích bài tập cá nhân hóa, nhưng cuối cùng không trả tiền. Khi hỏi lại, lý do không phải giá. Họ lo con không dùng đều, sợ app chỉ hiệu quả vài ngày đầu và chưa chắc báo cáo phản ánh đúng năng lực của con.\n\nKhách không mua không phải vì không hiểu tính năng. Họ chưa vượt qua rủi ro quyết định.\n\n## Vì sao bài này quan trọng\n\nNếu không hiểu cơ chế mua, sales sẽ cố nói thêm tính năng hoặc giảm giá. Nhưng nhiều deal mất không phải vì thiếu thông tin, mà vì khách chưa thấy vấn đề đủ đau, chưa tin kết quả, chưa đúng timing, không có người quyết định hoặc rủi ro cảm nhận quá cao.\n\n## Nguyên lý first principles\n\nKhách mua khi giá trị cảm nhận lớn hơn tổng chi phí và rủi ro cảm nhận.\n\n```text\nVấn đề đủ đau + Kết quả đủ đáng muốn + Niềm tin đủ lớn + Timing phù hợp\n> Giá tiền + Công sức đổi thói quen + Rủi ro thất bại + Rủi ro bị đánh giá sai\n```\n\nSales phải hiểu cả hai vế: điều kéo khách tiến lên và điều kéo khách dừng lại.\n\n## Kiến thức nền chi tiết\n\nQuyết định mua không chỉ là phép tính tiền. Khách hàng so sánh giá với giá trị, nhưng giá trị lại gồm nhiều lớp: kết quả thực tế, cảm giác an tâm, tiết kiệm thời gian, giảm rủi ro, hình ảnh cá nhân, khả năng kiểm soát và kỳ vọng tương lai.\n\nKhách cũng chịu nhiều chi phí ngoài tiền. Họ phải đổi thói quen, học cách dùng, thuyết phục người khác, chịu trách nhiệm nếu mua sai, dành thời gian triển khai và chấp nhận rủi ro sản phẩm không như hứa. Vì vậy một sản phẩm \"rẻ\" vẫn có thể khó bán nếu rủi ro cảm nhận cao.\n\nTrong B2C, quyết định mua thường nhanh hơn nhưng cảm xúc, niềm tin và thói quen đóng vai trò lớn. Phụ huynh mua app học không chỉ vì bài tập, mà vì niềm tin rằng con sẽ học đều và họ sẽ thấy tiến bộ.\n\nTrong B2B hoặc bán qua đại lý, quyết định mua có nhiều người ảnh hưởng: người dùng, người trả tiền, người phê duyệt, người triển khai, người chịu trách nhiệm khi có lỗi. Sales phải biết ai quan tâm điều gì. Một chủ nhà thích loa thông minh, nhưng đại lý lo lỗi kỹ thuật, kỹ thuật lo thiết bị không tương thích, CS lo khách kỳ vọng quá mức.\n\nNgười mới thường hỏi \"khách có thích không\". Câu hỏi tốt hơn là \"khách có vấn đề đủ đau không, có đang tìm cách giải quyết không, nếu không mua thì hậu quả là gì, ai cần đồng ý, điều gì khiến họ chưa hành động\".\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Buying trigger | Tác nhân mua | Điều khiến khách bắt đầu nghiêm túc tìm giải pháp | Nhu cầu chuyển từ âm thầm sang hành động | Con kiểm tra điểm kém nên phụ huynh tìm cách học lại | Khách bấm like bài viết | Awareness |\n| Perceived risk | Rủi ro cảm nhận | Điều khách sợ nếu mua sai | Lực cản quyết định | Sợ app làm con phụ thuộc màn hình | \"Khách chưa hiểu\" | Objection |\n| Decision criteria | Tiêu chí quyết định | Những điều khách dùng để chọn | Luật chọn trong đầu khách | Dễ dùng, thấy tiến bộ, an toàn dữ liệu | Chỉ nhìn giá | Feature list |\n| Decision maker | Người quyết định | Người có quyền đồng ý hoặc chi tiền | Nút phê duyệt thật | Cả bố và mẹ cùng quyết định gói học | Chỉ nói chuyện với trẻ | User |\n\n## Khung tư duy trực quan\n\n| Lực kéo mua | Lực cản mua |\n|---|---|\n| Vấn đề đau | Giá tiền |\n| Kết quả mong muốn | Công sức đổi thói quen |\n| Bằng chứng tin cậy | Rủi ro mua sai |\n| Timing cấp bách | Người khác chưa đồng ý |\n| Bước tiếp theo rõ | Không biết bắt đầu thế nào |\n\n## Ví dụ đời thường\n\nMột người muốn tập gym nhưng chưa mua gói tập vì sợ bỏ cuộc sau một tuần. Vấn đề không phải họ không muốn khỏe hơn. Vấn đề là rủi ro cảm nhận: mất tiền, mất mặt, không biết tập thế nào và không tin mình duy trì được.\n\n## Use case 1: Công ty mới\n\nPhụ huynh mua app AI giáo dục khi có đủ tín hiệu:\n\n- Con đang có vấn đề học tập rõ.\n- Phụ huynh không có thời gian hoặc phương pháp kèm.\n- Họ tin sản phẩm giúp thấy tiến bộ nhanh.\n- Họ tin dữ liệu của trẻ được bảo vệ.\n- Họ thấy dùng thử ít rủi ro và dễ bắt đầu.\n\nNếu thiếu niềm tin về hiệu quả hoặc thói quen học, giảm giá chưa chắc giải quyết được.\n\n## Use case 2: Công ty đã có\n\nKhách mua loa thông minh khi họ thấy một số tình huống điều khiển bằng giọng nói thật sự tiện hơn app hoặc công tắc. Nhưng quyết định còn phụ thuộc vào nhà có đủ thiết bị tương thích, đại lý demo có ổn định, chính sách hỗ trợ rõ và khách hiểu phạm vi tính năng.\n\nNếu khách kỳ vọng loa trả lời mọi câu hỏi như trợ lý AI tổng quát, sales phải điều chỉnh kỳ vọng trước khi bán.\n\n## Lỗi người mới thường mắc\n\n- Nhầm \"thích\" với \"sẵn sàng mua\".\n- Chỉ hỏi giá mà không hỏi rủi ro.\n- Không xác định ai là người quyết định.\n- Không tìm buying trigger.\n- Nghĩ giảm giá luôn làm khách mua nhanh hơn.\n\n## Bài tập ứng dụng\n\nLập Buying Decision Map:\n\n| Thành phần | Nội dung |\n|---|---|\n| Vấn đề khiến khách quan tâm |  |\n| Kết quả khách muốn |  |\n| Rủi ro khách sợ |  |\n| Tiêu chí quyết định |  |\n| Người dùng |  |\n| Người trả tiền/quyết định |  |\n| Điều kiện để mua |  |\n| Bước tiếp theo hợp lý |  |\n\n## Bài tập review\n\nMột khách nói: \"Sản phẩm hay, giá cũng được, nhưng để tháng sau tôi tính.\" Review 5 giả thuyết khác nhau đằng sau câu nói này và câu hỏi nên hỏi tiếp.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Chỉ kết luận khách không mua vì giá |\n| Đạt | Biết có vấn đề, giá trị và rủi ro |\n| Tốt | Xác định được trigger, tiêu chí, người quyết định và rào cản |\n| Xuất sắc | Thiết kế được bước tiếp theo để giảm rủi ro và kiểm chứng cam kết |\n\n## Checklist tự review\n\n1. Khách có buying trigger thật không?\n2. Tôi biết tiêu chí quyết định của khách chưa?\n3. Rủi ro lớn nhất trong mắt khách là gì?\n4. Ai cần đồng ý trước khi mua?\n5. Bước tiếp theo có giảm rủi ro quyết định không?\n\n## Hành động 30-90 phút\n\nPhỏng vấn một khách tiềm năng. Không giới thiệu sản phẩm trong 10 phút đầu. Chỉ hỏi họ đang gặp vấn đề gì, vì sao bây giờ quan trọng, đã thử gì và điều gì khiến họ chưa hành động.\n\n## Liên hệ với bài trước và bài sau\n\nBài trước định nghĩa sales là giúp khách ra quyết định đúng. Bài sau đi vào việc chọn khách phù hợp để không lãng phí thời gian cho cơ hội sai.\n"},{"sourcePath":"Sales/03_khach_hang_phu_hop_va_qualification.md","title":"Bài 3. Khách Hàng Phù Hợp Và Qualification","category":"sales","categoryLabel":"Sales","order":4,"sha256":"78f11a76fa8b960e8c6563e812edda44a18a1d419934607802af86bbee9bcd12","lineCount":126,"headings":[{"level":1,"text":"Bài 3. Khách Hàng Phù Hợp Và Qualification","id":"bài-3-khách-hàng-phù-hợp-và-qualification"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 3. Khách Hàng Phù Hợp Và Qualification\n\n## Câu hỏi bản chất\n\n> Ai là khách hàng nên bán, ai là khách hàng chưa nên bán?\n\n## Tình huống mở bài\n\nStartup AI giáo dục có 200 phụ huynh để lại số điện thoại sau một bài quảng cáo. Founder mừng vì \"có nhiều lead\". Nhưng khi gọi, nhiều người chỉ tò mò, con chưa đúng độ tuổi, không muốn trả phí, hoặc chỉ muốn tài liệu miễn phí. Đội sales mất nhiều thời gian nhưng ít người dùng thử nghiêm túc.\n\nVấn đề không phải thiếu lead. Vấn đề là chưa biết lead nào phù hợp.\n\n## Vì sao bài này quan trọng\n\nSales không thể bán tốt nếu cố bán cho tất cả mọi người. Qualification giúp đội sales tập trung vào khách có vấn đề thật, phù hợp sản phẩm, có khả năng mua và có điều kiện triển khai. Nó cũng giúp doanh nghiệp học nhanh hơn vì dữ liệu đến từ nhóm khách đúng.\n\n## Nguyên lý first principles\n\nMột khách hàng phù hợp cần có 5 điều kiện:\n\n```text\nĐúng vấn đề\n-> Đúng phân khúc\n-> Đúng khả năng chi trả\n-> Đúng thời điểm\n-> Đúng điều kiện sử dụng/triển khai\n```\n\nNếu thiếu một điều kiện quan trọng, deal có thể tốn thời gian, tạo kỳ vọng sai hoặc gây churn sau bán.\n\n## Kiến thức nền chi tiết\n\nICP là chân dung khách hàng lý tưởng. Đây không phải bản mô tả nhân khẩu học cho đẹp, mà là tiêu chuẩn giúp sales biết nên ưu tiên ai. ICP tốt mô tả vấn đề, bối cảnh, động lực mua, khả năng chi trả, hành vi thay thế, điều kiện triển khai và dấu hiệu không phù hợp.\n\nLead là người hoặc tổ chức có tín hiệu quan tâm. Qualified lead là lead đủ điều kiện để sales dành thời gian sâu hơn. Không phải mọi lead đều đáng theo đuổi. Một người tải tài liệu miễn phí có thể chưa có nhu cầu mua. Một đại lý muốn demo loa thông minh nhưng chưa có kỹ thuật lắp đặt cũng có thể chưa đủ điều kiện bán.\n\nQualification tốt không làm sales lạnh lùng. Nó giúp sales tôn trọng thời gian của cả hai bên. Nếu khách chưa phù hợp, sales có thể gửi tài liệu, mời quay lại sau hoặc giới thiệu giải pháp khác. Nếu khách phù hợp, sales cần ưu tiên discovery, demo và bước tiếp theo rõ.\n\nCác khung như BANT, MEDDIC hay CHAMP chỉ là công cụ. Với người mới, nên bắt đầu bằng câu hỏi đời thường: khách có vấn đề thật không, vấn đề có đáng giải quyết không, ai trả tiền, khi nào cần, có điều kiện dùng không, điều gì có thể làm họ không thành công.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| ICP | Khách hàng lý tưởng | Nhóm khách mình phục vụ tốt nhất | Tiêu chuẩn ưu tiên bán | Phụ huynh lớp 3-5, con học không đều, sẵn sàng theo dõi báo cáo | \"Tất cả phụ huynh\" | Persona |\n| Lead | Khách tiềm năng | Người có tín hiệu quan tâm | Cơ hội rất sớm | Để lại số để nhận tư vấn | Người xem video | Deal |\n| Qualification | Đánh giá độ phù hợp | Lọc xem có nên theo sâu không | Bảo vệ thời gian và chất lượng bán | Hỏi tuổi con, vấn đề, ngân sách, timing | Gọi mọi lead như nhau | Chấm điểm cảm tính |\n| Disqualification | Loại khỏi ưu tiên | Nhận ra chưa phù hợp | Tránh bán sai | Khách không có thiết bị tương thích nên chưa bán loa | Bỏ qua vì khách hỏi nhiều | Từ chối khách |\n\n## Khung tư duy trực quan\n\n| Điều kiện | Câu hỏi kiểm tra |\n|---|---|\n| Vấn đề | Khách đang đau ở đâu? |\n| Tác động | Nếu không giải quyết thì sao? |\n| Khả năng mua | Ai trả tiền và ngân sách thế nào? |\n| Timing | Vì sao cần bây giờ? |\n| Fit | Sản phẩm có thật sự phục vụ tốt không? |\n\n## Ví dụ đời thường\n\nMột lớp học tiếng Anh giao tiếp cho người đi làm không nên bán cho học sinh ôn thi IELTS nếu chương trình không phục vụ mục tiêu đó. Khách có thể trả tiền, nhưng không phù hợp thì trải nghiệm sẽ kém và lời giới thiệu xấu.\n\n## Use case 1: Công ty mới\n\nICP ban đầu có thể là phụ huynh có con lớp 3-5, thấy con học toán không đều, từng thử app hoặc học thêm nhưng thiếu theo dõi tiến bộ, sẵn sàng dành 10 phút mỗi ngày và có khả năng trả phí tháng.\n\nLead chưa phù hợp: phụ huynh chỉ muốn tài liệu miễn phí, con quá nhỏ, không cho con dùng thiết bị, hoặc kỳ vọng app thay giáo viên hoàn toàn.\n\n## Use case 2: Công ty đã có\n\nICP cho loa thông minh giai đoạn đầu là khách đã lắp nhiều thiết bị tương thích, có nhu cầu điều khiển nhiều kịch bản, có người già/trẻ em trong nhà hoặc thích demo trải nghiệm nhà thông minh.\n\nKhông nên bán sớm cho khách có hệ thống thiết bị không tương thích, mạng yếu, kỳ vọng trợ lý AI tổng quát, hoặc đại lý chưa được đào tạo.\n\n## Lỗi người mới thường mắc\n\n- Xem mọi lead là cơ hội ngang nhau.\n- Lọc khách bằng cảm giác thay vì tiêu chí.\n- Chỉ hỏi ngân sách, không hỏi vấn đề và điều kiện dùng.\n- Không dám disqualify vì sợ mất doanh thu.\n- Chọn ICP quá rộng nên thông điệp và demo đều mờ.\n\n## Bài tập ứng dụng\n\nLập ICP và Qualification Sheet:\n\n| Thành phần | Nội dung |\n|---|---|\n| Khách hàng lý tưởng |  |\n| Vấn đề bắt buộc có |  |\n| Dấu hiệu đủ đau |  |\n| Người trả tiền/quyết định |  |\n| Điều kiện sử dụng/triển khai |  |\n| Dấu hiệu không phù hợp |  |\n| Câu hỏi qualification |  |\n| Mức ưu tiên A/B/C |  |\n\n## Bài tập review\n\nMột đội sales gọi cho 500 lead nhưng không phân loại. Tỷ lệ mua thấp, đội mệt, founder nói \"sales chưa cố đủ\". Review vấn đề trong ICP, nguồn lead, qualification và cách ưu tiên.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Bán cho bất kỳ ai có số điện thoại |\n| Đạt | Có vài tiêu chí lọc cơ bản |\n| Tốt | Có ICP, dấu hiệu fit/unfit và mức ưu tiên |\n| Xuất sắc | Qualification giúp tăng conversion, giảm churn và tạo dữ liệu học hỏi đúng |\n\n## Checklist tự review\n\n1. ICP có đủ cụ thể để loại bớt khách không?\n2. Tôi biết dấu hiệu khách đủ đau chưa?\n3. Tôi biết điều kiện triển khai tối thiểu chưa?\n4. Có tiêu chí không nên bán không?\n5. Lead A/B/C khác nhau ở đâu?\n\n## Hành động 30-90 phút\n\nLấy 20 lead gần nhất hoặc giả định 20 lead. Chia thành A/B/C bằng 5 tiêu chí rõ và viết lý do cho từng nhóm.\n\n## Liên hệ với bài trước và bài sau\n\nBài trước giải thích cơ chế quyết định mua. Bài này chọn đúng người để bắt đầu. Bài sau đi vào cách tạo cơ hội bán hàng mà không spam và không làm hỏng niềm tin.\n"},{"sourcePath":"Sales/04_tao_co_hoi_ban_hang.md","title":"Bài 4. Tạo Cơ Hội Bán Hàng","category":"sales","categoryLabel":"Sales","order":5,"sha256":"375e494b762ce3f15ffc93d0277d43f1fde49792fbb245c7a8c1cfcef394abce","lineCount":135,"headings":[{"level":1,"text":"Bài 4. Tạo Cơ Hội Bán Hàng","id":"bài-4-tạo-cơ-hội-bán-hàng"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 4. Tạo Cơ Hội Bán Hàng\n\n## Câu hỏi bản chất\n\n> Làm sao tạo cơ hội bán hàng đúng cách?\n\n## Tình huống mở bài\n\nĐội startup AI giáo dục nhắn tin hàng loạt vào các nhóm phụ huynh: \"Ứng dụng AI học tập cá nhân hóa, đăng ký ngay\". Tin nhắn bị bỏ qua, một số người thấy phiền, vài người hỏi giá rồi biến mất. Đội kết luận thị trường khó.\n\nNhưng có thể vấn đề là cách tiếp cận chưa xuất phát từ bối cảnh và nỗi đau của phụ huynh.\n\n## Vì sao bài này quan trọng\n\nKhông có cơ hội thì không có pipeline. Nhưng tạo cơ hội sai cách sẽ tạo lead rác, làm xấu thương hiệu và khiến sales tốn thời gian. Prospecting tốt là tìm đúng người, đúng bối cảnh, đúng thông điệp và đúng đề nghị bước tiếp theo.\n\n## Nguyên lý first principles\n\nMột tiếp cận tốt trả lời 4 câu hỏi của khách:\n\n```text\nBạn là ai?\nVì sao bạn liên hệ tôi?\nBạn hiểu vấn đề gì của tôi?\nBước tiếp theo có ít rủi ro và đáng làm không?\n```\n\nNếu khách không thấy liên quan, họ sẽ bỏ qua dù sản phẩm tốt.\n\n## Kiến thức nền chi tiết\n\nTạo cơ hội bán hàng gồm nhiều nguồn: inbound từ marketing, referral, cộng đồng, sự kiện, đối tác, outbound, khách cũ, đại lý và dữ liệu sử dụng sản phẩm. Mỗi nguồn có chất lượng và kỳ vọng khác nhau. Lead từ referral thường có niềm tin cao hơn lead lạnh. Lead từ quảng cáo có thể nhiều nhưng cần qualification kỹ.\n\nProspecting không phải gửi càng nhiều càng tốt. Nó là quá trình chọn danh sách phù hợp, tìm lý do liên hệ, viết thông điệp liên quan và đề xuất bước nhỏ. Với người mới, bước nhỏ có thể là cuộc gọi 15 phút, buổi demo, khảo sát nhu cầu, dùng thử hoặc gửi case phù hợp.\n\nThông điệp tiếp cận phải nói về vấn đề khách nhận ra được. Nếu mở đầu bằng sản phẩm, khách chưa chắc quan tâm. Nếu mở đầu bằng một quan sát đúng về bối cảnh của họ, khách dễ phản hồi hơn.\n\nTần suất theo dõi cũng cần có trách nhiệm. Follow-up không phải làm phiền cho đến khi khách trả lời. Follow-up tốt bổ sung giá trị: một câu hỏi rõ hơn, một case liên quan, một lời nhắc lịch sự hoặc một đề nghị khác ít rủi ro hơn.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Prospecting | Tìm cơ hội | Chủ động tìm người có thể phù hợp | Tạo đầu vào pipeline | Tìm phụ huynh đang hỏi cách kèm con học toán | Nhắn đại trà mọi nhóm | Advertising |\n| Outbound | Tiếp cận chủ động | Mình liên hệ trước | Cần liên quan và tôn trọng | Gửi tin cá nhân hóa cho đại lý phù hợp | Spam danh sách số | Cold spam |\n| Inbound | Khách chủ động đến | Khách phản hồi từ nội dung/kênh | Có tín hiệu quan tâm sẵn | Điền form tư vấn | Người chỉ xem bài | Referral |\n| Follow-up | Theo dõi tiếp | Nhắc và dẫn khách sang bước sau | Duy trì động lượng quyết định | Gửi case sau demo và hẹn quyết định | Gửi \"anh/chị mua chưa\" mỗi ngày | Chăm sóc |\n\n## Khung tư duy trực quan\n\n```text\nICP rõ -> Nguồn lead phù hợp -> Lý do liên hệ -> Thông điệp liên quan -> Bước nhỏ -> Follow-up có giá trị\n```\n\n## Ví dụ đời thường\n\nMột người bán khóa học nấu ăn cho người bận rộn sẽ hiệu quả hơn nếu liên hệ nhóm nhân viên văn phòng hay đặt đồ ăn ngoài và nói về bữa tối nhanh lành mạnh, thay vì gửi thông điệp chung \"khóa học nấu ăn chất lượng cao\".\n\n## Use case 1: Công ty mới\n\nNguồn cơ hội tốt cho app AI giáo dục:\n\n- Nhóm phụ huynh có con lớp 3-5 đang hỏi về mất gốc toán.\n- Giáo viên hoặc tutor có tệp phụ huynh cần theo dõi tiến bộ.\n- Referral từ phụ huynh đã dùng thử.\n- Nội dung checklist \"5 dấu hiệu con học toán không đều\".\n\nBước tiếp theo nên nhỏ: làm bài kiểm tra 10 phút và nhận báo cáo thử, không phải mua ngay.\n\n## Use case 2: Công ty đã có\n\nNguồn cơ hội cho loa thông minh:\n\n- Khách hiện hữu đã lắp nhiều thiết bị.\n- Đại lý có showroom đủ điều kiện demo.\n- Khách từng hỏi về điều khiển bằng giọng nói.\n- Sự kiện trải nghiệm nhà thông minh.\n\nThông điệp nên nói rõ tình huống dùng: bật đèn, kéo rèm, kích hoạt ngữ cảnh bằng tiếng Việt, không hứa trợ lý AI toàn năng.\n\n## Lỗi người mới thường mắc\n\n- Gửi cùng một tin cho mọi người.\n- Mở đầu bằng tính năng thay vì vấn đề.\n- Không có bước tiếp theo rõ.\n- Follow-up chỉ để thúc ép.\n- Không đo nguồn lead nào tạo cơ hội chất lượng.\n\n## Bài tập ứng dụng\n\nLập Outreach Plan:\n\n| Thành phần | Nội dung |\n|---|---|\n| ICP mục tiêu |  |\n| Nguồn tìm lead |  |\n| Lý do liên hệ |  |\n| Vấn đề mở đầu |  |\n| Thông điệp 3 câu |  |\n| Bước tiếp theo |  |\n| Follow-up 1 |  |\n| Chỉ số đo |  |\n\n## Bài tập review\n\nReview tin nhắn:\n\n> \"Chào anh/chị, bên em có sản phẩm AI học tập thông minh nhất hiện nay, giá ưu đãi chỉ hôm nay. Anh/chị đăng ký nhé?\"\n\nViết lại theo hướng liên quan, cụ thể, ít rủi ro và có bước tiếp theo rõ.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Spam, chung chung, chỉ nói về sản phẩm |\n| Đạt | Có nhóm khách và CTA cơ bản |\n| Tốt | Có lý do liên hệ, vấn đề rõ và follow-up có giá trị |\n| Xuất sắc | Tạo cơ hội chất lượng, đo được nguồn lead và cải tiến thông điệp |\n\n## Checklist tự review\n\n1. Tôi có đang tiếp cận đúng ICP không?\n2. Lý do liên hệ có liên quan đến khách không?\n3. Thông điệp có nói vấn đề trước sản phẩm không?\n4. Bước tiếp theo có dễ đồng ý không?\n5. Tôi có đo tỷ lệ phản hồi và chất lượng lead không?\n\n## Hành động 30-90 phút\n\nViết 3 phiên bản tin nhắn tiếp cận cho cùng một ICP: một tin ngắn, một tin dựa trên vấn đề, một tin dựa trên case. Tự chấm xem tin nào liên quan nhất.\n\n## Liên hệ với bài trước và bài sau\n\nBài trước giúp chọn khách phù hợp. Bài này tạo cơ hội tiếp xúc. Bài sau đi vào discovery: khi khách đã phản hồi, cần hỏi gì trước khi tư vấn.\n"},{"sourcePath":"Sales/05_discovery_chan_doan_nhu_cau.md","title":"Bài 5. Discovery Và Chẩn Đoán Nhu Cầu","category":"sales","categoryLabel":"Sales","order":6,"sha256":"3ce48443eed42c6bf9febda06e58df9319f984376735674d7b9f6b94df62eca9","lineCount":132,"headings":[{"level":1,"text":"Bài 5. Discovery Và Chẩn Đoán Nhu Cầu","id":"bài-5-discovery-và-chẩn-đoán-nhu-cầu"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 5. Discovery Và Chẩn Đoán Nhu Cầu\n\n## Câu hỏi bản chất\n\n> Cần hỏi gì trước khi tư vấn?\n\n## Tình huống mở bài\n\nMột phụ huynh đồng ý nghe tư vấn app AI học tập. Sales mở demo ngay, trình bày 15 phút về bài tập, báo cáo, AI và giá. Cuối buổi, phụ huynh nói: \"Tôi cần hỏi thêm chồng.\" Sales nhận ra mình chưa biết ai quyết định, con đang yếu môn gì, phụ huynh từng thử gì và điều gì khiến họ muốn thay đổi.\n\nDemo đến quá sớm làm mất cơ hội hiểu nhu cầu thật.\n\n## Vì sao bài này quan trọng\n\nDiscovery là phần phân biệt tư vấn với thuyết trình. Nếu discovery yếu, sales sẽ demo sai trọng tâm, xử lý phản đối sai và forecast sai. Discovery tốt giúp sales biết có nên bán, bán giá trị nào, bán cho ai và bước tiếp theo là gì.\n\n## Nguyên lý first principles\n\nTrước khi đề xuất giải pháp, sales cần hiểu:\n\n```text\nBối cảnh -> Vấn đề -> Tác động -> Cách đang làm -> Rào cản -> Người quyết định -> Tiêu chí mua -> Timing -> Bước tiếp theo\n```\n\nKhông có chẩn đoán thì tư vấn chỉ là đoán.\n\n## Kiến thức nền chi tiết\n\nDiscovery không phải bảng câu hỏi máy móc. Nó là cuộc trò chuyện có mục tiêu để hiểu sự thật đủ sâu cho quyết định bán hàng. Sales cần vừa lắng nghe vừa dẫn dắt, vừa tò mò vừa có cấu trúc.\n\nMột câu hỏi discovery tốt không chỉ lấy thông tin, mà làm khách tự nhìn rõ vấn đề. Ví dụ \"Điều gì xảy ra nếu con tiếp tục học không đều trong 2 tháng tới?\" giúp phụ huynh nghĩ về tác động. \"Ai cần xem báo cáo trước khi quyết định trả tiền?\" giúp làm rõ người quyết định.\n\nDiscovery cần phân biệt triệu chứng và nguyên nhân. \"Con học kém toán\" là triệu chứng. Nguyên nhân có thể là mất gốc, thiếu thói quen, tài liệu không phù hợp, phụ huynh không theo dõi, hoặc trẻ không có động lực. Mỗi nguyên nhân cần giải pháp và thông điệp khác nhau.\n\nTrong công ty đã có, discovery còn phải kiểm tra điều kiện triển khai. Loa thông minh có thể hấp dẫn, nhưng nếu nhà chưa có thiết bị tương thích, Wi-Fi yếu hoặc đại lý chưa đủ kỹ thuật, bán ngay sẽ tạo rủi ro.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Discovery | Khám phá nhu cầu | Hỏi để hiểu trước khi bán | Chẩn đoán vấn đề và điều kiện mua | Hỏi bối cảnh học của con | Hỏi vài câu rồi demo ngay | Survey |\n| Pain | Nỗi đau | Điều khách muốn giải quyết | Động lực thay đổi | Phụ huynh không biết con yếu đâu | \"Muốn app hay\" | Need |\n| Impact | Tác động | Hậu quả nếu vấn đề tiếp diễn | Làm vấn đề đủ quan trọng | Con mất gốc, phụ huynh tốn thêm học thêm | Khó chịu nhẹ | Feature request |\n| Next step | Bước tiếp theo | Cam kết cụ thể sau cuộc trao đổi | Giữ động lượng deal | Hẹn demo với cả hai phụ huynh | \"Em gửi thông tin\" | Follow-up mơ hồ |\n\n## Khung tư duy trực quan\n\n| Lớp hỏi | Câu hỏi mẫu |\n|---|---|\n| Bối cảnh | Hiện tại anh/chị đang giải quyết việc này thế nào? |\n| Vấn đề | Điều gì đang khó nhất? |\n| Tác động | Nếu không xử lý, chuyện gì xảy ra? |\n| Đã thử | Anh/chị đã thử cách nào? Vì sao chưa ổn? |\n| Quyết định | Ai cần tham gia quyết định? |\n| Timing | Vì sao bây giờ cần làm? |\n\n## Ví dụ đời thường\n\nBác sĩ không kê thuốc ngay khi bệnh nhân nói \"đau bụng\". Bác sĩ hỏi đau ở đâu, đau khi nào, ăn gì, có sốt không, từng bị chưa. Sales discovery cũng vậy: chưa chẩn đoán thì chưa nên kê giải pháp.\n\n## Use case 1: Công ty mới\n\nCâu hỏi discovery cho phụ huynh:\n\n- Con đang học lớp mấy và môn nào khiến anh/chị lo nhất?\n- Anh/chị biết con yếu phần nào bằng cách nào?\n- Một tuần con tự học được mấy buổi?\n- Anh/chị đã thử học thêm, app, sách hay YouTube chưa?\n- Điều gì khiến anh/chị chưa hài lòng với cách hiện tại?\n- Ai sẽ quyết định trả phí nếu dùng sau thử nghiệm?\n\n## Use case 2: Công ty đã có\n\nCâu hỏi discovery cho loa thông minh:\n\n- Nhà đang có những thiết bị smart home nào?\n- Ai trong nhà gặp khó khi dùng app/công tắc?\n- Tình huống nào dùng giọng nói sẽ tiện hơn?\n- Khách kỳ vọng loa làm được những việc gì?\n- Wi-Fi, thiết bị và đại lý lắp đặt có đủ điều kiện không?\n- Nếu demo ổn, ai quyết định mua và lắp thử?\n\n## Lỗi người mới thường mắc\n\n- Demo trước khi hỏi.\n- Chỉ hỏi nhu cầu bề mặt, không hỏi tác động.\n- Không hỏi ai quyết định.\n- Ngại hỏi về ngân sách hoặc timing.\n- Không tóm tắt lại để xác nhận hiểu đúng.\n\n## Bài tập ứng dụng\n\nLập Discovery Call Guide:\n\n| Mục tiêu hỏi | Câu hỏi chính | Câu hỏi đào sâu | Dấu hiệu tốt |\n|---|---|---|---|\n| Bối cảnh |  |  |  |\n| Vấn đề |  |  |  |\n| Tác động |  |  |  |\n| Cách đang làm |  |  |  |\n| Người quyết định |  |  |  |\n| Timing |  |  |  |\n| Bước tiếp theo |  |  |  |\n\n## Bài tập review\n\nMột sales nghe khách nói \"tôi muốn tiết kiệm thời gian\" rồi demo ngay tính năng tự động hóa. Review những câu hỏi bị bỏ lỡ trước khi demo.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Hỏi qua loa rồi giới thiệu sản phẩm |\n| Đạt | Hỏi được vấn đề và nhu cầu cơ bản |\n| Tốt | Hiểu bối cảnh, tác động, cách đang làm và người quyết định |\n| Xuất sắc | Discovery làm rõ fit, rủi ro, tiêu chí mua và bước tiếp theo có cam kết |\n\n## Checklist tự review\n\n1. Tôi hiểu vấn đề cụ thể chưa?\n2. Tôi biết tác động nếu khách không giải quyết chưa?\n3. Tôi biết khách đang dùng cách nào thay thế chưa?\n4. Tôi biết ai quyết định và timing chưa?\n5. Tôi đã tóm tắt lại cho khách xác nhận chưa?\n\n## Hành động 30-90 phút\n\nViết 10 câu hỏi discovery cho sản phẩm của bạn. Sau đó đánh dấu câu nào hỏi bối cảnh, câu nào hỏi pain, câu nào hỏi impact, câu nào hỏi quyết định.\n\n## Liên hệ với bài trước và bài sau\n\nBài trước tạo cơ hội tiếp xúc. Discovery giúp hiểu cơ hội đó. Bài sau dùng dữ liệu discovery để tư vấn giá trị và demo đúng trọng tâm.\n"},{"sourcePath":"Sales/06_tu_van_gia_tri_va_demo.md","title":"Bài 6. Tư Vấn Giá Trị Và Demo","category":"sales","categoryLabel":"Sales","order":7,"sha256":"1892fcc16a83d9f9b0430b232ba5783a61f25f95ab30704b4e188e528638237f","lineCount":121,"headings":[{"level":1,"text":"Bài 6. Tư Vấn Giá Trị Và Demo","id":"bài-6-tư-vấn-giá-trị-và-demo"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 6. Tư Vấn Giá Trị Và Demo\n\n## Câu hỏi bản chất\n\n> Làm sao trình bày giải pháp để khách thấy giá trị thật?\n\n## Tình huống mở bài\n\nSales demo app AI học tập bằng cách đi qua mọi màn hình: đăng nhập, chọn lớp, tạo bài, chấm điểm, báo cáo, huy hiệu, cài đặt. Phụ huynh xem xong vẫn hỏi: \"Vậy con tôi học yếu phép chia thì app giúp thế nào?\"\n\nDemo nhiều tính năng nhưng chưa trả lời câu hỏi quan trọng nhất của khách.\n\n## Vì sao bài này quan trọng\n\nKhách không mua demo đẹp. Khách mua khả năng đạt kết quả họ quan tâm. Tư vấn giá trị giúp sales nối dữ liệu discovery với giải pháp, chứng minh vì sao sản phẩm phù hợp và giúp khách hình dung thay đổi sau khi mua.\n\n## Nguyên lý first principles\n\nTư vấn giá trị đi theo mạch:\n\n```text\nVấn đề khách nói -> Tác động khách quan tâm -> Khả năng sản phẩm -> Bằng chứng -> Kết quả mong đợi -> Bước tiếp theo\n```\n\nDemo tốt không trình diễn mọi thứ. Demo tốt chọn đúng thứ làm khách tin rằng vấn đề của họ có thể được giải quyết.\n\n## Kiến thức nền chi tiết\n\nTính năng là sản phẩm có gì. Lợi ích là khách được gì. Giá trị là lợi ích đó có đủ quan trọng trong bối cảnh cụ thể của khách không. Một tính năng có thể quan trọng với khách này nhưng vô nghĩa với khách khác.\n\nDemo phải được thiết kế sau discovery. Nếu phụ huynh lo không biết con yếu phần nào, demo cần tập trung vào bài kiểm tra đầu vào, báo cáo lỗ hổng kiến thức và lộ trình học. Nếu phụ huynh lo con không học đều, demo cần tập trung vào nhắc lịch, tiến độ và vai trò phụ huynh. Nếu khách smart home muốn người già dùng dễ hơn, demo cần cho thấy câu lệnh tiếng Việt tự nhiên và tình huống trong nhà.\n\nSales cần tránh \"feature tour\": đi qua tất cả tính năng theo thứ tự sản phẩm. Cách này khiến khách mệt và không biết điều gì liên quan đến mình. Demo giá trị nên ngắn, có kịch bản, có tình huống thật và luôn quay lại câu hỏi của khách.\n\nMột tư vấn tốt cũng nói rõ giới hạn. Nếu sản phẩm chưa làm được điều khách kỳ vọng, sales phải nói thật và đề xuất phạm vi phù hợp. Điều này không làm giảm sales; nó tăng niềm tin và giảm rủi ro sau bán.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Value proposition | Đề xuất giá trị | Lý do khách nên chọn mình | Kết nối vấn đề với kết quả | Biết con yếu gì sau 10 phút kiểm tra | \"Có AI hiện đại\" | Slogan |\n| Demo | Trình diễn sản phẩm | Cho khách thấy sản phẩm giải quyết việc gì | Bằng chứng sống | Demo báo cáo tiến bộ của trẻ | Bấm qua mọi menu | Training |\n| Use case | Tình huống sử dụng | Trường hợp khách dùng thật | Ngữ cảnh tạo giá trị | Điều khiển đèn khi tay bận | Tính năng chung chung | Feature |\n| Outcome | Kết quả | Điều khách muốn đạt | Cái khách mua thật | Phụ huynh yên tâm biết con học gì mỗi ngày | Số lượng bài tập | Output |\n\n## Khung tư duy trực quan\n\n| Discovery nói gì? | Demo nên cho thấy gì? |\n|---|---|\n| Không biết con yếu đâu | Bài test và báo cáo lỗ hổng |\n| Con học không đều | Nhắc học, streak, báo cáo phụ huynh |\n| Người già khó dùng app | Câu lệnh giọng nói đơn giản |\n| Sợ sản phẩm lỗi | Demo tình huống ổn định và chính sách hỗ trợ |\n\n## Ví dụ đời thường\n\nMột người bán xe cho gia đình có trẻ nhỏ không nên chỉ nói mã lực. Họ nên cho thấy ghế an toàn, cốp rộng, camera lùi, tiết kiệm nhiên liệu và trải nghiệm đi xa. Giá trị phụ thuộc vào bối cảnh dùng.\n\n## Use case 1: Công ty mới\n\nDemo app AI giáo dục nên bắt đầu bằng vấn đề đã nghe:\n\n> \"Anh/chị nói khó nhất là không biết con yếu phần nào. Em sẽ demo 3 phút luồng kiểm tra đầu vào và báo cáo phụ huynh nhận được sau buổi học đầu.\"\n\nSau demo, sales hỏi: \"Nếu báo cáo này được gửi mỗi tuần, anh/chị có dùng để theo dõi con không? Điều gì còn thiếu để anh/chị tin?\"\n\n## Use case 2: Công ty đã có\n\nDemo loa thông minh nên theo kịch bản đời sống: về nhà bật đèn phòng khách, kéo rèm, bật ngữ cảnh xem phim, tắt toàn bộ thiết bị trước khi ngủ. Sales phải nói rõ câu lệnh nào ổn định, câu lệnh nào chưa hỗ trợ và điều kiện kỹ thuật cần có.\n\n## Lỗi người mới thường mắc\n\n- Demo mọi tính năng.\n- Không nối demo với vấn đề khách vừa nói.\n- Dùng thuật ngữ kỹ thuật quá nhiều.\n- Né giới hạn sản phẩm.\n- Không hỏi khách sau demo họ thấy giá trị ở đâu.\n\n## Bài tập ứng dụng\n\nLập Value Demo Script:\n\n| Phần | Nội dung |\n|---|---|\n| Vấn đề khách đã nói |  |\n| Kết quả khách muốn |  |\n| Tính năng cần demo |  |\n| Tình huống demo |  |\n| Bằng chứng đi kèm |  |\n| Giới hạn cần nói rõ |  |\n| Câu hỏi sau demo |  |\n| Bước tiếp theo |  |\n\n## Bài tập review\n\nMột sales demo 30 phút, khách khen \"hay\" nhưng không đặt lịch tiếp. Review xem demo thiếu vấn đề, thiếu outcome, thiếu bằng chứng hay thiếu next step.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Demo dài, lan man, theo menu sản phẩm |\n| Đạt | Demo được tính năng chính |\n| Tốt | Demo gắn với vấn đề và kết quả khách cần |\n| Xuất sắc | Demo tạo niềm tin, nói rõ giới hạn và dẫn đến cam kết bước tiếp theo |\n\n## Checklist tự review\n\n1. Demo có dựa trên discovery không?\n2. Tôi có nói outcome trước feature không?\n3. Demo có đủ ngắn và đúng trọng tâm không?\n4. Tôi có nói rõ giới hạn quan trọng không?\n5. Sau demo có câu hỏi kiểm tra giá trị không?\n\n## Hành động 30-90 phút\n\nChọn một tính năng quan trọng và viết lại thành 3 lớp: tính năng, lợi ích, kết quả trong bối cảnh khách hàng cụ thể.\n\n## Liên hệ với bài trước và bài sau\n\nDiscovery cho biết khách cần gì. Tư vấn và demo cho khách thấy giá trị. Bài sau đi sâu vào niềm tin và bằng chứng, vì khách có thể hiểu giá trị nhưng vẫn chưa dám mua.\n"},{"sourcePath":"Sales/07_xay_niem_tin_va_bang_chung.md","title":"Bài 7. Xây Niềm Tin Và Bằng Chứng","category":"sales","categoryLabel":"Sales","order":8,"sha256":"6a1ce89a0a40957492f8c4f3ffac7a264a82eab2da5d9073eca1e47ba6b61c61","lineCount":126,"headings":[{"level":1,"text":"Bài 7. Xây Niềm Tin Và Bằng Chứng","id":"bài-7-xây-niềm-tin-và-bằng-chứng"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 7. Xây Niềm Tin Và Bằng Chứng\n\n## Câu hỏi bản chất\n\n> Khách cần tin điều gì trước khi mua?\n\n## Tình huống mở bài\n\nMột phụ huynh hiểu app AI giáo dục có thể giúp con học đúng lỗ hổng kiến thức. Nhưng họ vẫn ngần ngại: dữ liệu của con có an toàn không, AI có chấm đúng không, trẻ có bị phụ thuộc màn hình không, công ty mới có hỗ trợ nếu gặp lỗi không.\n\nKhách đã hiểu giá trị, nhưng niềm tin chưa đủ.\n\n## Vì sao bài này quan trọng\n\nNiềm tin là cầu nối giữa hiểu và mua. Sales không thể thay niềm tin bằng nói hay. Sales phải biết khách cần bằng chứng nào, bằng chứng nào hợp lệ, claim nào được phép nói và rủi ro nào cần giảm.\n\n## Nguyên lý first principles\n\nKhách tin khi 4 lớp bằng chứng đủ mạnh:\n\n```text\nClaim rõ\n-> Bằng chứng phù hợp\n-> Nguồn đáng tin\n-> Rủi ro còn lại được kiểm soát\n```\n\nClaim càng lớn, bằng chứng càng phải mạnh. Sản phẩm càng mới, trách nhiệm chứng minh càng cao.\n\n## Kiến thức nền chi tiết\n\nNiềm tin không phải cảm giác chung chung. Trong sales, niềm tin có nhiều loại: tin sản phẩm làm được việc, tin người bán không nói quá, tin doanh nghiệp sẽ hỗ trợ, tin dữ liệu an toàn, tin giá hợp lý, tin mua bây giờ là quyết định đúng.\n\nBằng chứng cũng có nhiều cấp độ. Lời nói của sales là bằng chứng yếu nhất. Demo thật, case khách hàng, dữ liệu sử dụng, review, chính sách hoàn tiền, cam kết hỗ trợ, chứng nhận, chuyên gia và trải nghiệm dùng thử là các bằng chứng mạnh hơn. Nhưng bằng chứng phải khớp với rủi ro khách đang lo.\n\nVới sản phẩm mới, không nên bịa bằng chứng. Nếu chưa có case lớn, có thể dùng pilot nhỏ, dữ liệu thử nghiệm, demo minh bạch, giới hạn claim và offer dùng thử ít rủi ro. Trung thực về bằng chứng hiện có thường tốt hơn tuyên bố quá lớn.\n\nTrong công ty đã có, thương hiệu cũ giúp tạo niềm tin ban đầu nhưng cũng tạo kỳ vọng cao. Sales phải dùng uy tín thương hiệu để bảo đảm hỗ trợ và hệ sinh thái, nhưng không được khiến khách nghĩ sản phẩm mới đã trưởng thành như các dòng cũ.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Trust proof | Bằng chứng niềm tin | Thứ làm khách dám tin claim | Giảm rủi ro cảm nhận | Case phụ huynh sau 14 ngày | \"Bên em uy tín\" | Testimonial |\n| Claim | Điều tuyên bố | Lời hứa hoặc khẳng định | Cần được chứng minh | Giúp phụ huynh thấy lỗ hổng kiến thức | \"Cam kết học giỏi\" | Message |\n| Risk reversal | Đảo ngược rủi ro | Cách giảm rủi ro cho khách | Làm thử dễ hơn | Dùng thử 14 ngày, hoàn tiền nếu không phù hợp | Giảm giá mạnh | Promotion |\n| Social proof | Bằng chứng xã hội | Người khác đã tin/dùng | Mượn niềm tin từ cộng đồng | 50 phụ huynh dùng thử và phản hồi | Like ảo | Brand awareness |\n\n## Khung tư duy trực quan\n\n| Khách lo | Bằng chứng phù hợp |\n|---|---|\n| Sản phẩm có hiệu quả không? | Case, dữ liệu tiến bộ, demo thật |\n| Có an toàn không? | Chính sách dữ liệu, quyền riêng tư |\n| Có dễ dùng không? | Dùng thử, onboarding, video ngắn |\n| Có được hỗ trợ không? | SLA, hotline, quy trình CS |\n| Có bị hứa quá không? | Claim được nói/không được nói |\n\n## Ví dụ đời thường\n\nMột nha khoa không thể chỉ nói \"chúng tôi làm răng đẹp\". Khách cần ảnh trước/sau, bác sĩ có chuyên môn, tư vấn rõ rủi ro, báo giá minh bạch và chính sách chăm sóc sau điều trị.\n\n## Use case 1: Công ty mới\n\nApp AI giáo dục cần bằng chứng:\n\n- Bài kiểm tra đầu vào giải thích được lỗ hổng kiến thức.\n- Báo cáo mẫu dễ hiểu cho phụ huynh.\n- Dữ liệu 14 ngày từ nhóm pilot nhỏ.\n- Chính sách bảo vệ dữ liệu trẻ em.\n- Giới hạn rõ: app hỗ trợ theo dõi và luyện tập, không thay thế hoàn toàn giáo viên hoặc phụ huynh.\n\n## Use case 2: Công ty đã có\n\nLoa thông minh cần bằng chứng:\n\n- Demo trực tiếp tại showroom với thiết bị thật.\n- Danh sách câu lệnh hỗ trợ ổn định.\n- Checklist điều kiện kỹ thuật trước lắp đặt.\n- Chính sách hỗ trợ 14 ngày đầu.\n- FAQ cho đại lý về claim được nói và không được nói.\n\n## Lỗi người mới thường mắc\n\n- Nói \"anh/chị cứ tin em\" thay vì đưa bằng chứng.\n- Dùng bằng chứng không khớp rủi ro.\n- Claim quá lớn so với dữ liệu.\n- Che giấu giới hạn sản phẩm.\n- Không chuẩn hóa bằng chứng cho sales/đại lý.\n\n## Bài tập ứng dụng\n\nLập Trust Proof Map:\n\n| Claim | Khách có thể nghi ngờ gì? | Bằng chứng hiện có | Bằng chứng cần bổ sung | Claim an toàn |\n|---|---|---|---|---|\n|  |  |  |  |  |\n\n## Bài tập review\n\nMột sales nói: \"Sản phẩm AI của bên em chắc chắn giúp con học tốt hơn trong 1 tháng.\" Review rủi ro claim này và viết lại thành claim an toàn hơn có bằng chứng đi kèm.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Dựa vào lời hứa và sự tự tin của sales |\n| Đạt | Có vài bằng chứng cơ bản |\n| Tốt | Bằng chứng khớp với rủi ro khách lo |\n| Xuất sắc | Có trust proof map, guardrails claim và cơ chế giảm rủi ro mua |\n\n## Checklist tự review\n\n1. Claim quan trọng nhất là gì?\n2. Khách nghi ngờ claim đó ở đâu?\n3. Bằng chứng có đủ mạnh chưa?\n4. Có claim nào sales không được nói không?\n5. Offer có giảm rủi ro quyết định không?\n\n## Hành động 30-90 phút\n\nViết 5 claim sales hay dùng. Với mỗi claim, ghi bằng chứng hiện có và cách nói an toàn hơn nếu bằng chứng chưa đủ.\n\n## Liên hệ với bài trước và bài sau\n\nBài trước giúp khách thấy giá trị. Bài này giúp khách tin giá trị đó. Bài sau xử lý phản đối, tức những rào cản còn lại trước quyết định.\n"},{"sourcePath":"Sales/08_xu_ly_phan_doi.md","title":"Bài 8. Xử Lý Phản Đối","category":"sales","categoryLabel":"Sales","order":9,"sha256":"976d6982f3e94845bdab588fd21e9e49f6458579655d908d77efe1cc1dab2dc0","lineCount":121,"headings":[{"level":1,"text":"Bài 8. Xử Lý Phản Đối","id":"bài-8-xử-lý-phản-đối"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 8. Xử Lý Phản Đối\n\n## Câu hỏi bản chất\n\n> Vì sao khách nói \"chưa\"?\n\n## Tình huống mở bài\n\nKhách xem demo loa thông minh và nói: \"Tôi sợ mua về không dùng mấy.\" Sales lập tức giảm giá 10%. Khách vẫn không mua. Lý do thật không phải giá, mà là họ chưa tin các thành viên trong nhà sẽ dùng giọng nói hằng ngày và chưa rõ nếu nhận lệnh sai thì xử lý thế nào.\n\nGiảm giá sai vấn đề không giải quyết được phản đối.\n\n## Vì sao bài này quan trọng\n\nPhản đối không phải lúc nào cũng là vật cản cần vượt qua. Nó là dữ liệu về rủi ro, thiếu thông tin, thiếu niềm tin, thiếu fit hoặc thiếu quyền quyết định. Xử lý phản đối tốt giúp sales hiểu thật và quyết định nên tiến, nuôi dưỡng hay dừng.\n\n## Nguyên lý first principles\n\nPhản đối thường đến từ 5 gốc:\n\n```text\nKhông thấy vấn đề đủ đau\nKhông thấy giá trị đủ lớn\nKhông tin bằng chứng\nKhông đúng thời điểm/người quyết định\nKhông phù hợp thật\n```\n\nSales phải chẩn đoán gốc phản đối trước khi trả lời.\n\n## Kiến thức nền chi tiết\n\nMột câu phản đối bề mặt có thể che nhiều nguyên nhân. \"Giá cao\" có thể nghĩa là khách chưa thấy giá trị, chưa có ngân sách, đang so với lựa chọn khác, chưa tin hiệu quả, hoặc chỉ dùng giá để trì hoãn. \"Để tôi suy nghĩ\" có thể nghĩa là thiếu người quyết định, thiếu thông tin, không cấp bách hoặc không muốn từ chối trực tiếp.\n\nXử lý phản đối không nên bắt đầu bằng phản biện. Sales nên xác nhận, hỏi sâu, phân loại và trả lời đúng. Ví dụ: \"Em hiểu. Khi anh/chị nói sợ không dùng mấy, anh/chị đang lo trẻ không học đều hay phụ huynh không có thời gian theo dõi?\" Câu hỏi này làm rõ phản đối thật.\n\nCó phản đối hợp lệ và phản đối không nên vượt qua. Nếu khách không phù hợp, không có điều kiện triển khai, hoặc kỳ vọng ngoài phạm vi sản phẩm, sales nên disqualify hoặc hẹn thời điểm khác. Cố vượt qua mọi phản đối có thể tạo doanh thu ngắn hạn nhưng gây churn và khiếu nại.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Objection | Phản đối | Lý do khách chưa tiến tiếp | Tín hiệu rủi ro hoặc thiếu rõ | \"Tôi sợ con không dùng đều\" | \"Khách khó tính\" | Rejection |\n| Stall | Trì hoãn | Khách né quyết định | Có rào cản chưa nói | \"Để tháng sau\" | Tin là timing chắc chắn | Follow-up |\n| Price objection | Phản đối giá | Khách thấy giá chưa hợp lý | Giá trị chưa vượt chi phí/rủi ro | So với học thêm | Mặc định phải giảm giá | Negotiation |\n| No-fit | Không phù hợp | Sản phẩm không nên bán | Bảo vệ chất lượng và thương hiệu | Nhà không có thiết bị tương thích | Chưa thuyết phục đủ | Objection |\n\n## Khung tư duy trực quan\n\n```text\nNghe phản đối -> Xác nhận -> Hỏi sâu -> Phân loại -> Trả lời bằng giá trị/bằng chứng -> Kiểm tra lại -> Chọn bước tiếp theo\n```\n\n## Ví dụ đời thường\n\nKhách nói một khóa học \"đắt\". Nếu họ đang so với video miễn phí, cần làm rõ giá trị kèm cặp và phản hồi. Nếu họ thật sự không có ngân sách, giảm nhẹ có thể không đủ. Nếu họ không có thời gian học, vấn đề không phải giá.\n\n## Use case 1: Công ty mới\n\nPhản đối thường gặp:\n\n| Phản đối | Gốc có thể là gì? | Cách xử lý |\n|---|---|---|\n| Tôi sợ con không dùng đều | Rủi ro thói quen | Onboarding 14 ngày, nhắc học, báo cáo phụ huynh |\n| AI có chính xác không? | Thiếu niềm tin | Demo bài test, giải thích giới hạn, cho dùng thử |\n| Để tôi hỏi chồng/vợ | Người quyết định | Mời cả hai xem báo cáo mẫu |\n| Giá hơi cao | Chưa thấy giá trị hoặc ngân sách | So với học thêm, làm rõ kết quả mong muốn |\n\n## Use case 2: Công ty đã có\n\nPhản đối với loa thông minh:\n\n- \"Nhận giọng nói có ổn không?\" cần demo tình huống thật và nói rõ điều kiện.\n- \"Nhà tôi dùng app là đủ\" cần hỏi tình huống người già, trẻ em, tay bận.\n- \"Sợ lỗi phiền đại lý\" cần chính sách hỗ trợ, checklist kỹ thuật và phạm vi triển khai.\n- \"AI này có trả lời mọi thứ không?\" cần đặt lại kỳ vọng.\n\n## Lỗi người mới thường mắc\n\n- Trả lời quá nhanh trước khi hiểu gốc phản đối.\n- Giảm giá cho mọi phản đối.\n- Tranh luận để thắng khách.\n- Xem phản đối là dấu hiệu khách không thích mình.\n- Không ghi lại phản đối để cải tiến sản phẩm và marketing.\n\n## Bài tập ứng dụng\n\nLập Objection Handling Matrix:\n\n| Phản đối | Gốc phản đối | Câu hỏi đào sâu | Bằng chứng/câu trả lời | Bước tiếp theo |\n|---|---|---|---|---|\n|  |  |  |  |  |\n\n## Bài tập review\n\nKhách nói \"giá cao quá\". Viết 5 câu hỏi đào sâu trước khi quyết định có giảm giá hay không.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Phản biện hoặc giảm giá ngay |\n| Đạt | Có câu trả lời cho phản đối phổ biến |\n| Tốt | Hỏi sâu và phân loại gốc phản đối |\n| Xuất sắc | Dùng phản đối để quyết định tiến, nuôi dưỡng, disqualify hoặc cải tiến playbook |\n\n## Checklist tự review\n\n1. Tôi đã hỏi sâu trước khi trả lời chưa?\n2. Phản đối này là giá, niềm tin, timing hay fit?\n3. Có bằng chứng nào phù hợp không?\n4. Nếu khách vẫn chưa sẵn sàng, bước tiếp theo là gì?\n5. Phản đối này có nên đưa vào playbook không?\n\n## Hành động 30-90 phút\n\nLiệt kê 10 phản đối hay gặp. Nhóm chúng vào 5 loại: vấn đề, giá trị, niềm tin, timing, fit. Viết một câu hỏi đào sâu cho mỗi phản đối.\n\n## Liên hệ với bài trước và bài sau\n\nBài trước xây niềm tin bằng bằng chứng. Bài này xử lý những rào cản còn lại. Bài sau đi vào báo giá, đàm phán và chốt khi khách đã đủ điều kiện.\n"},{"sourcePath":"Sales/09_bao_gia_dam_phan_va_chot.md","title":"Bài 9. Báo Giá, Đàm Phán Và Chốt","category":"sales","categoryLabel":"Sales","order":10,"sha256":"2c9cb3004c4eea7478ab5546190069f3f066b20c6a372dc1e64a2ee0e614d277","lineCount":135,"headings":[{"level":1,"text":"Bài 9. Báo Giá, Đàm Phán Và Chốt","id":"bài-9-báo-giá-đàm-phán-và-chốt"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 9. Báo Giá, Đàm Phán Và Chốt\n\n## Câu hỏi bản chất\n\n> Chốt đơn có trách nhiệm là gì?\n\n## Tình huống mở bài\n\nMột khách đã dùng thử app AI giáo dục 14 ngày. Con học được 9/14 ngày, phụ huynh mở báo cáo 3 lần và nói thấy hữu ích. Khi sales báo giá, khách hỏi có giảm không. Sales giảm ngay 30% để chốt. Tháng sau khách hủy vì không có ai hỗ trợ duy trì thói quen học.\n\nDeal được chốt nhưng giá trị không được bảo vệ.\n\n## Vì sao bài này quan trọng\n\nBáo giá và chốt là nơi sales dễ đánh đổi chất lượng lấy doanh thu ngắn hạn. Chốt tốt không chỉ làm khách trả tiền, mà làm rõ giá trị, điều kiện, kỳ vọng, trách nhiệm hai bên và bước triển khai sau mua.\n\n## Nguyên lý first principles\n\nChốt đơn là xác nhận một cam kết phù hợp:\n\n```text\nVấn đề rõ + Giá trị rõ + Niềm tin đủ + Điều kiện mua đủ + Kỳ vọng đúng + Bước triển khai rõ\n= Cam kết có trách nhiệm\n```\n\nNếu một phần chưa rõ, chốt nhanh có thể tạo rủi ro.\n\n## Kiến thức nền chi tiết\n\nBáo giá không nên là con số rơi xuống cuối cuộc gọi. Nó phải được đặt trong bối cảnh giá trị. Khách cần hiểu họ trả tiền cho kết quả gì, gói nào phù hợp, điều gì bao gồm, điều gì không bao gồm, rủi ro nào được giảm và bước tiếp theo ra sao.\n\nĐàm phán không chỉ là giảm giá. Khách có thể cần giảm rủi ro, chia giai đoạn, thêm hỗ trợ, thay đổi gói, điều chỉnh thời điểm thanh toán hoặc có điều kiện hủy. Nếu sales chỉ giảm giá, doanh nghiệp có thể làm hỏng định vị, biên lợi nhuận và kỳ vọng.\n\nChốt là kỹ năng hỏi cam kết rõ. Người mới thường ngại hỏi nên để deal mơ hồ: \"Anh/chị suy nghĩ rồi báo em.\" Câu chốt có trách nhiệm là câu giúp hai bên rõ quyết định: \"Dựa trên việc anh/chị muốn theo dõi tiến bộ mỗi tuần, gói 3 tháng có vẻ phù hợp. Nếu hôm nay bắt đầu, em sẽ onboarding ngày mai và hẹn review sau 14 ngày. Anh/chị muốn bắt đầu với gói này không?\"\n\nTrong B2B hoặc đại lý, chốt còn cần proposal, điều kiện triển khai, người ký, timeline, trách nhiệm kỹ thuật và handoff.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Proposal | Đề xuất | Tài liệu/cam kết về giải pháp và điều kiện | Biến tư vấn thành quyết định rõ | Gói, giá, phạm vi, timeline, hỗ trợ | File báo giá trống ngữ cảnh | Quotation |\n| Closing | Chốt | Hỏi và xác nhận cam kết | Đưa deal sang hành động | Chốt gói và lịch onboarding | Ép mua ngay | Manipulation |\n| Discount | Giảm giá | Giảm số tiền khách trả | Công cụ có chi phí | Giảm khi đổi lấy cam kết dài hơn | Giảm vì khách lưỡng lự | Value |\n| Terms | Điều khoản | Điều kiện mua/bán | Bảo vệ kỳ vọng hai bên | Thanh toán, bảo hành, hỗ trợ | Nói miệng không ghi | Price |\n\n## Khung tư duy trực quan\n\n| Trước khi chốt | Cần rõ |\n|---|---|\n| Pain | Khách mua để giải quyết gì? |\n| Value | Kết quả nào đáng trả tiền? |\n| Proof | Khách tin bằng chứng nào? |\n| Terms | Giá, phạm vi, hỗ trợ, giới hạn |\n| Next step | Ai làm gì, khi nào? |\n\n## Ví dụ đời thường\n\nMột phòng gym không nên chỉ bán gói năm vì khách đang hứng thú. Nếu khách mới tập và sợ bỏ cuộc, gói 2 tháng kèm buổi hướng dẫn đầu tiên có thể phù hợp hơn, dù doanh thu ban đầu thấp hơn.\n\n## Use case 1: Công ty mới\n\nVới app AI giáo dục, closing plan có thể là:\n\n- Sau 14 ngày dùng thử, review dữ liệu học của con.\n- Tóm tắt giá trị phụ huynh đã thấy.\n- Đề xuất gói 3 tháng kèm onboarding và báo cáo tuần.\n- Nói rõ app cần trẻ học tối thiểu 3 buổi/tuần.\n- Hẹn review sau 14 ngày trả phí.\n\nKhông nên chốt nếu trẻ gần như không dùng trong trial và phụ huynh không có kế hoạch đồng hành.\n\n## Use case 2: Công ty đã có\n\nVới loa thông minh, proposal cho khách hoặc đại lý cần có:\n\n- Phạm vi thiết bị tương thích.\n- Câu lệnh được hỗ trợ.\n- Điều kiện kỹ thuật trước lắp đặt.\n- Giá, bảo hành, hỗ trợ 14 ngày đầu.\n- Kịch bản bàn giao và thu feedback.\n\nChốt chỉ nên xảy ra khi khách hiểu loa mạnh nhất ở điều khiển smart home tiếng Việt, không phải trợ lý AI tổng quát.\n\n## Lỗi người mới thường mắc\n\n- Báo giá trước khi làm rõ giá trị.\n- Giảm giá ngay khi khách hỏi.\n- Ngại hỏi quyết định.\n- Không ghi rõ điều khoản và giới hạn.\n- Chốt xong không có lịch onboarding.\n\n## Bài tập ứng dụng\n\nLập Proposal Brief:\n\n| Thành phần | Nội dung |\n|---|---|\n| Vấn đề khách muốn giải quyết |  |\n| Kết quả kỳ vọng |  |\n| Giải pháp/gói đề xuất |  |\n| Giá và điều khoản |  |\n| Bao gồm |  |\n| Không bao gồm/giới hạn |  |\n| Điều kiện để thành công |  |\n| Bước tiếp theo sau khi đồng ý |  |\n\n## Bài tập review\n\nMột sales giảm giá 20% để khách \"quyết nhanh trong hôm nay\". Review rủi ro với biên lợi nhuận, định vị, kỳ vọng, forecast và retention.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Chốt bằng giảm giá hoặc áp lực |\n| Đạt | Báo giá và hỏi quyết định rõ |\n| Tốt | Proposal gắn với giá trị, điều khoản và next step |\n| Xuất sắc | Chốt có trách nhiệm, bảo vệ biên lợi nhuận, kỳ vọng và thành công sau bán |\n\n## Checklist tự review\n\n1. Giá có được đặt trong bối cảnh giá trị không?\n2. Khách hiểu gói nào phù hợp và vì sao chưa?\n3. Có điều khoản và giới hạn rõ không?\n4. Tôi có đổi giảm giá lấy cam kết hợp lý không?\n5. Sau khi chốt, bước triển khai đầu tiên là gì?\n\n## Hành động 30-90 phút\n\nViết một đoạn báo giá 90 giây cho sản phẩm của bạn, gồm: vấn đề, giá trị, gói đề xuất, giá, điều kiện thành công và câu hỏi chốt.\n\n## Liên hệ với bài trước và bài sau\n\nBài trước xử lý phản đối. Bài này chuyển cơ hội thành cam kết. Bài sau giúp quản trị nhiều cơ hội bằng pipeline, CRM và forecast.\n"},{"sourcePath":"Sales/10_pipeline_crm_va_forecast.md","title":"Bài 10. Pipeline, CRM Và Forecast","category":"sales","categoryLabel":"Sales","order":11,"sha256":"6e7a7c0dc0ac34ce114cddb15eb6fba92bf654c5b22fde69cd43b5a314e6ce0c","lineCount":135,"headings":[{"level":1,"text":"Bài 10. Pipeline, CRM Và Forecast","id":"bài-10-pipeline-crm-và-forecast"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 10. Pipeline, CRM Và Forecast\n\n## Câu hỏi bản chất\n\n> Bán hàng có hệ thống ra sao?\n\n## Tình huống mở bài\n\nFounder startup AI giáo dục nói có \"rất nhiều khách tiềm năng\", nhưng khi hỏi cụ thể thì không biết ai đang dùng thử, ai đã được demo, ai cần follow-up, ai có khả năng trả tiền tuần này và vì sao các deal bị mất. Mọi thứ nằm trong trí nhớ và tin nhắn cá nhân.\n\nKhông có pipeline, doanh nghiệp không biết sales đang thật sự khỏe hay chỉ bận.\n\n## Vì sao bài này quan trọng\n\nPipeline và CRM giúp sales biến hoạt động rời rạc thành hệ thống có thể đo, học và dự báo. Không có dữ liệu pipeline, đội sales dễ nhầm số cuộc gọi với tiến triển thật, nhầm hy vọng với forecast và bỏ lỡ khách phù hợp.\n\n## Nguyên lý first principles\n\nMột pipeline tốt trả lời:\n\n```text\nCó bao nhiêu cơ hội?\nĐang ở stage nào?\nGiá trị tiềm năng bao nhiêu?\nBước tiếp theo là gì?\nRủi ro chính là gì?\nKhi nào có thể ra quyết định?\n```\n\nDeal không có next step cụ thể không nên được forecast như cơ hội thật.\n\n## Kiến thức nền chi tiết\n\nPipeline là bản đồ các cơ hội bán hàng theo giai đoạn. CRM là hệ thống lưu dữ liệu khách hàng và hoạt động sales. Forecast là dự báo doanh thu dựa trên pipeline, xác suất, timing và chất lượng deal.\n\nStage trong pipeline không nên đặt theo cảm giác của sales, mà theo hành vi và cam kết của khách. \"Đã gửi báo giá\" chưa chắc là stage mạnh nếu khách chưa xác nhận vấn đề và chưa có người quyết định. \"Đã hẹn demo với cả hai phụ huynh\" có thể mạnh hơn \"khách khen sản phẩm hay\".\n\nCRM tốt không cần phức tạp lúc đầu. Với công ty mới, một bảng đơn giản cũng đủ nếu có lead, ICP fit, stage, pain, decision maker, next step, deadline, value, objection và kết quả. Điều quan trọng là dữ liệu phải được cập nhật sau mỗi tương tác.\n\nForecast cần khi doanh nghiệp ra quyết định: thuê thêm sales, tăng ngân sách marketing, chuẩn bị hàng tồn kho, mở rộng đại lý, hoặc dự kiến dòng tiền. Forecast sai có thể làm công ty sản xuất quá nhiều, tuyển quá nhanh hoặc hụt doanh thu.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Pipeline | Đường ống bán hàng | Danh sách deal theo giai đoạn | Bản đồ doanh thu tương lai | Lead -> discovery -> trial -> paid | Danh bạ khách | Funnel marketing |\n| CRM | Quản trị quan hệ khách | Nơi lưu dữ liệu khách và hoạt động | Bộ nhớ của hệ thống sales | Ghi pain, next step, objection | Chỉ lưu số điện thoại | Chat app |\n| Forecast | Dự báo doanh thu | Ước lượng deal nào sẽ chốt khi nào | Quyết định nguồn lực | 20 deal trial, 5 khả năng paid tháng này | Mong muốn doanh số | Target |\n| Stage | Giai đoạn deal | Deal đang tiến đến đâu | Đo cam kết khách | Đã hẹn review trial | \"Khách có vẻ thích\" | Status |\n\n## Khung tư duy trực quan\n\n| Stage | Điều kiện vào stage | Dữ liệu bắt buộc |\n|---|---|---|\n| Lead | Có thông tin liên hệ | Nguồn, ICP fit |\n| Qualified | Có vấn đề và fit cơ bản | Pain, người quyết định |\n| Discovery | Đã trao đổi sâu | Impact, tiêu chí mua |\n| Demo/Trial | Khách cam kết trải nghiệm | Ngày bắt đầu, mục tiêu |\n| Proposal | Có đề xuất cụ thể | Giá, điều khoản, objection |\n| Won/Lost | Có quyết định | Lý do thắng/thua |\n\n## Ví dụ đời thường\n\nMột quán ăn nhận đặt tiệc không thể chỉ nhớ trong đầu ai đã hỏi. Họ cần biết khách nào đã chốt cọc, khách nào chờ menu, khách nào cần gọi lại, ngày tiệc nào và giá trị đơn hàng bao nhiêu.\n\n## Use case 1: Công ty mới\n\nPipeline startup AI giáo dục nên theo dõi:\n\n- Lead từ nguồn nào.\n- Con lớp mấy, vấn đề học gì.\n- Phụ huynh có xem báo cáo mẫu chưa.\n- Trial bắt đầu ngày nào, trẻ học mấy buổi.\n- Phản đối chính trước paid.\n- Lý do trả tiền hoặc hủy.\n\nForecast paid không nên dựa trên số lead, mà dựa trên số phụ huynh đã trial đủ và có lịch review.\n\n## Use case 2: Công ty đã có\n\nPipeline loa thông minh cần theo dõi cả khách hàng và đại lý:\n\n- Đại lý đủ điều kiện demo chưa.\n- Khách có thiết bị tương thích không.\n- Đã demo tình huống nào.\n- Có checklist kỹ thuật chưa.\n- Ngày lắp dự kiến, đội hỗ trợ phụ trách.\n- Feedback sau 3/14 ngày.\n\nForecast phải tính năng lực lắp đặt và hỗ trợ, không chỉ số đơn đặt hàng.\n\n## Lỗi người mới thường mắc\n\n- Gọi danh sách lead là pipeline.\n- Stage dựa trên cảm giác sales.\n- Không có next step và ngày follow-up.\n- Forecast theo hy vọng.\n- Không ghi lý do lost nên không học được.\n\n## Bài tập ứng dụng\n\nLập Pipeline Dashboard:\n\n| Deal | Nguồn | ICP fit | Stage | Pain chính | Next step | Ngày hẹn | Giá trị | Rủi ro | Forecast |\n|---|---|---|---|---|---|---|---:|---|---|\n|  |  |  |  |  |  |  |  |  |  |\n\n## Bài tập review\n\nMột founder nói: \"Chúng ta có 100 lead nên tháng này chắc có 30 khách.\" Review vì sao forecast này yếu và cần thêm dữ liệu gì.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Quản lý sales bằng trí nhớ và cảm giác |\n| Đạt | Có danh sách deal và stage cơ bản |\n| Tốt | Có CRM, next step, lý do thắng/thua và forecast theo stage |\n| Xuất sắc | Pipeline giúp ra quyết định nguồn lực, cải tiến playbook và dự báo dòng tiền |\n\n## Checklist tự review\n\n1. Mỗi deal có stage rõ không?\n2. Stage dựa trên cam kết khách hay cảm giác sales?\n3. Mỗi deal có next step và ngày hẹn không?\n4. Forecast có tính rủi ro và timing không?\n5. Lý do won/lost có được ghi lại không?\n\n## Hành động 30-90 phút\n\nTạo bảng pipeline 10 deal giả định hoặc thật. Với mỗi deal, viết next step cụ thể và lý do forecast là high, medium hoặc low.\n\n## Liên hệ với bài trước và bài sau\n\nBài trước chốt từng deal. Bài này quản trị nhiều deal như một hệ thống. Bài sau đảm bảo sau khi thắng deal, khách được bàn giao và dùng đúng.\n"},{"sourcePath":"Sales/11_ban_giao_sau_ban_va_customer_success.md","title":"Bài 11. Bàn Giao Sau Bán Và Customer Success","category":"sales","categoryLabel":"Sales","order":12,"sha256":"7d67f263a1f0ae9be48316b22e70963c8a9aa4b400fd3595ea6d9bc7f0fb92b9","lineCount":138,"headings":[{"level":1,"text":"Bài 11. Bàn Giao Sau Bán Và Customer Success","id":"bài-11-bàn-giao-sau-bán-và-customer-success"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 11. Bàn Giao Sau Bán Và Customer Success\n\n## Câu hỏi bản chất\n\n> Bán xong đã xong chưa?\n\n## Tình huống mở bài\n\nSales chốt được 30 khách dùng app AI giáo dục trong tháng đầu. Nhưng sau đó phụ huynh hỏi liên tục, trẻ không học đều, đội product không biết khách được hứa gì, CS không biết khách kỳ vọng báo cáo thế nào. Sau 30 ngày, nhiều khách hủy.\n\nSales thắng đơn, nhưng hệ thống giao giá trị thất bại.\n\n## Vì sao bài này quan trọng\n\nMột deal tốt phải dẫn đến khách hàng thành công. Nếu sales bàn giao kém, khách dùng sai, CS xử lý mù, product thiếu dữ liệu và marketing không biết claim nào gây kỳ vọng sai. Bàn giao sau bán bảo vệ retention, thương hiệu và lợi nhuận.\n\n## Nguyên lý first principles\n\nSau khi khách đồng ý mua, doanh nghiệp phải chuyển giao 5 thứ:\n\n```text\nKỳ vọng đã hứa\n-> Vấn đề khách cần giải quyết\n-> Điều kiện thành công\n-> Dữ liệu và lịch sử trao đổi\n-> Bước onboarding đầu tiên\n```\n\nKhông bàn giao nghĩa là bắt khách và đội nội bộ bắt đầu lại từ đầu.\n\n## Kiến thức nền chi tiết\n\nSales không kết thúc ở chữ ký hoặc thanh toán. Sales kết thúc khi kỳ vọng mua hàng được chuyển thành kế hoạch sử dụng đúng. Với sản phẩm có onboarding, triển khai, lắp đặt hoặc thói quen sử dụng, bàn giao là một phần của chất lượng bán hàng.\n\nHandoff tốt cần thông tin cụ thể: khách mua vì lý do gì, ai là người quyết định, ai là người dùng, phản đối từng có là gì, sales đã hứa gì, điều gì không được hứa, gói nào đã mua, timeline thế nào, dấu hiệu thành công đầu tiên là gì.\n\nCustomer success không chỉ là hỗ trợ khi khách kêu. Nó là chủ động giúp khách đạt kết quả. Với app giáo dục, quick win có thể là hoàn thành bài test và nhận báo cáo đầu tiên. Với loa thông minh, quick win là dùng được 5 câu lệnh hữu ích nhất trong nhà.\n\nFeedback loop sau bán giúp sales cải tiến. Nếu nhiều khách hủy vì trẻ không học đều, sales cần qualification tốt hơn hoặc bán kèm onboarding. Nếu nhiều khách phàn nàn loa không hiểu mọi câu hỏi, sales kit cần sửa claim.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Handoff | Bàn giao | Chuyển thông tin từ sales sang đội triển khai/CS | Giữ lời hứa nhất quán | Gửi pain, gói mua, kỳ vọng, rủi ro | Chỉ báo \"khách đã mua\" | Hỗ trợ |\n| Onboarding | Hướng dẫn bắt đầu | Giúp khách dùng đúng từ đầu | Tạo quick win | Ngày 1 làm bài test và đọc báo cáo | Gửi file dài | Training |\n| Customer success | Thành công khách hàng | Giúp khách đạt kết quả đã mua | Bảo vệ retention | Theo dõi trẻ học 7 ngày đầu | Chờ khách than phiền | Customer support |\n| Expansion | Mở rộng | Bán thêm/gia hạn khi khách thành công | Tăng giá trị vòng đời | Gia hạn gói 6 tháng sau khi thấy tiến bộ | Upsell khi khách chưa dùng được | Cross-sell |\n\n## Khung tư duy trực quan\n\n| Sau khi chốt | Cần làm |\n|---|---|\n| Ngay lập tức | Xác nhận gói, giá, kỳ vọng, timeline |\n| Trước onboarding | Bàn giao pain, người dùng, rủi ro |\n| Ngày đầu | Tạo quick win |\n| Ngày 3-7 | Kiểm tra hành vi sử dụng |\n| Ngày 14-30 | Review giá trị và rủi ro churn |\n\n## Ví dụ đời thường\n\nMột người bán máy lạnh không chỉ nhận tiền rồi đi. Nếu không bàn giao lịch lắp, công suất phòng, vị trí máy, bảo hành và cách dùng tiết kiệm điện, khách rất dễ thất vọng dù sản phẩm tốt.\n\n## Use case 1: Công ty mới\n\nHandoff app AI giáo dục cần có:\n\n- Con học lớp mấy, yếu phần nào.\n- Phụ huynh muốn thấy kết quả gì sau 14 ngày.\n- Ai theo dõi báo cáo.\n- Trẻ có lịch học lúc nào.\n- Sales đã hứa gì và không hứa gì.\n- Ngày review đầu tiên.\n\nCS cần biết nếu trẻ không học 3 ngày thì phải nhắc phụ huynh.\n\n## Use case 2: Công ty đã có\n\nHandoff loa thông minh cần có:\n\n- Danh sách thiết bị tương thích trong nhà.\n- Câu lệnh khách được demo.\n- Kỳ vọng đã được đặt.\n- Đại lý và kỹ thuật phụ trách.\n- Checklist lắp đặt.\n- Lịch gọi sau 3 ngày và khảo sát sau 14 ngày.\n\n## Lỗi người mới thường mắc\n\n- Nghĩ sales không chịu trách nhiệm sau khi thu tiền.\n- Không ghi lại lời hứa với khách.\n- Không bàn giao phản đối và rủi ro.\n- Không thiết kế quick win.\n- Không dùng feedback sau bán để sửa sales script.\n\n## Bài tập ứng dụng\n\nLập Handoff Checklist:\n\n| Mục bàn giao | Nội dung |\n|---|---|\n| Khách mua vì lý do gì |  |\n| Người dùng/người quyết định |  |\n| Kỳ vọng đã thống nhất |  |\n| Điều sales đã hứa |  |\n| Điều không được hứa |  |\n| Rủi ro churn |  |\n| Quick win đầu tiên |  |\n| Lịch review |  |\n\n## Bài tập review\n\nMột khách hủy sau tháng đầu vì \"sản phẩm không như sales nói\". Review những điểm có thể sai trong sales claim, proposal, handoff, onboarding và CS.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Bán xong bỏ mặc khách |\n| Đạt | Có hướng dẫn sau mua cơ bản |\n| Tốt | Có handoff, quick win, review và feedback loop |\n| Xuất sắc | Sales, CS, product và marketing cùng học từ dữ liệu sau bán |\n\n## Checklist tự review\n\n1. CS có biết khách mua vì lý do gì không?\n2. Có ghi lại kỳ vọng và claim đã nói không?\n3. Quick win đầu tiên là gì?\n4. Có lịch review sau mua không?\n5. Feedback sau bán quay về sales playbook không?\n\n## Hành động 30-90 phút\n\nViết mẫu handoff một trang cho một deal vừa chốt, gồm pain, kỳ vọng, gói mua, rủi ro và
