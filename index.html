Báo cáo đầu tiên sau 7 ngày học | Lượt like bài viết | KPI |\n| Friction | Ma sát | Điều làm khách ngại tiếp tục | Rào cản trong hành động | Form đăng ký dài, thiếu bằng chứng bảo mật | Khách chưa sẵn sàng mua | Objection |\n\n## Khung tư duy trực quan\n\n| Giai đoạn | Câu hỏi của khách | Marketing cần làm |\n|---|---|---|\n| Nhận biết | Vấn đề này có liên quan đến tôi không? | Gọi đúng nỗi đau |\n| Cân nhắc | Giải pháp nào đáng tin? | So sánh, giải thích, bằng chứng |\n| Mua | Rủi ro có chấp nhận được không? | Offer, cam kết, CTA rõ |\n| Sử dụng | Tôi có thấy giá trị không? | Onboarding, hướng dẫn, quick win |\n| Quay lại | Có đáng tiếp tục không? | Báo cáo giá trị, nhắc thói quen |\n\n## Ví dụ đời thường\n\nMột người mua máy lọc nước không chỉ xem giá rồi mua. Họ nghe người quen nói, tìm hiểu nước nhà mình có vấn đề gì, so sánh thương hiệu, xem chi phí lõi lọc, hỏi bảo hành, rồi sau khi mua đánh giá qua chất lượng lắp đặt và nhắc thay lõi.\n\n## Use case 1: Công ty mới\n\nHành trình đề xuất:\n\n| Giai đoạn | Nội dung |\n|---|---|\n| Nhận biết | \"Con học mãi không tiến bộ vì chưa biết lỗ hổng nằm ở đâu\" |\n| Cân nhắc | Bài kiểm tra 15 phút và giải thích phương pháp |\n| Dùng thử | Lộ trình 7 ngày miễn phí |\n| Chuyển đổi | Báo cáo tiến bộ gửi phụ huynh |\n| Retention | Nhắc học 10 phút, báo cáo tuần, gợi ý điều chỉnh |\n\n## Use case 2: Công ty đã có\n\nVới loa thông minh, demo showroom là điểm chạm then chốt. Marketing cần thiết kế video demo, sales kit, tài liệu giới hạn tính năng, hướng dẫn sau lắp đặt và quy trình thu feedback 3 ngày, 14 ngày.\n\n## Lỗi người mới thường mắc\n\n- Nghĩ khách mua ngay sau khi thấy quảng cáo.\n- Dùng một thông điệp cho mọi giai đoạn.\n- Chỉ đo click, không đo hành động sau click.\n- Bỏ qua onboarding sau mua.\n- Không biết điểm chạm nào tạo hoặc phá niềm tin.\n\n## Bài tập ứng dụng\n\nLập Customer Journey Map:\n\n| Giai đoạn | Suy nghĩ của khách | Câu hỏi của khách | Nội dung cần cung cấp | Kênh | Chỉ số đo |\n|---|---|---|---|---|---|\n| Nhận biết |  |  |  |  |  |\n| Cân nhắc |  |  |  |  |  |\n| Mua |  |  |  |  |  |\n| Sử dụng |  |  |  |  |  |\n| Giới thiệu |  |  |  |  |  |\n\n## Bài tập review\n\nMột campaign có 10.000 lượt xem, 1.000 click, 300 đăng ký nhưng chỉ 10 người dùng thử. Review điểm nghẽn có thể nằm ở đâu.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Chỉ liệt kê kênh hoặc bước chung chung |\n| Đạt | Có các giai đoạn chính và nội dung cơ bản |\n| Tốt | Có câu hỏi, rào cản, điểm chạm, chỉ số từng giai đoạn |\n| Xuất sắc | Xác định được điểm nghẽn và thử nghiệm cải thiện cụ thể |\n\n## Checklist tự review\n\n1. Tôi có biết khách đang ở giai đoạn nào không?\n2. Mỗi giai đoạn có câu hỏi và rào cản riêng không?\n3. Điểm chạm quan trọng nhất là gì?\n4. Sau mua có kế hoạch giúp khách thấy giá trị không?\n5. Tôi có chỉ số đo từng bước không?\n\n## Hành động 30-90 phút\n\nChọn một sản phẩm và phỏng vấn một khách hàng đã mua. Hỏi họ biết sản phẩm từ đâu, cân nhắc gì, lo gì, điều gì khiến họ quyết định và trải nghiệm sau mua ra sao.\n\n## Liên hệ với bài trước và bài sau\n\nĐịnh vị cho biết muốn khách nhớ gì. Hành trình cho biết khi nào khách cần thông tin gì. Bài sau chuyển journey và định vị thành thông điệp cụ thể.\n\n"},{"sourcePath":"Marketing/05_thong_diep_marketing.md","title":"Bài 5. Thông Điệp Marketing","category":"marketing","categoryLabel":"Marketing","order":6,"sha256":"03958690c38c49acce7b3b1cf9c57c09a4009978ca2f425d2822f201f3c1e471","lineCount":131,"headings":[{"level":1,"text":"Bài 5. Thông Điệp Marketing","id":"bài-5-thông-điệp-marketing"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 5. Thông Điệp Marketing\n\n## Câu hỏi bản chất\n\n> Một thông điệp tốt cần làm khách hàng hiểu, tin và hành động như thế nào?\n\n## Tình huống mở bài\n\nStartup viết headline: \"Nền tảng AI học tập thông minh cho trẻ em\". Câu này nghe hiện đại nhưng phụ huynh không biết con mình được gì, mất bao lâu, có an toàn không, và bước tiếp theo là gì. Nhóm viết lại: \"Biết con đang yếu phần nào sau 15 phút, nhận lộ trình học 10 phút mỗi ngày để con tiến bộ từng tuần\". Lượt đăng ký tăng vì thông điệp cụ thể hơn.\n\n## Vì sao bài này quan trọng\n\nThông điệp là nơi insight, định vị và hành trình khách hàng gặp nhau. Thông điệp yếu làm kênh tốt cũng khó hiệu quả. Thông điệp tốt không chỉ hay; nó phải rõ, đúng, có bằng chứng và tạo hành động phù hợp.\n\n## Nguyên lý first principles\n\nKhách hàng không mua câu chữ đẹp. Họ phản ứng với thông điệp khi thấy:\n\n```text\nVấn đề của tôi -> Kết quả tôi muốn -> Giải pháp tôi hiểu -> Bằng chứng tôi tin -> Bước tiếp theo tôi làm được\n```\n\n## Kiến thức nền chi tiết\n\nThông điệp marketing không phải slogan. Slogan thường ngắn và gợi nhớ. Thông điệp là hệ thống diễn đạt giá trị cho từng nhóm khách, từng giai đoạn hành trình và từng kênh.\n\nMột thông điệp tốt thường có 5 yếu tố: vấn đề cụ thể, kết quả mong muốn, giải pháp rõ, bằng chứng đáng tin và lời kêu gọi hành động phù hợp. Nếu thiếu vấn đề, khách không thấy liên quan. Nếu thiếu kết quả, khách không thấy đáng quan tâm. Nếu thiếu bằng chứng, khách không tin. Nếu CTA mơ hồ, khách không biết làm gì.\n\nThông điệp có 3 tầng:\n\n| Tầng | Câu hỏi | Ví dụ |\n|---|---|---|\n| Tính năng | Sản phẩm có gì? | Bài kiểm tra năng lực 15 phút |\n| Lợi ích | Khách được gì? | Biết con yếu phần nào |\n| Chuyển đổi | Cuộc sống thay đổi ra sao? | Cha mẹ bớt lo và có cách đồng hành mỗi ngày |\n\nGiới hạn quan trọng: thông điệp không được hứa quá năng lực sản phẩm. Overpromise có thể tăng chuyển đổi ngắn hạn nhưng phá niềm tin dài hạn.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Message | Thông điệp | Điều mình muốn khách hiểu và nhớ | Diễn đạt giá trị thành ngôn ngữ khách hiểu | Biết con yếu gì sau 15 phút | Sản phẩm công nghệ hàng đầu | Slogan |\n| Claim | Tuyên bố | Điều doanh nghiệp khẳng định | Lời hứa cần bằng chứng | Báo cáo tiến bộ mỗi tuần | Cam kết giỏi toán sau 1 tháng | Benefit |\n| CTA | Lời kêu gọi hành động | Bước tiếp theo muốn khách làm | Biến nhận thức thành hành động | Làm bài kiểm tra miễn phí | Tìm hiểu thêm chung chung | Slogan |\n| Proof point | Bằng chứng | Thứ làm claim đáng tin | Giảm rủi ro cảm nhận | Case học sinh, chuyên gia, demo | \"Chúng tôi uy tín\" | Review |\n\n## Khung tư duy trực quan\n\n```text\nVấn đề cụ thể + Kết quả mong muốn + Giải pháp dễ hiểu + Bằng chứng + Hành động tiếp theo\n```\n\n## Ví dụ đời thường\n\n\"Dịch vụ giặt ủi chất lượng cao\" là thông điệp yếu. \"Nhận quần áo sạch, thơm, gấp gọn trong 24 giờ, miễn phí giao nhận trong bán kính 3 km\" cụ thể hơn vì khách hiểu kết quả, thời gian và tiện ích.\n\n## Use case 1: Công ty mới\n\nThông điệp theo 3 tầng:\n\n| Tầng | Nội dung |\n|---|---|\n| Tính năng | Bài kiểm tra năng lực toán 15 phút và lộ trình học cá nhân hóa |\n| Lợi ích | Phụ huynh biết con yếu phần nào và nên học gì tiếp theo |\n| Chuyển đổi | Mỗi ngày 10 phút để cha mẹ đồng hành cùng con rõ ràng hơn |\n\n## Use case 2: Công ty đã có\n\nThông điệp yếu: \"Loa AI thông minh thế hệ mới\".\n\nThông điệp tốt hơn: \"Bật đèn, kéo rèm, xem camera và điều khiển ngôi nhà bằng tiếng Việt tự nhiên hơn\". Câu này giới hạn phạm vi claim trong trải nghiệm sản phẩm đã làm tốt.\n\n## Lỗi người mới thường mắc\n\n- Viết thông điệp từ góc nhìn sản phẩm.\n- Dùng từ lớn nhưng không cụ thể.\n- Không có bằng chứng.\n- CTA mơ hồ.\n- Hứa quá mức để gây chú ý.\n- Một thông điệp dùng cho mọi nhóm khách.\n\n## Bài tập ứng dụng\n\nViết 5 phiên bản thông điệp:\n\n| Loại thông điệp | Nội dung |\n|---|---|\n| Theo nỗi đau |  |\n| Theo kết quả |  |\n| Theo cảm xúc |  |\n| Theo bằng chứng |  |\n| Theo lời mời dùng thử |  |\n\n## Bài tập review\n\nReview thông điệp: \"Giải pháp toàn diện giúp doanh nghiệp chuyển đổi số hiệu quả\".\n\n| Câu hỏi review | Nhận xét |\n|---|---|\n| Khách hàng cụ thể là ai? |  |\n| Vấn đề cụ thể là gì? |  |\n| Kết quả đo được là gì? |  |\n| Bằng chứng nằm ở đâu? |  |\n| CTA có rõ không? |  |\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Chung chung, nhiều từ đẹp nhưng không rõ giá trị |\n| Đạt | Có vấn đề và lợi ích cơ bản |\n| Tốt | Cụ thể, đúng insight, có bằng chứng và CTA |\n| Xuất sắc | Dễ hiểu trong 5 giây, không overpromise, phù hợp từng giai đoạn journey |\n\n## Checklist tự review\n\n1. Khách có thấy mình trong thông điệp không?\n2. Kết quả có cụ thể không?\n3. Có bằng chứng cho claim không?\n4. CTA có hành động rõ không?\n5. Có hứa quá năng lực sản phẩm không?\n\n## Hành động 30-90 phút\n\nViết 3 headline cho một landing page. Đưa cho 5 người đọc trong 5 giây, sau đó hỏi họ nhớ sản phẩm dành cho ai, giúp gì và bước tiếp theo là gì.\n\n## Liên hệ với bài trước và bài sau\n\nJourney cho biết khách cần nghe gì ở từng giai đoạn. Bài này tạo thông điệp. Bài sau biến thông điệp thành hệ thống nội dung giáo dục, thuyết phục và nuôi dưỡng.\n\n"},{"sourcePath":"Marketing/06_content_marketing.md","title":"Bài 6. Content Marketing","category":"marketing","categoryLabel":"Marketing","order":7,"sha256":"b32ac76996fea3d8c38d85fc9ffbe8a49579bb3ef5bcb775c34af92de2aabac8","lineCount":118,"headings":[{"level":1,"text":"Bài 6. Content Marketing","id":"bài-6-content-marketing"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 6. Content Marketing\n\n## Câu hỏi bản chất\n\n> Vì sao khách hàng cần đọc, xem hoặc nghe nội dung của mình?\n\n## Tình huống mở bài\n\nStartup AI giáo dục tạo 100 bài viết bằng AI về học tập. Bài nào cũng tròn trịa, nhưng phụ huynh ít bình luận và ít đăng ký. Khi xem lại, nội dung toàn lời khuyên chung như \"hãy tạo động lực học cho con\", thiếu tình huống thật, thiếu ngôn ngữ phụ huynh và thiếu bước hành động cụ thể.\n\n## Vì sao bài này quan trọng\n\nContent không phải đăng bài cho đều. Content tốt giúp khách hàng thông minh hơn, hiểu vấn đề hơn, tin thương hiệu hơn và sẵn sàng hành động hơn. Nếu content không gắn với insight và journey, nó chỉ là tiếng ồn.\n\n## Nguyên lý first principles\n\nContent marketing là hệ thống giáo dục thị trường:\n\n```text\nNhận ra vấn đề -> Hiểu nguyên nhân -> Biết cách đánh giá giải pháp -> Tin chuyên môn -> Hành động\n```\n\n## Kiến thức nền chi tiết\n\nNội dung tốt bắt đầu từ câu hỏi thật của khách hàng, không bắt đầu từ lịch đăng. Một khách chưa nhận ra vấn đề cần nội dung khác với khách đã muốn mua. Một khách lo về dữ liệu trẻ em cần bằng chứng khác với khách chỉ muốn biết giá.\n\nContent pillar là các trụ cột nội dung lặp lại có mục đích. Trụ cột không nên chỉ là chủ đề rộng như \"giáo dục\" hoặc \"công nghệ\". Nó nên gắn với nhiệm vụ marketing: giáo dục vấn đề, giải thích giải pháp, tạo bằng chứng, hướng dẫn sử dụng, kể câu chuyện khách hàng, xử lý phản đối.\n\nContent có nhiều dạng: bài viết, video ngắn, checklist, case study, webinar, demo, email, tài liệu sales, FAQ. Chọn dạng theo hành vi khách và loại bằng chứng cần tạo. Sản phẩm công nghệ mới thường cần demo và hướng dẫn; sản phẩm cần niềm tin cao cần case thật và chuyên gia.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Content marketing | Tiếp thị bằng nội dung | Dùng nội dung để giúp khách hiểu và tin | Giáo dục thị trường có mục tiêu | Checklist kiểm tra con mất gốc toán | Đăng ảnh sản phẩm mỗi ngày | Social posting |\n| Content pillar | Trụ cột nội dung | Nhóm chủ đề lặp lại có mục tiêu | Khung duy trì nhất quán | Dấu hiệu mất gốc, case tiến bộ, hướng dẫn học | \"Tin tức\" | Topic |\n| Editorial calendar | Lịch nội dung | Kế hoạch xuất bản | Công cụ vận hành, không thay chiến lược | Tuần 1 giáo dục vấn đề, tuần 2 case | Lịch đăng cho đủ số lượng | Strategy |\n| Lead magnet | Nội dung đổi lấy thông tin | Tài liệu/offer nhỏ để khách để lại liên hệ | Tạo bước chuyển từ quan tâm sang lead | Bài test 15 phút miễn phí | File PDF chung chung | Promotion |\n\n## Khung tư duy trực quan\n\n| Nhiệm vụ nội dung | Câu hỏi khách hàng |\n|---|---|\n| Giáo dục vấn đề | Vì sao chuyện này quan trọng? |\n| Giải thích nguyên nhân | Vì sao tôi gặp vấn đề này? |\n| Hướng dẫn đánh giá | Tôi nên chọn giải pháp thế nào? |\n| Tạo bằng chứng | Vì sao tôi tin bạn? |\n| Kích hoạt hành động | Tôi nên làm gì tiếp theo? |\n\n## Ví dụ đời thường\n\nMột phòng gym không nên chỉ đăng ảnh máy tập. Nội dung tốt có thể là cách nhận biết tập sai, lịch tập cho người bận, câu chuyện người mới giảm đau lưng, checklist chọn gói tập và hướng dẫn buổi đầu.\n\n## Use case 1: Công ty mới\n\nTrụ cột nội dung:\n\n| Trụ cột | Ví dụ |\n|---|---|\n| Dấu hiệu vấn đề | 5 dấu hiệu con mất gốc toán nhưng cha mẹ dễ bỏ qua |\n| Hướng dẫn kiểm tra | Cách kiểm tra con yếu phần nào trong 15 phút |\n| Giải pháp nhỏ | 10 phút học mỗi ngày nên bắt đầu từ đâu |\n| Bằng chứng | Một học sinh cải thiện qua 4 tuần như thế nào |\n| AI đúng vai trò | AI hỗ trợ cá nhân hóa, không thay cha mẹ |\n\n## Use case 2: Công ty đã có\n\nNội dung cho loa thông minh cần phục vụ cả khách hàng cuối và đại lý. Khách hàng cần demo đời sống: bật đèn, kéo rèm, hỏi trạng thái thiết bị. Đại lý cần sales kit: phạm vi tính năng, câu lệnh mẫu, cách demo và cách xử lý kỳ vọng.\n\n## Lỗi người mới thường mắc\n\n- Đăng nhiều nhưng không có chiến lược.\n- Dùng AI tạo nội dung chung chung.\n- Chỉ bán hàng, không giáo dục.\n- Không có CTA theo giai đoạn.\n- Không tạo bằng chứng.\n\n## Bài tập ứng dụng\n\nLập Content Pillar:\n\n| Trụ cột nội dung | Mục tiêu | Đối tượng | Ví dụ tiêu đề | CTA |\n|---|---|---|---|---|\n| Giáo dục vấn đề |  |  |  |  |\n| Giải pháp |  |  |  |  |\n| Bằng chứng |  |  |  |  |\n| Hướng dẫn |  |  |  |  |\n| Câu chuyện khách hàng |  |  |  |  |\n\n## Bài tập review\n\nChọn 5 bài content gần nhất của một thương hiệu. Đánh giá mỗi bài đang phục vụ giai đoạn nào trong journey và có CTA phù hợp không.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Nội dung rời rạc, đăng cho có |\n| Đạt | Có trụ cột và lịch đăng cơ bản |\n| Tốt | Trụ cột gắn với insight, journey và CTA |\n| Xuất sắc | Nội dung tạo học hỏi, niềm tin, lead và feedback để tối ưu |\n\n## Checklist tự review\n\n1. Nội dung có trả lời câu hỏi thật của khách không?\n2. Có đủ giáo dục, bằng chứng, hướng dẫn và hành động không?\n3. CTA có phù hợp giai đoạn không?\n4. Nội dung có dùng ngôn ngữ khách hàng không?\n5. Có cách đo nội dung tạo ra kết quả gì không?\n\n## Hành động 30-90 phút\n\nViết 10 câu hỏi khách hàng thường hỏi trước khi mua. Nhóm chúng thành 4-5 trụ cột nội dung và viết mỗi trụ cột 3 tiêu đề.\n\n## Liên hệ với bài trước và bài sau\n\nThông điệp là điều cần nói. Content là hệ thống nói điều đó nhiều lần, theo nhiều dạng và đúng giai đoạn. Bài sau chọn kênh để đưa nội dung đến đúng bối cảnh.\n\n"},{"sourcePath":"Marketing/07_kenh_marketing.md","title":"Bài 7. Kênh Marketing","category":"marketing","categoryLabel":"Marketing","order":8,"sha256":"b2e8c27ecc047f35183cc85974f484fb1cdecc77362e53276032dcd9c04967fa","lineCount":128,"headings":[{"level":1,"text":"Bài 7. Kênh Marketing","id":"bài-7-kênh-marketing"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 7. Kênh Marketing\n\n## Câu hỏi bản chất\n\n> Khách hàng đang ở đâu và họ sẵn sàng tiếp nhận thông điệp trong bối cảnh nào?\n\n## Tình huống mở bài\n\nStartup AI giáo dục hỏi: \"Nên chạy Facebook Ads, TikTok hay SEO?\". Câu hỏi đúng hơn là: phụ huynh đang tìm thông tin ở đâu, họ tin ai, lúc nào họ sẵn sàng nói về việc học của con, và kênh nào giúp startup học nhanh nhất từ 100 phụ huynh đầu tiên?\n\n## Vì sao bài này quan trọng\n\nKhông có kênh nào tốt tuyệt đối. Kênh tốt là kênh phù hợp với khách hàng, giai đoạn hành trình, mức độ niềm tin cần có, năng lực nội bộ, chi phí và mục tiêu học hỏi.\n\n## Nguyên lý first principles\n\nKênh là đường đưa thông điệp và trải nghiệm đến khách hàng. Chọn kênh phải dựa trên hành vi khách, không dựa trên trào lưu.\n\n```text\nKhách hàng -> Bối cảnh tiếp nhận -> Mức niềm tin cần có -> Loại thông điệp -> Kênh -> Chỉ số học hỏi\n```\n\n## Kiến thức nền chi tiết\n\nMột kênh có thể tốt cho nhận biết nhưng yếu cho chuyển đổi. TikTok có thể tạo chú ý nhanh nhưng không đủ cho sản phẩm cần niềm tin cao. SEO có thể tốt cho khách đang tìm giải pháp nhưng cần thời gian. Nhóm cộng đồng có thể khó scale nhưng học insight tốt. Đại lý và showroom tạo niềm tin cao nhưng cần đào tạo và kiểm soát thông điệp.\n\nỞ giai đoạn đầu, kênh học nhanh thường quan trọng hơn kênh scale. Doanh nghiệp cần nghe phản hồi thật, quan sát phản đối và hiểu lý do khách không mua. Khi đã rõ insight, thông điệp và offer, mới nên tối ưu kênh scale.\n\nVới công ty đã có, kênh hiện hữu là tài sản: khách hàng cũ, email, đại lý, showroom, sales, cộng đồng, bảo hành. Nhưng kênh hiện hữu cũng có rủi ro nếu người bán hiểu sai sản phẩm mới.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Channel | Kênh | Nơi thông điệp đến khách | Đường tiếp cận và tương tác | Showroom, Facebook group, email | Chọn TikTok vì đang hot | Platform |\n| Owned channel | Kênh sở hữu | Kênh doanh nghiệp kiểm soát | Tài sản dài hạn | Website, email list, app | Fanpage phụ thuộc thuật toán | Paid channel |\n| Paid channel | Kênh trả phí | Trả tiền để tiếp cận | Tăng tốc phân phối | Ads cho offer dùng thử | Ads khi chưa rõ thông điệp | Marketing |\n| Channel fit | Độ phù hợp kênh | Mức kênh khớp với khách và mục tiêu | Điều kiện để kênh hiệu quả | Webinar cho sản phẩm cần giải thích | Banner cho vấn đề phức tạp | Reach |\n\n## Khung tư duy trực quan\n\n| Tiêu chí chọn kênh | Câu hỏi |\n|---|---|\n| Hành vi | Khách đã ở đâu? |\n| Niềm tin | Kênh này tạo đủ tin không? |\n| Chi phí | Chi phí thử có chịu được không? |\n| Học hỏi | Có thu feedback sâu không? |\n| Đo lường | Có biết bước nào hiệu quả không? |\n| Năng lực | Đội ngũ có làm tốt kênh này không? |\n\n## Ví dụ đời thường\n\nMuốn bán một khóa học kỹ năng cho phụ huynh, tờ rơi ngoài đường có thể tạo nhận biết thấp, nhưng workshop tại trường hoặc lời giới thiệu từ giáo viên có niềm tin cao hơn. Kênh đúng phụ thuộc vào người khách tin và bối cảnh họ ra quyết định.\n\n## Use case 1: Công ty mới\n\nKênh thử 30 ngày:\n\n| Kênh | Mục tiêu |\n|---|---|\n| Nhóm Facebook phụ huynh | Học insight, tuyển người test |\n| Workshop online | Tạo niềm tin và giải thích phương pháp |\n| Referral | Dùng niềm tin từ phụ huynh đã thử |\n| TikTok/Shorts | Giáo dục dấu hiệu con mất gốc |\n| Landing page | Đo đăng ký bài test |\n\n## Use case 2: Công ty đã có\n\nKênh ưu tiên:\n\n| Kênh | Vai trò |\n|---|---|\n| Showroom | Demo trải nghiệm thật |\n| Đại lý | Bán và giải thích tại điểm chạm tin cậy |\n| Khách hàng cũ | Nhóm early adopter phù hợp |\n| Video demo | Chuẩn hóa thông điệp |\n| CS sau lắp đặt | Thu feedback và giữ niềm tin |\n\n## Lỗi người mới thường mắc\n\n- Chọn kênh vì xu hướng.\n- Chạy quá nhiều kênh khi chưa rõ thông điệp.\n- Đánh giá kênh chỉ bằng reach.\n- Bỏ qua kênh học hỏi sâu.\n- Không tính năng lực nội bộ.\n\n## Bài tập ứng dụng\n\nLập Channel Strategy:\n\n| Kênh | Mục tiêu | Khách phù hợp | Chi phí | Độ tin cậy | Khả năng đo | Ưu tiên |\n|---|---|---|---|---|---|---|\n| Facebook |  |  |  |  |  |  |\n| TikTok |  |  |  |  |  |  |\n| SEO |  |  |  |  |  |  |\n| Đại lý |  |  |  |  |  |  |\n| Event |  |  |  |  |  |  |\n| Referral |  |  |  |  |  |  |\n\n## Bài tập review\n\nMột startup chưa có khách hàng thật muốn chi toàn bộ ngân sách cho ads trong 2 tháng. Review rủi ro và đề xuất kế hoạch kênh học nhanh hơn.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Chọn kênh theo cảm tính hoặc trào lưu |\n| Đạt | Chọn được vài kênh phù hợp mục tiêu |\n| Tốt | Có logic theo hành vi, niềm tin, chi phí, đo lường |\n| Xuất sắc | Phân biệt kênh học nhanh và kênh scale, có thử nghiệm nhỏ rõ |\n\n## Checklist tự review\n\n1. Khách hàng có thật sự ở kênh này không?\n2. Kênh này phù hợp giai đoạn nào trong journey?\n3. Kênh có tạo đủ niềm tin không?\n4. Tôi đo được gì sau khi thử?\n5. Đội ngũ có năng lực vận hành kênh này không?\n\n## Hành động 30-90 phút\n\nChọn 3 kênh có thể thử trong 7 ngày. Với mỗi kênh, viết giả thuyết, chi phí thử, chỉ số học hỏi và tiêu chí dừng/tiếp tục.\n\n## Liên hệ với bài trước và bài sau\n\nContent là thứ cần đưa đến khách. Kênh là nơi đưa đến. Bài sau tổ chức insight, thông điệp, content và kênh thành một chiến dịch có mục tiêu.\n\n"},{"sourcePath":"Marketing/08_chien_dich_marketing.md","title":"Bài 8. Chiến Dịch Marketing","category":"marketing","categoryLabel":"Marketing","order":9,"sha256":"9686c52471fedaf66d2629bb97212d0c59b386aa5bf2d24bfe4a1931387ff80f","lineCount":134,"headings":[{"level":1,"text":"Bài 8. Chiến Dịch Marketing","id":"bài-8-chiến-dịch-marketing"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 8. Chiến Dịch Marketing\n\n## Câu hỏi bản chất\n\n> Chiến dịch này phục vụ mục tiêu kinh doanh nào?\n\n## Tình huống mở bài\n\nStartup muốn \"làm campaign cho hoành tráng\" để ra mắt app. Có người đề xuất video viral, có người muốn ads, có người muốn webinar. Nhưng mục tiêu thật chỉ là có 100 phụ huynh dùng thử trong 30 ngày và học xem nhóm nào có khả năng trả tiền. Nếu không chốt mục tiêu, mọi ý tưởng đều có vẻ đúng.\n\n## Vì sao bài này quan trọng\n\nCampaign không nên bắt đầu từ ý tưởng sáng tạo. Campaign tốt bắt đầu từ mục tiêu kinh doanh, sau đó mới chọn khách hàng, insight, offer, thông điệp, kênh, nội dung và KPI.\n\n## Nguyên lý first principles\n\nMột campaign là hệ thống hành động có thời hạn nhằm thay đổi nhận thức hoặc hành vi cụ thể của khách hàng.\n\n```text\nMục tiêu kinh doanh -> Mục tiêu marketing -> Khách hàng -> Insight -> Offer -> Thông điệp -> Kênh -> KPI -> Tối ưu\n```\n\n## Kiến thức nền chi tiết\n\nCampaign khác hoạt động marketing thường ngày ở chỗ có mục tiêu, thời gian, nguồn lực và tiêu chí đánh giá rõ. Một campaign launch sản phẩm mới có thể nhằm tạo nhận biết, tuyển người dùng thử, tạo đơn hàng, đào tạo kênh bán hoặc thu feedback. Mỗi mục tiêu cần KPI khác nhau.\n\nOffer là phần rất quan trọng. Offer không chỉ là giảm giá. Offer là lời mời hành động làm khách thấy đáng thử và giảm rủi ro. Với sản phẩm mới, offer có thể là bài test miễn phí, demo tại showroom, dùng thử 7 ngày, gói early access hoặc tư vấn miễn phí.\n\nCampaign cần risk register. Rủi ro có thể là thông điệp overpromise, kênh không đủ niềm tin, đại lý hiểu sai, khách dùng thử không thấy giá trị, hoặc chỉ số đẹp nhưng không dẫn đến mua thật.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Campaign | Chiến dịch | Chuỗi hoạt động có mục tiêu và thời hạn | Tổ chức nguồn lực để tạo thay đổi cụ thể | 30 ngày tuyển 100 phụ huynh dùng thử | Đăng bài rải rác | Content plan |\n| Offer | Lời mời hành động | Thứ khách nhận khi tham gia | Giảm rủi ro và tạo động lực | Bài test miễn phí + lộ trình 7 ngày | Giảm giá không rõ lý do | Promotion |\n| KPI | Chỉ số chính | Số đo thành công | Biết campaign có phục vụ mục tiêu không | 100 hoàn thành bài test | Lượt like | Metric |\n| Optimization | Tối ưu | Cải thiện dựa trên dữ liệu | Học và sửa điểm nghẽn | Sửa onboarding nếu trial thấp | Đổi màu banner liên tục | Reporting |\n\n## Khung tư duy trực quan\n\n| Thành phần | Câu hỏi |\n|---|---|\n| Mục tiêu | Muốn thay đổi điều gì? |\n| Đối tượng | Ai cần thay đổi? |\n| Insight | Vì sao họ chưa hành động? |\n| Offer | Điều gì khiến họ thử? |\n| KPI | Số nào chứng minh thành công? |\n| Rủi ro | Điều gì có thể làm chiến dịch sai hướng? |\n\n## Ví dụ đời thường\n\nMột cửa hàng mới khai trương không nên chỉ treo băng rôn. Nếu mục tiêu là có 200 khách đầu tiên, cần offer rõ, kênh mời đúng khu vực, trải nghiệm tốt tại cửa hàng và cách xin phản hồi sau mua.\n\n## Use case 1: Công ty mới\n\nCampaign mẫu:\n\n| Thành phần | Nội dung |\n|---|---|\n| Tên | 7 ngày hiểu con học toán yếu ở đâu |\n| Mục tiêu | 100 phụ huynh dùng thử trong 30 ngày |\n| Offer | Kiểm tra đầu vào miễn phí + lộ trình học 7 ngày |\n| Kênh | Nhóm phụ huynh, webinar, referral |\n| KPI | 300 đăng ký, 100 hoàn thành test, 50 dùng đủ 7 ngày, 20 trả tiền |\n| Rủi ro | Phụ huynh đăng ký nhưng con không học đủ |\n\n## Use case 2: Công ty đã có\n\nCampaign mẫu:\n\n| Thành phần | Nội dung |\n|---|---|\n| Tên | Nhà thông minh nghe hiểu tiếng Việt |\n| Mục tiêu | 100 bộ triển khai có kiểm soát |\n| Kênh | Hội nghị đại lý, showroom, khách hàng cũ |\n| Công cụ | Demo script, sales kit, FAQ giới hạn tính năng |\n| KPI | Số đại lý đăng ký, demo, lắp đặt thành công, feedback nghiêm trọng, NPS sau 14 ngày |\n\n## Lỗi người mới thường mắc\n\n- Bắt đầu từ ý tưởng sáng tạo thay vì mục tiêu.\n- KPI không liên quan mục tiêu kinh doanh.\n- Offer yếu hoặc không giảm rủi ro.\n- Không có kế hoạch tối ưu.\n- Không có giới hạn claim và rủi ro truyền thông.\n\n## Bài tập ứng dụng\n\nLập Campaign Brief:\n\n| Thành phần | Nội dung |\n|---|---|\n| Mục tiêu kinh doanh |  |\n| Mục tiêu marketing |  |\n| Đối tượng |  |\n| Insight |  |\n| Thông điệp |  |\n| Offer |  |\n| Kênh |  |\n| Nội dung chủ đạo |  |\n| KPI |  |\n| Rủi ro |  |\n| Kế hoạch tối ưu |  |\n\n## Bài tập review\n\nReview campaign có mục tiêu \"tăng nhận diện\", KPI là \"doanh thu 1 tỷ\", kênh là TikTok, offer chưa rõ. Chỉ ra điểm lệch và sửa brief.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Campaign là danh sách hoạt động rời rạc |\n| Đạt | Có mục tiêu, đối tượng, thông điệp, kênh cơ bản |\n| Tốt | Có offer, KPI, timeline và tối ưu |\n| Xuất sắc | Gắn mục tiêu kinh doanh, insight, rủi ro và tiêu chí học hỏi rõ |\n\n## Checklist tự review\n\n1. Campaign phục vụ mục tiêu kinh doanh nào?\n2. Offer có đủ hấp dẫn và giảm rủi ro không?\n3. KPI có đo đúng hành vi cần thay đổi không?\n4. Có kế hoạch xử lý nếu số liệu xấu không?\n5. Có rủi ro overpromise không?\n\n## Hành động 30-90 phút\n\nViết campaign brief một trang cho một mục tiêu 30 ngày. Chỉ chọn tối đa 2 kênh và 3 KPI chính để tránh dàn trải.\n\n## Liên hệ với bài trước và bài sau\n\nKênh giúp đưa thông điệp đi. Campaign tổ chức toàn bộ hệ thống đó theo mục tiêu. Bài sau đi sâu vào brand trust, nền tảng giúp campaign dễ thuyết phục hơn.\n\n"},{"sourcePath":"Marketing/09_brand_marketing.md","title":"Bài 9. Brand Marketing","category":"marketing","categoryLabel":"Marketing","order":10,"sha256":"8b204acb0a9f497d4b0ed554500e4130138e289508d9b28eb9383f27b0d46902","lineCount":117,"headings":[{"level":1,"text":"Bài 9. Brand Marketing","id":"bài-9-brand-marketing"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 9. Brand Marketing\n\n## Câu hỏi bản chất\n\n> Vì sao khách hàng tin một thương hiệu trước khi mua?\n\n## Tình huống mở bài\n\nMột startup AI giáo dục nói rằng app giúp trẻ tiến bộ nhanh. Phụ huynh hỏi: ai xây chương trình học, dữ liệu con tôi có an toàn không, có học sinh nào dùng hiệu quả chưa? Cùng lúc đó, công ty smart home đã có thương hiệu muốn launch loa thông minh. Khách hàng tin công ty, nhưng nếu sản phẩm mới lỗi, niềm tin với cả hệ sinh thái có thể bị ảnh hưởng.\n\n## Vì sao bài này quan trọng\n\nBrand không chỉ là logo, màu sắc hoặc slogan. Brand là tài sản niềm tin tích lũy qua lời hứa, trải nghiệm, bằng chứng và ký ức khách hàng. Brand mạnh làm giảm chi phí thuyết phục, nhưng cũng làm rủi ro overpromise lớn hơn.\n\n## Nguyên lý first principles\n\nKhách hàng không thể tự kiểm chứng mọi thứ trước khi mua. Họ dùng niềm tin thương hiệu để giảm rủi ro.\n\n```text\nCam kết -> Bằng chứng -> Trải nghiệm -> Ký ức -> Niềm tin -> Chi phí thuyết phục thấp hơn\n```\n\n## Kiến thức nền chi tiết\n\nBrand là tổng hợp của điều doanh nghiệp nói, điều khách trải nghiệm, điều người khác kể lại và cách doanh nghiệp xử lý khi có vấn đề. Logo chỉ là dấu hiệu nhận diện; thương hiệu thật nằm trong trí nhớ và cảm nhận của khách hàng.\n\nBrand marketing khác performance marketing. Brand marketing xây niềm tin và sự quen thuộc dài hạn. Performance marketing đo và tối ưu chuyển đổi ngắn hạn. Hai phần không đối lập. Brand tốt giúp performance hiệu quả hơn vì khách ít nghi ngờ hơn. Performance tốt giúp brand có dữ liệu thật về hành vi.\n\nNiềm tin cần bằng chứng. Với giáo dục, bằng chứng có thể là chuyên gia, phương pháp, case tiến bộ, minh bạch dữ liệu. Với smart home, bằng chứng có thể là demo ổn định, bảo hành, đại lý được đào tạo, khách hàng thật và phạm vi tính năng rõ.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Brand | Thương hiệu | Điều khách nhớ và tin về mình | Tài sản niềm tin | Minh bạch phương pháp học và dữ liệu | Chỉ đổi logo | Identity |\n| Brand trust | Niềm tin thương hiệu | Mức khách dám tin trước khi kiểm chứng hết | Giảm rủi ro cảm nhận | Case thật, chính sách rõ | Tuyên bố \"uy tín\" | Awareness |\n| Proof | Bằng chứng | Dữ liệu/trải nghiệm làm lời hứa đáng tin | Cầu nối giữa claim và niềm tin | Demo, review, chuyên gia | Hình ảnh đẹp | Claim |\n| Overpromise | Hứa quá mức | Nói vượt năng lực thật | Phá niềm tin dài hạn | Gọi beta là beta | Hứa AI làm được mọi thứ | Ambition |\n\n## Khung tư duy trực quan\n\n| Thành phần niềm tin | Câu hỏi |\n|---|---|\n| Chuyên môn | Ai đứng sau và có năng lực gì? |\n| Chất lượng | Sản phẩm hoạt động ổn định không? |\n| Minh bạch | Giới hạn và điều kiện sử dụng có rõ không? |\n| Dịch vụ | Khi lỗi xảy ra, ai hỗ trợ? |\n| Bằng chứng xã hội | Ai đã dùng và nói gì? |\n\n## Ví dụ đời thường\n\nBạn chọn một bác sĩ không chỉ vì phòng khám đẹp. Bạn tin vì bằng cấp, lời giới thiệu, cách tư vấn, kết quả trước đó và thái độ khi xử lý vấn đề. Thương hiệu cũng vậy.\n\n## Use case 1: Công ty mới\n\nStartup chưa có niềm tin cần xây từ minh bạch:\n\n| Rủi ro niềm tin | Bằng chứng cần có |\n|---|---|\n| AI dạy sai | Chuyên gia/giáo viên kiểm duyệt |\n| Dữ liệu trẻ em | Chính sách dữ liệu rõ |\n| Không hiệu quả | Báo cáo tiến bộ và case thật |\n| Phụ huynh không hiểu | Giải thích phương pháp đơn giản |\n\n## Use case 2: Công ty đã có\n\nLoa thông minh mượn niềm tin từ thương hiệu smart home mẹ. Vì vậy launch nên có kiểm soát: đại lý được đào tạo, claim được duyệt, demo trong phạm vi ổn định, quy trình feedback rõ và có thể dùng nhãn early access nếu cần.\n\n## Lỗi người mới thường mắc\n\n- Nghĩ brand là logo.\n- Hứa lớn trước khi có bằng chứng.\n- Chạy performance làm hỏng kỳ vọng brand.\n- Không chuẩn hóa thông điệp cho sales/đại lý.\n- Không xử lý phản hồi sau mua như một phần của brand.\n\n## Bài tập ứng dụng\n\nLập Brand Trust Map:\n\n| Thành phần niềm tin | Bằng chứng hiện có | Bằng chứng cần bổ sung | Rủi ro nếu thiếu |\n|---|---|---|---|\n| Chuyên môn |  |  |  |\n| Chất lượng |  |  |  |\n| Dữ liệu |  |  |  |\n| Dịch vụ |  |  |  |\n| Cam kết dài hạn |  |  |  |\n\n## Bài tập review\n\nReview một thương hiệu đang hứa \"hiệu quả vượt trội\" nhưng không có case, không có số liệu, không có chính sách bảo hành rõ. Chỉ ra rủi ro niềm tin.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Xem brand là nhận diện hình ảnh |\n| Đạt | Nêu được vài bằng chứng niềm tin |\n| Tốt | Liên kết claim, bằng chứng, trải nghiệm và rủi ro |\n| Xuất sắc | Có kế hoạch xây và bảo vệ niềm tin trước, trong, sau launch |\n\n## Checklist tự review\n\n1. Lời hứa thương hiệu có bằng chứng không?\n2. Có claim nào vượt năng lực thật không?\n3. Khách cần tin điều gì trước khi mua?\n4. Nếu sản phẩm lỗi, niềm tin bị ảnh hưởng ra sao?\n5. Sales/đại lý có nói đúng thông điệp không?\n\n## Hành động 30-90 phút\n\nLiệt kê 5 claim thương hiệu đang dùng. Với mỗi claim, ghi bằng chứng hiện có, bằng chứng thiếu và rủi ro nếu khách kiểm chứng không thấy đúng.\n\n## Liên hệ với bài trước và bài sau\n\nCampaign tạo hành động trong thời hạn cụ thể. Brand trust làm khách dễ tin hơn qua nhiều campaign. Bài sau đo chuyển đổi và tối ưu bằng performance marketing.\n\n"},{"sourcePath":"Marketing/10_performance_marketing.md","title":"Bài 10. Performance Marketing","category":"marketing","categoryLabel":"Marketing","order":11,"sha256":"4a74e4613f97ac50f0183f317469a287aed87372d439d3bee1106b095d3fc35e","lineCount":122,"headings":[{"level":1,"text":"Bài 10. Performance Marketing","id":"bài-10-performance-marketing"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 10. Performance Marketing\n\n## Câu hỏi bản chất\n\n> Marketing có tạo ra kết quả kinh doanh thật không?\n\n## Tình huống mở bài\n\nStartup chi 10 triệu đồng quảng cáo, có 500 lead, 100 phụ huynh cho con làm bài kiểm tra, 20 người trả tiền. Nhìn 500 lead có vẻ tốt, nhưng câu hỏi thật là chi phí mỗi khách trả tiền là bao nhiêu, bước nào rơi nhiều nhất và nếu scale lên thì có lỗ không.\n\n## Vì sao bài này quan trọng\n\nPerformance marketing giúp doanh nghiệp đo và tối ưu hành vi thật, không chỉ cảm giác. Nhưng nếu chỉ nhìn số ngắn hạn, doanh nghiệp có thể tối ưu sai: tăng click rẻ nhưng lead kém, tăng doanh thu bằng khuyến mãi nhưng CAC thật quá cao, hoặc tăng ROAS mà bỏ qua retention.\n\n## Nguyên lý first principles\n\nPerformance là quá trình đo từng bước chuyển đổi:\n\n```text\nImpression -> Click -> Lead -> Trial/Demo -> Purchase -> Retention -> Referral\n```\n\nMục tiêu là biết điểm nghẽn nằm ở đâu và hành động tối ưu nào đáng làm.\n\n## Kiến thức nền chi tiết\n\nChỉ số không tự có ý nghĩa nếu tách khỏi mục tiêu. CTR cao không tốt nếu người click không mua. CPL thấp không tốt nếu lead không đủ chất lượng. ROAS cao trong ngắn hạn chưa chắc tốt nếu khách không quay lại hoặc biên lợi nhuận thấp.\n\nPerformance cần nối với kinh tế đơn vị. CAC là chi phí có một khách hàng mới. LTV là giá trị khách hàng tạo ra trong vòng đời. Nếu CAC cao hơn lợi nhuận khách tạo ra, càng tăng trưởng càng lỗ. Payback period cho biết mất bao lâu để thu hồi chi phí có khách.\n\nVới sản phẩm mới, số liệu ban đầu thường nhỏ và nhiễu. Mục tiêu không phải kết luận tuyệt đối, mà là tìm điểm nghẽn và giả thuyết cần kiểm chứng tiếp.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| CTR | Tỷ lệ click | Bao nhiêu người thấy rồi bấm | Đo độ hấp dẫn ban đầu | 1.000 click/100.000 impression = 1% | CTR cao là campaign tốt chắc chắn | Conversion |\n| CPL | Chi phí mỗi lead | Tốn bao nhiêu tiền để có một liên hệ | Đo chi phí tạo cơ hội | 10 triệu/500 lead = 20.000đ | Bỏ qua chất lượng lead | CAC |\n| CAC | Chi phí có khách mới | Tốn bao nhiêu để có một người mua | Kiểm tra tăng trưởng có đắt không | 10 triệu/20 khách = 500.000đ | Chỉ tính tiền ads | CPL |\n| LTV | Giá trị vòng đời khách | Khách tạo bao nhiêu giá trị theo thời gian | Biết có đáng trả CAC không | Khách trả 199k/tháng trong 8 tháng | Lấy doanh thu 1 tháng làm LTV | Revenue |\n| ROAS | Doanh thu trên chi phí ads | 1 đồng ads tạo mấy đồng doanh thu | Đo hiệu quả media ngắn hạn | 10 triệu ads tạo 30 triệu doanh thu | Bỏ qua biên lợi nhuận | Profit |\n\n## Khung tư duy trực quan\n\n| Giai đoạn | Chỉ số | Câu hỏi |\n|---|---|---|\n| Awareness | Reach, impression | Có đủ người thấy không? |\n| Interest | CTR | Thông điệp có tạo quan tâm không? |\n| Lead | CPL | Chi phí tạo liên hệ thế nào? |\n| Trial/Demo | Trial rate | Khách có hành động sâu hơn không? |\n| Purchase | CAC, conversion | Có mua thật không? |\n| Retention | Retention, churn | Có tiếp tục dùng không? |\n\n## Ví dụ đời thường\n\nMột cửa hàng phát 1.000 voucher, 200 người vào cửa hàng, 50 người mua, 10 người quay lại. Nếu chỉ nhìn 1.000 voucher được phát, sẽ tưởng hoạt động lớn. Performance hỏi: chi phí mỗi khách mua là bao nhiêu và vì sao 150 người vào nhưng không mua?\n\n## Use case 1: Công ty mới\n\nSố liệu: chi 10 triệu, 500 lead, 100 trial, 20 paid.\n\n| Chỉ số | Kết quả | Câu hỏi |\n|---|---:|---|\n| CPL | 20.000đ | Lead có đúng nhóm phụ huynh không? |\n| Lead -> Trial | 20% | Onboarding và niềm tin có đủ không? |\n| Trial -> Paid | 20% | Giá trị sau 7 ngày có rõ không? |\n| CAC paid | 500.000đ | LTV có cao hơn CAC không? |\n\n## Use case 2: Công ty đã có\n\nVideo demo loa có nhiều lượt xem nhưng ít người đăng ký showroom. Điểm nghẽn có thể là CTA không rõ, khách chưa hiểu lợi ích trong đời sống, hoặc demo tạo tò mò nhưng chưa tạo đủ niềm tin để đặt lịch.\n\n## Lỗi người mới thường mắc\n\n- Tối ưu chỉ số dễ đẹp nhưng không liên quan doanh thu.\n- Nhầm lead rẻ với lead tốt.\n- Không tính đủ CAC.\n- Bỏ qua retention.\n- Kết luận quá sớm từ mẫu nhỏ.\n\n## Bài tập ứng dụng\n\nLập Marketing Funnel Dashboard:\n\n| Giai đoạn | Chỉ số | Giá trị hiện tại | Mục tiêu | Vấn đề | Hành động tối ưu |\n|---|---|---|---|---|---|\n| Awareness |  |  |  |  |  |\n| Interest |  |  |  |  |  |\n| Lead |  |  |  |  |  |\n| Trial/Demo |  |  |  |  |  |\n| Purchase |  |  |  |  |  |\n| Retention |  |  |  |  |  |\n\n## Bài tập review\n\nMột chiến dịch có CPL giảm 50% nhưng tỷ lệ mua giảm 80%. Review vì sao không nên gọi đây là tối ưu thành công.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Chỉ nhìn lượt xem, like, click |\n| Đạt | Đo được funnel cơ bản |\n| Tốt | Tìm được điểm nghẽn và hành động tối ưu |\n| Xuất sắc | Liên kết chỉ số marketing với CAC, LTV, retention và quyết định scale/dừng |\n\n## Checklist tự review\n\n1. KPI có gắn với mục tiêu kinh doanh không?\n2. Tôi có biết điểm rơi lớn nhất trong funnel không?\n3. CAC đã tính đủ chi phí chưa?\n4. Retention có được đo không?\n5. Tôi có biết nên tối ưu bước nào trước không?\n\n## Hành động 30-90 phút\n\nLấy một campaign thật hoặc giả định, tính 5 chỉ số: CTR, CPL, trial rate, purchase rate, CAC. Viết 3 giả thuyết cho điểm nghẽn lớn nhất.\n\n## Liên hệ với bài trước và bài sau\n\nBrand giúp khách tin. Performance đo khách có hành động không. Bài sau đi vào phần thường bị bỏ quên: sau khi khách mua, làm sao giữ khách và tạo giá trị dài hạn.\n\n"},{"sourcePath":"Marketing/11_crm_retention_customer_success.md","title":"Bài 11. CRM, Retention Và Customer Success","category":"marketing","categoryLabel":"Marketing","order":12,"sha256":"f2c03c6778f2cfad5f900fb1c2c019844e1d69ef88fa8899bd9041b58e7151c4","lineCount":116,"headings":[{"level":1,"text":"Bài 11. CRM, Retention Và Customer Success","id":"bài-11-crm-retention-và-customer-success"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 11. CRM, Retention Và Customer Success\n\n## Câu hỏi bản chất\n\n> Marketing có kết thúc sau khi khách hàng mua không?\n\n## Tình huống mở bài\n\nPhụ huynh trả tiền tháng đầu cho app học toán nhưng trẻ học không đều. Sau 30 ngày, phụ huynh hủy vì \"không thấy con tiến bộ\". Nhìn lại, sản phẩm có bài học tốt nhưng thiếu nhắc lịch, thiếu báo cáo tiến bộ, thiếu hướng dẫn phụ huynh đồng hành và thiếu can thiệp khi trẻ bỏ học 3 ngày.\n\n## Vì sao bài này quan trọng\n\nDoanh nghiệp không chỉ cần có khách hàng mới. Doanh nghiệp cần khách dùng đúng, thấy giá trị, quay lại và giới thiệu. Retention thường rẻ hơn acquisition, nhưng cần thiết kế chủ động.\n\n## Nguyên lý first principles\n\nSau khi mua, khách vẫn cần được dẫn dắt:\n\n```text\nMua -> Onboarding -> Quick win -> Thói quen -> Giá trị lặp lại -> Tin tưởng -> Gia hạn/giới thiệu\n```\n\n## Kiến thức nền chi tiết\n\nCRM là hệ thống quản lý và nuôi dưỡng quan hệ khách hàng. Retention là khả năng giữ khách tiếp tục dùng hoặc mua lại. Customer success là việc giúp khách đạt kết quả mong muốn khi dùng sản phẩm.\n\nMarketing sau bán quan trọng vì quyết định mua lần đầu thường dựa trên kỳ vọng; quyết định tiếp tục dựa trên trải nghiệm thật. Nếu khách không dùng đúng, họ không thấy giá trị. Nếu họ không thấy giá trị nhanh, họ rời đi. Nếu họ rời đi, CAC bị lãng phí.\n\nVới sản phẩm giáo dục, retention phụ thuộc vào thói quen học, cảm giác tiến bộ và sự tham gia của phụ huynh. Với smart home, retention và brand trust phụ thuộc vào hướng dẫn dùng đúng, xử lý lỗi, cập nhật tính năng và feedback về R&D.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| CRM | Quản trị quan hệ khách hàng | Hệ thống ghi nhớ và chăm sóc khách | Duy trì tương tác có mục tiêu | Email báo cáo tiến bộ hằng tuần | Gửi spam khuyến mãi | Email marketing |\n| Retention | Giữ chân | Khách tiếp tục dùng/mua | Chứng minh giá trị lặp lại | Phụ huynh gia hạn tháng 2 | Chỉ mua lần đầu | Acquisition |\n| Churn | Rời bỏ | Khách ngừng dùng/mua | Tín hiệu giá trị không đủ hoặc trải nghiệm kém | Hủy sau 30 ngày | Tạm nghỉ do bận | Complaint |\n| Onboarding | Hướng dẫn ban đầu | Giúp khách dùng đúng từ đầu | Tạo quick win | 7 ngày đầu có nhắc học và báo cáo | Gửi file hướng dẫn dài | Training |\n\n## Khung tư duy trực quan\n\n| Giai đoạn sau mua | Khách cần gì? |\n|---|---|\n| Ngày 1 | Biết bắt đầu thế nào |\n| Ngày 3 | Thấy một kết quả nhỏ |\n| Ngày 7 | Hiểu giá trị đang tạo ra |\n| Ngày 14 | Duy trì thói quen |\n| Ngày 30 | Có lý do tiếp tục/gia hạn |\n\n## Ví dụ đời thường\n\nMua một máy pha cà phê không đủ để khách hài lòng. Nếu họ không biết chỉnh lượng nước, vệ sinh máy, chọn cà phê phù hợp, họ có thể kết luận máy không ngon. Hướng dẫn sau mua quyết định trải nghiệm thật.\n\n## Use case 1: Công ty mới\n\nOnboarding 14 ngày:\n\n| Ngày | Mục tiêu | Nội dung |\n|---|---|---|\n| 1 | Bắt đầu dễ | Hướng dẫn làm bài test và đọc báo cáo |\n| 3 | Tạo nhịp | Nhắc học 10 phút, gợi ý bài phù hợp |\n| 7 | Thấy giá trị | Báo cáo tiến bộ tuần đầu |\n| 14 | Duy trì | Gợi ý điều chỉnh và mời phụ huynh phản hồi |\n\n## Use case 2: Công ty đã có\n\nSau khi lắp loa thông minh, khách cần \"10 câu lệnh hữu ích nhất\", video ngắn hướng dẫn, cuộc gọi sau 3 ngày, khảo sát sau 14 ngày và kênh báo lỗi nhanh. Feedback phải chuyển về R&D, sales và marketing để sửa tài liệu và claim.\n\n## Lỗi người mới thường mắc\n\n- Nghĩ bán xong là xong.\n- Không thiết kế quick win.\n- Gửi quá nhiều thông tin nhưng thiếu hướng dẫn đúng lúc.\n- Không đo churn.\n- Không đưa feedback sau mua về sản phẩm và marketing.\n\n## Bài tập ứng dụng\n\nThiết kế onboarding 14 ngày:\n\n| Ngày | Mục tiêu | Nội dung gửi khách | Kênh | Chỉ số đo |\n|---|---|---|---|---|\n| Ngày 1 |  |  |  |  |\n| Ngày 3 |  |  |  |  |\n| Ngày 7 |  |  |  |  |\n| Ngày 14 |  |  |  |  |\n\n## Bài tập review\n\nMột sản phẩm SaaS có nhiều khách mua tháng đầu nhưng 60% hủy sau tháng thứ hai. Review những giả thuyết về onboarding, giá trị, thói quen, support và kỳ vọng ban đầu.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Chỉ có tin nhắn cảm ơn sau mua |\n| Đạt | Có hướng dẫn sử dụng cơ bản |\n| Tốt | Có onboarding, quick win, nhắc dùng, đo retention |\n| Xuất sắc | Có hệ thống customer success, feedback loop và kế hoạch giảm churn |\n\n## Checklist tự review\n\n1. Khách có biết bắt đầu thế nào không?\n2. Khách thấy giá trị đầu tiên trong bao lâu?\n3. Có chỉ số cảnh báo rời bỏ không?\n4. Feedback sau mua đi về đâu?\n5. Có cơ chế biến khách hài lòng thành referral không?\n\n## Hành động 30-90 phút\n\nViết chuỗi 4 tin nhắn/email sau mua cho ngày 1, 3, 7, 14. Mỗi tin chỉ phục vụ một mục tiêu rõ.\n\n## Liên hệ với bài trước và bài sau\n\nPerformance đo chuyển đổi. CRM và retention bảo vệ giá trị sau chuyển đổi. Bài sau dùng AI để tăng tốc các việc marketing nhưng vẫn giữ bản chất và kiểm soát chất lượng.\n\n"},{"sourcePath":"Marketing/12_ai_trong_marketing.md","title":"Bài 12. AI Trong Marketing","category":"marketing","categoryLabel":"Marketing","order":13,"sha256":"180d665adb095df7412af54339372d33e4527cd7915f049b8a43d85f79e6b5f2","lineCount":116,"headings":[{"level":1,"text":"Bài 12. AI Trong Marketing","id":"bài-12-ai-trong-marketing"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 12. AI Trong Marketing\n\n## Câu hỏi bản chất\n\n> AI giúp marketing tốt hơn ở đâu và có thể làm marketing tệ hơn ở đâu?\n\n## Tình huống mở bài\n\nStartup dùng AI tạo 100 bài content về giáo dục. Bài viết đúng ngữ pháp, có cấu trúc, nhưng phụ huynh không tương tác. Lý do: dữ liệu đầu vào quá chung, không có phỏng vấn thật, không có insight và không có bằng chứng. AI tăng tốc tạo nội dung, nhưng cũng tăng tốc tạo nội dung vô hồn.\n\n## Vì sao bài này quan trọng\n\nAI là công cụ mạnh để nghiên cứu, viết, phân tích và cá nhân hóa. Nhưng AI không thay thế được hiểu biết thật về khách hàng, trách nhiệm với claim, kiểm soát dữ liệu và phán đoán chiến lược.\n\n## Nguyên lý first principles\n\nAI nên tăng tốc các bước tư duy và sản xuất, nhưng quyết định marketing vẫn phải dựa trên dữ liệu thật, insight thật và kiểm duyệt của con người.\n\n```text\nDữ liệu thật -> Prompt rõ -> Đầu ra AI -> Kiểm duyệt -> Thử nghiệm -> Học hỏi -> Cải tiến\n```\n\n## Kiến thức nền chi tiết\n\nAI hữu ích khi doanh nghiệp có dữ liệu đầu vào tốt: transcript phỏng vấn, feedback khách hàng, FAQ sales, dữ liệu campaign, guideline thương hiệu, phạm vi tính năng sản phẩm. Khi dữ liệu đầu vào nghèo, AI thường tạo câu trả lời nghe hợp lý nhưng chung chung.\n\nAI có thể hỗ trợ tóm tắt phỏng vấn, tìm mẫu insight, viết nhiều phiên bản thông điệp, lập lịch nội dung, tạo sales kit, phân loại feedback, cá nhân hóa email và gợi ý tối ưu campaign. Tuy nhiên, AI có rủi ro bịa thông tin, overclaim, dùng giọng thương hiệu không nhất quán, tạo nội dung giống đối thủ hoặc xử lý dữ liệu riêng tư sai cách.\n\nGuardrails là các ranh giới sử dụng AI: claim được phép nói, claim không được nói, dữ liệu không được đưa vào AI, tiêu chuẩn kiểm duyệt, người chịu trách nhiệm duyệt và cách lưu lại nguồn dữ liệu.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Prompt | Chỉ dẫn cho AI | Cách giao việc cho AI | Chất lượng đầu vào ảnh hưởng đầu ra | Đưa insight, audience, tone, claim | \"Viết bài hay\" | Brief |\n| Hallucination | Bịa thông tin | AI nói sai nhưng nghe tự tin | Rủi ro sự thật và niềm tin | Kiểm nguồn trước khi dùng | Dùng số liệu AI tự tạo | Creativity |\n| Guardrails | Rào chắn kiểm soát | Luật AI được/không được làm | Bảo vệ chất lượng và trách nhiệm | Danh sách claim không được nói | Cho AI tự viết sales kit không duyệt | Policy |\n| Human review | Kiểm duyệt con người | Người có trách nhiệm xem lại | Phán đoán cuối cùng | Marketing + R&D duyệt claim | Tin AI hoàn toàn | Editing |\n\n## Khung tư duy trực quan\n\n| Việc marketing | AI hỗ trợ | Con người quyết định |\n|---|---|---|\n| Nghiên cứu | Tóm tắt, nhóm chủ đề | Insight nào đáng tin |\n| Thông điệp | Tạo phiên bản | Claim nào đúng và nên dùng |\n| Content | Draft, biến thể | Góc nhìn, bằng chứng, giọng thương hiệu |\n| Campaign | Gợi ý KPI, rủi ro | Mục tiêu và trade-off |\n| Feedback | Phân loại phản hồi | Ưu tiên sửa gì |\n\n## Ví dụ đời thường\n\nAI giống một trợ lý viết nhanh. Nếu bạn đưa trợ lý thông tin sai hoặc mơ hồ, họ có thể viết rất trôi chảy nhưng sai hướng. Tốc độ không thay thế được phán đoán.\n\n## Use case 1: Công ty mới\n\nAI nên dùng sau khi có phỏng vấn phụ huynh thật. Quy trình tốt:\n\n1. Ghi lại 10 cuộc phỏng vấn.\n2. Dùng AI tóm tắt nỗi đau, câu nói lặp lại, rào cản.\n3. Con người chọn insight và kiểm tra với dữ liệu gốc.\n4. Dùng AI viết 10 thông điệp thử.\n5. Test với phụ huynh thật.\n\n## Use case 2: Công ty đã có\n\nCông ty smart home có thể dùng AI để tạo sales kit, video script, FAQ đại lý và phân loại feedback sau launch. Guardrails bắt buộc: không nói ngoài phạm vi tính năng đã duyệt, không hứa \"hiểu mọi câu lệnh\", mọi tài liệu đại lý phải qua marketing, R&D và CS duyệt.\n\n## Lỗi người mới thường mắc\n\n- Dùng AI trước khi có insight thật.\n- Tin số liệu hoặc claim AI tự tạo.\n- Tạo nội dung hàng loạt không có kiểm duyệt.\n- Đưa dữ liệu nhạy cảm vào công cụ không kiểm soát.\n- Để AI làm mất giọng thương hiệu.\n\n## Bài tập ứng dụng\n\nLập AI Marketing Workflow:\n\n| Công việc | AI hỗ trợ gì? | Dữ liệu đầu vào | Người kiểm duyệt | Rủi ro | Tiêu chuẩn đầu ra |\n|---|---|---|---|---|---|\n| Nghiên cứu khách hàng |  |  |  |  |  |\n| Viết content |  |  |  |  |  |\n| Viết sales kit |  |  |  |  |  |\n| Phân tích feedback |  |  |  |  |  |\n| Tối ưu campaign |  |  |  |  |  |\n\n## Bài tập review\n\nMột đội marketing dùng AI tạo 50 bài viết, không có nguồn dữ liệu khách hàng, không có người duyệt claim, đăng tự động mỗi ngày. Review rủi ro và thiết kế lại workflow.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Xem AI là người thay thế marketer |\n| Đạt | Dùng AI để draft và tiết kiệm thời gian |\n| Tốt | Có dữ liệu đầu vào, kiểm duyệt và guardrails |\n| Xuất sắc | AI giúp tăng tốc học hỏi, cá nhân hóa và tối ưu nhưng không làm mất sự thật khách hàng |\n\n## Checklist tự review\n\n1. Dữ liệu đầu vào có đến từ khách hàng thật không?\n2. AI có tạo claim cần kiểm chứng không?\n3. Ai duyệt đầu ra trước khi dùng?\n4. Có dữ liệu riêng tư nào không nên đưa vào AI không?\n5. Đầu ra có giữ đúng giọng thương hiệu không?\n\n## Hành động 30-90 phút\n\nViết một prompt tạo thông điệp marketing gồm: khách hàng, insight, định vị, claim được phép nói, claim không được nói, tone, CTA và tiêu chí tự kiểm. Sau đó dùng kết quả để tạo 3 phiên bản và tự review.\n\n## Liên hệ với bài trước và bài sau\n\nAI có thể hỗ trợ mọi bài trước: insight, thông điệp, content, campaign, performance, CRM. Bài sau là đồ án cuối khóa, nơi người học tổng hợp toàn bộ thành kế hoạch marketing hoàn chỉnh.\n\n"},{"sourcePath":"Marketing/13_do_an_cuoi_khoa.md","title":"Đồ Án Cuối Khóa: Kế Hoạch Marketing Hoàn Chỉnh","category":"marketing","categoryLabel":"Marketing","order":14,"sha256":"edec0b2abcefd19f140bdfe8a1f543e92ca3d8c3702508cd5855b8a02fde56ba","lineCount":90,"headings":[{"level":1,"text":"Đồ Án Cuối Khóa: Kế Hoạch Marketing Hoàn Chỉnh","id":"đồ-án-cuối-khóa-kế-hoạch-marketing-hoàn-chỉnh"},{"level":2,"text":"Mục tiêu","id":"mục-tiêu"},{"level":2,"text":"Đề bài 1: Kế hoạch marketing cho công ty mới","id":"đề-bài-1-kế-hoạch-marketing-cho-công-ty-mới"},{"level":3,"text":"Đầu ra bắt buộc","id":"đầu-ra-bắt-buộc"},{"level":3,"text":"Mẫu nộp bài","id":"mẫu-nộp-bài"},{"level":2,"text":"Đề bài 2: Kế hoạch marketing cho công ty đã có","id":"đề-bài-2-kế-hoạch-marketing-cho-công-ty-đã-có"},{"level":3,"text":"Đầu ra bắt buộc","id":"đầu-ra-bắt-buộc-2"},{"level":2,"text":"Rubric đánh giá đồ án","id":"rubric-đánh-giá-đồ-án"},{"level":2,"text":"Checklist trước khi nộp","id":"checklist-trước-khi-nộp"}],"rawMarkdown":"# Đồ Án Cuối Khóa: Kế Hoạch Marketing Hoàn Chỉnh\n\n## Mục tiêu\n\nĐồ án cuối khóa không phải bài viết lý thuyết. Đây là bản kế hoạch marketing có thể đem đi thảo luận, kiểm chứng hoặc triển khai thử. Người học chọn một trong hai đề bài: công ty mới hoặc công ty đã có.\n\n## Đề bài 1: Kế hoạch marketing cho công ty mới\n\nChọn một ý tưởng kinh doanh mới và xây kế hoạch marketing đầu tiên.\n\n### Đầu ra bắt buộc\n\n| Phần | Nội dung cần có |\n|---|---|\n| Khách hàng mục tiêu | Nhóm khách đầu tiên, bối cảnh, nỗi đau, hành vi thay thế |\n| Insight | Insight statement theo cấu trúc muốn/lo/cần |\n| Định vị | Positioning statement rõ khách hàng, vấn đề, khác biệt, bằng chứng |\n| Thông điệp chính | Message hierarchy: tính năng, lợi ích, chuyển đổi |\n| Bằng chứng niềm tin | Chuyên môn, case, demo, chính sách, dữ liệu |\n| Customer journey | Giai đoạn, câu hỏi khách, nội dung, kênh, chỉ số |\n| Content pillar | 4-5 trụ cột nội dung và ví dụ tiêu đề |\n| Kênh ban đầu | Kênh học nhanh và kênh chuyển đổi |\n| Campaign dùng thử | Mục tiêu, offer, KPI, rủi ro, tối ưu |\n| KPI funnel | Lead, trial, purchase, retention, CAC sơ bộ |\n| AI workflow | AI hỗ trợ gì, dữ liệu đầu vào, người duyệt |\n| Rủi ro truyền thông | Claim rủi ro, overpromise, cách kiểm soát |\n\n### Mẫu nộp bài\n\n```markdown\n# Kế hoạch marketing cho [tên ý tưởng]\n\n## 1. Tóm tắt một trang\n## 2. Khách hàng mục tiêu và insight\n## 3. Định vị\n## 4. Thông điệp\n## 5. Hành trình khách hàng\n## 6. Content pillar\n## 7. Kênh marketing 30 ngày\n## 8. Campaign dùng thử\n## 9. Dashboard KPI\n## 10. AI workflow và guardrails\n## 11. Rủi ro và thử nghiệm kiểm chứng\n```\n\n## Đề bài 2: Kế hoạch marketing cho công ty đã có\n\nChọn một công ty đang hoạt động và một sản phẩm/dịch vụ mới để launch.\n\n### Đầu ra bắt buộc\n\n| Phần | Nội dung cần có |\n|---|---|\n| Mục tiêu chiến lược | Vì sao sản phẩm mới quan trọng |\n| Tệp khách hàng hiện hữu | Nhóm nào phù hợp nhất để bắt đầu |\n| Định vị trong hệ sinh thái | Sản phẩm mới củng cố giá trị hiện tại thế nào |\n| Thông điệp launch | Rõ, đúng phạm vi, không overpromise |\n| Sales kit | FAQ, claim được nói/không được nói, objection handling |\n| Demo script | Kịch bản demo tạo giá trị và quản trị kỳ vọng |\n| Campaign launch | Launch có kiểm soát, kênh, KPI, timeline |\n| Onboarding sau mua | Hướng dẫn, CS, feedback 3/14/30 ngày |\n| Dashboard feedback | Số liệu bán, lỗi, phản hồi, NPS, churn |\n| Kế hoạch 30/60/90 ngày | Tối ưu nội dung, sản phẩm, kênh và hỗ trợ |\n\n## Rubric đánh giá đồ án\n\n| Tiêu chí | Trọng số | Yếu | Đạt | Tốt | Xuất sắc |\n|---|---:|---|---|---|---|\n| Hiểu khách hàng | 20% | Mô tả chung chung | Có nhóm khách và vấn đề | Có bối cảnh, nỗi đau, rào cản | Có insight sâu, hành vi thay thế, bằng chứng |\n| Logic marketing | 20% | Các phần rời rạc | Có đủ phần chính | Insight, định vị, thông điệp, kênh nối nhau | Mạch logic rõ và ra quyết định được |\n| Tính thực tế | 15% | Kế hoạch đẹp nhưng khó làm | Có hoạt động cơ bản | Có nguồn lực, thời gian, ưu tiên | Có thử nghiệm nhỏ và tiêu chí dừng/tiếp tục |\n| Chỉ số | 10% | Chỉ có like/view | Có KPI cơ bản | Có funnel và điểm nghẽn | Có CAC, retention, ngưỡng quyết định |\n| Quản trị rủi ro | 10% | Không nêu rủi ro | Có vài rủi ro | Có rủi ro chính và xử lý | Có risk register và kế hoạch kiểm chứng |\n| Thông điệp | 10% | Chung chung | Có lợi ích | Cụ thể, có bằng chứng | Dễ hiểu, khác biệt, không overpromise |\n| AI workflow | 5% | Dùng AI chung chung | Có AI hỗ trợ vài việc | Có dữ liệu đầu vào và người duyệt | Có guardrails rõ và kiểm soát chất lượng |\n| Trình bày | 10% | Khó đọc | Đủ ý | Mạch lạc, trực quan | Rõ quyết định, bảo vệ được lập luận |\n\n## Checklist trước khi nộp\n\n1. Kế hoạch có một khách hàng mục tiêu rõ không?\n2. Insight có sâu hơn nhu cầu chung chung không?\n3. Định vị có khác biệt và có bằng chứng không?\n4. Thông điệp có dễ hiểu trong 5 giây không?\n5. Journey có đủ trước mua và sau mua không?\n6. Kênh được chọn theo hành vi khách hàng không?\n7. Campaign có mục tiêu, offer, KPI và rủi ro không?\n8. Có chỉ số đo chuyển đổi và retention không?\n9. AI có guardrails và người kiểm duyệt không?\n10. Có thử nghiệm nhỏ trong 7-30 ngày không?\n\n"},{"sourcePath":"Marketing/14_phu_luc_bo_cau_hoi_va_mau_bieu.md","title":"Phụ Lục: Bộ Câu Hỏi Và Mẫu Biểu Marketing First Principles","category":"marketing","categoryLabel":"Marketing","order":15,"sha256":"4149a5e4642ffe63ef70dbb9f0e0e9a452a5730b0c7a76fe5cbb14e5be3ff93d","lineCount":167,"headings":[{"level":1,"text":"Phụ Lục: Bộ Câu Hỏi Và Mẫu Biểu Marketing First Principles","id":"phụ-lục-bộ-câu-hỏi-và-mẫu-biểu-marketing-first-principles"},{"level":2,"text":"Bộ câu hỏi first principles","id":"bộ-câu-hỏi-first-principles"},{"level":3,"text":"Về khách hàng","id":"về-khách-hàng"},{"level":3,"text":"Về insight","id":"về-insight"},{"level":3,"text":"Về định vị","id":"về-định-vị"},{"level":3,"text":"Về thông điệp","id":"về-thông-điệp"},{"level":3,"text":"Về kênh","id":"về-kênh"},{"level":3,"text":"Về chiến dịch","id":"về-chiến-dịch"},{"level":3,"text":"Về AI marketing","id":"về-ai-marketing"},{"level":2,"text":"Mẫu Insight Canvas","id":"mẫu-insight-canvas"},{"level":2,"text":"Mẫu Positioning Statement","id":"mẫu-positioning-statement"},{"level":2,"text":"Mẫu Customer Journey Map","id":"mẫu-customer-journey-map"},{"level":2,"text":"Mẫu Campaign Brief","id":"mẫu-campaign-brief"},{"level":2,"text":"Mẫu Marketing Funnel Dashboard","id":"mẫu-marketing-funnel-dashboard"},{"level":2,"text":"Mẫu AI Marketing Workflow","id":"mẫu-ai-marketing-workflow"},{"level":2,"text":"Checklist kiểm định từng bài","id":"checklist-kiểm-định-từng-bài"},{"level":2,"text":"Checklist kiểm định toàn giáo trình","id":"checklist-kiểm-định-toàn-giáo-trình"}],"rawMarkdown":"# Phụ Lục: Bộ Câu Hỏi Và Mẫu Biểu Marketing First Principles\n\n## Bộ câu hỏi first principles\n\n### Về khách hàng\n\n1. Khách hàng đang sống trong bối cảnh nào?\n2. Họ đang lo lắng điều gì?\n3. Họ muốn đạt kết quả gì?\n4. Họ đang dùng giải pháp thay thế nào?\n5. Vì sao họ chưa hành động?\n\n### Về insight\n\n1. Điều khách hàng nói ra là gì?\n2. Điều họ thật sự nghĩ là gì?\n3. Điều họ sợ là gì?\n4. Điều họ muốn người khác nhìn nhận là gì?\n5. Mâu thuẫn nội tâm của họ là gì?\n\n### Về định vị\n\n1. Mình dành cho ai?\n2. Mình giải quyết vấn đề gì?\n3. Mình khác gì so với lựa chọn hiện tại?\n4. Bằng chứng nào làm khách hàng tin?\n5. Mình muốn khách nhớ đến điều gì đầu tiên?\n\n### Về thông điệp\n\n1. Thông điệp có rõ vấn đề không?\n2. Có nói được kết quả không?\n3. Có dễ hiểu trong 5 giây không?\n4. Có tạo niềm tin không?\n5. Có lời kêu gọi hành động rõ không?\n\n### Về kênh\n\n1. Khách hàng đang ở đâu?\n2. Họ tìm thông tin bằng cách nào?\n3. Họ tin ai?\n4. Kênh nào phù hợp với giai đoạn nhận biết?\n5. Kênh nào phù hợp với giai đoạn chuyển đổi?\n\n### Về chiến dịch\n\n1. Chiến dịch phục vụ mục tiêu kinh doanh nào?\n2. Muốn thay đổi nhận thức hay hành vi nào?\n3. Offer có đủ hấp dẫn không?\n4. KPI nào chứng minh thành công?\n5. Nếu chiến dịch thất bại, cần học được điều gì?\n\n### Về AI marketing\n\n1. AI đang dùng để tăng tốc việc gì?\n2. Dữ liệu đầu vào có đáng tin không?\n3. Ai kiểm duyệt đầu ra?\n4. Có rủi ro overclaim không?\n5. Nội dung có còn giữ được giọng thương hiệu không?\n\n## Mẫu Insight Canvas\n\n| Thành phần | Nội dung |\n|---|---|\n| Khách hàng |  |\n| Bối cảnh |  |\n| Điều họ nói ra |  |\n| Điều họ thật sự lo |  |\n| Điều họ thật sự muốn |  |\n| Hành vi thay thế |  |\n| Rào cản hành động |  |\n| Insight một câu |  |\n| Gợi ý thông điệp |  |\n\n## Mẫu Positioning Statement\n\n```text\nDành cho [khách hàng mục tiêu],\nngười đang gặp [vấn đề],\n[sản phẩm/thương hiệu] là [danh mục],\ngiúp [lợi ích chính],\nkhác với [giải pháp thay thế],\nchúng tôi [điểm khác biệt/bằng chứng].\n```\n\n## Mẫu Customer Journey Map\n\n| Giai đoạn | Suy nghĩ của khách | Câu hỏi của khách | Nội dung cần cung cấp | Kênh | Chỉ số đo |\n|---|---|---|---|---|---|\n| Nhận biết |  |  |  |  |  |\n| Cân nhắc |  |  |  |  |  |\n| Mua |  |  |  |  |  |\n| Sử dụng |  |  |  |  |  |\n| Giới thiệu |  |  |  |  |  |\n\n## Mẫu Campaign Brief\n\n| Thành phần | Nội dung |\n|---|---|\n| Mục tiêu kinh doanh |  |\n| Mục tiêu marketing |  |\n| Đối tượng |  |\n| Insight |  |\n| Thông điệp |  |\n| Offer |  |\n| Kênh |  |\n| Nội dung chủ đạo |  |\n| KPI |  |\n| Rủi ro |  |\n| Kế hoạch tối ưu |  |\n\n## Mẫu Marketing Funnel Dashboard\n\n| Giai đoạn | Chỉ số | Giá trị hiện tại | Mục tiêu | Vấn đề | Hành động tối ưu |\n|---|---|---|---|---|---|\n| Awareness |  |  |  |  |  |\n| Interest |  |  |  |  |  |\n| Lead |  |  |  |  |  |\n| Trial/Demo |  |  |  |  |  |\n| Purchase |  |  |  |  |  |\n| Retention |  |  |  |  |  |\n\n## Mẫu AI Marketing Workflow\n\n| Công việc | AI hỗ trợ gì? | Dữ liệu đầu vào | Người kiểm duyệt | Rủi ro | Tiêu chuẩn đầu ra |\n|---|---|---|---|---|---|\n| Nghiên cứu khách hàng |  |  |  |  |  |\n| Viết content |  |  |  |  |  |\n| Viết sales kit |  |  |  |  |  |\n| Phân tích feedback |  |  |  |  |  |\n| Tối ưu campaign |  |  |  |  |  |\n\n## Checklist kiểm định từng bài\n\n| Câu hỏi kiểm định | Có/Không |\n|---|---|\n| Bài có một câu hỏi bản chất rõ không? |  |\n| Có tình huống mở bài cụ thể không? |  |\n| Có giải thích bằng ngôn ngữ người mới hiểu không? |  |\n| Phần lý thuyết nền có đủ sâu không? |  |\n| Thuật ngữ quan trọng có ví dụ đúng/sai không? |  |\n| Có phân biệt bản chất với biểu hiện bề mặt không? |  |\n| Có khung tư duy trực quan không? |  |\n| Có ví dụ đời thường không? |  |\n| Có phân tích use case công ty mới không? |  |\n| Có phân tích use case công ty đã có không? |  |\n| Có chỉ ra lỗi phổ biến không? |  |\n| Có bài tập tạo đầu ra cụ thể không? |  |\n| Có bài tập review không? |  |\n| Có rubric yếu/đạt/tốt/xuất sắc không? |  |\n| Có checklist tự review không? |  |\n| Có liên hệ với bài trước và bài sau không? |  |\n| Có hành động kiểm chứng thực tế không? |  |\n\n## Checklist kiểm định toàn giáo trình\n\n1. Có mạch logic từ bản chất đến ứng dụng.\n2. Có 2 use case xuyên suốt và nhất quán.\n3. Mỗi phần đều tạo ra artifact thực hành.\n4. Mỗi bài đều có tình huống, phân tích, bài tập, rubric.\n5. Mỗi bài có kiến thức nền đủ sâu để hiểu bản chất.\n6. Mỗi bài có thuật ngữ, ví dụ đúng/sai và lỗi dễ nhầm.\n7. Người mới có thể học mà không cần nền tảng marketing trước đó.\n8. Có đủ phần cho công ty mới và công ty đã có.\n9. Có đủ insight, định vị, journey, thông điệp, content, kênh, campaign, brand, performance, CRM và AI.\n10. Đồ án cuối khóa có thể dùng làm bản kế hoạch thật để kiểm chứng.\n\n"},{"sourcePath":"Sales/00_tong_quan_giao_trinh_sales_first_principles.md","title":"Sales từ gốc: Hiểu khách hàng, chẩn đoán nhu cầu, tạo niềm tin và chuyển giá trị thành doanh thu bền vững","category":"sales","categoryLabel":"Sales","order":1,"sha256":"06264b063c7cfe5d47e70e70d5f44569938995f64268fcef30827c8736946987","lineCount":130,"headings":[{"level":1,"text":"Sales từ gốc: Hiểu khách hàng, chẩn đoán nhu cầu, tạo niềm tin và chuyển giá trị thành doanh thu bền vững","id":"sales-từ-gốc-hiểu-khách-hàng-chẩn-đoán-nhu-cầu-tạo-niềm-tin-và-chuyển-giá-trị-thành-doanh-thu-bền-vững"},{"level":2,"text":"Tinh thần giáo trình","id":"tinh-thần-giáo-trình"},{"level":2,"text":"Đối tượng học viên","id":"đối-tượng-học-viên"},{"level":2,"text":"Chuẩn đầu ra","id":"chuẩn-đầu-ra"},{"level":2,"text":"Hai use case xuyên suốt","id":"hai-use-case-xuyên-suốt"},{"level":3,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":3,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Bản đồ giáo trình","id":"bản-đồ-giáo-trình"},{"level":2,"text":"Cách học","id":"cách-học"},{"level":2,"text":"Nguyên tắc làm bài tập","id":"nguyên-tắc-làm-bài-tập"},{"level":2,"text":"Thang đánh giá chung","id":"thang-đánh-giá-chung"}],"rawMarkdown":"# Sales từ gốc: Hiểu khách hàng, chẩn đoán nhu cầu, tạo niềm tin và chuyển giá trị thành doanh thu bền vững\n\n## Tinh thần giáo trình\n\nGiáo trình này không xem sales là nói hay, ép khách mua, thuộc kịch bản chốt đơn hoặc dùng thủ thuật tâm lý. Sales được nhìn từ bản chất:\n\n> Sales là quá trình giúp đúng khách hàng hiểu rõ vấn đề, nhìn thấy giá trị phù hợp, giảm rủi ro quyết định và cam kết hành động có lợi cho cả khách hàng lẫn doanh nghiệp.\n\nSales tốt không bắt đầu từ câu \"làm sao chốt được đơn\", mà bắt đầu từ câu \"khách hàng có thật sự phù hợp, thật sự cần, thật sự tin và thật sự có điều kiện để mua không\". Một đơn hàng chỉ tốt khi khách mua đúng kỳ vọng, dùng được sản phẩm, nhận được giá trị và không tạo rủi ro sau bán.\n\n```text\nKhông biết bán hàng\n-> Hiểu vì sao khách mua\n-> Biết chọn khách phù hợp\n-> Biết hỏi đúng\n-> Biết tư vấn theo giá trị\n-> Biết xử lý phản đối\n-> Biết chốt có trách nhiệm\n-> Biết bàn giao sau bán\n-> Biết cải tiến pipeline và playbook\n```\n\n## Đối tượng học viên\n\nGiáo trình dành cho:\n\n- Người mới học sales và chưa từng bán hàng bài bản.\n- Founder, chủ doanh nghiệp nhỏ, marketer, product, R&D cần hiểu sales để phối hợp tốt hơn.\n- Nhân sự sales muốn thoát khỏi tư duy chỉ gọi nhiều, nói nhiều, giảm giá và chốt nhanh.\n- Công ty mới cần tìm khách hàng đầu tiên.\n- Công ty đã có cần launch sản phẩm mới qua đội sales, đại lý hoặc showroom.\n\nGiáo trình không giả định người học đã biết ICP, lead, qualification, discovery, pipeline, CRM, forecast, objection handling, proposal hay handoff. Mỗi thuật ngữ quan trọng đều được giải thích bằng tiếng Việt đời thường trước khi dùng trong phân tích.\n\n## Chuẩn đầu ra\n\nSau giáo trình, người học có thể:\n\n| Năng lực | Biểu hiện đạt yêu cầu |\n|---|---|\n| Hiểu bản chất sales | Phân biệt sales với marketing, chăm sóc khách hàng và thao túng chốt đơn |\n| Nhìn quyết định mua | Hiểu khách mua khi có vấn đề, giá trị, niềm tin, timing và khả năng chi trả |\n| Chọn khách phù hợp | Xác định ICP, lead đủ điều kiện và khách không nên bán |\n| Tạo cơ hội bán hàng | Biết tìm, tiếp cận và nuôi dưỡng cơ hội mà không spam |\n| Discovery | Hỏi để chẩn đoán vấn đề, bối cảnh, tác động, người quyết định và rào cản |\n| Tư vấn giá trị | Liên kết giải pháp với kết quả khách cần, không demo tính năng lan man |\n| Xây niềm tin | Dùng bằng chứng, case, demo, chính sách và giới hạn claim đúng cách |\n| Xử lý phản đối | Phân biệt phản đối thật, thiếu thông tin, thiếu niềm tin và khách không phù hợp |\n| Chốt có trách nhiệm | Biết báo giá, đàm phán và chốt dựa trên giá trị, điều kiện và bước tiếp theo rõ |\n| Quản trị pipeline | Dùng CRM, stage, next step, forecast và deal review để bán có hệ thống |\n| Bàn giao sau bán | Chuyển giao kỳ vọng, dữ liệu và trách nhiệm để khách dùng đúng |\n| Xây playbook | Chuẩn hóa câu hỏi, demo, objection, proposal, handoff và feedback loop |\n\n## Hai use case xuyên suốt\n\n### Use case 1: Công ty mới\n\nMột startup muốn xây dựng **nền tảng học tập cá nhân hóa bằng AI cho học sinh tiểu học**. Sản phẩm giúp phụ huynh biết con yếu ở đâu, nhận lộ trình học mỗi ngày và theo dõi tiến bộ rõ ràng.\n\n| Thành phần | Nội dung |\n|---|---|\n| Bối cảnh | Chưa có thương hiệu, chưa có dữ liệu bán hàng, sản phẩm còn thử nghiệm |\n| Mục tiêu | Tìm 20-30 phụ huynh đầu tiên sẵn sàng dùng thử, trả tiền và phản hồi thật |\n| Ràng buộc | Ít ngân sách, ít bằng chứng, phụ huynh nghi ngại AI và dữ liệu trẻ em |\n| Mâu thuẫn | Cần bán để học, nhưng bán quá sớm có thể tạo kỳ vọng sai |\n| Dữ liệu hiện có | Demo, vài cuộc phỏng vấn, một số phụ huynh tò mò |\n| Dữ liệu thiếu | Ai có nhu cầu đủ đau, ai trả tiền, giá nào hợp lý, lý do từ chối thật |\n| Quyết định | Chọn ICP đầu tiên, thiết kế discovery, offer dùng thử và tiêu chí paid conversion |\n\n### Use case 2: Công ty đã có\n\nMột công ty smart home Việt Nam đã có thương hiệu, đại lý, showroom và khách hàng hiện hữu. Công ty muốn bán **loa thông minh trợ lý ảo tiếng Việt** để tăng trải nghiệm điều khiển nhà thông minh.\n\n| Thành phần | Nội dung |\n|---|---|\n| Bối cảnh | Đã có khách hàng và đại lý nhưng sản phẩm AI mới cần quản trị kỳ vọng |\n| Mục tiêu | Bán có kiểm soát cho nhóm khách phù hợp, giúp đại lý demo đúng và thu feedback |\n| Ràng buộc | Một số tính năng chưa hoàn hảo, khách kỳ vọng cao khi nghe đến AI |\n| Mâu thuẫn | Bán mạnh tạo doanh thu nhanh nhưng dễ overpromise; bán hẹp an toàn hơn nhưng ít tiếng vang |\n| Dữ liệu hiện có | Tệp khách smart home, showroom demo, đội kỹ thuật và CS |\n| Dữ liệu thiếu | Ai phù hợp nhất, objection chính là gì, đại lý có bán đúng không, lỗi sau lắp đặt ra sao |\n| Quyết định | Chọn qualification, demo script, sales kit, pipeline thử nghiệm và handoff sau bán |\n\n## Bản đồ giáo trình\n\n| Bài | Chủ đề | Câu hỏi bản chất | Đầu ra thực hành |\n|---:|---|---|---|\n| 1 | Bản chất sales | Sales thật sự làm việc gì? | Bản mô tả vai trò sales |\n| 2 | Quyết định mua | Vì sao khách quyết định mua hoặc không mua? | Buying decision map |\n| 3 | Qualification | Ai là khách hàng phù hợp? | ICP và lead qualification |\n| 4 | Tạo cơ hội | Làm sao tạo cơ hội bán hàng đúng cách? | Outreach plan |\n| 5 | Discovery | Cần hỏi gì trước khi tư vấn? | Discovery call guide |\n| 6 | Tư vấn và demo | Làm sao trình bày giá trị? | Value demo script |\n| 7 | Niềm tin | Khách cần tin điều gì? | Trust proof map |\n| 8 | Phản đối | Vì sao khách nói chưa? | Objection handling matrix |\n| 9 | Báo giá và chốt | Chốt đơn có trách nhiệm là gì? | Proposal và closing plan |\n| 10 | Pipeline | Bán hàng có hệ thống ra sao? | Pipeline dashboard |\n| 11 | Bàn giao sau bán | Bán xong đã xong chưa? | Handoff checklist |\n| 12 | Playbook | Làm sao sales lặp lại được? | Sales playbook |\n| 13 | AI sales | Dùng AI trong sales thế nào? | AI sales workflow |\n| 14 | Đồ án | Xây kế hoạch sales hoàn chỉnh | Sales plan kiểm chứng được |\n\n## Cách học\n\nMỗi bài nên học theo 5 bước:\n\n| Bước | Cách làm | Đầu ra |\n|---|---|---|\n| 1 | Đọc câu hỏi bản chất và tình huống mở bài | Hiểu vấn đề sales thật |\n| 2 | Đọc nguyên lý và kiến thức nền | Nắm cơ chế ra quyết định mua |\n| 3 | So sánh 2 use case xuyên suốt | Thấy khác biệt giữa công ty mới và công ty đã có |\n| 4 | Làm bài tập ứng dụng và review | Tạo artifact cụ thể |\n| 5 | Làm hành động 30-90 phút | Kiểm chứng bằng cuộc gọi, tin nhắn, dữ liệu nhỏ |\n\n## Nguyên tắc làm bài tập\n\n- Viết cụ thể, tránh câu chung như \"khách hàng cần giải pháp tốt\".\n- Luôn phân biệt điều khách nói, điều khách thật sự cần và điều khách có khả năng mua.\n- Nếu chưa có dữ liệu, ghi rõ đó là giả thuyết.\n- Mỗi deal phải có bước tiếp theo rõ, người chịu trách nhiệm và thời điểm.\n- Không xem mọi phản đối là thứ cần vượt qua; đôi khi đó là tín hiệu khách không phù hợp.\n\n## Thang đánh giá chung\n\n| Mức | Ý nghĩa |\n|---|---|\n| Yếu | Chỉ tập trung nói về sản phẩm, giảm giá hoặc chốt đơn |\n| Đạt | Có khách hàng, vấn đề, nhu cầu và bước tiếp theo cơ bản |\n| Tốt | Có logic, có câu hỏi tốt, có bằng chứng, thấy được rủi ro và người quyết định |\n| Xuất sắc | Chẩn đoán sâu, chọn đúng khách, tạo niềm tin, chốt có trách nhiệm và có feedback loop |\n"},{"sourcePath":"Sales/01_sales_la_gi.md","title":"Bài 1. Sales Là Gì?","category":"sales","categoryLabel":"Sales","order":2,"sha256":"36c701827ee24116fdd452d88a5ee66099615caac2e0e47470db66f0dbb153a7","lineCount":131,"headings":[{"level":1,"text":"Bài 1. Sales Là Gì?","id":"bài-1-sales-là-gì"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"
