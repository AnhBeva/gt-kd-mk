      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);

      color: var(--text);

      font-size: 14px;

    .search-input:focus { border-color: rgba(0,113,227,0.42); box-shadow: 0 0 0 4px var(--accent-soft); }
    .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted-2); font-size: 15px; }
    .clear-search {

  <script id="courseData" type="application/json">{"generatedFrom":["Kinh doanh","Marketing"],"generatedAt":"2026-06-08","counts":{"business":14,"marketing":15,"total":29},"lessons":[{"sourcePath":"Kinh doanh/00_tong_quan_giao_trinh.md","title":"Kinh doanh từ gốc: Từ ý tưởng đến mô hình doanh nghiệp bền vững","category":"business","categoryLabel":"Kinh doanh","order":1,"sha256":"80c9b9c30bcc1883da66e384159c2d7cdc6d06527257db644ca5c3bce75b2856","lineCount":129,"headings":[{"level":1,"text":"Kinh doanh từ gốc: Từ ý tưởng đến mô hình doanh nghiệp bền vững","id":"kinh-doanh-tu-goc-tu-y-tuong-đen-mo-hinh-doanh-nghiep-ben-vung"},{"level":2,"text":"Tinh thần giáo trình","id":"tinh-than-giao-trinh"},{"level":2,"text":"Đối tượng học viên","id":"đoi-tuong-hoc-vien"},{"level":2,"text":"Chuẩn đầu ra","id":"chuan-đau-ra"},{"level":2,"text":"Hai use case xuyên suốt","id":"hai-use-case-xuyen-suot"},{"level":3,"text":"Use case 1: Công ty mới","id":"use-case-1-cong-ty-moi"},{"level":3,"text":"Use case 2: Công ty đã có","id":"use-case-2-cong-ty-đa-co"},{"level":2,"text":"Bản đồ giáo trình","id":"ban-đo-giao-trinh"},{"level":2,"text":"Cách học","id":"cach-hoc"},{"level":2,"text":"Nguyên tắc làm bài tập","id":"nguyen-tac-lam-bai-tap"},{"level":2,"text":"Thang đánh giá chung","id":"thang-đanh-gia-chung"}],"rawMarkdown":"# Kinh doanh từ gốc: Từ ý tưởng đến mô hình doanh nghiệp bền vững\n\n## Tinh thần giáo trình\n\nGiáo trình này bắt đầu từ một câu hỏi gốc:\n\n> Vì sao một doanh nghiệp có quyền tồn tại trên thị trường?\n\nMột doanh nghiệp không có quyền tồn tại chỉ vì người sáng lập thích ý tưởng, sản phẩm có công nghệ mới, thương hiệu nhìn chuyên nghiệp hoặc thị trường nghe có vẻ lớn. Doanh nghiệp chỉ có quyền tồn tại khi nó tạo ra giá trị thật cho một nhóm khách hàng đủ rõ, giải quyết một vấn đề đủ quan trọng, có cách đưa giá trị đó đến khách hàng, có mô hình thu tiền hợp lý, vận hành ổn định và thích nghi được với thay đổi.\n\nHọc kinh doanh theo first principles nghĩa là không học thuộc công thức trước. Người học phải đi từ bản chất: khách hàng là ai, họ đau ở đâu, họ đang làm gì thay thế, vì sao họ phải đổi sang giải pháp mới, doanh nghiệp thu lại giá trị bằng cách nào, và điều gì có thể làm mọi kế hoạch đẹp trên giấy thất bại ngoài thị trường.\n\n```text\nKhông biết gì\n-> Hiểu bản chất\n-> Nhìn được vấn đề thật\n-> Biết đặt câu hỏi đúng\n-> Biết phân tích tình huống\n-> Biết thiết kế thử nghiệm nhỏ\n-> Biết đo kết quả\n-> Biết tiếp tục, dừng lại hoặc đổi hướng\n```\n\n## Đối tượng học viên\n\nGiáo trình dành cho:\n\n- Người muốn khởi nghiệp hoặc đang có một ý tưởng kinh doanh.\n- Chủ doanh nghiệp nhỏ và vừa muốn nhìn lại mô hình kinh doanh.\n- Nhân sự quản lý, sales, marketing, product, R&D muốn hiểu doanh nghiệp như một hệ thống.\n- Sinh viên hoặc người mới đi làm chưa từng học kinh doanh bài bản.\n\nGiáo trình không giả định người học đã biết CAC, LTV, unit economics, GTM, MVP, định vị, funnel hay dòng tiền. Mỗi thuật ngữ quan trọng đều được giải thích bằng tiếng Việt đời thường trước khi dùng trong phân tích.\n\n## Chuẩn đầu ra\n\nSau khi học xong, người học có thể:\n\n| Năng lực | Biểu hiện đạt yêu cầu |\n|---|---|\n| Nhìn khách hàng | Mô tả khách hàng bằng vấn đề, bối cảnh và động lực mua, không chỉ bằng tuổi, giới tính, thu nhập |\n| Phân biệt khái niệm | Tách được ý tưởng, sản phẩm, giá trị, mô hình kinh doanh và công ty |\n| Đánh giá vấn đề | Biết hỏi vấn đề có đủ đau, đủ thường xuyên, đủ đáng trả tiền không |\n| Nhìn thị trường | Phân biệt thị trường rộng với thị trường có thể bắt đầu |\n| Nhìn cạnh tranh | Thấy được đối thủ trực tiếp, đối thủ gián tiếp và hành vi thay thế |\n| Thiết kế mô hình | Lập được mô hình doanh thu, chi phí và cách giao giá trị sơ bộ |\n| Đọc tài chính | Ước lượng doanh thu, giá vốn, biên lợi nhuận, CAC, LTV và dòng tiền |\n| Giảm rủi ro | Xác định giả thuyết nguy hiểm nhất và thiết kế thử nghiệm nhỏ |\n| Lập kế hoạch | Xây được bản kế hoạch kinh doanh sơ bộ có thể đem đi kiểm chứng |\n| Ra quyết định | Biết khi nào nên tiếp tục, dừng lại hoặc đổi hướng |\n\n## Hai use case xuyên suốt\n\n### Use case 1: Công ty mới\n\nMột nhóm sáng lập muốn làm **giải pháp học tập cá nhân hóa bằng AI cho học sinh tiểu học**. Sản phẩm hứa hẹn giúp phụ huynh biết con đang yếu ở đâu, mỗi ngày nên học gì, và con có tiến bộ không.\n\nRủi ro chính:\n\n- Chưa biết phụ huynh có đau thật không.\n- Chưa biết ai là người trả tiền: phụ huynh, trường học hay trung tâm.\n- Chưa biết trẻ có dùng đều không.\n- Chưa có niềm tin thương hiệu.\n- Chưa biết mô hình doanh thu có bền không.\n\nCâu hỏi xuyên suốt:\n\n> Cần kiểm chứng điều gì trước khi đầu tư lớn?\n\n### Use case 2: Công ty đã có\n\nMột công ty smart home Việt Nam đã có sản phẩm, nhà máy, đại lý, khách hàng và thương hiệu. Công ty muốn mở rộng sang dòng **loa thông minh trợ lý ảo tiếng Việt** để tăng giá trị hệ sinh thái nhà thông minh.\n\nRủi ro chính:\n\n- Sản phẩm mới có thể vượt quá năng lực AI, cloud và hỗ trợ hiện tại.\n- Kênh đại lý có thể bán sai kỳ vọng.\n- Khách hàng kỳ vọng trải nghiệm ổn định như sản phẩm đã trưởng thành.\n- Launch rộng khi sản phẩm chưa ổn có thể làm hỏng niềm tin thương hiệu.\n\nCâu hỏi xuyên suốt:\n\n> Sản phẩm mới có củng cố hệ sinh thái hiện tại không, hay tạo rủi ro lớn hơn giá trị?\n\n## Bản đồ giáo trình\n\n| Bài | Chủ đề | Câu hỏi bản chất | Đầu ra thực hành |\n|---:|---|---|---|\n| 1 | Bản chất kinh doanh | Doanh nghiệp tồn tại để làm gì? | Bản mô tả quyền tồn tại |\n| 2 | Vấn đề khách hàng | Khách hàng thật sự mua điều gì? | Customer problem brief |\n| 3 | Thị trường | Thị trường hấp dẫn cần điều kiện nào? | Bảng chọn thị trường ban đầu |\n| 4 | Sản phẩm và giá trị | Sản phẩm tốt là gì? | Value proposition canvas rút gọn |\n| 5 | Mô hình kinh doanh | Doanh nghiệp kiếm tiền bằng cách nào? | Bảng doanh thu, chi phí, biên lợi nhuận |\n| 6 | Lợi thế cạnh tranh | Vì sao khách hàng chọn mình? | Bảng lợi thế cạnh tranh |\n| 7 | Go-to-market | Đưa sản phẩm ra thị trường thế nào? | Kế hoạch GTM một trang |\n| 8 | Vận hành | Giao giá trị ổn định ra sao? | Bản đồ quy trình giao giá trị |\n| 9 | Tài chính | Doanh nghiệp sống khỏe bằng gì? | Unit economics sơ bộ |\n| 10 | Tăng trưởng | Tăng trưởng đến từ đâu và có bền không? | Growth engine |\n| 11 | Rủi ro | Điều gì làm doanh nghiệp thất bại? | Risk register |\n| 12 | Đồ án | Xây kế hoạch kinh doanh hoàn chỉnh | Business plan kiểm chứng được |\n\n## Cách học\n\nMỗi bài nên học theo 4 bước:\n\n1. Đọc câu hỏi bản chất và tình huống mở bài.\n2. Học phần kiến thức nền, ghi lại thuật ngữ bằng ngôn ngữ của mình.\n3. Áp dụng vào cả 2 use case để thấy khác biệt giữa công ty mới và công ty đã có.\n4. Làm bài tập bằng một ý tưởng hoặc doanh nghiệp thật, rồi tự chấm theo rubric.\n\nKhông nên đọc giáo trình như tài liệu tham khảo để biết khái niệm. Giá trị thật nằm ở việc người học buộc mình viết ra giả định, chọn phân khúc, tính thử chi phí, nhìn rủi ro và thiết kế hành động kiểm chứng nhỏ.\n\n## Nguyên tắc làm bài tập\n\n- Viết cụ thể, tránh câu chung như \"khách hàng muốn tiện lợi\".\n- Nếu chưa có dữ liệu, ghi rõ đó là giả thuyết.\n- Mỗi giả thuyết quan trọng phải có cách kiểm chứng.\n- Luôn hỏi: nếu điều này sai, kế hoạch có sụp không?\n- Luôn phân biệt điều mình tin, điều khách hàng nói và điều khách hàng thật sự làm.\n\n## Thang đánh giá chung\n\n| Mức | Ý nghĩa |\n|---|---|\n| Yếu | Làm hình thức, còn mơ hồ, chủ yếu mô tả sản phẩm hoặc mong muốn của doanh nghiệp |\n| Đạt | Trả lời đúng khung cơ bản, xác định được khách hàng, vấn đề, giải pháp và mô hình sơ bộ |\n| Tốt | Có logic, có ví dụ, có liên hệ thực tế, thấy được lựa chọn thay thế và rủi ro |\n| Xuất sắc | Có insight sâu, chỉ ra trade-off, giả thuyết nguy hiểm, dữ liệu cần thu và hành động kiểm chứng cụ thể |\n\n"},{"sourcePath":"Kinh doanh/01_kinh_doanh_la_gi.md","title":"Bài 1. Kinh doanh là gì?","category":"business","categoryLabel":"Kinh doanh","order":2,"sha256":"a2aefb4bf8e7673c4119b6fca10b9a834ea8c4dd48cd565da6b405fabe6145a3","lineCount":144,"headings":[{"level":1,"text":"Bài 1. Kinh doanh là gì?","id":"bai-1-kinh-doanh-la-gi"},{"level":2,"text":"Mục tiêu học tập","id":"muc-tieu-hoc-tap"},{"level":2,"text":"Câu hỏi bản chất","id":"cau-hoi-ban-chat"},{"level":2,"text":"Tình huống mở bài","id":"tinh-huong-mo-bai"},{"level":2,"text":"Nguyên lý first principles","id":"nguyen-ly-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kien-thuc-nen-chi-tiet"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuat-ngu-can-hieu-sau"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tu-duy-truc-quan"},{"level":2,"text":"Ví dụ đời thường","id":"vi-du-đoi-thuong"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-cong-ty-moi"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-cong-ty-đa-co"},{"level":2,"text":"Lỗi người mới thường mắc","id":"loi-nguoi-moi-thuong-mac"},{"level":2,"text":"Bài tập ứng dụng","id":"bai-tap-ung-dung"},{"level":2,"text":"Bài tập review","id":"bai-tap-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tieu-chi-đanh-gia"},{"level":2,"text":"Checklist tự review","id":"checklist-tu-review"},{"level":2,"text":"Hành động nhỏ trong 30-90 phút","id":"hanh-đong-nho-trong-30-90-phut"}],"rawMarkdown":"# Bài 1. Kinh doanh là gì?\n\n## Mục tiêu học tập\n\nSau bài này, người học có thể:\n\n- Giải thích kinh doanh bằng ngôn ngữ đơn giản: tạo giá trị và thu lại một phần giá trị đó.\n- Phân biệt ý tưởng, sản phẩm, giá trị, mô hình kinh doanh và công ty.\n- Nhìn ra vì sao sản phẩm hay chưa đủ để thành doanh nghiệp.\n- Viết bản mô tả quyền tồn tại của một doanh nghiệp.\n\n## Câu hỏi bản chất\n\n> Một doanh nghiệp tồn tại để làm gì?\n\n## Tình huống mở bài\n\nMột nhóm bạn kỹ thuật làm được bản demo app AI học tập. App tạo bài tập tự động, chấm điểm nhanh, gợi ý bài tiếp theo và có giao diện đẹp. Nhóm tin rằng \"AI giáo dục là xu hướng lớn\" nên muốn lập công ty ngay.\n\nNhưng khi hỏi phụ huynh, có người nói thích, có người nói đã tải nhiều app nhưng con không dùng đều, có người nói không biết app này khác gì YouTube hoặc học thêm. Nhóm bắt đầu lúng túng: họ có sản phẩm, nhưng chưa chắc đã có doanh nghiệp.\n\n## Nguyên lý first principles\n\nKinh doanh không bắt đầu từ sản phẩm. Kinh doanh bắt đầu từ giá trị.\n\nMột doanh nghiệp cần trả lời được 5 câu hỏi gốc:\n\n1. Ai có vấn đề?\n2. Vấn đề đó có đủ quan trọng không?\n3. Giải pháp tạo ra giá trị gì?\n4. Khách hàng có sẵn sàng trả tiền không?\n5. Doanh nghiệp có thể tạo lợi nhuận bền vững không?\n\nNếu thiếu một trong năm yếu tố này, doanh nghiệp dễ rơi vào các lỗi quen thuộc: có sản phẩm nhưng không có thị trường, có người thích nhưng không có người trả tiền, có doanh thu nhưng không có lợi nhuận, có tăng trưởng nhưng dòng tiền âm, hoặc có công nghệ tốt nhưng khách hàng không thấy giá trị.\n\n## Kiến thức nền chi tiết\n\nKinh doanh là quá trình tổ chức nguồn lực để giải quyết một vấn đề có giá trị đối với khách hàng, sau đó thu lại một phần giá trị đó dưới dạng doanh thu, lợi nhuận, dữ liệu, tài sản hoặc vị thế thị trường. Nói đời thường, doanh nghiệp phải làm được một việc khiến khách hàng thấy đáng đổi tiền, thời gian, niềm tin hoặc thói quen để nhận lấy.\n\nÝ tưởng chỉ là một khả năng trong đầu. Sản phẩm là thứ được tạo ra để phục vụ khả năng đó. Giá trị là kết quả khách hàng thật sự nhận được. Mô hình kinh doanh là cách doanh nghiệp tạo, giao và thu lại giá trị. Công ty là hệ thống con người, tài sản, quy trình, vốn, thương hiệu và năng lực vận hành để lặp lại việc đó.\n\nNgười mới thường nhầm \"có ý tưởng\" với \"có cơ hội kinh doanh\". Một ý tưởng nghe hấp dẫn vì nó mới, hợp xu hướng hoặc có công nghệ mạnh. Nhưng cơ hội kinh doanh chỉ xuất hiện khi một nhóm khách hàng cụ thể có vấn đề đủ đau, đang tìm cách giải quyết, có khả năng trả tiền, có thể tiếp cận được và doanh nghiệp có cách phục vụ họ với chi phí thấp hơn giá trị thu về.\n\nCơ chế vận hành của kinh doanh có thể nhìn như một vòng lặp. Doanh nghiệp phát hiện vấn đề, thiết kế giải pháp, đưa giải pháp đến khách hàng, khách hàng trả tiền hoặc phản hồi, doanh nghiệp dùng nguồn lực thu về để cải tiến và phục vụ nhiều khách hơn. Nếu vòng lặp tạo ra nhiều giá trị hơn chi phí, doanh nghiệp có cơ hội sống. Nếu càng làm càng tốn tiền, càng bán càng lỗ, hoặc khách hàng dùng một lần rồi bỏ, vòng lặp bị hỏng.\n\nĐiểm khó là giá trị không nằm trong mắt doanh nghiệp mà nằm trong mắt khách hàng. Một tính năng có thể rất khó làm nhưng khách hàng không quan tâm. Ngược lại, một thay đổi nhỏ như báo cáo tiến bộ rõ ràng mỗi tuần có thể tạo giá trị lớn vì nó giải quyết nỗi lo thật của phụ huynh.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Câu hỏi kiểm tra |\n|---|---|---|---|---|---|---|\n| Giá trị | Kết quả có ích mà khách hàng nhận được | Điều khiến khách thấy đáng đổi tiền hoặc thời gian | Giá trị do khách hàng cảm nhận, không do doanh nghiệp tự tuyên bố | Phụ huynh thấy con học đều hơn và biết con yếu phần nào | App có nhiều tính năng nhưng phụ huynh không dùng | Khách hàng sẽ tiếc điều gì nếu sản phẩm biến mất? |\n| Mô hình kinh doanh | Cách tạo, giao và thu giá trị | Doanh nghiệp kiếm tiền bằng cách nào và tốn gì để làm điều đó | Cầu nối giữa giá trị khách hàng và sức khỏe tài chính | Bán thuê bao học tập theo tháng với chi phí phục vụ thấp hơn doanh thu | Bán app giá rẻ nhưng chi phí AI mỗi tháng vượt tiền thu | Càng có nhiều khách, doanh nghiệp lời hơn hay lỗ hơn? |\n| Khách hàng | Người trả tiền hoặc quyết định mua | Không phải lúc nào cũng là người dùng | Doanh nghiệp sống nhờ người có quyền trả tiền | Phụ huynh trả tiền cho app học của con | Chỉ tối ưu cho trẻ thích game nhưng phụ huynh không thấy đáng mua | Ai thực sự ký chi tiền? |\n| Quyền tồn tại | Lý do doanh nghiệp xứng đáng có mặt trên thị trường | Vì sao khách hàng, thị trường và xã hội cần doanh nghiệp này | Tổng hợp của vấn đề, giá trị, khả năng trả tiền và năng lực thực thi | Giúp phụ huynh bận rộn theo sát việc học của con với chi phí hợp lý | \"Vì AI đang hot\" | Nếu không có doanh nghiệp này, khách hàng mất điều gì quan trọng? |\n\n## Khung tư duy trực quan\n\n```text\nKhách hàng có vấn đề\n-> Doanh nghiệp tạo giải pháp\n-> Khách hàng nhận giá trị\n-> Khách hàng trả tiền hoặc quay lại\n-> Doanh nghiệp có nguồn lực phục vụ tốt hơn\n```\n\n## Ví dụ đời thường\n\nMột quán cơm văn phòng không tồn tại vì \"bán cơm\". Nó tồn tại vì dân văn phòng gần đó cần bữa trưa nhanh, sạch, vừa túi tiền, không phải suy nghĩ nhiều. Nếu quán nấu ngon nhưng phục vụ chậm, xa, giá cao hoặc hết món thường xuyên, giá trị bị giảm. Kinh doanh không phải chỉ là món cơm, mà là toàn bộ trải nghiệm giúp khách giải quyết bữa trưa.\n\n## Use case 1: Công ty mới\n\nVới app AI học tập, ý tưởng \"AI cá nhân hóa\" chưa đủ. Nhóm sáng lập phải xác định vấn đề gốc: phụ huynh không biết con yếu ở đâu, không có thời gian kèm con, con mất động lực học, hay chương trình học quá tải. Mỗi vấn đề dẫn đến sản phẩm, thông điệp và mô hình kinh doanh khác nhau.\n\nNếu phụ huynh chỉ thấy app \"hay\" nhưng không mở báo cáo, không cho con học đều và không trả tiền sau dùng thử, doanh nghiệp chưa có bằng chứng về giá trị. Nếu phụ huynh nói \"nhờ app tôi biết con yếu phép chia và mỗi tối chỉ cần cho con học 10 phút\", đó là tín hiệu giá trị rõ hơn.\n\nQuyết định quan trọng không phải là lập công ty ngay, mà là kiểm chứng vấn đề, người trả tiền và hành vi sử dụng trước khi đầu tư lớn.\n\n## Use case 2: Công ty đã có\n\nVới công ty smart home, loa thông minh không chỉ là sản phẩm mới để danh mục trông đầy đủ. Sản phẩm phải tăng giá trị cho hệ sinh thái hiện tại. Nếu loa giúp người già bật đèn dễ hơn, giúp gia đình điều khiển nhiều thiết bị bằng một câu nói và giúp đại lý demo nhà thông minh thuyết phục hơn, nó có lý do kinh doanh.\n\nNhưng nếu nhận diện giọng nói chậm, điều khiển sai hoặc chỉ hoạt động tốt trong demo, sản phẩm có thể làm khách mất niềm tin vào cả hệ sinh thái. Với công ty đã có, câu hỏi không chỉ là \"có bán được không\", mà còn là \"bán ra có làm thương hiệu mạnh hơn hay yếu đi\".\n\n## Lỗi người mới thường mắc\n\n- Bắt đầu từ sản phẩm thay vì vấn đề.\n- Nhầm người thích với người sẵn sàng trả tiền.\n- Tin rằng thị trường lớn nghĩa là cơ hội lớn.\n- Không tính chi phí tạo và giao giá trị.\n- Xem doanh thu là thành công dù lợi nhuận và dòng tiền âm.\n- Lập kế hoạch dựa trên niềm tin nội bộ thay vì hành vi khách hàng.\n\n## Bài tập ứng dụng\n\nChọn một ý tưởng kinh doanh và điền bảng sau:\n\n| Câu hỏi | Câu trả lời |\n|---|---|\n| Khách hàng là ai? |  |\n| Vấn đề cụ thể của họ là gì? |  |\n| Vấn đề xảy ra trong bối cảnh nào? |  |\n| Họ đang giải quyết bằng cách nào? |  |\n| Giải pháp của bạn tạo giá trị gì? |  |\n| Vì sao họ sẽ trả tiền? |  |\n| Chi phí chính để tạo và giao giá trị là gì? |  |\n| Rủi ro lớn nhất nếu giả định sai là gì? |  |\n\n## Bài tập review\n\nReview tuyên bố sau:\n\n> \"Chúng tôi sẽ làm một nền tảng AI toàn diện cho giáo dục vì thị trường giáo dục rất lớn và phụ huynh nào cũng muốn con học giỏi.\"\n\n| Nội dung review | Nhận xét |\n|---|---|\n| Vấn đề khách hàng có rõ không? |  |\n| Người trả tiền có rõ không? |  |\n| Giá trị cụ thể là gì? |  |\n| Có giả định nào chưa kiểm chứng? |  |\n| Rủi ro nếu triển khai ngay là gì? |  |\n| Cần thử nghiệm nhỏ nào trước? |  |\n\n## Tiêu chí đánh giá\n\n| Mức | Biểu hiện |\n|---|---|\n| Yếu | Chỉ mô tả sản phẩm, chưa mô tả vấn đề khách hàng |\n| Đạt | Xác định được khách hàng, vấn đề và giá trị cơ bản |\n| Tốt | Có bối cảnh, lựa chọn thay thế, người trả tiền và rủi ro chính |\n| Xuất sắc | Chỉ ra được cơ chế tạo giá trị, thu giá trị, chi phí, giả thuyết nguy hiểm và cách kiểm chứng |\n\n## Checklist tự review\n\n- Tôi có đang mô tả vấn đề thật hay chỉ mô tả sản phẩm?\n- Tôi có biết ai trả tiền không?\n- Tôi có biết khách hàng đang làm gì thay thế không?\n- Tôi có phân biệt được giá trị với tính năng không?\n- Tôi có thể kiểm chứng giả định quan trọng nhất trong 7 ngày không?\n\n## Hành động nhỏ trong 30-90 phút\n\nViết một đoạn 150-200 chữ mô tả quyền tồn tại của ý tưởng kinh doanh của bạn. Sau đó gạch chân mọi câu chưa có bằng chứng và chuyển chúng thành giả thuyết cần kiểm chứng.\n\n"},{"sourcePath":"Kinh doanh/02_khach_hang_mua_su_chuyen_doi.md","title":"Bài 2. Khách hàng không mua sản phẩm, họ mua sự chuyển đổi","category":"business","categoryLabel":"Kinh doanh","order":3,"sha256":"da71caa6f948fa431d71cd45f98a4e57626e3f77e689c3922657ef22b883a76d","lineCount":170,"headings":[{"level":1,"text":"Bài 2. Khách hàng không mua sản phẩm, họ mua sự chuyển đổi","id":"bai-2-khach-hang-khong-mua-san-pham-ho-mua-su-chuyen-đoi"},{"level":2,"text":"Mục tiêu học tập","id":"muc-tieu-hoc-tap"},{"level":2,"text":"Câu hỏi bản chất","id":"cau-hoi-ban-chat"},{"level":2,"text":"Tình huống mở bài","id":"tinh-huong-mo-bai"},{"level":2,"text":"Nguyên lý first principles","id":"nguyen-ly-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kien-thuc-nen-chi-tiet"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuat-ngu-can-hieu-sau"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tu-duy-truc-quan"},{"level":2,"text":"Ví dụ đời thường","id":"vi-du-đoi-thuong"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-cong-ty-moi"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-cong-ty-đa-co"},{"level":2,"text":"Lỗi người mới thường mắc","id":"loi-nguoi-moi-thuong-mac"},{"level":2,"text":"Bài tập ứng dụng","id":"bai-tap-ung-dung"},{"level":2,"text":"Bài tập review","id":"bai-tap-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tieu-chi-đanh-gia"},{"level":2,"text":"Checklist tự review","id":"checklist-tu-review"},{"level":2,"text":"Hành động nhỏ trong 30-90 phút","id":"hanh-đong-nho-trong-30-90-phut"}],"rawMarkdown":"# Bài 2. Khách hàng không mua sản phẩm, họ mua sự chuyển đổi\n\n## Mục tiêu học tập\n\nSau bài này, người học có thể:\n\n- Giải thích vì sao khách hàng mua kết quả, không mua tính năng.\n- Phân tích trạng thái trước và sau khi dùng sản phẩm.\n- Phân biệt người dùng, người trả tiền và người ảnh hưởng.\n- Viết customer problem brief cho một ý tưởng kinh doanh.\n\n## Câu hỏi bản chất\n\n> Khách hàng thật sự mua điều gì?\n\n## Tình huống mở bài\n\nMột phụ huynh có con lớp 3 thấy con làm toán chậm. Chị đã mua sách bài tập, cho con xem YouTube, tải app học toán và cân nhắc học thêm. Vấn đề là sau vài tuần, con vẫn học thất thường, chị không biết con yếu chỗ nào, và mỗi tối kèm con học trở thành một cuộc thương lượng mệt mỏi.\n\nNếu một startup nói \"app của chúng tôi có AI tạo bài tập\", phụ huynh có thể thấy hay. Nhưng nếu startup nói \"mỗi ngày chị biết con cần học đúng 10 phút phần nào và cuối tuần thấy con tiến bộ ra sao\", khả năng chạm đúng nỗi đau cao hơn.\n\n## Nguyên lý first principles\n\nKhách hàng không mua tính năng. Họ mua sự chuyển đổi từ trạng thái hiện tại sang trạng thái mong muốn.\n\n```text\nTrạng thái hiện tại\n-> Nỗi đau / bất tiện / lo lắng\n-> Giải pháp\n-> Trạng thái tốt hơn\n-> Giá trị cảm nhận\n-> Sẵn sàng trả tiền\n```\n\nMột sản phẩm có giá trị khi nó giúp khách hàng:\n\n- Đạt được điều họ muốn.\n- Tránh được điều họ sợ.\n- Tiết kiệm thời gian, tiền bạc hoặc công sức.\n- Giảm rủi ro và sự mơ hồ.\n- Cảm thấy yên tâm, tự tin hoặc được kiểm soát tốt hơn.\n\n## Kiến thức nền chi tiết\n\nNhu cầu khách hàng thường không nằm ngay trên bề mặt. Khi khách hàng nói \"tôi cần một app học toán\", điều họ thật sự cần có thể là con học đều hơn, cha mẹ bớt căng thẳng, kết quả kiểm tra tốt hơn, hoặc cảm giác mình không bỏ bê việc học của con. Nếu doanh nghiệp chỉ nghe câu chữ bề mặt, sản phẩm dễ trở thành một danh sách tính năng mà không giải quyết được động lực thật.\n\nSự chuyển đổi gồm hai đầu: trạng thái hiện tại và trạng thái mong muốn. Trạng thái hiện tại không chỉ là vấn đề lý trí, mà còn gồm cảm xúc, thói quen, rào cản, lựa chọn thay thế và nỗi sợ. Trạng thái mong muốn cũng không chỉ là kết quả cuối cùng, mà gồm cảm giác kiểm soát, sự tiện lợi, niềm tin và mức độ dễ duy trì.\n\nTrong nhiều thị trường, người dùng và người trả tiền không phải là một. Trẻ em dùng app học, phụ huynh trả tiền. Nhân viên dùng phần mềm, giám đốc hoặc phòng tài chính duyệt mua. Người già dùng thiết bị smart home, con cái có thể là người mua. Vì vậy sản phẩm phải tạo giá trị cho người dùng, nhưng thông điệp và mô hình bán hàng phải thuyết phục người trả tiền.\n\nCơ chế mua thường bắt đầu từ một khoảng cách: khách hàng đang ở trạng thái A nhưng muốn đến trạng thái B. Khoảng cách càng đau, càng thường xuyên, càng khó tự giải quyết, khách hàng càng có động lực tìm giải pháp. Nếu khoảng cách nhỏ hoặc chỉ là \"có thì tốt\", sản phẩm khó trở thành ưu tiên chi tiền.\n\nHiểu sự chuyển đổi giúp doanh nghiệp ra quyết định tốt hơn: chọn tính năng nào cần làm trước, viết thông điệp nào, định giá ra sao, chọn kênh nào và đo chỉ số gì. Nếu giá trị là \"phụ huynh yên tâm vì thấy tiến bộ\", chỉ số quan trọng không chỉ là số bài tập tạo ra, mà là tỷ lệ trẻ học đều, tỷ lệ phụ huynh mở báo cáo và mức độ phụ huynh tin kết quả.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Câu hỏi kiểm tra |\n|---|---|---|---|---|---|---|\n| Nỗi đau khách hàng | Vấn đề gây khó chịu, tổn thất hoặc lo lắng | Điều khiến khách muốn thay đổi | Nỗi đau tạo động lực mua | Phụ huynh không biết con yếu phần nào | \"Phụ huynh muốn con học giỏi\" quá chung | Vấn đề này có làm khách hành động không? |\n| Chuyển đổi | Sự thay đổi từ trước sang sau | Khách từ mệt, mơ hồ, tốn thời gian sang rõ ràng, yên tâm, hiệu quả hơn | Khách mua kết quả của thay đổi | Từ kèm con 60 phút căng thẳng sang 10 phút có lộ trình | Thêm chatbot nhưng thói quen học không đổi | Sau khi dùng, cuộc sống khách khác gì? |\n| Người dùng | Người trực tiếp dùng sản phẩm | Người thao tác hoặc nhận trải nghiệm hằng ngày | Ảnh hưởng retention và chất lượng sử dụng | Học sinh dùng app | Chỉ hỏi phụ huynh, bỏ qua việc trẻ có thích dùng không | Ai phải dùng đều để sản phẩm có giá trị? |\n| Người trả tiền | Người chi tiền hoặc duyệt mua | Người cần thấy giá trị đủ lớn để trả | Quyết định doanh thu | Phụ huynh mua thuê bao | Tối ưu game cho trẻ nhưng phụ huynh không thấy tiến bộ | Ai có quyền nói có hoặc không với khoản chi? |\n\n## Khung tư duy trực quan\n\n| Thành phần | Câu hỏi |\n|---|---|\n| Trước khi dùng | Khách đang đau, tốn, sợ hoặc bất tiện ở đâu? |\n| Lựa chọn thay thế | Khách đang xử lý bằng cách nào? |\n| Rào cản đổi mới | Vì sao họ chưa đổi sang giải pháp mới? |\n| Sau khi dùng | Điều gì tốt hơn, rõ hơn, nhanh hơn, rẻ hơn hoặc yên tâm hơn? |\n| Bằng chứng | Làm sao khách biết sự chuyển đổi đã xảy ra? |\n\n## Ví dụ đời thường\n\nKhách không mua một chiếc ổ khóa thông minh chỉ vì nó có vân tay, mật mã và app. Họ mua cảm giác không phải lo quên chìa, không cần chạy về mở cửa cho người thân, và biết cửa đã khóa hay chưa. Nếu ổ khóa nhiều tính năng nhưng hay lỗi, sự chuyển đổi từ \"lo lắng\" sang \"yên tâm\" không xảy ra.\n\n## Use case 1: Công ty mới\n\nVới app AI học tập, người dùng là học sinh, người trả tiền thường là phụ huynh, người ảnh hưởng có thể là giáo viên hoặc bạn bè trong nhóm phụ huynh. Startup cần hiểu từng người cần chuyển đổi gì.\n\n| Vai trò | Trạng thái hiện tại | Trạng thái mong muốn |\n|---|---|---|\n| Học sinh | Học dài, chán, không biết sai ở đâu | Học ngắn, vừa sức, thấy mình tiến bộ |\n| Phụ huynh | Lo lắng, không có thời gian, không biết kèm phần nào | Biết con yếu gì, có lộ trình, thấy báo cáo rõ |\n| Giáo viên/trung tâm | Khó cá nhân hóa cho từng trẻ | Có dữ liệu hỗ trợ dạy đúng điểm yếu |\n\nGiá trị cốt lõi không phải là \"AI tạo bài tập\", mà là \"giúp phụ huynh nhìn thấy và duy trì lộ trình tiến bộ của con\".\n\n## Use case 2: Công ty đã có\n\nVới loa thông minh, khách hàng không mua một chiếc loa để có thêm thiết bị. Họ mua sự tiện lợi khi điều khiển nhà bằng giọng nói, đặc biệt trong các tình huống app hoặc công tắc bất tiện.\n\nChuyển đổi có thể là:\n\n- Người già từ khó dùng app sang nói lệnh đơn giản.\n- Trẻ em từ không với tới công tắc sang nói bật đèn ngủ.\n- Chủ nhà từ mở nhiều màn hình điều khiển sang nói một câu cho cả kịch bản.\n- Đại lý từ demo từng thiết bị rời rạc sang demo một trải nghiệm sống thông minh.\n\nNếu wakeword chậm, nhận lệnh sai hoặc phản hồi không nhất quán, khách không nhận được sự chuyển đổi mà chỉ nhận thêm phiền phức.\n\n## Lỗi người mới thường mắc\n\n- Viết tính năng thay cho giá trị.\n- Hỏi khách hàng \"có thích không\" thay vì hỏi họ đang làm gì và đã trả tiền cho gì.\n- Nhầm mong muốn chung với nỗi đau đủ mạnh.\n- Chỉ tối ưu cho người dùng nhưng bỏ qua người trả tiền.\n- Không xác định bằng chứng nào chứng minh khách đã nhận được giá trị.\n\n## Bài tập ứng dụng\n\nLập bảng Before - After:\n\n| Thành phần | Trước khi dùng sản phẩm | Sau khi dùng sản phẩm | Bằng chứng cần thấy |\n|---|---|---|---|\n| Cảm xúc |  |  |  |\n| Thời gian |  |  |  |\n| Chi phí |  |  |  |\n| Rủi ro |  |  |  |\n| Sự tiện lợi |  |  |  |\n| Kết quả đạt được |  |  |  |\n\nViết customer problem brief:\n\n| Mục | Nội dung |\n|---|---|\n| Khách hàng mục tiêu |  |\n| Bối cảnh xảy ra vấn đề |  |\n| Nỗi đau chính |  |\n| Lựa chọn thay thế hiện tại |  |\n| Vì sao cách hiện tại chưa đủ tốt |  |\n| Chuyển đổi mong muốn |  |\n| Bằng chứng khách nhận giá trị |  |\n\n## Bài tập review\n\nReview câu sau:\n\n> \"Sản phẩm của chúng tôi có AI, dashboard, game hóa, video bài giảng và chatbot nên chắc chắn phụ huynh sẽ thích.\"\n\n| Nội dung review | Nhận xét |\n|---|---|\n| Câu này nói về tính năng hay chuyển đổi? |  |\n| Người trả tiền thấy giá trị gì? |  |\n| Người dùng có động lực dùng đều không? |  |\n| Bằng chứng tiến bộ là gì? |  |\n| Cần viết lại thông điệp thế nào? |  |\n\n## Tiêu chí đánh giá\n\n| Mức | Biểu hiện |\n|---|---|\n| Yếu | Chỉ liệt kê tính năng, không có trạng thái trước-sau |\n| Đạt | Mô tả được nỗi đau, người dùng, người trả tiền và chuyển đổi cơ bản |\n| Tốt | Có bối cảnh, lựa chọn thay thế, rào cản và bằng chứng giá trị |\n| Xuất sắc | Chỉ ra được động lực sâu, trade-off giữa các vai trò và thử nghiệm đo hành vi thật |\n\n## Checklist tự review\n\n- Tôi có biết khách hàng đang làm gì thay thế không?\n- Tôi có phân biệt người dùng và người trả tiền không?\n- Tôi có mô tả được trạng thái sau khi dùng sản phẩm không?\n- Tôi có biết bằng chứng nào khiến khách tin sản phẩm có giá trị không?\n- Tôi có biết vấn đề này là must-have hay nice-to-have không?\n\n## Hành động nhỏ trong 30-90 phút\n\nPhỏng vấn 1 khách hàng tiềm năng. Không giới thiệu sản phẩm trước. Chỉ hỏi họ đang gặp vấn đề gì, đã thử cách nào, tốn bao nhiêu thời gian hoặc tiền, và điều gì khiến họ quyết định đổi sang giải pháp mới.\n\n"},{"sourcePath":"Kinh doanh/03_thi_truong_la_gi.md","title":"Bài 3. Thị trường là gì?","category":"business","categoryLabel":"Kinh doanh","order":4,"sha256":"26332967a265a1b9cea431bc1da509e1d10e38c6a99f57370e5ebe308f76518d","lineCount":146,"headings":[{"level":1,"text":"Bài 3. Thị trường là gì?","id":"bai-3-thi-truong-la-gi"},{"level":2,"text":"Mục tiêu học tập","id":"muc-tieu-hoc-tap"},{"level":2,"text":"Câu hỏi bản chất","id":"cau-hoi-ban-chat"},{"level":2,"text":"Tình huống mở bài","id":"tinh-huong-mo-bai"},{"level":2,"text":"Nguyên lý first principles","id":"nguyen-ly-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kien-thuc-nen-chi-tiet"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuat-ngu-can-hieu-sau"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tu-duy-truc-quan"},{"level":2,"text":"Ví dụ đời thường","id":"vi-du-đoi-thuong"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-cong-ty-moi"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-cong-ty-đa-co"},{"level":2,"text":"Lỗi người mới thường mắc","id":"loi-nguoi-moi-thuong-mac"},{"level":2,"text":"Bài tập ứng dụng","id":"bai-tap-ung-dung"},{"level":2,"text":"Bài tập review","id":"bai-tap-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tieu-chi-đanh-gia"},{"level":2,"text":"Checklist tự review","id":"checklist-tu-review"},{"level":2,"text":"Hành động nhỏ trong 30-90 phút","id":"hanh-đong-nho-trong-30-90-phut"}],"rawMarkdown":"# Bài 3. Thị trường là gì?\n\n## Mục tiêu học tập\n\nSau bài này, người học có thể:\n\n- Giải thích vì sao thị trường không chỉ là số lượng người.\n- Chọn thị trường ban đầu theo vấn đề, khả năng chi trả, kênh tiếp cận và lợi nhuận.\n- Phân biệt thị trường tổng thể với phân khúc có thể bắt đầu.\n- Nhìn thấy đối thủ trực tiếp, đối thủ gián tiếp và hành vi thay thế.\n\n## Câu hỏi bản chất\n\n> Một thị trường hấp dẫn cần có những điều kiện nào?\n\n## Tình huống mở bài\n\nStartup AI giáo dục nói rằng thị trường của họ là \"toàn bộ học sinh tiểu học Việt Nam\". Con số nghe rất lớn. Nhưng khi bắt đầu bán, họ không biết nên nói với phụ huynh lớp mấy, môn nào, mức học nào, ở thành phố nào, qua kênh nào, giá bao nhiêu và vì sao phụ huynh phải mua ngay.\n\nThị trường rộng làm kế hoạch đẹp hơn, nhưng không giúp tìm khách hàng đầu tiên.\n\n## Nguyên lý first principles\n\nThị trường tốt không chỉ có nhiều người. Thị trường cần có 5 điều kiện:\n\n1. Có nhóm khách hàng rõ ràng.\n2. Có vấn đề đủ quan trọng.\n3. Có khả năng và ý chí chi trả.\n4. Có cách tiếp cận khách hàng với chi phí hợp lý.\n5. Có cơ hội tạo lợi nhuận sau khi trừ chi phí phục vụ.\n\nNếu có nhiều người nhưng không trả tiền, đó chưa chắc là thị trường. Nếu khách hàng có tiền nhưng rất khó tiếp cận, chi phí bán hàng có thể phá hỏng mô hình. Nếu nhu cầu có thật nhưng biên lợi nhuận quá thấp, doanh nghiệp dễ bị mắc kẹt.\n\n## Kiến thức nền chi tiết\n\nThị trường là tập hợp những khách hàng có cùng một vấn đề hoặc mong muốn, có lựa chọn thay thế, có khả năng ra quyết định và có thể được phục vụ bằng một mô hình kinh doanh nhất định. Một thị trường không tồn tại chỉ vì doanh nghiệp đặt tên cho nó. Nó tồn tại khi khách hàng thật sự có hành vi: tìm kiếm, so sánh, hỏi người quen, tải app, mua thử, trả tiền, đổi nhà cung cấp hoặc chịu chi phí để giải quyết vấn đề.\n\nNgười mới thường nhìn thị trường theo danh mục sản phẩm: thị trường giáo dục, thị trường smart home, thị trường phần mềm quản trị. Cách nhìn này hữu ích ở mức tổng quan nhưng quá rộng để hành động. Khi bắt đầu, doanh nghiệp cần nhìn theo phân khúc có vấn đề cụ thể: phụ huynh có con lớp 3 mất gốc toán ở thành phố lớn; gia đình đã lắp nhiều thiết bị smart home nhưng người già không dùng app được; chủ doanh nghiệp nhỏ đang quản lý kho bằng Excel và thường thất thoát hàng.\n\nPhân khúc ban đầu nên đủ hẹp để hiểu sâu, nhưng đủ thật để có cơ hội mở rộng. Đây thường gọi là beachhead market: thị trường bãi đáp đầu tiên. Mục tiêu không phải chiếm toàn bộ thị trường ngay, mà thắng một nhóm nhỏ đủ rõ để tạo bằng chứng, học nhanh và mở rộng có logic.\n\nĐối thủ cũng cần hiểu rộng hơn. Đối thủ trực tiếp là sản phẩm giống mình. Đối thủ gián tiếp là giải pháp khác cùng giải quyết vấn đề. Hành vi thay thế là cách khách đang làm dù không gọi là sản phẩm. Với app học AI, đối thủ không chỉ là app học khác, mà còn là học thêm, sách bài tập, YouTube, gia sư, phụ huynh tự kèm, hoặc không làm gì cả.\n\nMột thị trường hấp dẫn nhưng không phù hợp năng lực hiện tại vẫn có thể là lựa chọn sai. Startup nhỏ nên ưu tiên thị trường dễ học, dễ tiếp cận, có phản hồi nhanh. Công ty đã có nên xem xét thị trường mới có tận dụng được thương hiệu, kênh bán, dữ liệu và năng lực vận hành hiện tại không.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Câu hỏi kiểm tra |\n|---|---|---|---|---|---|---|\n| Thị trường | Nhóm khách có vấn đề và khả năng mua | Nơi có người thật cần giải pháp và có thể trả tiền | Giao điểm giữa nhu cầu, chi trả, tiếp cận và lợi nhuận | Phụ huynh lớp 3 có con mất gốc toán | \"Tất cả học sinh tiểu học\" | Có thể gọi tên 20 khách đầu tiên không? |\n| Phân khúc | Nhóm nhỏ trong thị trường có đặc điểm và vấn đề giống nhau | Một nhóm khách đủ giống để phục vụ bằng cùng thông điệp và sản phẩm | Giúp doanh nghiệp tập trung | Gia đình smart home có người già | Người từ 18-60 tuổi | Nhóm này có đau giống nhau không? |\n| Beachhead market | Thị trường bãi đáp đầu tiên | Nhóm nhỏ nên thắng trước | Tạo bằng chứng trước khi mở rộng | Phụ huynh bận rộn có con lớp 3 yếu toán | Ra mắt cho mọi lớp, mọi môn | Nếu thắng nhóm này, mở rộng sang đâu? |\n| Hành vi thay thế | Cách khách đang giải quyết vấn đề | Đối thủ thật trong đời sống | Khách phải bỏ thói quen cũ để dùng mình | Học thêm, YouTube, sách bài tập | Chỉ xem app khác là đối thủ | Khách đang làm gì nếu không có mình? |\n\n## Khung tư duy trực quan\n\n```text\nThị trường hấp dẫn =\nKhách rõ\n+ Vấn đề đau\n+ Có tiền\n+ Tiếp cận được\n+ Phục vụ có lời\n+ Có đường mở rộng\n```\n\n## Ví dụ đời thường\n\nMột người bán cà phê không nên nói thị trường là \"tất cả người uống cà phê\". Người đi làm cần cà phê nhanh buổi sáng khác người tìm quán ngồi làm việc, khác người mua cà phê đặc sản, khác người đặt cà phê văn phòng. Mỗi nhóm có lý do mua, mức giá, địa điểm và kỳ vọng khác nhau.\n\n## Use case 1: Công ty mới\n\nStartup AI giáo dục không nên bắt đầu bằng toàn bộ học sinh tiểu học. Một lựa chọn tốt hơn là chọn nhóm phụ huynh có con lớp 3 học toán yếu, sống ở thành phố, có thói quen trả tiền cho học thêm hoặc app giáo dục, và sẵn sàng thử phương pháp mới trong 14 ngày.\n\nNhóm này đủ hẹp để phỏng vấn, đủ đau vì toán lớp 3 là giai đoạn nền tảng, và đủ dễ thiết kế MVP. Sau khi có bằng chứng học đều và phụ huynh trả tiền, startup có thể mở rộng sang lớp khác, môn khác hoặc kênh trung tâm.\n\n## Use case 2: Công ty đã có\n\nCông ty smart home có thể bắt đầu với khách hàng hiện hữu đã lắp nhiều thiết bị, đặc biệt là gia đình cao cấp có người già, trẻ em hoặc nhu cầu điều khiển nhiều kịch bản. Đây là thị trường đầu tiên tốt hơn so với bán đại trà vì công ty đã có dữ liệu khách hàng, đại lý lắp đặt và khả năng hỗ trợ.\n\nNếu nhóm đầu tiên hài lòng, công ty có bằng chứng để mở rộng sang căn hộ mẫu, biệt thự, khách sạn, showroom hoặc gói smart home cao cấp.\n\n## Lỗi người mới thường mắc\n\n- Lấy quy mô thị trường lớn để thay thế hiểu biết về khách hàng.\n- Chọn phân khúc theo nhân khẩu học nhưng không theo vấn đề.\n- Bỏ qua khả năng tiếp cận và chi phí bán hàng.\n- Chỉ nhìn đối thủ giống sản phẩm của mình.\n- Cố phục vụ quá nhiều nhóm ngay từ đầu.\n- Không có tiêu chí rõ để chọn thị trường ban đầu.\n\n## Bài tập ứng dụng\n\nLập bảng phân khúc thị trường:\n\n| Phân khúc | Vấn đề chính | Khả năng chi trả | Dễ tiếp cận | Mức độ cạnh tranh | Bằng chứng hiện có | Ưu tiên |\n|---|---|---|---|---|---|---|\n|  |  |  |  |  |  |  |\n|  |  |  |  |  |  |  |\n|  |  |  |  |  |  |  |\n\nChọn một phân khúc đầu tiên và viết:\n\n| Câu hỏi | Trả lời |\n|---|---|\n| Vì sao chọn nhóm này trước? |  |\n| Nhóm này đau ở đâu? |  |\n| Có thể tiếp cận qua kênh nào? |  |\n| Chỉ số nào chứng minh nhóm này có tiềm năng? |  |\n| Nếu thắng nhóm này, mở rộng sang nhóm nào tiếp theo? |  |\n\n## Bài tập review\n\nReview câu sau:\n\n> \"Thị trường giáo dục rất lớn, chỉ cần chiếm 1% là đủ lớn.\"\n\n| Nội dung review | Nhận xét |\n|---|---|\n| Khách hàng cụ thể là ai? |  |\n| Vấn đề cụ thể là gì? |  |\n| 1% đó đến từ kênh nào? |  |\n| Chi phí để có khách là bao nhiêu? |  |\n| Có phân khúc bắt đầu chưa? |  |\n\n## Tiêu chí đánh giá\n\n| Mức | Biểu hiện |\n|---|---|\n| Yếu | Chỉ nêu thị trường rộng, không có phân khúc cụ thể |\n| Đạt | Xác định được một số phân khúc và vấn đề chính |\n| Tốt | So sánh phân khúc theo đau, chi trả, tiếp cận, cạnh tranh và mở rộng |\n| Xuất sắc | Chọn được beachhead market có logic, bằng chứng, rủi ro và kế hoạch kiểm chứng |\n\n## Checklist tự review\n\n- Tôi có gọi tên được nhóm khách hàng đầu tiên không?\n- Tôi có biết họ đang dùng giải pháp thay thế nào không?\n- Tôi có biết tiếp cận họ qua đâu không?\n- Tôi có biết họ có khả năng trả tiền không?\n- Tôi có biết vì sao không chọn các phân khúc khác trước không?\n\n## Hành động nhỏ trong 30-90 phút\n\nLiệt kê 5 phân khúc có thể phục vụ. Chọn 1 phân khúc ưu tiên và viết danh sách 20 khách hàng thật hoặc nơi có thể tìm thấy họ trong 7 ngày tới.\n\n"},{"sourcePath":"Kinh doanh/04_san_pham_va_gia_tri.md","title":"Bài 4. Sản phẩm tốt là gì?","category":"business","categoryLabel":"Kinh doanh","order":5,"sha256":"446d9c3248ba2c8247966ef3886b43e1faf01d3d27f4a0a40103803e0c0f2af0","lineCount":163,"headings":[{"level":1,"text":"Bài 4. Sản phẩm tốt là gì?","id":"bai-4-san-pham-tot-la-gi"},{"level":2,"text":"Mục tiêu học tập","id":"muc-tieu-hoc-tap"},{"level":2,"text":"Câu hỏi bản chất","id":"cau-hoi-ban-chat"},{"level":2,"text":"Tình huống mở bài","id":"tinh-huong-mo-bai"},{"level":2,"text":"Nguyên lý first principles","id":"nguyen-ly-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kien-thuc-nen-chi-tiet"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuat-ngu-can-hieu-sau"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tu-duy-truc-quan"},{"level":2,"text":"Ví dụ đời thường","id":"vi-du-đoi-thuong"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-cong-ty-moi"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-cong-ty-đa-co"},{"level":2,"text":"Lỗi người mới thường mắc","id":"loi-nguoi-moi-thuong-mac"},{"level":2,"text":"Bài tập ứng dụng","id":"bai-tap-ung-dung"},{"level":2,"text":"Bài tập review","id":"bai-tap-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tieu-chi-đanh-gia"},{"level":2,"text":"Checklist tự review","id":"checklist-tu-review"},{"level":2,"text":"Hành động nhỏ trong 30-90 phút","id":"hanh-đong-nho-trong-30-90-phut"}],"rawMarkdown":"# Bài 4. Sản phẩm tốt là gì?\n\n## Mục tiêu học tập\n\nSau bài này, người học có thể:\n\n- Phân biệt sản phẩm nhiều tính năng với sản phẩm tạo giá trị.\n- Giải thích MVP là công cụ kiểm chứng giả thuyết, không phải bản nháp cẩu thả.\n- Xác định tính năng cốt lõi, tính năng phụ và tính năng rủi ro.\n- Viết value proposition canvas rút gọn.\n\n## Câu hỏi bản chất\n\n> Sản phẩm tốt là sản phẩm nhiều tính năng hay sản phẩm tạo ra kết quả tốt cho khách hàng?\n\n## Tình huống mở bài\n\nStartup AI giáo dục muốn làm bài tập tự động, chatbot hỏi đáp, video bài giảng, game hóa, bảng xếp hạng, báo cáo phụ huynh và cộng đồng học tập. Mỗi tính năng đều nghe hợp lý. Nhưng đội ngũ chỉ có 4 người và chưa biết phụ huynh trả tiền vì điều gì.\n\nNếu làm tất cả, sản phẩm ra chậm và khó biết tính năng nào tạo giá trị. Nếu làm quá ít, có thể không đủ thuyết phục. Vấn đề không phải là làm nhiều hay ít, mà là làm đúng giả thuyết quan trọng nhất.\n\n## Nguyên lý first principles\n\nSản phẩm tốt là sản phẩm giải quyết đúng vấn đề, trong đúng bối cảnh, với trải nghiệm đủ đơn giản, đủ tin cậy và đủ giá trị để khách hàng tiếp tục sử dụng.\n\n```text\nSản phẩm tốt =\nVấn đề đúng\n+ Giải pháp đúng\n+ Trải nghiệm đúng\n+ Niềm tin đúng\n+ Giá trị vượt chi phí\n```\n\nMột tính năng chỉ đáng làm khi nó góp phần tạo giá trị, giảm rủi ro hoặc tạo bằng chứng cho quyết định kinh doanh.\n\n## Kiến thức nền chi tiết\n\nSản phẩm là phương tiện, không phải mục đích. Mục đích là giúp khách hàng đạt được sự chuyển đổi đã học ở bài trước. Vì vậy, đánh giá sản phẩm phải bắt đầu từ kết quả khách hàng cần, không bắt đầu từ danh sách tính năng doanh nghiệp muốn xây.\n\nSản phẩm tốt có nhiều lớp. Lớp chức năng trả lời \"nó làm được gì\". Lớp trải nghiệm trả lời \"khách dùng có dễ không\". Lớp niềm tin trả lời \"khách có dám phụ thuộc vào nó không\". Lớp kinh tế trả lời \"giá trị khách nhận được có lớn hơn tiền, thời gian, công sức và rủi ro họ bỏ ra không\".\n\nMVP là minimum viable product, có thể hiểu là phiên bản nhỏ nhất đủ để kiểm chứng một giả thuyết quan trọng. MVP không phải sản phẩm tệ, thiếu trách nhiệm hoặc làm cho có. Một MVP tốt phải đủ rõ giá trị cốt lõi, đủ an toàn để khách dùng trong phạm vi thử nghiệm, và đủ đo lường để doanh nghiệp học được điều cần học.\n\nKhi thiết kế sản phẩm, cần phân loại tính năng. Tính năng cốt lõi là lý do khách mua hoặc dùng đều. Tính năng hỗ trợ giúp trải nghiệm mượt hơn nhưng không phải lý do mua chính. Tính năng trình diễn giúp demo đẹp nhưng có thể chưa cần bán. Tính năng rủi ro cao nếu lỗi sẽ làm hỏng niềm tin hoặc tạo chi phí hỗ trợ lớn.\n\nVới công ty mới, sản phẩm nên tập trung vào học nhanh. Với công ty đã có, sản phẩm còn phải bảo vệ thương hiệu và hệ thống vận hành hiện tại. Cùng là MVP, nhưng MVP của startup cho nhóm 30 khách thử nghiệm khác với phiên bản launch dưới thương hiệu đã có hàng chục nghìn khách hàng.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Câu hỏi kiểm tra |\n|---|---|---|---|---|---|---|\n| MVP | Phiên bản nhỏ nhất đủ kiểm chứng giả thuyết | Làm ít nhưng đúng điều cần học | Công cụ học thị trường | Bài kiểm tra đầu vào, lộ trình 7 ngày, báo cáo phụ huynh | App nhiều module nhưng không đo retention | MVP kiểm chứng giả thuyết nào? |\n| Value proposition | Lời hứa giá trị | Vì sao khách nên dùng mình thay vì cách cũ | Kết nối vấn đề, giải pháp, kết quả và khác biệt | \"Biết con yếu gì và học gì mỗi ngày\" | \"Nền tảng AI toàn diện\" | Khách hiểu giá trị trong 5 giây không? |\n| Tính năng cốt lõi | Tính năng tạo lý do mua hoặc dùng | Nếu bỏ đi, sản phẩm mất giá trị chính | Nơi giá trị được tạo ra | Báo cáo tiến bộ dễ hiểu cho phụ huynh | Bảng xếp hạng đẹp nhưng phụ huynh không cần | Nếu bỏ tính năng này, khách còn mua không? |\n| Niềm tin sản phẩm | Mức độ khách dám dựa vào sản phẩm | Khách có tin sản phẩm làm đúng việc quan trọng không | Điều kiện để dùng lâu dài | Loa nhận lệnh bật đèn chính xác | Chatbot trả lời hay nhưng điều khiển nhà sai | Tính năng nào lỗi sẽ làm khách mất niềm tin? |\n\n## Khung tư duy trực quan\n\n| Lớp sản phẩm | Câu hỏi kiểm tra |\n|---|---|\n| Vấn đề | Có đúng nỗi đau ưu tiên không? |\n| Giải pháp | Có giải quyết trực tiếp nỗi đau không? |\n| Trải nghiệm | Khách có dùng được trong bối cảnh thật không? |\n| Niềm tin | Khách có tin kết quả không? |\n| Kinh tế | Giá trị có vượt chi phí không? |\n\n## Ví dụ đời thường\n\nMột chiếc bình giữ nhiệt tốt không phải là chiếc bình có nhiều phụ kiện nhất. Nó tốt khi giữ nước nóng đủ lâu, không rò rỉ, dễ mang, dễ rửa và dùng mỗi ngày không phiền. Tính năng đo nhiệt độ trên nắp có thể hay, nhưng nếu bình rò nước trong balo, giá trị cốt lõi bị phá hỏng.\n\n## Use case 1: Công ty mới\n\nGiả thuyết quan trọng nhất của startup AI giáo dục có thể là:\n\n> Phụ huynh sẵn sàng cho con học 10 phút mỗi ngày nếu hệ thống chỉ rõ con đang yếu gì và tiến bộ ra sao.\n\nMVP nên tập trung vào:\n\n- Bài kiểm tra đầu vào ngắn.\n- Lộ trình học 7 ngày.\n- Bài tập mỗi ngày vừa sức.\n- Báo cáo tiến bộ cho phụ huynh.\n- Phỏng vấn sau ngày 3, 7 và 14.\n\nCác tính năng như chatbot, video, bảng xếp hạng hoặc cộng đồng có thể để sau nếu chưa liên quan trực tiếp đến giả thuyết cốt lõi.\n\n## Use case 2: Công ty đã có\n\nVới loa thông minh, công ty cần phân loại:\n\n| Nhóm | Ví dụ | Quyết định |\n|---|---|---|\n| Sell-ready | Bật/tắt đèn, điều khiển kịch bản nhà thông minh trong phạm vi đã kiểm thử | Có thể bán có kiểm soát |\n| Demo-ready | Hỏi thời tiết, kể chuyện, trả lời kiến thức đơn giản | Dùng trong demo, không hứa quá mức |\n| Internal-only | Hội thoại phức tạp, cá nhân hóa sâu, tích hợp chưa ổn định | Chưa truyền thông bán hàng |\n\nSản phẩm mới phải đủ tốt ở phần khách hàng mua vì nó. Nếu tính năng điều khiển nhà chưa ổn, các tính năng giải trí không cứu được niềm tin.\n\n## Lỗi người mới thường mắc\n\n- Xem MVP là bản thiếu tính năng thay vì công cụ kiểm chứng.\n- Làm nhiều tính năng để tránh phải chọn.\n- Đánh giá sản phẩm bằng nỗ lực kỹ thuật thay vì giá trị khách nhận.\n- Không phân loại rủi ro tính năng.\n- Launch sản phẩm chưa đủ ổn dưới thương hiệu đã có.\n- Không đo hành vi sử dụng thật.\n\n## Bài tập ứng dụng\n\nLập bảng phân loại tính năng:\n\n| Tính năng | Vấn đề giải quyết | Mức độ quan trọng | Rủi ro nếu lỗi | Trạng thái | Quyết định |\n|---|---|---|---|---|---|\n|  |  |  |  | Sell-ready / Demo-ready / Internal-only |  |\n\nValue proposition canvas rút gọn:\n\n| Thành phần | Nội dung |\n|---|---|\n| Khách hàng mục tiêu |  |\n| Việc khách cần làm |  |\n| Nỗi đau chính |  |\n| Kết quả mong muốn |  |\n| Giải pháp cốt lõi |  |\n| Bằng chứng giá trị |  |\n| Lý do chọn mình thay vì cách cũ |  |\n\n## Bài tập review\n\nReview kế hoạch sau:\n\n> \"MVP của chúng tôi sẽ có đủ chatbot, video, game hóa, báo cáo, bảng xếp hạng và cộng đồng để khách thấy sản phẩm hoàn chỉnh.\"\n\n| Nội dung review | Nhận xét |\n|---|---|\n| Giả thuyết cần kiểm chứng là gì? |  |\n| Tính năng nào là cốt lõi? |  |\n| Tính năng nào có thể làm sau? |  |\n| Rủi ro nếu xây quá nhiều là gì? |  |\n| MVP nên rút gọn thế nào? |  |\n\n## Tiêu chí đánh giá\n\n| Mức | Biểu hiện |\n|---|---|\n| Yếu | Liệt kê tính năng, không liên hệ vấn đề và giá trị |\n| Đạt | Xác định được tính năng cốt lõi và MVP cơ bản |\n| Tốt | Có giả thuyết, trạng thái tính năng, rủi ro và chỉ số đo |\n| Xuất sắc | Thiết kế MVP rõ mục tiêu học, bảo vệ niềm tin khách hàng và có tiêu chí quyết định tiếp theo |\n\n## Checklist tự review\n\n- Tính năng này có làm khách hàng mua hoặc dùng đều không?\n- Nếu bỏ tính năng này, giá trị cốt lõi có mất không?\n- Nếu tính năng này lỗi, hậu quả là gì?\n- MVP đang kiểm chứng giả thuyết nào?\n- Khách hàng biết sản phẩm tạo giá trị bằng bằng chứng nào?\n\n## Hành động nhỏ trong 30-90 phút\n\nChọn 10 tính năng bạn muốn làm. Bắt buộc phân loại thành 3 nhóm: phải có để kiểm chứng, có thể demo nhưng chưa bán, và để sau. Viết lý do cho từng quyết định.\n\n"},{"sourcePath":"Kinh doanh/05_mo_hinh_kinh_doanh.md","title":"Bài 5. Doanh nghiệp kiếm tiền bằng cách nào?","category":"business","categoryLabel":"Kinh doanh","order":6,"sha256":"57281c3bd7322a1de61d209e6c2c425894a6a2c5f0de2348b7edefc3b1f9b872","lineCount":162,"headings":[{"level":1,"text":"Bài 5. Doanh nghiệp kiếm tiền bằng cách nào?","id":"bai-5-doanh-nghiep-kiem-tien-bang-cach-nao"},{"level":2,"text":"Mục tiêu học tập","id":"muc-tieu-hoc-tap"},{"level":2,"text":"Câu hỏi bản chất","id":"cau-hoi-ban-chat"},{"level":2,"text":"Tình huống mở bài","id":"tinh-huong-mo-bai"},{"level":2,"text":"Nguyên lý first principles","id":"nguyen-ly-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kien-thuc-nen-chi-tiet"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuat-ngu-can-hieu-sau"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tu-duy-truc-quan"},{"level":2,"text":"Ví dụ đời thường","id":"vi-du-đoi-thuong"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-cong-ty-moi"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-cong-ty-đa-co"},{"level":2,"text":"Lỗi người mới thường mắc","id":"loi-nguoi-moi-thuong-mac"},{"level":2,"text":"Bài tập ứng dụng","id":"bai-tap-ung-dung"},{"level":2,"text":"Bài tập review","id":"bai-tap-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tieu-chi-đanh-gia"},{"level":2,"text":"Checklist tự review","id":"checklist-tu-review"},{"level":2,"text":"Hành động nhỏ trong 30-90 phút","id":"hanh-đong-nho-trong-30-90-phut"}],"rawMarkdown":"# Bài 5. Doanh nghiệp kiếm tiền bằng cách nào?\n\n## Mục tiêu học tập\n\nSau bài này, người học có thể:\n\n- Giải thích mô hình kinh doanh bằng cách tạo, giao và thu giá trị.\n- So sánh B2C, B2B, B2B2C, bán một lần, thuê bao và bán kèm gói.\n- Nhìn được mối liên hệ giữa doanh thu, chi phí, kênh bán và lợi nhuận.\n- Lập bảng mô hình doanh thu và chi phí sơ bộ.\n\n## Câu hỏi bản chất\n\n> Giá trị được tạo ra ở đâu và doanh nghiệp thu lại giá trị bằng cách nào?\n\n## Tình huống mở bài\n\nStartup AI giáo dục định bán gói 99.000 đồng mỗi tháng cho phụ huynh. Nhưng để có một phụ huynh trả tiền, họ có thể phải chạy quảng cáo, tư vấn, hỗ trợ onboarding và nhắc trẻ học. Nếu phụ huynh hủy sau 2 tháng, doanh thu chỉ là 198.000 đồng. Nếu chi phí để có khách cao hơn số đó, sản phẩm có người mua vẫn chưa chắc là doanh nghiệp tốt.\n\n## Nguyên lý first principles\n\nMột mô hình kinh doanh tốt cần trả lời:\n\n1. Bán cho ai?\n2. Bán cái gì?\n3. Bán qua kênh nào?\n4. Thu tiền một lần hay định kỳ?\n5. Chi phí tạo ra và giao giá trị là bao nhiêu?\n6. Lợi nhuận còn lại là bao nhiêu?\n7. Mô hình có mở rộng được không?\n\nMô hình kinh doanh không chỉ là \"cách kiếm tiền\". Nó là logic kinh tế của toàn bộ doanh nghiệp.\n\n## Kiến thức nền chi tiết\n\nMột doanh nghiệp tạo giá trị cho khách hàng nhưng không thu lại đủ giá trị sẽ khó sống lâu. Ngược lại, một doanh nghiệp thu tiền tốt nhưng không tạo đủ giá trị sẽ mất niềm tin, mất retention và bị cạnh tranh. Mô hình kinh doanh tốt phải cân bằng cả hai: khách hàng thấy đáng trả tiền, doanh nghiệp có đủ lợi nhuận và dòng tiền để tiếp tục phục vụ.\n\nDoanh thu có thể đến từ nhiều cách: bán một lần, thuê bao định kỳ, phí sử dụng, hoa hồng, dịch vụ triển khai, bảo trì, bán kèm gói, cấp phép, hoặc chia sẻ doanh thu với đối tác. Mỗi cách thu tiền tạo ra hành vi khác nhau. Bán một lần giúp thu tiền nhanh nhưng có thể không bù được chi phí vận hành dài hạn. Thuê bao tạo doanh thu lặp lại nhưng đòi hỏi khách hàng nhận giá trị liên tục. Bán cho doanh nghiệp có hợp đồng lớn hơn nhưng chu kỳ bán hàng dài và cần hỗ trợ nhiều hơn.\n\nKênh bán ảnh hưởng mạnh đến mô hình. Bán trực tiếp cho phụ huynh qua online khác bán qua trường học hoặc trung tâm giáo dục. Bán thiết bị smart home qua đại lý khác bán trực tiếp qua website. Kênh nào cũng có chi phí: quảng cáo, hoa hồng, lương sales, chiết khấu, đào tạo, hỗ trợ, bảo hành và xử lý khiếu nại.\n\nCấu trúc chi phí quyết định mô hình có mở rộng được không. Chi phí cố định là khoản phải trả dù bán ít hay nhiều, như lương đội ngũ, văn phòng, R&D. Chi phí biến đổi tăng theo số khách, như cloud AI, thiết bị, vận chuyển, hoa hồng, hỗ trợ. Nếu mỗi khách mới tạo thêm chi phí cao hơn doanh thu, tăng trưởng làm doanh nghiệp yếu đi.\n\nMô hình kinh doanh nên được chọn theo hành vi khách hàng và cơ chế giá trị, không theo xu hướng. Nếu giá trị được tạo liên tục mỗi tháng, thuê bao có thể hợp lý. Nếu giá trị nằm ở thiết bị vật lý và ít chi phí sau bán, bán một lần có thể hợp lý. Nếu sản phẩm cần triển khai và hỗ trợ sâu, mô hình dịch vụ hoặc B2B có thể phù hợp hơn.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Câu hỏi kiểm tra |\n|---|---|---|---|---|---|---|\n| B2C | Bán trực tiếp cho người tiêu dùng | Bán cho cá nhân hoặc hộ gia đình | Phản hồi nhanh, quy mô lớn, nhưng acquisition khó | App học bán cho phụ huynh | Tưởng tải app miễn phí là có doanh nghiệp | Người mua cá nhân có trả đều không? |\n| B2B | Bán cho doanh nghiệp/tổ chức | Bán qua hợp đồng, ngân sách, quy trình duyệt | Doanh thu lớn hơn nhưng chu kỳ dài | Bán nền tảng học cho trường | Nghĩ trường sẽ mua nhanh như cá nhân | Ai duyệt, ai dùng, ai trả? |\n| B2B2C | Bán qua đối tác đến người tiêu dùng | Tận dụng kênh của người khác | Có kênh sẵn nhưng phụ thuộc đối tác | Hợp tác trung tâm giáo dục | Không tính chia sẻ doanh thu | Đối tác có động lực bán không? |\n| Thuê bao | Thu tiền định kỳ | Khách trả mỗi tháng/năm để nhận giá trị liên tục | Đòi hỏi retention và giá trị lặp lại | Gói học 199.000đ/tháng | Thuê bao nhưng khách chỉ dùng 1 lần | Khách có lý do trả tháng sau không? |\n| Biên lợi nhuận | Phần còn lại sau chi phí trực tiếp | Bán xong còn bao nhiêu để nuôi doanh nghiệp | Cho biết mô hình có thở được không | Bán 1 triệu, giá vốn 600.000đ, còn 400.000đ | Chỉ nhìn doanh thu | Sau mỗi đơn hàng còn lại bao nhiêu? |\n\n## Khung tư duy trực quan\n\n```text\nMô hình kinh doanh =\nKhách hàng\n+ Giá trị bán\n+ Cách thu tiền\n+ Kênh bán\n+ Chi phí tạo/giao giá trị\n+ Lợi nhuận\n+ Khả năng mở rộng\n```\n\n## Ví dụ đời thường\n\nMột tiệm giặt ủi không chỉ cần có khách mang quần áo đến. Tiệm phải tính giá giặt, tiền thuê mặt bằng, điện nước, nhân công, hóa chất, khấu hao máy, thời gian xử lý và tỷ lệ khách quay lại. Nếu giảm giá để đông khách nhưng mỗi đơn đều lỗ, tiệm chỉ bận hơn chứ không khỏe hơn.\n\n## Use case 1: Công ty mới\n\nStartup AI giáo dục có 3 lựa chọn:\n\n| Mô hình | Ưu điểm | Nhược điểm | Phù hợp khi |\n|---|---|---|---|\n| B2C phụ huynh | Thử nhanh, phản hồi nhanh | CAC cao, retention khó | Cần kiểm chứng sản phẩm và thông điệp |\n| B2B trường học | Hợp đồng lớn, uy tín | Chu kỳ bán dài, quy trình phức tạp | Có bằng chứng kết quả và năng lực triển khai |\n| B2B2C trung tâm | Có kênh sẵn, học sinh dùng đều hơn | Phụ thuộc đối tác, chia doanh thu | Sản phẩm hỗ trợ được việc dạy/học của trung tâm |\n\nLựa chọn hợp lý ban đầu có thể là B2C nhóm nhỏ để học nhanh, tạo case thành công, rồi mở B2B2C khi có bằng chứng.\n\n## Use case 2: Công ty đã có\n\nLoa thông minh có thể bán một lần như thiết bị, bán kèm gói smart home cao cấp, hoặc thu phí AI premium. Vấn đề là loa có chi phí cloud, AI inference, OTA và hỗ trợ sau bán. Nếu chỉ bán phần cứng một lần, biên lợi nhuận ban đầu phải đủ bù chi phí dịch vụ trong nhiều năm.\n\nCông ty cần tính rõ:\n\n- Giá vốn phần cứng.\n- Chiết khấu đại lý.\n- Chi phí cloud/AI mỗi tháng.\n- Chi phí bảo hành và hỗ trợ.\n- Tỷ lệ khách dùng tính năng AI cao.\n- Khả năng bán thêm thiết bị hoặc gói dịch vụ.\n\n## Lỗi người mới thường mắc\n\n- Chỉ nói \"sẽ bán thuê bao\" mà không chứng minh khách dùng lâu dài.\n- Bỏ qua chi phí bán hàng, hỗ trợ và vận hành.\n- Nhầm doanh thu với lợi nhuận.\n- Chọn mô hình vì thấy công ty khác làm, không dựa trên hành vi khách.\n- Không tính kênh bán lấy bao nhiêu phần giá trị.\n- Không biết càng mở rộng thì chi phí biến đổi tăng thế nào.\n\n## Bài tập ứng dụng\n\nLập bảng mô hình doanh thu:\n\n| Mô hình | Khách hàng trả tiền | Cách thu tiền | Ưu điểm | Nhược điểm | Rủi ro | Phù hợp giai đoạn |\n|---|---|---|---|---|---|---|\n| Bán một lần |  |  |  |  |  |  |\n| Thuê bao |  |  |  |  |  |  |\n| Bán kèm gói |  |  |  |  |  |  |\n| Dịch vụ doanh nghiệp |  |  |  |  |  |  |\n\nBảng chi phí sơ bộ:\n\n| Loại chi phí | Mô tả | Cố định hay biến đổi | Ước lượng |\n|---|---|---|---|\n| Sản xuất/phát triển |  |  |  |\n| Kênh bán |  |  |  |\n| Marketing |  |  |  |\n| Hỗ trợ khách hàng |  |  |  |\n| Vận hành định kỳ |  |  |  |\n\n## Bài tập review\n\nReview câu sau:\n\n> \"Chúng tôi sẽ bán app 99.000đ/tháng. Chỉ cần có 10.000 người dùng là doanh thu gần 1 tỷ/tháng.\"\n\n| Nội dung review | Nhận xét |\n|---|---|\n| Chi phí có khách là bao nhiêu? |  |\n| Khách ở lại bao lâu? |  |\n| Chi phí phục vụ mỗi khách là gì? |  |\n| Tỷ lệ chuyển đổi từ dùng thử sang trả tiền? |  |\n| Mô hình có lời khi mở rộng không? |  |\n\n## Tiêu chí đánh giá\n\n| Mức | Biểu hiện |\n|---|---|\n| Yếu | Chỉ nêu giá bán hoặc doanh thu kỳ vọng |\n| Đạt | Có mô hình thu tiền, khách hàng trả tiền và chi phí chính |\n| Tốt | So sánh mô hình, nêu ưu nhược điểm, rủi ro và phù hợp giai đoạn |\n| Xuất sắc | Tính được logic kinh tế sơ bộ, chỉ ra điểm hòa vốn, rủi ro mở rộng và giả thuyết cần kiểm chứng |\n\n## Checklist tự review\n\n- Ai là người trả tiền thật?\n- Khách trả một lần hay trả định kỳ vì giá trị nào?\n- Kênh bán lấy bao nhiêu chi phí hoặc chiết khấu?\n- Mỗi khách mới tạo thêm chi phí gì?\n- Càng bán nhiều, doanh nghiệp lời hơn hay áp lực hơn?\n\n## Hành động nhỏ trong 30-90 phút\n\nLấy một sản phẩm bạn định bán. Viết 3 cách thu tiền khác nhau, rồi chọn một cách phù hợp nhất bằng cách so sánh hành vi khách hàng, chi phí bán hàng, chi phí phục vụ và khả năng mở rộng.\n\n"},{"sourcePath":"Kinh doanh/06_loi_the_canh_tranh.md","title":"Bài 6. Vì sao khách hàng chọn mình?","category":"business","categoryLabel":"Kinh doanh","order":7,"sha256":"8fd0cf1f5bedfb23f9b0bb8846753c32daf5cf77437fce8943e9bf560d05e4f5","lineCount":140,"headings":[{"level":1,"text":"Bài 6. Vì sao khách hàng chọn mình?","id":"bai-6-vi-sao-khach-hang-chon-minh"},{"level":2,"text":"Mục tiêu học tập","id":"muc-tieu-hoc-tap"},{"level":2,"text":"Câu hỏi bản chất","id":"cau-hoi-ban-chat"},{"level":2,"text":"Tình huống mở bài","id":"tinh-huong-mo-bai"},{"level":2,"text":"Nguyên lý first principles","id":"nguyen-ly-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kien-thuc-nen-chi-tiet"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuat-ngu-can-hieu-sau"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tu-duy-truc-quan"},{"level":2,"text":"Ví dụ đời thường","id":"vi-du-đoi-thuong"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-cong-ty-moi"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-cong-ty-đa-co"},{"level":2,"text":"Lỗi người mới thường mắc","id":"loi-nguoi-moi-thuong-mac"},{"level":2,"text":"Bài tập ứng dụng","id":"bai-tap-ung-dung"},{"level":2,"text":"Bài tập review","id":"bai-tap-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tieu-chi-đanh-gia"},{"level":2,"text":"Checklist tự review","id":"checklist-tu-review"},{"level":2,"text":"Hành động nhỏ trong 30-90 phút","id":"hanh-đong-nho-trong-30-90-phut"}],"rawMarkdown":"# Bài 6. Vì sao khách hàng chọn mình?\n\n## Mục tiêu học tập\n\nSau bài này, người học có thể:\n\n- Giải thích lợi thế cạnh tranh là lý do khách chọn mình dù có lựa chọn khác.\n- Phân biệt khác biệt bề mặt với lợi thế có giá trị kinh tế.\n- Đánh giá lợi thế theo 3 tiêu chí: khách có quan tâm, đối thủ có dễ sao chép, có tạo lợi nhuận.\n- Lập bảng lợi thế cạnh tranh cho công ty mới hoặc sản phẩm mới.\n\n## Câu hỏi bản chất\n\n> Nếu đối thủ cũng có sản phẩm tương tự, vì sao khách hàng vẫn chọn mình?\n\n## Tình huống mở bài\n\nStartup AI giáo dục phát hiện thị trường đã có nhiều app học toán, app tiếng Anh, trung tâm học thêm, gia sư và nội dung miễn phí. Công ty smart home cũng thấy Google, Apple, Xiaomi và nhiều thương hiệu Trung Quốc đã có loa thông minh. Câu hỏi khó không phải là \"mình có làm được không\", mà là \"vì sao khách phải chọn mình\".\n\n## Nguyên lý first principles\n\nLợi thế cạnh tranh tốt cần có 3 điều kiện:\n\n1. Khách hàng thật sự quan tâm.\n2. Đối thủ không dễ sao chép nhanh.\n3. Lợi thế đó giúp doanh nghiệp tạo doanh thu, lợi nhuận, retention hoặc niềm tin tốt hơn.\n\nLợi thế không nhất thiết là công nghệ mạnh nhất. Nó có thể đến từ sự tập trung, thương hiệu, kênh phân phối, dữ liệu, chi phí, dịch vụ, hệ sinh thái, tốc độ cải tiến hoặc hiểu biết sâu về bối cảnh địa phương.\n\n## Kiến thức nền chi tiết\n\nKhách hàng hiếm khi mua trong khoảng trống. Họ luôn so sánh với thứ khác: sản phẩm đối thủ, cách làm thủ công, thói quen cũ, không làm gì, hoặc trì hoãn quyết định. Vì vậy lợi thế cạnh tranh không phải là một câu doanh nghiệp tự nói về mình, mà là lý do đủ mạnh để khách từ bỏ lựa chọn hiện tại.\n\nKhác biệt chưa chắc là lợi thế. Một sản phẩm có màu lạ, tên gọi mới hoặc thêm tính năng độc đáo có thể khác biệt, nhưng nếu khách không quan tâm hoặc không trả thêm tiền, nó không tạo lợi thế kinh doanh. Lợi thế phải nằm ở điểm khách đánh giá khi ra quyết định: kết quả tốt hơn, rủi ro thấp hơn, tiện hơn, tin hơn, rẻ hơn theo tổng chi phí, hoặc phù hợp hơn với bối cảnh của họ.\n\nLợi thế cũng có độ bền khác nhau. Giảm giá dễ bị sao chép. Một tính năng đơn lẻ có thể bị sao chép. Nhưng dữ liệu tích lũy, kênh phân phối mạnh, thương hiệu đáng tin, quy trình vận hành tốt, chi phí thấp nhờ quy mô, hoặc hệ sinh thái sản phẩm tích hợp sâu thường khó sao chép hơn.\n\nVới startup, lợi thế ban đầu thường không phải là \"hào kinh tế\" lớn. Lợi thế có thể là hiểu sâu một nhóm khách hàng hẹp, phản hồi nhanh, chăm sóc thủ công, hoặc tập trung vào một vấn đề mà công ty lớn bỏ qua. Với công ty đã có, lợi thế thường đến từ tài sản hiện hữu: thương hiệu, khách hàng, đại lý, dữ liệu, năng lực sản xuất, quy trình hỗ trợ và quan hệ đối tác.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Câu hỏi kiểm tra |\n|---|---|---|---|---|---|---|\n| Lợi thế cạnh tranh | Lý do giúp doanh nghiệp thắng lựa chọn khác | Vì sao khách vẫn chọn mình | Khác biệt có giá trị và khó sao chép | Tích hợp sâu với smart home Việt Nam | \"Chúng tôi có AI\" | Khách có trả tiền vì điểm này không? |\n| Đối thủ trực tiếp | Sản phẩm giống mình | Công ty bán giải pháp tương tự | Cạnh tranh trong cùng danh mục | App học toán khác | Chỉ nhìn công ty lớn | Khách có so sánh trực tiếp không? |\n| Đối thủ gián tiếp | Giải pháp khác cùng giải quyết vấn đề | Cách khác để đạt kết quả tương tự | Cạnh tranh trên nhu cầu | Gia sư, học thêm | Bỏ qua vì không phải app | Khách có thể chọn cách này thay mình không? |\n| Hệ sinh thái | Tập hợp sản phẩm/dịch vụ hỗ trợ nhau | Một sản phẩm làm sản phẩm khác có giá trị hơn | Tạo switching cost và giá trị cộng hưởng | Loa điều khiển toàn bộ thiết bị smart home | Nhiều sản phẩm rời rạc | Sản phẩm mới có làm hệ sinh thái mạnh hơn không? |\n\n## Khung tư duy trực quan\n\n```text\nLợi thế thật =\nKhách quan tâm\n+ Đối thủ khó sao chép\n+ Mình làm được ổn định\n+ Có tác động đến doanh thu/lợi nhuận/retention/niềm tin\n```\n\n## Ví dụ đời thường\n\nMột tiệm sửa xe cạnh tranh không chỉ bằng \"sửa được xe\". Lợi thế có thể là ở gần khu dân cư, báo giá minh bạch, sửa nhanh trong giờ đi làm, nhớ lịch bảo dưỡng của khách và không thay đồ không cần thiết. Khách chọn vì tin và tiện, không chỉ vì tiệm có dụng cụ.\n\n## Use case 1: Công ty mới\n\nStartup AI giáo dục khó thắng bằng số lượng bài tập hoặc ngân sách quảng cáo. Lợi thế khả thi hơn là tập trung vào phụ huynh Việt Nam có con lớp 3 yếu toán, thiết kế báo cáo cực dễ hiểu, duy trì thói quen học 10 phút mỗi ngày và chăm sóc phụ huynh trong giai đoạn đầu.\n\nLợi thế ban đầu có thể là:\n\n- Hiểu sâu nỗi lo của phụ huynh bận rộn.\n- Dữ liệu học tập theo điểm yếu nhỏ của học sinh.\n- Quy trình phản hồi nhanh sau mỗi tuần học.\n- Nội dung phù hợp chương trình học Việt Nam.\n\n## Use case 2: Công ty đã có\n\nCông ty smart home không nhất thiết phải có AI tổng quát giỏi hơn Google. Lợi thế có thể là:\n\n- Tích hợp sâu với thiết bị nhà thông minh đang lắp tại Việt Nam.\n- Hiểu tiếng Việt, ngữ cảnh gia đình Việt và cách gọi thiết bị trong nhà.\n- Có đại lý lắp đặt và hỗ trợ tại địa phương.\n- Có khách hàng hiện hữu để bán kèm, nâng cấp hoặc demo.\n\nNếu loa giúp hệ sinh thái dễ bán hơn và tăng độ gắn bó, lợi thế không chỉ nằm ở doanh thu loa mà còn ở toàn bộ giá trị smart home.\n\n## Lỗi người mới thường mắc\n\n- Tưởng \"khác biệt\" là lợi thế dù khách không quan tâm.\n- Chỉ nhìn đối thủ trực tiếp, bỏ qua hành vi thay thế.\n- Dựa vào tính năng dễ sao chép.\n- Nói \"công nghệ tốt hơn\" nhưng không có bằng chứng khách cảm nhận được.\n- Không liên hệ lợi thế với lợi nhuận, retention hoặc kênh bán.\n\n## Bài tập ứng dụng\n\nLập bảng lợi thế cạnh tranh:\n\n| Loại lợi thế | Mình có gì? | Khách hàng có quan tâm không? | Đối thủ có dễ copy không? | Có tạo lợi nhuận/retention không? | Bằng chứng cần có |\n|---|---|---|---|---|---|\n| Công nghệ |  |  |  |  |  |\n| Thương hiệu |  |  |  |  |  |\n| Kênh bán |  |  |  |  |  |\n| Dữ liệu |  |  |  |  |  |\n| Dịch vụ |  |  |  |  |  |\n| Hệ sinh thái |  |  |  |  |  |\n\n## Bài tập review\n\nReview câu sau:\n\n> \"Chúng tôi khác biệt vì dùng AI mới nhất và giao diện đẹp hơn đối thủ.\"\n\n| Nội dung review | Nhận xét |\n|---|---|\n| Khách hàng có quan tâm điểm này không? |  |\n| Đối thủ có dễ sao chép không? |  |\n| Điểm này có tạo kết quả tốt hơn không? |  |\n| Có bằng chứng từ hành vi khách không? |  |\n| Lợi thế nên viết lại thế nào? |  |\n\n## Tiêu chí đánh giá\n\n| Mức | Biểu hiện |\n|---|---|\n| Yếu | Nêu khác biệt chung chung, không có góc nhìn khách hàng |\n| Đạt | Xác định được một số lợi thế và đối thủ chính |\n| Tốt | Đánh giá lợi thế theo giá trị khách, độ khó sao chép và tác động kinh tế |\n| Xuất sắc | Chỉ ra lợi thế phù hợp giai đoạn, có bằng chứng, rủi ro bị sao chép và kế hoạch củng cố |\n\n## Checklist tự review\n\n- Khách hàng có thật sự quan tâm lợi thế này không?\n- Đối thủ mất bao lâu để sao chép?\n- Lợi thế này có giúp bán dễ hơn, giữ khách lâu hơn hoặc lời hơn không?\n- Lợi thế này đến từ tài sản nào của doanh nghiệp?\n- Nếu bỏ tuyên bố marketing, bằng chứng thật là gì?\n\n## Hành động nhỏ trong 30-90 phút\n\nChọn 3 đối thủ trực tiếp và 3 hành vi thay thế. Viết lý do khách đang chọn họ, sau đó viết lý do đủ mạnh khiến khách có thể chuyển sang bạn.\n\n"},{"sourcePath":"Kinh doanh/07_go_to_market.md","title":"Bài 7. Đưa sản phẩm ra thị trường như thế nào?","category":"business","categoryLabel":"Kinh doanh","order":8,"sha256":"cb42cd72becba0952c1947457117ea5fc2eac1be858ce23527c390e88e44b46f","lineCount":152,"headings":[{"level":1,"text":"Bài 7. Đưa sản phẩm ra thị trường như thế nào?","id":"bai-7-đua-san-pham-ra-thi-truong-nhu-the-nao"},{"level":2,"text":"Mục tiêu học tập","id":"muc-tieu-hoc-tap"},{"level":2,"text":"Câu hỏi bản chất","id":"cau-hoi-ban-chat"},{"level":2,"text":"Tình huống mở bài","id":"tinh-huong-mo-bai"},{"level":2,"text":"Nguyên lý first principles","id":"nguyen-ly-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kien-thuc-nen-chi-tiet"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuat-ngu-can-hieu-sau"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tu-duy-truc-quan"},{"level":2,"text":"Ví dụ đời thường","id":"vi-du-đoi-thuong"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-cong-ty-moi"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-cong-ty-đa-co"},{"level":2,"text":"Lỗi người mới thường mắc","id":"loi-nguoi-moi-thuong-mac"},{"level":2,"text":"Bài tập ứng dụng","id":"bai-tap-ung-dung"},{"level":2,"text":"Bài tập review","id":"bai-tap-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tieu-chi-đanh-gia"},{"level":2,"text":"Checklist tự review","id":"checklist-tu-review"},{"level":2,"text":"Hành động nhỏ trong 30-90 phút","id":"hanh-đong-nho-trong-30-90-phut"}],"rawMarkdown":"# Bài 7. Đưa sản phẩm ra thị trường như thế nào?\n\n## Mục tiêu học tập\n\nSau bài này, người học có thể:\n\n- Giải thích go-to-market là toàn bộ cách đưa giá trị đến khách hàng.\n- Xác định khách hàng đầu tiên, thông điệp, kênh, cách bán, dùng thử và hỗ trợ.\n- Thiết kế kế hoạch tiếp cận 30 ngày.\n- Phân biệt launch học hỏi, launch có kiểm soát và launch mở rộng.\n\n## Câu hỏi bản chất\n\n> Làm sao để khách hàng biết, hiểu, tin, mua, dùng và giới thiệu sản phẩm?\n\n## Tình huống mở bài\n\nStartup AI giáo dục có MVP và muốn \"ra mắt thị trường\". Một người đề xuất chạy quảng cáo lớn. Người khác muốn đăng bài cộng đồng phụ huynh. Người khác muốn bán qua trường học. Mỗi hướng đều có lý, nhưng nếu chưa rõ khách hàng đầu tiên là ai, thông điệp gì, chỉ số nào cần học và ai hỗ trợ sau khi dùng, launch có thể tạo tiếng ồn mà không tạo hiểu biết.\n\n## Nguyên lý first principles\n\nGo-to-market không chỉ là marketing. Đó là hệ thống đưa giá trị từ doanh nghiệp đến khách hàng.\n\nCác thành phần chính:\n\n1. Khách hàng mục tiêu đầu tiên.\n2. Vấn đề và thông điệp chính.\n3. Kênh tiếp cận.\n4. Mô hình bán hàng.\n5. Cách dùng thử hoặc demo.\n6. Chính sách giá và offer.\n7. Hỗ trợ sau bán.\n8. Đo lường và cải tiến.\n\n## Kiến thức nền chi tiết\n\nMột sản phẩm tốt vẫn có thể thất bại nếu khách hàng không biết, không hiểu, không tin, không mua đúng cách, không dùng đúng cách hoặc không nhận được hỗ trợ khi gặp vấn đề. GTM là cầu nối giữa sản phẩm và thị trường.\n\nGTM bắt đầu bằng khách hàng đầu tiên, không bắt đầu bằng kênh. Nếu khách hàng là phụ huynh bận rộn, kênh có thể là cộng đồng lớp học, nhóm phụ huynh, giáo viên, nội dung tư vấn hoặc giới thiệu. Nếu khách hàng là đại lý smart home, kênh có thể là hội nghị nhà phân phối, demo showroom, tài liệu bán hàng và chương trình đào tạo kỹ thuật.\n\nThông điệp phải trả lời câu hỏi \"vì sao tôi nên quan tâm ngay\". Thông điệp yếu nói về tính năng. Thông điệp tốt nói về vấn đề, kết quả, khác biệt và bằng chứng. Với sản phẩm mới, mục tiêu không chỉ là thuyết phục mua, mà còn đặt đúng kỳ vọng để khách dùng đúng và đánh giá công bằng.\n\nLaunch cũng có cấp độ. Launch học hỏi dùng để tìm tín hiệu thị trường với nhóm nhỏ. Launch có kiểm soát dùng khi sản phẩm có giá trị nhưng còn rủi ro vận hành hoặc trải nghiệm. Launch mở rộng chỉ nên làm khi sản phẩm, thông điệp, kênh, hỗ trợ và chỉ số kinh tế đã có bằng chứng.\n\nGTM tốt luôn có vòng phản hồi. Doanh nghiệp cần biết khách đến từ đâu, họ hiểu gì, vướng ở đâu, vì sao mua, vì sao không mua, vì sao dùng tiếp, vì sao bỏ. Không có dữ liệu này, doanh nghiệp chỉ đang phát thông điệp ra ngoài mà không học được từ thị trường.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Câu hỏi kiểm tra |\n|---|---|---|---|---|---|---|\n| Go-to-market | Cách đưa sản phẩm ra thị trường | Làm sao khách biết, tin, mua, dùng | Hệ thống thương mại hóa giá trị | Tuyển 30 phụ huynh dùng thử, đo retention | Chạy ads trước khi rõ thông điệp | GTM đang học gì hoặc bán gì? |\n| Kênh | Đường tiếp cận khách hàng | Nơi khách có thể nghe, tin và hành động | Kênh phải khớp hành vi khách | Nhóm phụ huynh lớp 3 | Chọn TikTok vì đang hot | Khách mục tiêu có ở kênh này không? |\n| Offer | Đề nghị mua/dùng thử cụ thể | Khách nhận gì, trả gì, trong điều kiện nào | Giảm rủi ro quyết định | Dùng thử 14 ngày có báo cáo | \"Đăng ký ngay\" chung chung | Offer có làm khách dễ thử hơn không? |\n| Launch có kiểm soát | Ra mắt giới hạn để giảm rủi ro | Bán cho nhóm phù hợp trước | Học và bảo vệ chất lượng | Bán loa cho 100 nhà đã đủ điều kiện | Công bố đại trà khi chưa ổn | Nếu lỗi xảy ra, có kiểm soát được không? |\n\n## Khung tư duy trực quan\n\n```text\nBiết -> Hiểu -> Tin -> Thử/Mua -> Dùng đúng -> Nhận giá trị -> Quay lại/Giới thiệu\n```\n\n## Ví dụ đời thường\n\nMột nhà hàng mới không nên chỉ treo biển và hy vọng khách vào. Họ cần biết khách đầu tiên là dân văn phòng, gia đình hay khách đi chơi; món chủ lực là gì; giá ra sao; khách biết qua đâu; có dùng thử hay combo không; khi đông khách bếp có phục vụ kịp không; và khách có quay lại không.\n\n## Use case 1: Công ty mới\n\nKế hoạch GTM 30 ngày cho startup AI giáo dục:\n\n| Giai đoạn | Hành động | Chỉ số |\n|---|---|---|\n| Tuần 1 | Phỏng vấn 15 phụ huynh lớp 3, chọn 30 người dùng thử | Số phụ huynh đủ tiêu chí |\n| Tuần 2 | Cho trẻ làm bài kiểm tra đầu vào và học 7 ngày | Tỷ lệ bắt đầu, số ngày học |\n| Tuần 3 | Gửi báo cáo tiến bộ, phỏng vấn phụ huynh | Tỷ lệ mở báo cáo, phản hồi giá trị |\n| Tuần 4 | Đề nghị trả tiền hoặc gia hạn | Tỷ lệ trả tiền, lý do từ chối |\n\nMục tiêu giai đoạn này là học xem vấn đề, thông điệp, sản phẩm và giá có tín hiệu thật không.\n\n## Use case 2: Công ty đã có\n\nVới loa thông minh, công ty nên launch có kiểm soát:\n\n- Chọn nhóm khách hàng đã lắp đủ thiết bị tương thích.\n- Đào tạo đại lý về phạm vi tính năng được hứa.\n- Demo theo kịch bản thật: bật đèn, điều khiển rèm, kích hoạt ngữ cảnh.\n- Có checklist kỹ thuật trước bàn giao.\n- Có đội hỗ trợ nhanh trong 14 ngày đầu.\n- Thu feedback theo lỗi, bối cảnh, thiết bị và câu lệnh.\n\nThông điệp nên tránh hứa \"trợ lý AI toàn năng\" nếu sản phẩm mạnh nhất ở điều khiển smart home tiếng Việt.\n\n## Lỗi người mới thường mắc\n\n- Chạy quảng cáo trước khi thông điệp rõ.\n- Chọn kênh theo xu hướng, không theo hành vi khách hàng.\n- Launch quá rộng khi chưa có hỗ trợ vận hành.\n- Không đặt đúng kỳ vọng khiến khách thất vọng.\n- Chỉ đo lượt xem, không đo hành vi mua và dùng.\n- Không có kế hoạch học sau launch.\n\n## Bài tập ứng dụng\n\nLập kế hoạch GTM một trang:\n\n| Thành phần | Nội dung |\n|---|---|\n| Khách hàng mục tiêu đầu tiên |  |\n| Vấn đề chính |  |\n| Thông điệp chính |  |\n| Kênh tiếp cận |  |\n| Cách bán |  |\n| Cách dùng thử/demo |  |\n| Chính sách giá/offer |  |\n| Chỉ số đo lường |  |\n| Rủi ro |  |\n| Kế hoạch cải tiến |  |\n\n## Bài tập review\n\nReview kế hoạch:\n\n> \"Ra mắt bằng cách chạy ads toàn quốc trong 2 tuần để xem thị trường phản ứng thế nào.\"\n\n| Nội dung review | Nhận xét |\n|---|---|\n| Khách hàng đầu tiên có rõ không? |  |\n| Thông điệp có dựa trên insight không? |  |\n| Chỉ số nào chứng minh giá trị? |  |\n| Nếu khách đăng ký, ai hỗ trợ? |  |\n| Cách launch nào ít rủi ro hơn? |  |\n\n## Tiêu chí đánh giá\n\n| Mức | Biểu hiện |\n|---|---|\n| Yếu | Chỉ nêu kênh quảng bá, không có hệ thống bán và hỗ trợ |\n| Đạt | Có khách hàng, thông điệp, kênh và chỉ số cơ bản |\n| Tốt | Có kế hoạch 30 ngày, offer, dùng thử, hỗ trợ và phản hồi |\n| Xuất sắc | Chọn đúng loại launch, kiểm soát rủi ro, đo được học hỏi và có tiêu chí mở rộng |\n\n## Checklist tự review\n\n- Khách hàng đầu tiên là ai?\n- Thông điệp có nói đúng vấn đề và giá trị không?\n- Kênh có khớp hành vi khách hàng không?\n- Khách mua/dùng xong có được hỗ trợ không?\n- Tôi đo điều gì để biết nên mở rộng hay chỉnh lại?\n\n## Hành động nhỏ trong 30-90 phút\n\nViết kế hoạch tiếp cận 10 khách hàng đầu tiên trong 7 ngày. Ghi rõ họ là ai, tìm ở đâu, nói thông điệp gì, đề nghị thử gì và sau đó đo điều gì.\n\n"},{"sourcePath":"Kinh doanh/08_van_hanh_doanh_nghiep.md","title":"Bài 8. Vận hành là khả năng giao giá trị ổn định","category":"business","categoryLabel":"Kinh doanh","order":9,"sha256":"ba426d6ea77a81b96313ce87907717bef790f33f460013d416356ad6959e0959","lineCount":146,"headings":[{"level":1,"text":"Bài 8. Vận hành là khả năng giao giá trị ổn định","id":"bai-8-van-hanh-la-kha-nang-giao-gia-tri-on-đinh"},{"level":2,"text":"Mục tiêu học tập","id":"muc-tieu-hoc-tap"},{"level":2,"text":"Câu hỏi bản chất","id":"cau-hoi-ban-chat"},{"level":2,"text":"Tình huống mở bài","id":"tinh-huong-mo-bai"},{"level":2,"text":"Nguyên lý first principles","id":"nguyen-ly-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kien-thuc-nen-chi-tiet"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuat-ngu-can-hieu-sau"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tu-duy-truc-quan"},{"level":2,"text":"Ví dụ đời thường","id":"vi-du-đoi-thuong"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-cong-ty-moi"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-cong-ty-đa-co"},{"level":2,"text":"Lỗi người mới thường mắc","id":"loi-nguoi-moi-thuong-mac"},{"level":2,"text":"Bài tập ứng dụng","id":"bai-tap-ung-dung"},{"level":2,"text":"Bài tập review","id":"bai-tap-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tieu-chi-đanh-gia"},{"level":2,"text":"Checklist tự review","id":"checklist-tu-review"},{"level":2,"text":"Hành động nhỏ trong 30-90 phút","id":"hanh-đong-nho-trong-30-90-phut"}],"rawMarkdown":"# Bài 8. Vận hành là khả năng giao giá trị ổn định\n\n## Mục tiêu học tập\n\nSau bài này, người học có thể:\n\n- Giải thích vì sao bán được chưa đủ, doanh nghiệp phải giao giá trị ổn định.\n- Thiết kế quy trình vận hành đơn giản với đầu vào, đầu ra, owner và chỉ số.\n- Phân biệt lỗi sản phẩm, lỗi quy trình, lỗi con người và lỗi kỳ vọng.\n- Lập bản đồ quy trình giao giá trị.\n\n## Câu hỏi bản chất\n\n> Doanh nghiệp có thể lặp lại việc tạo giá trị với chất lượng ổn định không?\n\n## Tình huống mở bài\n\nStartup AI giáo dục có 100 người dùng đầu tiên. Phụ huynh nhắn hỏi nhiều, trẻ học không đều, báo cáo đôi khi sai, founder phải xử lý từng trường hợp thủ công. Cùng lúc, công ty smart home bán loa qua đại lý nhưng lỗi phát sinh từ nhiều nguồn: thiết bị, mạng, cloud, AI, app, cách lắp đặt và kỳ vọng khách hàng.\n\nBán được chỉ mở đầu cho bài toán vận hành.\n\n## Nguyên lý first principles\n\nVận hành là khả năng biến lời hứa giá trị thành trải nghiệm thật, lặp lại được, đo được và cải tiến được.\n\nVận hành tốt giúp:\n\n- Giảm lỗi.\n- Tăng sự hài lòng.\n- Giảm chi phí.\n- Tăng khả năng mở rộng.\n- Tạo niềm tin.\n\nNếu không vận hành được, tăng trưởng chỉ làm lỗi xuất hiện nhiều hơn.\n\n## Kiến thức nền chi tiết\n\nDoanh nghiệp không chỉ là sản phẩm và marketing. Doanh nghiệp là một hệ thống giao giá trị. Hệ thống đó gồm con người, quy trình, công cụ, dữ liệu, tiêu chuẩn chất lượng, cơ chế phản hồi và quyết định cải tiến. Khi khách mua, doanh nghiệp phải onboarding, giao hàng, triển khai, hỗ trợ, xử lý lỗi, thu tiền, theo dõi chất lượng và duy trì niềm tin.\n\nVận hành bắt đầu bằng việc mô tả quy trình. Mỗi quy trình cần có đầu vào, các bước chính, người phụ trách, đầu ra, chỉ số đo và rủi ro. Nếu không có owner rõ, lỗi sẽ bị đẩy qua lại. Nếu không có chỉ số, doanh nghiệp không biết chất lượng đang tốt hay xấu. Nếu không có cách phân loại lỗi, đội sản phẩm không học được từ phản hồi khách hàng.\n\nỞ giai đoạn đầu, vận hành có thể thủ công nhưng kh
