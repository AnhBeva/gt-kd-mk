bước onboarding.\n\n## Liên hệ với bài trước và bài sau\n\nBài trước quản trị pipeline trước khi chốt. Bài này bảo vệ giá trị sau khi chốt. Bài sau chuẩn hóa toàn bộ thành sales playbook để đội ngũ lặp lại được.\n"},{"sourcePath":"Sales/12_sales_playbook_va_phoi_hop_noi_bo.md","title":"Bài 12. Sales Playbook Và Phối Hợp Nội Bộ","category":"sales","categoryLabel":"Sales","order":13,"sha256":"a42e73a0ac5ee10889228a5266e1db6f37cc029996a1532fe764a13f2d5af267","lineCount":146,"headings":[{"level":1,"text":"Bài 12. Sales Playbook Và Phối Hợp Nội Bộ","id":"bài-12-sales-playbook-và-phối-hợp-nội-bộ"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 12. Sales Playbook Và Phối Hợp Nội Bộ\n\n## Câu hỏi bản chất\n\n> Làm sao sales lặp lại được mà không phụ thuộc vào từng cá nhân?\n\n## Tình huống mở bài\n\nCông ty smart home có 30 đại lý bán loa thông minh. Mỗi đại lý demo một kiểu, hứa một kiểu, xử lý phản đối một kiểu. Có đại lý nói loa hiểu mọi câu lệnh tiếng Việt, có đại lý chỉ demo bật đèn, có đại lý không kiểm tra điều kiện kỹ thuật trước khi bán. Kết quả là khách kỳ vọng khác nhau và đội hỗ trợ quá tải.\n\nDoanh nghiệp không thiếu người bán. Doanh nghiệp thiếu playbook.\n\n## Vì sao bài này quan trọng\n\nSales playbook giúp biến kinh nghiệm rời rạc thành hệ thống có thể đào tạo, đo lường và cải tiến. Nó cũng giúp sales phối hợp với marketing, product, CS, finance và operations để bán đúng giá trị, đúng kỳ vọng và đúng năng lực giao hàng.\n\n## Nguyên lý first principles\n\nMột sales playbook tốt chuẩn hóa các quyết định lặp lại:\n\n```text\nBán cho ai\n-> Hỏi gì\n-> Nói gì\n-> Demo gì\n-> Đưa bằng chứng nào\n-> Xử lý phản đối ra sao\n-> Chốt thế nào\n-> Bàn giao cho ai\n-> Dữ liệu nào quay về hệ thống\n```\n\nPlaybook không làm sales cứng nhắc. Nó giúp sales có nền chung để ứng biến đúng.\n\n## Kiến thức nền chi tiết\n\nPlaybook là tài liệu vận hành sales. Nó không chỉ là script gọi điện. Một playbook đầy đủ gồm ICP, qualification, nguồn lead, thông điệp tiếp cận, discovery guide, demo script, trust proof, objection handling, proposal template, pricing rules, CRM rules, handoff checklist và feedback process.\n\nPlaybook phải được cập nhật từ dữ liệu thật. Nếu khách liên tục phản đối giá, playbook cần xem lại value proof. Nếu nhiều deal lost vì thiếu người quyết định, discovery guide phải thêm câu hỏi decision process. Nếu đại lý hứa quá, claim guardrails phải rõ hơn.\n\nPhối hợp nội bộ là điều kiện để sales không bán trong khoảng tối. Marketing cần cung cấp insight, nội dung, case và lead quality. Product cần nói rõ tính năng, giới hạn và roadmap. CS cần phản hồi churn, complaint và onboarding issue. Finance cần kiểm soát discount và margin. Operations cần nói rõ năng lực triển khai.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Sales playbook | Sổ tay bán hàng | Tài liệu hướng dẫn sales làm đúng | Chuẩn hóa học hỏi | ICP, discovery, demo, objection, handoff | Script cứng 1 trang | Training deck |\n| Sales kit | Bộ công cụ bán | Tài liệu hỗ trợ bán | Giúp sales/đại lý nói đúng và có bằng chứng | FAQ, demo script, case, brochure | Poster quảng cáo | Brand guideline |\n| Enablement | Hỗ trợ năng lực sales | Trang bị kiến thức, công cụ, quy trình | Tăng chất lượng bán | Đào tạo đại lý và role-play | Gửi file rồi thôi | Onboarding nhân sự |\n| Feedback loop | Vòng phản hồi | Dữ liệu thị trường quay lại đội nội bộ | Cải tiến liên tục | Lost reason về product/marketing | Than phiền miệng | Report hình thức |\n\n## Khung tư duy trực quan\n\n| Bộ phận | Sales cần gì? | Sales trả lại gì? |\n|---|---|---|\n| Marketing | Lead, insight, nội dung, case | Chất lượng lead, phản đối, câu hỏi khách |\n| Product | Tính năng, giới hạn, roadmap | Nhu cầu, lỗi, request, fit/unfit |\n| CS | Onboarding, support promise | Kỳ vọng khách, rủi ro churn |\n| Finance | Giá, discount rule | Forecast, margin risk |\n| Operations | Năng lực triển khai | Lịch lắp, điều kiện kỹ thuật |\n\n## Ví dụ đời thường\n\nMột chuỗi cà phê không thể để mỗi nhân viên pha cùng một món theo cảm giác riêng. Công thức chuẩn giúp khách nhận trải nghiệm ổn định; nhân viên giỏi vẫn có thể xử lý tình huống linh hoạt trong khung đó.\n\n## Use case 1: Công ty mới\n\nStartup AI giáo dục cần playbook tối giản:\n\n- ICP phụ huynh đầu tiên.\n- 10 câu discovery.\n- Demo báo cáo tiến bộ.\n- 5 phản đối chính.\n- Gói dùng thử và điều kiện paid.\n- CRM fields bắt buộc.\n- Handoff sang CS sau paid.\n\nPlaybook này nên cập nhật mỗi tuần trong giai đoạn tìm tín hiệu đầu tiên.\n\n## Use case 2: Công ty đã có\n\nCông ty smart home cần sales kit cho đại lý:\n\n- Claim được nói và không được nói.\n- Demo script tại showroom.\n- Checklist điều kiện kỹ thuật.\n- FAQ xử lý phản đối.\n- Bảng thiết bị tương thích.\n- Quy trình escalation khi lỗi.\n- Form feedback sau lắp đặt.\n\nKhông có playbook, mỗi đại lý sẽ tạo một phiên bản thị trường khác nhau.\n\n## Lỗi người mới thường mắc\n\n- Chỉ đào tạo bằng truyền miệng.\n- Playbook quá chung, không dùng được trong cuộc bán thật.\n- Không cập nhật playbook sau khi có dữ liệu.\n- Marketing, sales, product, CS dùng claim khác nhau.\n- Không role-play trước khi cho sales/đại lý bán.\n\n## Bài tập ứng dụng\n\nLập Sales Playbook Checklist:\n\n| Phần | Đã có? | Cần bổ sung |\n|---|---|---|\n| ICP và qualification |  |  |\n| Discovery questions |  |  |\n| Outreach message |  |  |\n| Demo script |  |  |\n| Trust proof |  |  |\n| Objection handling |  |  |\n| Proposal/pricing rules |  |  |\n| CRM rules |  |  |\n| Handoff checklist |  |  |\n| Feedback loop |  |  |\n\n## Bài tập review\n\nMột công ty có sales script nhưng không có ICP, không có demo chuẩn, không có discount rule và không ghi lost reason. Review vì sao script chưa phải playbook.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Sales tự bán theo kinh nghiệm cá nhân |\n| Đạt | Có script và tài liệu cơ bản |\n| Tốt | Có playbook đủ các bước chính và phối hợp nội bộ |\n| Xuất sắc | Playbook được cập nhật bằng dữ liệu pipeline, phản đối, won/lost và feedback sau bán |\n\n## Checklist tự review\n\n1. Người mới đọc playbook có bán đúng không?\n2. Playbook có nói rõ không được hứa gì không?\n3. Có demo script và objection matrix chưa?\n4. Có CRM rule và handoff checklist chưa?\n5. Ai chịu trách nhiệm cập nhật playbook?\n\n## Hành động 30-90 phút\n\nViết mục lục sales playbook cho sản phẩm của bạn và chọn 3 phần cần viết trước để giảm rủi ro bán sai.\n\n## Liên hệ với bài trước và bài sau\n\nBài trước bàn giao sau bán. Bài này chuẩn hóa hệ thống sales. Bài sau dùng AI để tăng tốc sales nhưng vẫn giữ dữ liệu thật, guardrails và trách nhiệm con người.\n"},{"sourcePath":"Sales/13_ai_trong_sales.md","title":"Bài 13. AI Trong Sales","category":"sales","categoryLabel":"Sales","order":14,"sha256":"c58fb53b73112465e80f998f9edd3223e6db8fa6df1f62dbd55c32d7a991bb22","lineCount":132,"headings":[{"level":1,"text":"Bài 13. AI Trong Sales","id":"bài-13-ai-trong-sales"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 13. AI Trong Sales\n\n## Câu hỏi bản chất\n\n> Dùng AI để bán tốt hơn hay chỉ nói nhanh hơn?\n\n## Tình huống mở bài\n\nMột đội sales dùng AI tạo hàng trăm tin nhắn tiếp cận phụ huynh. Tin nhắn trôi chảy, lịch sự, có tên người nhận, nhưng conversion vẫn thấp. Khi xem lại, các tin đều nói chung về \"AI học tập cá nhân hóa\", không dựa trên insight thật, không có giới hạn claim và không giúp sales hiểu phản đối của khách.\n\nAI tăng tốc việc sai thì chỉ giúp sai nhanh hơn.\n\n## Vì sao bài này quan trọng\n\nAI có thể hỗ trợ sales nghiên cứu, viết tin nhắn, tóm tắt cuộc gọi, phân loại phản đối, tạo proposal và cập nhật CRM. Nhưng AI không thay thế discovery, phán đoán fit, đạo đức bán hàng và trách nhiệm với claim.\n\n## Nguyên lý first principles\n\nAI trong sales nên dùng để tăng tốc 4 việc:\n\n```text\nChuẩn bị tốt hơn\n-> Ghi nhớ tốt hơn\n-> Cá nhân hóa có kiểm soát\n-> Học từ dữ liệu nhanh hơn\n```\n\nCon người vẫn quyết định khách có phù hợp không, claim nào được nói, deal nào nên chốt và kỳ vọng nào phải bảo vệ.\n\n## Kiến thức nền chi tiết\n\nAI mạnh ở việc xử lý ngôn ngữ và dữ liệu bán hàng. Nó có thể tóm tắt notes, rút ra pain, đề xuất câu hỏi discovery, tạo phiên bản follow-up, phân nhóm objection, soạn proposal nháp và tạo battlecard cho sales. Những việc này tiết kiệm thời gian và giúp sales nhất quán hơn.\n\nNhưng AI dễ tạo ra nội dung nghe hợp lý mà không đúng dữ liệu thật. Nếu đầu vào là ghi chú mơ hồ, AI sẽ suy diễn. Nếu không có guardrails, AI có thể viết claim quá mức. Nếu sales dùng AI để cá nhân hóa giả tạo, khách có thể thấy thiếu chân thật.\n\nAI sales workflow cần có dữ liệu đầu vào, mục tiêu, người kiểm duyệt, claim được phép nói, claim không được nói, dữ liệu nhạy cảm không được đưa vào và tiêu chuẩn đầu ra. Với dữ liệu khách hàng, cần đặc biệt cẩn trọng về quyền riêng tư, nhất là dữ liệu trẻ em trong use case giáo dục.\n\nAI nên được gắn vào playbook, không dùng tự phát. Ví dụ: AI tóm tắt discovery theo khung pain-impact-decision-next step; AI tạo follow-up dựa trên template đã duyệt; AI phân tích lost reason hằng tuần; AI gợi ý cập nhật objection matrix nhưng con người duyệt.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| AI sales assistant | Trợ lý AI sales | Công cụ hỗ trợ sales viết, tóm tắt, phân tích | Tăng tốc công việc lặp lại | Tóm tắt call notes thành CRM fields | Để AI quyết định chốt | Salesperson |\n| Guardrails | Ranh giới sử dụng | Điều được phép/không được phép | Bảo vệ claim và dữ liệu | Không hứa \"AI giúp con giỏi chắc chắn\" | Tạo nội dung tự do | Prompt |\n| Call summary | Tóm tắt cuộc gọi | Ghi lại ý chính sau trao đổi | Giữ dữ liệu sales | Pain, objection, next step | Tóm tắt chung chung | Transcript |\n| Personalization | Cá nhân hóa | Điều chỉnh theo bối cảnh khách | Làm thông điệp liên quan hơn | Nhắc đúng lớp học và vấn đề con | Chèn tên vào tin spam | Automation |\n\n## Khung tư duy trực quan\n\n| Công việc sales | AI hỗ trợ | Con người quyết định |\n|---|---|---|\n| Chuẩn bị call | Tóm tắt khách, gợi ý câu hỏi | Câu hỏi nào phù hợp |\n| Outreach | Draft phiên bản tin nhắn | Thông điệp có thật và tôn trọng không |\n| Discovery | Tóm tắt pain/impact | Khách có fit không |\n| Proposal | Soạn nháp đề xuất | Claim, giá, điều khoản |\n| Review pipeline | Nhóm objection/lost reason | Ưu tiên sửa playbook |\n\n## Ví dụ đời thường\n\nAI giống một trợ lý ghi chép và soạn nháp rất nhanh. Nếu người quản lý không nói rõ điều gì đúng, điều gì cấm, trợ lý có thể viết rất tự tin nhưng sai lời hứa.\n\n## Use case 1: Công ty mới\n\nStartup AI giáo dục có thể dùng AI để:\n\n- Tóm tắt 20 cuộc phỏng vấn phụ huynh.\n- Nhóm phản đối: giá, thói quen học, niềm tin AI, dữ liệu trẻ em.\n- Tạo 5 phiên bản tin nhắn follow-up sau trial.\n- Soạn proposal gói 3 tháng dựa trên dữ liệu học thật.\n\nGuardrails: không đưa dữ liệu trẻ em nhạy cảm vào công cụ không kiểm soát; không hứa kết quả học tập chắc chắn; mọi claim hiệu quả phải có dữ liệu.\n\n## Use case 2: Công ty đã có\n\nCông ty smart home có thể dùng AI để:\n\n- Tạo FAQ đại lý từ phản đối thật.\n- Tóm tắt feedback sau lắp đặt.\n- Phân loại lỗi theo thiết bị, câu lệnh, mạng, kỳ vọng.\n- Soạn script demo theo từng nhóm khách.\n\nGuardrails: không nói loa hiểu mọi câu lệnh, không tạo danh sách tính năng chưa phát hành, mọi tài liệu đại lý phải qua sales, marketing, R&D và CS duyệt.\n\n## Lỗi người mới thường mắc\n\n- Dùng AI trước khi có dữ liệu khách thật.\n- Để AI viết claim không kiểm chứng.\n- Cá nhân hóa giả tạo gây mất niềm tin.\n- Đưa dữ liệu nhạy cảm vào công cụ không kiểm soát.\n- Tự động hóa follow-up mà không hiểu deal stage.\n\n## Bài tập ứng dụng\n\nLập AI Sales Workflow:\n\n| Công việc | AI hỗ trợ gì? | Dữ liệu đầu vào | Guardrails | Người duyệt | Tiêu chuẩn đầu ra |\n|---|---|---|---|---|---|\n| Outreach |  |  |  |  |  |\n| Discovery summary |  |  |  |  |  |\n| Follow-up |  |  |  |  |  |\n| Proposal |  |  |  |  |  |\n| Pipeline review |  |  |  |  |  |\n\n## Bài tập review\n\nMột đội sales để AI tự viết và gửi follow-up sau mọi cuộc gọi, không kiểm tra stage, không kiểm duyệt claim. Review rủi ro và thiết kế lại workflow.\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Dùng AI để spam nhanh hơn |\n| Đạt | Dùng AI để soạn nháp và tiết kiệm thời gian |\n| Tốt | Có dữ liệu đầu vào, guardrails và người duyệt |\n| Xuất sắc | AI giúp sales học nhanh hơn, cá nhân hóa đúng hơn và cải tiến playbook có kiểm soát |\n\n## Checklist tự review\n\n1. AI dùng dữ liệu khách thật hay giả định?\n2. Có dữ liệu nhạy cảm nào không nên đưa vào AI không?\n3. Claim AI tạo có cần kiểm chứng không?\n4. Ai duyệt đầu ra trước khi dùng với khách?\n5. Kết quả AI có cập nhật CRM/playbook không?\n\n## Hành động 30-90 phút\n\nViết một prompt tạo follow-up sau discovery gồm: ICP, pain, impact, objection, claim được nói, claim không được nói, next step và tone. Sau đó tự review đầu ra theo guardrails.\n\n## Liên hệ với bài trước và bài sau\n\nBài trước xây sales playbook. AI nên tăng tốc playbook đó, không thay thế nó. Bài sau là đồ án cuối khóa, nơi người học tổng hợp toàn bộ thành kế hoạch sales hoàn chỉnh.\n"},{"sourcePath":"Sales/14_do_an_cuoi_khoa.md","title":"Đồ Án Cuối Khóa: Kế Hoạch Sales Hoàn Chỉnh","category":"sales","categoryLabel":"Sales","order":15,"sha256":"3248fc0fbd5cadc7450a404b9145461ecf982fb892b133a446c8768a9b6dfa7f","lineCount":111,"headings":[{"level":1,"text":"Đồ Án Cuối Khóa: Kế Hoạch Sales Hoàn Chỉnh","id":"đồ-án-cuối-khóa-kế-hoạch-sales-hoàn-chỉnh"},{"level":2,"text":"Mục tiêu","id":"mục-tiêu"},{"level":2,"text":"Đề bài 1: Kế hoạch sales cho công ty mới","id":"đề-bài-1-kế-hoạch-sales-cho-công-ty-mới"},{"level":3,"text":"Đầu ra bắt buộc","id":"đầu-ra-bắt-buộc"},{"level":3,"text":"Mẫu nộp bài","id":"mẫu-nộp-bài"},{"level":2,"text":"Đề bài 2: Kế hoạch sales cho công ty đã có","id":"đề-bài-2-kế-hoạch-sales-cho-công-ty-đã-có"},{"level":3,"text":"Đầu ra bắt buộc","id":"đầu-ra-bắt-buộc-2"},{"level":2,"text":"Rubric đánh giá đồ án","id":"rubric-đánh-giá-đồ-án"},{"level":2,"text":"Checklist trước khi nộp","id":"checklist-trước-khi-nộp"},{"level":2,"text":"Kế hoạch kiểm chứng 30 ngày cho công ty mới","id":"kế-hoạch-kiểm-chứng-30-ngày-cho-công-ty-mới"},{"level":2,"text":"Kế hoạch 30/60/90 ngày cho công ty đã có","id":"kế-hoạch-30-60-90-ngày-cho-công-ty-đã-có"}],"rawMarkdown":"# Đồ Án Cuối Khóa: Kế Hoạch Sales Hoàn Chỉnh\n\n## Mục tiêu\n\nĐồ án cuối khóa không phải bài viết lý thuyết. Đây là bản kế hoạch sales có thể đem đi thảo luận, kiểm chứng hoặc triển khai thử. Người học chọn một trong hai đề bài: công ty mới hoặc công ty đã có.\n\n## Đề bài 1: Kế hoạch sales cho công ty mới\n\nChọn một ý tưởng kinh doanh mới và xây kế hoạch tìm 20-30 khách hàng đầu tiên.\n\n### Đầu ra bắt buộc\n\n| Phần | Nội dung cần có |\n|---|---|\n| ICP đầu tiên | Nhóm khách phù hợp, vấn đề, điều kiện mua, dấu hiệu không phù hợp |\n| Buying decision map | Trigger, pain, impact, rủi ro, người quyết định, tiêu chí mua |\n| Lead source | 3-5 nguồn tìm khách đầu tiên và lý do chọn |\n| Outreach plan | Thông điệp tiếp cận, CTA nhỏ, follow-up |\n| Qualification | Câu hỏi lọc khách và mức ưu tiên A/B/C |\n| Discovery guide | Câu hỏi bối cảnh, pain, impact, decision, timing |\n| Demo script | Demo theo vấn đề, bằng chứng, giới hạn claim |\n| Offer và giá | Gói dùng thử/trả phí, điều kiện thành công, risk reversal |\n| Objection matrix | Phản đối chính và cách hỏi sâu/xử lý |\n| Pipeline dashboard | Stage, next step, forecast, lý do won/lost |\n| Handoff | Kỳ vọng, onboarding, quick win và lịch review |\n| AI workflow | AI hỗ trợ gì, guardrails và người duyệt |\n\n### Mẫu nộp bài\n\n```markdown\n# Kế hoạch sales cho [tên ý tưởng]\n\n## 1. Tóm tắt một trang\n## 2. ICP và qualification\n## 3. Buying decision map\n## 4. Lead source và outreach plan\n## 5. Discovery guide\n## 6. Demo script và trust proof\n## 7. Offer, báo giá và closing plan\n## 8. Objection handling matrix\n## 9. Pipeline dashboard và forecast\n## 10. Handoff và customer success\n## 11. AI sales workflow và guardrails\n## 12. Kế hoạch kiểm chứng 30 ngày\n```\n\n## Đề bài 2: Kế hoạch sales cho công ty đã có\n\nChọn một công ty đang hoạt động và một sản phẩm/dịch vụ mới để bán có kiểm soát.\n\n### Đầu ra bắt buộc\n\n| Phần | Nội dung cần có |\n|---|---|\n| Mục tiêu sales | Vì sao sản phẩm mới quan trọng và doanh thu kỳ vọng |\n| ICP/khách hiện hữu | Nhóm khách nên bán đầu tiên, nhóm chưa nên bán |\n| Kênh bán | Sales trực tiếp, đại lý, showroom, khách cũ, đối tác |\n| Qualification | Điều kiện kỹ thuật, nhu cầu, người quyết định, timing |\n| Sales kit | FAQ, claim được nói/không được nói, bằng chứng |\n| Demo script | Kịch bản demo tạo giá trị và quản trị kỳ vọng |\n| Objection handling | Phản đối từ khách, đại lý, kỹ thuật, CS |\n| Pricing/proposal | Gói, giá, điều khoản, bảo hành, hỗ trợ |\n| Pipeline và forecast | Stage, giá trị deal, năng lực triển khai, rủi ro |\n| Handoff | Bàn giao từ sales/đại lý sang kỹ thuật và CS |\n| Feedback loop | Dữ liệu sau bán gửi về sales, marketing, product, CS |\n| Kế hoạch 30/60/90 ngày | Bán thử, cải tiến playbook, mở rộng có điều kiện |\n\n## Rubric đánh giá đồ án\n\n| Tiêu chí | Trọng số | Yếu | Đạt | Tốt | Xuất sắc |\n|---|---:|---|---|---|---|\n| Hiểu khách hàng | 20% | Mô tả chung chung | Có ICP và pain | Có bối cảnh, impact, decision maker | Có trigger, rủi ro, fit/unfit và dữ liệu cần kiểm chứng |\n| Logic sales | 20% | Các phần rời rạc | Có pipeline cơ bản | ICP, outreach, discovery, demo, close nối nhau | Mạch sales rõ và ra quyết định được |\n| Tính thực tế | 15% | Kế hoạch khó làm | Có hoạt động cơ bản | Có nguồn lực, timeline, next step | Có thử nghiệm nhỏ và tiêu chí dừng/tiếp tục |\n| Chỉ số | 10% | Chỉ có số lead | Có KPI cơ bản | Có conversion theo stage | Có forecast, CAC/sales cost và lý do won/lost |\n| Quản trị rủi ro | 10% | Không nêu rủi ro | Có vài rủi ro | Có objection và mitigation | Có guardrails claim, no-fit criteria và handoff |\n| Demo/niềm tin | 10% | Demo tính năng | Có demo sản phẩm | Demo theo pain và bằng chứng | Demo đúng kỳ vọng, có proof và giới hạn rõ |\n| Playbook/AI | 5% | Dùng chung chung | Có vài tài liệu | Có playbook hoặc AI workflow | Có guardrails, review và cập nhật từ dữ liệu thật |\n| Trình bày | 10% | Khó đọc | Đủ ý | Mạch lạc, dễ dùng | Rõ quyết định, có bảng biểu triển khai ngay |\n\n## Checklist trước khi nộp\n\n1. ICP có đủ rõ để loại bớt khách không?\n2. Có buying trigger, pain, impact và decision maker không?\n3. Outreach có liên quan và có bước tiếp theo nhỏ không?\n4. Discovery guide có hỏi sâu hơn nhu cầu bề mặt không?\n5. Demo có gắn với vấn đề khách nói không?\n6. Trust proof có khớp rủi ro khách lo không?\n7. Objection matrix có phân loại gốc phản đối không?\n8. Proposal có giá, phạm vi, giới hạn và điều kiện thành công không?\n9. Pipeline có next step, ngày hẹn và forecast không?\n10. Handoff có bảo vệ kỳ vọng sau bán không?\n11. AI có guardrails và người duyệt không?\n12. Kế hoạch có thử nghiệm nhỏ trong 7-30 ngày không?\n\n## Kế hoạch kiểm chứng 30 ngày cho công ty mới\n\n| Tuần | Mục tiêu | Hành động | Dữ liệu cần thu | Tiêu chí quyết định |\n|---|---|---|---|---|\n| 1 | Xác định ICP | 20 cuộc tiếp cận, 10 discovery | Pain, trigger, fit/unfit | Có ít nhất 5 khách đủ đau |\n| 2 | Kiểm chứng demo | 10 demo theo vấn đề | Câu hỏi, phản đối, trust gap | 5 khách đồng ý trial |\n| 3 | Kiểm chứng trial | Theo dõi hành vi dùng | Usage, quick win, feedback | 3 khách thấy giá trị rõ |\n| 4 | Kiểm chứng paid | Đề xuất gói trả phí | Paid conversion, lý do từ chối | Có tín hiệu giá trị và willingness to pay |\n\n## Kế hoạch 30/60/90 ngày cho công ty đã có\n\n| Giai đoạn | Mục tiêu | Hành động | Chỉ số | Điều kiện mở rộng |\n|---|---|---|---|---|\n| 1-30 ngày | Bán thử có kiểm soát | Chọn khách/đại lý phù hợp, demo, handoff | Demo, đơn thử, lỗi nghiêm trọng | Claim và demo ổn định |\n| 31-60 ngày | Cải tiến playbook | Sửa FAQ, objection, checklist, support | Conversion, feedback, NPS | Đại lý bán đúng kỳ vọng |\n| 61-90 ngày | Mở rộng có điều kiện | Thêm đại lý/kênh, tăng forecast | Doanh số, hỗ trợ, churn | Vận hành và chất lượng đạt chuẩn |\n"},{"sourcePath":"Sales/99_phu_luc_bo_cau_hoi_va_mau_bieu.md","title":"Phụ Lục: Bộ Câu Hỏi Và Mẫu Biểu Sales First Principles","category":"sales","categoryLabel":"Sales","order":16,"sha256":"e06d597ef0d69c23b2323e97714a2a774a6cea6c9b396b9d801e4ecc836fc06c","lineCount":223,"headings":[{"level":1,"text":"Phụ Lục: Bộ Câu Hỏi Và Mẫu Biểu Sales First Principles","id":"phụ-lục-bộ-câu-hỏi-và-mẫu-biểu-sales-first-principles"},{"level":2,"text":"Bộ câu hỏi first principles","id":"bộ-câu-hỏi-first-principles"},{"level":3,"text":"Về khách hàng phù hợp","id":"về-khách-hàng-phù-hợp"},{"level":3,"text":"Về quyết định mua","id":"về-quyết-định-mua"},{"level":3,"text":"Về discovery","id":"về-discovery"},{"level":3,"text":"Về demo và niềm tin","id":"về-demo-và-niềm-tin"},{"level":3,"text":"Về phản đối và chốt","id":"về-phản-đối-và-chốt"},{"level":3,"text":"Về pipeline và playbook","id":"về-pipeline-và-playbook"},{"level":2,"text":"Mẫu ICP Canvas","id":"mẫu-icp-canvas"},{"level":2,"text":"Mẫu Lead Qualification Sheet","id":"mẫu-lead-qualification-sheet"},{"level":2,"text":"Mẫu Discovery Call Guide","id":"mẫu-discovery-call-guide"},{"level":2,"text":"Mẫu Pain/Gain/Impact Map","id":"mẫu-pain-gain-impact-map"},{"level":2,"text":"Mẫu Demo Script","id":"mẫu-demo-script"},{"level":2,"text":"Mẫu Objection Handling Matrix","id":"mẫu-objection-handling-matrix"},{"level":2,"text":"Mẫu Proposal Brief","id":"mẫu-proposal-brief"},{"level":2,"text":"Mẫu Deal Review Sheet","id":"mẫu-deal-review-sheet"},{"level":2,"text":"Mẫu Pipeline Dashboard","id":"mẫu-pipeline-dashboard"},{"level":2,"text":"Mẫu Handoff Checklist","id":"mẫu-handoff-checklist"},{"level":2,"text":"Mẫu Sales Playbook Checklist","id":"mẫu-sales-playbook-checklist"},{"level":2,"text":"Mẫu AI Sales Workflow Và Guardrails","id":"mẫu-ai-sales-workflow-và-guardrails"},{"level":2,"text":"Checklist kiểm định từng bài","id":"checklist-kiểm-định-từng-bài"},{"level":2,"text":"Checklist kiểm định toàn giáo trình","id":"checklist-kiểm-định-toàn-giáo-trình"}],"rawMarkdown":"# Phụ Lục: Bộ Câu Hỏi Và Mẫu Biểu Sales First Principles\n\n## Bộ câu hỏi first principles\n\n### Về khách hàng phù hợp\n\n1. Khách hàng nào có vấn đề mà sản phẩm giải quyết tốt nhất?\n2. Dấu hiệu nào cho thấy vấn đề đủ đau?\n3. Ai là người dùng, ai trả tiền, ai ảnh hưởng quyết định?\n4. Điều kiện tối thiểu để khách dùng thành công là gì?\n5. Dấu hiệu nào cho thấy không nên bán?\n\n### Về quyết định mua\n\n1. Điều gì khiến khách bắt đầu nghiêm túc tìm giải pháp?\n2. Nếu không giải quyết, hậu quả là gì?\n3. Khách đang so sánh với lựa chọn thay thế nào?\n4. Rủi ro lớn nhất trong mắt khách là gì?\n5. Tiêu chí nào khiến khách chọn hoặc không chọn?\n\n### Về discovery\n\n1. Hiện tại khách đang làm việc này thế nào?\n2. Điều gì đang khó nhất?\n3. Vấn đề này ảnh hưởng đến tiền, thời gian, niềm tin hoặc kết quả ra sao?\n4. Khách đã thử cách nào và vì sao chưa ổn?\n5. Ai cần tham gia quyết định tiếp theo?\n\n### Về demo và niềm tin\n\n1. Demo có gắn với vấn đề khách vừa nói không?\n2. Tính năng nào chứng minh giá trị quan trọng nhất?\n3. Claim nào cần bằng chứng?\n4. Claim nào không được nói?\n5. Khách cần thấy bằng chứng gì để giảm rủi ro?\n\n### Về phản đối và chốt\n\n1. Phản đối này là về giá, giá trị, niềm tin, timing hay fit?\n2. Câu hỏi đào sâu nào cần hỏi trước khi trả lời?\n3. Có bằng chứng hoặc proposal nào phù hợp không?\n4. Nếu khách chưa sẵn sàng, bước tiếp theo là gì?\n5. Nếu chốt, onboarding đầu tiên là gì?\n\n### Về pipeline và playbook\n\n1. Mỗi deal đang ở stage nào?\n2. Stage dựa trên cam kết khách hay cảm giác sales?\n3. Deal có next step, người phụ trách và ngày hẹn không?\n4. Lý do won/lost có được ghi lại không?\n5. Dữ liệu này có cập nhật playbook không?\n\n## Mẫu ICP Canvas\n\n| Thành phần | Nội dung |\n|---|---|\n| Phân khúc khách hàng |  |\n| Bối cảnh |  |\n| Vấn đề chính |  |\n| Tác động của vấn đề |  |\n| Hành vi thay thế |  |\n| Người dùng |  |\n| Người trả tiền/quyết định |  |\n| Khả năng chi trả |  |\n| Timing tốt |  |\n| Điều kiện sử dụng/triển khai |  |\n| Dấu hiệu không phù hợp |  |\n\n## Mẫu Lead Qualification Sheet\n\n| Lead | Nguồn | ICP fit | Pain | Impact | Decision maker | Timing | Điều kiện triển khai | Ưu tiên |\n|---|---|---|---|---|---|---|---|---|\n|  |  |  |  |  |  |  |  |  |\n\n## Mẫu Discovery Call Guide\n\n| Mục tiêu | Câu hỏi chính | Câu hỏi đào sâu | Ghi chú |\n|---|---|---|---|\n| Bối cảnh |  |  |  |\n| Vấn đề |  |  |  |\n| Tác động |  |  |  |\n| Cách đang làm |  |  |  |\n| Người quyết định |  |  |  |\n| Tiêu chí mua |  |  |  |\n| Timing |  |  |  |\n| Next step |  |  |  |\n\n## Mẫu Pain/Gain/Impact Map\n\n| Pain | Gain mong muốn | Impact nếu không giải quyết | Giá trị sản phẩm liên quan | Bằng chứng |\n|---|---|---|---|---|\n|  |  |  |  |  |\n\n## Mẫu Demo Script\n\n| Phần | Nội dung |\n|---|---|\n| Vấn đề khách đã nói |  |\n| Mục tiêu demo |  |\n| Tình huống demo |  |\n| Tính năng cần trình diễn |  |\n| Bằng chứng đi kèm |  |\n| Giới hạn cần nói rõ |  |\n| Câu hỏi sau demo |  |\n| Bước tiếp theo |  |\n\n## Mẫu Objection Handling Matrix\n\n| Phản đối | Loại phản đối | Câu hỏi đào sâu | Bằng chứng/câu trả lời | Khi nào disqualify | Bước tiếp theo |\n|---|---|---|---|---|---|\n|  |  |  |  |  |  |\n\n## Mẫu Proposal Brief\n\n| Thành phần | Nội dung |\n|---|---|\n| Tóm tắt vấn đề |  |\n| Kết quả khách muốn |  |\n| Giải pháp/gói đề xuất |  |\n| Giá và điều khoản |  |\n| Bao gồm |  |\n| Không bao gồm/giới hạn |  |\n| Bằng chứng |  |\n| Điều kiện để thành công |  |\n| Bước tiếp theo |  |\n\n## Mẫu Deal Review Sheet\n\n| Thành phần | Nội dung |\n|---|---|\n| Deal |  |\n| Stage hiện tại |  |\n| Giá trị tiềm năng |  |\n| Pain/impact |  |\n| Người quyết định |  |\n| Phản đối chính |  |\n| Bằng chứng đã dùng |  |\n| Next step |  |\n| Rủi ro mất deal |  |\n| Quyết định: tiến/nuôi dưỡng/dừng |  |\n\n## Mẫu Pipeline Dashboard\n\n| Deal | Nguồn | Stage | Giá trị | Xác suất | Next step | Ngày hẹn | Rủi ro | Forecast | Lý do won/lost |\n|---|---|---|---:|---:|---|---|---|---|---|\n|  |  |  |  |  |  |  |  |  |  |\n\n## Mẫu Handoff Checklist\n\n| Mục bàn giao | Nội dung |\n|---|---|\n| Khách mua vì lý do gì |  |\n| Người dùng/người quyết định |  |\n| Gói/điều khoản đã chốt |  |\n| Kỳ vọng đã thống nhất |  |\n| Điều sales đã hứa |  |\n| Điều không được hứa |  |\n| Rủi ro churn |  |\n| Quick win đầu tiên |  |\n| Người phụ trách onboarding |  |\n| Lịch review |  |\n\n## Mẫu Sales Playbook Checklist\n\n| Phần playbook | Có/Không | Người phụ trách | Cần cập nhật |\n|---|---|---|---|\n| ICP |  |  |  |\n| Qualification |  |  |  |\n| Outreach message |  |  |  |\n| Discovery guide |  |  |  |\n| Demo script |  |  |  |\n| Trust proof |  |  |  |\n| Objection matrix |  |  |  |\n| Proposal template |  |  |  |\n| Pricing/discount rules |  |  |  |\n| CRM rules |  |  |  |\n| Handoff checklist |  |  |  |\n| Feedback loop |  |  |  |\n\n## Mẫu AI Sales Workflow Và Guardrails\n\n| Công việc | AI hỗ trợ gì? | Dữ liệu đầu vào | Không được làm | Người duyệt | Tiêu chuẩn đầu ra |\n|---|---|---|---|---|---|\n| Research lead |  |  |  |  |  |\n| Outreach |  |  |  |  |  |\n| Discovery summary |  |  |  |  |  |\n| Follow-up |  |  |  |  |  |\n| Proposal draft |  |  |  |  |  |\n| Pipeline review |  |  |  |  |  |\n\n## Checklist kiểm định từng bài\n\n| Câu hỏi kiểm định | Có/Không |\n|---|---|\n| Bài có một câu hỏi bản chất rõ không? |  |\n| Có tình huống mở bài cụ thể không? |  |\n| Có giải thích bằng ngôn ngữ người mới hiểu không? |  |\n| Phần lý thuyết nền có đủ sâu không? |  |\n| Thuật ngữ quan trọng có ví dụ đúng/sai không? |  |\n| Có khung tư duy trực quan không? |  |\n| Có ví dụ đời thường không? |  |\n| Có phân tích use case công ty mới không? |  |\n| Có phân tích use case công ty đã có không? |  |\n| Có chỉ ra lỗi phổ biến không? |  |\n| Có bài tập tạo đầu ra cụ thể không? |  |\n| Có bài tập review không? |  |\n| Có rubric yếu/đạt/tốt/xuất sắc không? |  |\n| Có checklist tự review không? |  |\n| Có hành động kiểm chứng thực tế không? |  |\n| Có liên hệ với bài trước và bài sau không? |  |\n\n## Checklist kiểm định toàn giáo trình\n\n1. Có mạch logic từ bản chất sales đến sales plan hoàn chỉnh.\n2. Có 2 use case xuyên suốt và nhất quán.\n3. Mỗi phần đều tạo ra artifact thực hành.\n4. Mỗi bài đều có tình huống, phân tích, bài tập, rubric.\n5. Mỗi bài có kiến thức nền đủ sâu để hiểu bản chất.\n6. Người mới có thể học mà không cần nền tảng sales trước đó.\n7. Có đủ ICP, qualification, outreach, discovery, demo, trust, objection, proposal, pipeline, handoff, playbook và AI.\n8. Có guardrails để tránh bán sai, overpromise và dùng AI thiếu kiểm soát.\n9. Có đủ phần cho công ty mới và công ty đã có.\n10. Đồ án cuối khóa có thể dùng làm kế hoạch sales thật để kiểm chứng.\n"}]}</script>
  <script>
    const DATA = JSON.parse(document.getElementById('courseData').textContent);
    const els = {
      tabs: [...document.querySelectorAll('.tab-button')],
      search: document.getElementById('searchInput'),
      clearSearch: document.getElementById('clearSearch'),
      lessonList: document.getElementById('lessonList'),
      lessonSelect: document.getElementById('lessonSelect'),
      article: document.getElementById('article'),
      sidebarTitle: document.getElementById('sidebarTitle'),
      lessonCount: document.getElementById('lessonCount'),
      crumb: document.getElementById('crumb'),
      tocTitle: document.getElementById('tocTitle'),
      tocList: document.getElementById('tocList')
    };

    const labels = { business: 'Kinh doanh', marketing: 'Marketing', sales: 'Sales' };
    const storageKey = 'gt-kd-mk-reader-state-v1';
    let state = readState();

    function readState() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
        return { category: saved.category || 'business', sourcePath: saved.sourcePath || null, query: '' };
      } catch {
        return { category: 'business', sourcePath: null, query: '' };
      }
    }

    function writeState() {
      localStorage.setItem(storageKey, JSON.stringify({ category: state.category, sourcePath: state.sourcePath }));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function inlineFormat(value) {
      const tokens = [];
      let text = escapeHtml(value).replace(/`([^`]+)`/g, (_, code) => {
        const token = `@@CODE${tokens.length}@@`;
        tokens.push(`<code>${code}</code>`);
        return token;
      });
      text = text
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/__([^_]+)__/g, '<strong>$1</strong>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      tokens.forEach((html, index) => { text = text.replace(`@@CODE${index}@@`, html); });
      return text;
    }

    function isTableDivider(line) {
      return /^\s*\|?\s*:?-{3,}:?(\s*\|\s*:?-{3,}:?)+\s*\|?\s*$/.test(line);
    }

    function splitTableRow(line) {
      return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
    }

    function renderTable(lines) {
      const header = splitTableRow(lines[0]);
      const body = lines.slice(2).filter(line => line.trim()).map(splitTableRow);
      const thead = `<thead><tr>${header.map(cell => `<th>${inlineFormat(cell)}</th>`).join('')}</tr></thead>`;
      const tbody = `<tbody>${body.map(row => `<tr>${row.map(cell => `<td>${inlineFormat(cell)}</td>`).join('')}</tr>`).join('')}</tbody>`;
      return `<div class="table-wrap"><table>${thead}${tbody}</table></div>`;
    }

    function renderMarkdown(markdown, headings) {
      const lines = markdown.replace(/\r\n/g, '\n').split('\n');
      const out = [];
      let i = 0;
      let headingIndex = 0;

      const collectParagraph = () => {
        const parts = [];
        while (i < lines.length && lines[i].trim() && !/^(#{1,6})\s+/.test(lines[i]) && !/^```/.test(lines[i]) && !/^\s*>/.test(lines[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) && !(lines[i].includes('|') && i + 1 < lines.length && isTableDivider(lines[i + 1]))) {
          parts.push(lines[i].trim());
          i += 1;
        }
        if (parts.length) out.push(`<p>${inlineFormat(parts.join(' '))}</p>`);
      };

      while (i < lines.length) {
        const line = lines[i];
        const trimmed = line.trim();
        if (!trimmed) { i += 1; continue; }

        if (/^```/.test(trimmed)) {
          const lang = trimmed.slice(3).trim();
          i += 1;
          const code = [];
          while (i < lines.length && !/^```/.test(lines[i].trim())) { code.push(lines[i]); i += 1; }
          if (i < lines.length) i += 1;
          out.push(`<pre><code${lang ? ` class="language-${escapeHtml(lang)}"` : ''}>${escapeHtml(code.join('\n'))}</code></pre>`);
          continue;
        }

        const heading = /^(#{1,6})\s+(.+?)\s*$/.exec(line);
        if (heading) {
          const level = heading[1].length;
          const text = heading[2].trim();
          const id = headings[headingIndex]?.id || `heading-${headingIndex + 1}`;
          headingIndex += 1;
          out.push(`<h${level} id="${escapeHtml(id)}">${inlineFormat(text)}</h${level}>`);
          i += 1;
          continue;
        }

        if (line.includes('|') && i + 1 < lines.length && isTableDivider(lines[i + 1])) {
          const tableLines = [lines[i], lines[i + 1]];
          i += 2;
          while (i < lines.length && lines[i].includes('|') && lines[i].trim()) { tableLines.push(lines[i]); i += 1; }
          out.push(renderTable(tableLines));
          continue;
        }

        if (/^\s*>/.test(line)) {
          const quote = [];
          while (i < lines.length && /^\s*>/.test(lines[i])) {
            quote.push(lines[i].replace(/^\s*>\s?/, ''));
            i += 1;
          }
          out.push(`<blockquote>${renderMarkdown(quote.join('\n'), [])}</blockquote>`);
          continue;
        }

        if (/^\s*([-*+])\s+/.test(line) || /^\s*\d+\.\s+/.test(line)) {
          const ordered = /^\s*\d+\.\s+/.test(line);
          const tag = ordered ? 'ol' : 'ul';
          const items = [];
          while (i < lines.length && (ordered ? /^\s*\d+\.\s+/.test(lines[i]) : /^\s*([-*+])\s+/.test(lines[i]))) {
            const item = lines[i].replace(ordered ? /^\s*\d+\.\s+/ : /^\s*([-*+])\s+/, '');
            items.push(`<li>${inlineFormat(item)}</li>`);
            i += 1;
          }
          out.push(`<${tag}>${items.join('')}</${tag}>`);
          continue;
        }

        if (/^-{3,}$/.test(trimmed)) { out.push('<hr>'); i += 1; continue; }

        collectParagraph();
      }
      return out.join('\n');
    }

    function getLessons(category = state.category) {
      return DATA.lessons.filter(lesson => lesson.category === category).sort((a, b) => a.order - b.order);
    }

    function normalize(value) {
      return String(value).toLocaleLowerCase('vi').normalize('NFD').replace(/[̀-ͯ]/g, '');
    }

    function filteredLessons() {
      const query = normalize(state.query.trim());
      const lessons = getLessons();
      if (!query) return lessons;
      return lessons.filter(lesson => normalize(`${lesson.title} ${lesson.sourcePath} ${lesson.rawMarkdown}`).includes(query));
    }

    function selectCategory(category) {
      state.category = category;
      const available = getLessons(category);
      if (!available.some(lesson => lesson.sourcePath === state.sourcePath)) {
        state.sourcePath = available[0]?.sourcePath || null;
      }
      writeState();
      render();
    }

    function selectLesson(sourcePath, pushTop = true) {
      state.sourcePath = sourcePath;
      writeState();
      render();
      if (pushTop) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function activeLesson() {
      const lessons = getLessons();
      return lessons.find(lesson => lesson.sourcePath === state.sourcePath) || lessons[0];
    }

    function renderLessonList() {
      const lessons = filteredLessons();
      els.lessonList.innerHTML = lessons.length ? lessons.map(lesson => `
        <button class="lesson-button ${lesson.sourcePath === state.sourcePath ? 'is-active' : ''}" type="button" data-source="${escapeHtml(lesson.sourcePath)}">
          <span class="lesson-number">${String(lesson.order).padStart(2, '0')}</span>
          <span>
            <span class="lesson-name">${escapeHtml(lesson.title)}</span>
          </span>
        </button>`).join('') : '<div class="empty-state">Không tìm thấy bài phù hợp.</div>';

      els.lessonSelect.innerHTML = getLessons().map(lesson => `<option value="${escapeHtml(lesson.sourcePath)}" ${lesson.sourcePath === state.sourcePath ? 'selected' : ''}>${String(lesson.order).padStart(2, '0')} · ${escapeHtml(lesson.title)}</option>`).join('');
    }

    function renderToc(lesson) {
      els.tocTitle.textContent = lesson.title;
      els.tocList.innerHTML = lesson.headings.length ? lesson.headings.map(item => `
        <a class="toc-link level-${item.level}" href="#${escapeHtml(item.id)}">${escapeHtml(item.text)}</a>`).join('') : '<div class="empty-state">Bài này chưa có heading.</div>';
    }

    function renderArticle(lesson) {
      els.article.innerHTML = renderMarkdown(lesson.rawMarkdown, lesson.headings);
      els.crumb.textContent = `${labels[lesson.category]} · ${lesson.title}`;
    }

    function render() {
      const all = getLessons();
      if (!state.sourcePath || !all.some(lesson => lesson.sourcePath === state.sourcePath)) {
        state.sourcePath = all[0]?.sourcePath || null;
      }
      const lesson = activeLesson();
      els.tabs.forEach(tab => tab.setAttribute('aria-selected', String(tab.dataset.category === state.category)));
      els.sidebarTitle.textContent = labels[state.category];
      els.lessonCount.textContent = `${getLessons().length} bài`;
      els.clearSearch.classList.toggle('is-visible', Boolean(state.query));
      renderLessonList();
      if (lesson) {
        renderArticle(lesson);
        renderToc(lesson);
      }
    }

    els.tabs.forEach(tab => tab.addEventListener('click', () => selectCategory(tab.dataset.category)));
    els.lessonList.addEventListener('click', event => {
      const button = event.target.closest('[data-source]');
      if (button) selectLesson(button.dataset.source);
    });
    els.lessonSelect.addEventListener('change', event => selectLesson(event.target.value));
    els.search.addEventListener('input', event => { state.query = event.target.value; renderLessonList(); els.clearSearch.classList.toggle('is-visible', Boolean(state.query)); });
    els.clearSearch.addEventListener('click', () => { state.query = ''; els.search.value = ''; renderLessonList(); els.clearSearch.classList.remove('is-visible'); els.search.focus(); });
    els.tocList.addEventListener('click', event => {
      const link = event.target.closest('a[href^="#"]');
      if (!link) return;
      event.preventDefault();
      const targetId = decodeURIComponent(link.hash.slice(1));
      document.getElementById(targetId)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      history.replaceState(null, '', link.getAttribute('href'));
    });

    render();
  </script>
