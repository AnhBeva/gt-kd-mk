 Onboarding phụ huynh và học sinh.\n- Theo dõi trẻ có học ngày đầu không.\n- Nhắc phụ huynh nếu trẻ bỏ học 2 ngày.\n- Ghi nhận lỗi bài tập hoặc báo cáo.\n- Phỏng vấn phụ huynh sau 7 ngày.\n- Tổng hợp dữ liệu retention và phản hồi.\n\nFounder nên trực tiếp tham gia để hiểu vì sao trẻ không học: bài quá khó, giao diện khó dùng, phụ huynh quên nhắc, hay giá trị chưa đủ rõ.\n\n## Use case 2: Công ty đã có\n\nCông ty smart home cần vận hành bài bản hơn:\n\n- Checklist điều kiện kỹ thuật trước khi bán loa.\n- Tài liệu câu lệnh được hỗ trợ.\n- Quy trình đại lý lắp đặt và bàn giao.\n- Mẫu ghi nhận lỗi gồm thiết bị, mạng, câu lệnh, thời gian, log.\n- SLA hỗ trợ khách đầu tiên.\n- Báo cáo lỗi hằng tuần cho R&D và product.\n\nĐiểm quan trọng là không để đại lý hứa quá mức hoặc tự xử lý lỗi không có dữ liệu.\n\n## Lỗi người mới thường mắc\n\n- Nghĩ vận hành chỉ cần sau khi có nhiều khách.\n- Không ghi nhận lỗi có cấu trúc.\n- Không phân biệt lỗi kỹ thuật với lỗi kỳ vọng.\n- Không có owner cho quy trình quan trọng.\n- Tăng trưởng trước khi hệ thống hỗ trợ sẵn sàng.\n- Không tính chi phí vận hành vào mô hình kinh doanh.\n\n## Bài tập ứng dụng\n\nThiết kế bảng vận hành:\n\n| Quy trình | Người phụ trách | Đầu vào | Đầu ra | Chỉ số đo | Rủi ro |\n|---|---|---|---|---|---|\n| Bán hàng |  |  |  |  |  |\n| Triển khai/onboarding |  |  |  |  |  |\n| Hỗ trợ khách hàng |  |  |  |  |  |\n| Xử lý lỗi |  |  |  |  |  |\n| Cải tiến sản phẩm |  |  |  |  |  |\n\n## Bài tập review\n\nReview tình huống:\n\n> \"Có khách phàn nàn sản phẩm lỗi. Sales nói do khách dùng sai. Kỹ thuật nói do sales hứa quá. Product nói chưa nhận đủ dữ liệu.\"\n\n| Nội dung review | Nhận xét |\n|---|---|\n| Thiếu quy trình nào? |  |\n| Thiếu dữ liệu nào? |  |\n| Ai nên là owner? |  |\n| Cần phân loại lỗi ra sao? |  |\n| Cải tiến hệ thống thế nào? |  |\n\n## Tiêu chí đánh giá\n\n| Mức | Biểu hiện |\n|---|---|\n| Yếu | Chỉ nói chung chung về chăm sóc khách hàng |\n| Đạt | Có quy trình chính, owner và chỉ số cơ bản |\n| Tốt | Có phân loại lỗi, dữ liệu đầu vào, SLA và vòng phản hồi |\n| Xuất sắc | Thiết kế vận hành vừa đủ cho giai đoạn, kiểm soát rủi ro mở rộng và liên kết với tài chính/sản phẩm |\n\n## Checklist tự review\n\n- Khách mua xong sẽ đi qua những bước nào?\n- Mỗi bước ai chịu trách nhiệm?\n- Lỗi được ghi nhận bằng dữ liệu gì?\n- Chỉ số nào cho biết chất lượng đang giảm?\n- Quy trình có chạy được khi số khách tăng gấp 5 không?\n\n## Hành động nhỏ trong 30-90 phút\n\nVẽ quy trình từ lúc khách quan tâm đến lúc khách nhận giá trị đầu tiên. Đánh dấu 3 điểm dễ lỗi nhất và viết cách ghi nhận dữ liệu cho từng điểm.\n\n"},{"sourcePath":"Kinh doanh/09_tai_chinh_kinh_doanh.md","title":"Bài 9. Doanh nghiệp sống bằng lợi nhuận và dòng tiền","category":"business","categoryLabel":"Kinh doanh","order":10,"sha256":"ae32f951e3b7538335ff385df1ffb2d10dc3c120a497c5180d3bcf523591f060","lineCount":155,"headings":[{"level":1,"text":"Bài 9. Doanh nghiệp sống bằng lợi nhuận và dòng tiền","id":"bài-9-doanh-nghiệp-sống-bằng-lợi-nhuận-và-dòng-tiền"},{"level":2,"text":"Mục tiêu học tập","id":"mục-tiêu-học-tập"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động nhỏ trong 30-90 phút","id":"hành-động-nhỏ-trong-30-90-phút"}],"rawMarkdown":"# Bài 9. Doanh nghiệp sống bằng lợi nhuận và dòng tiền\n\n## Mục tiêu học tập\n\nSau bài này, người học có thể:\n\n- Phân biệt doanh thu, lợi nhuận và dòng tiền.\n- Hiểu các chỉ số cơ bản: giá vốn, biên lợi nhuận gộp, CAC, LTV, payback.\n- Nhìn ra vì sao càng bán nhiều vẫn có thể càng lỗ.\n- Lập bảng unit economics sơ bộ.\n\n## Câu hỏi bản chất\n\n> Doanh nghiệp có thể sống khỏe nếu càng bán càng lỗ không?\n\n## Tình huống mở bài\n\nApp AI giáo dục bán gói 99.000 đồng/tháng. Chi phí quảng cáo và tư vấn để có một phụ huynh trả tiền là 300.000 đồng. Trung bình phụ huynh dùng 2 tháng rồi hủy. Doanh thu mỗi khách là 198.000 đồng, chưa tính chi phí AI, hỗ trợ và vận hành.\n\nDoanh thu có thật. Nhưng mô hình đang âm.\n\n## Nguyên lý first principles\n\nDoanh thu không phải sức khỏe thật. Doanh nghiệp sống bằng khả năng tạo lợi nhuận và quản lý dòng tiền.\n\nCác câu hỏi gốc:\n\n1. Một khách hàng trả bao nhiêu?\n2. Chi phí trực tiếp để phục vụ khách là bao nhiêu?\n3. Chi phí để có khách là bao nhiêu?\n4. Khách ở lại bao lâu?\n5. Tiền vào có kịp trước tiền ra không?\n6. Càng tăng trưởng, dòng tiền tốt hơn hay xấu hơn?\n\n## Kiến thức nền chi tiết\n\nDoanh thu là số tiền doanh nghiệp ghi nhận từ bán hàng. Lợi nhuận là phần còn lại sau khi trừ chi phí. Dòng tiền là tiền thật vào và ra trong tài khoản. Một doanh nghiệp có thể có doanh thu cao nhưng lợi nhuận thấp. Một doanh nghiệp có thể có lợi nhuận trên giấy nhưng thiếu tiền mặt vì khách trả chậm, tồn kho cao hoặc phải chi trước quá nhiều.\n\nGiá vốn là chi phí trực tiếp để tạo ra sản phẩm hoặc dịch vụ. Với phần cứng, giá vốn gồm linh kiện, sản xuất, đóng gói. Với phần mềm AI, giá vốn có thể gồm cloud, AI inference, lưu trữ, hỗ trợ trực tiếp. Biên lợi nhuận gộp cho biết sau khi bán một đơn, doanh nghiệp còn lại bao nhiêu để trả cho marketing, sales, R&D, quản lý và lợi nhuận.\n\nCAC là chi phí có khách hàng mới. Không nên chỉ tính tiền quảng cáo. CAC thật có thể gồm quảng cáo, khuyến mãi, lương sales, hoa hồng, công cụ, sự kiện và chi phí onboarding. LTV là giá trị vòng đời khách hàng, tức tổng lợi nhuận gộp một khách tạo ra trong thời gian họ ở lại. Nếu CAC cao hơn LTV, càng tăng trưởng càng lỗ.\n\nDòng tiền đặc biệt quan trọng vì doanh nghiệp chết khi hết tiền, không phải khi hết ý tưởng. Bán thiết bị có thể phải trả tiền sản xuất trước, tồn kho trước, chiết khấu đại lý trước, nhưng thu tiền sau. Bán thuê bao có thể thu ít mỗi tháng trong khi chi phí phát triển và marketing trả ngay.\n\nTài chính không phải việc của kế toán sau cùng. Nó là công cụ ra quyết định: có nên giảm giá không, có nên chạy quảng cáo không, có nên thuê sales không, có nên bán thuê bao không, có nên launch rộng không.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Câu hỏi kiểm tra |\n|---|---|---|---|---|---|---|\n| Doanh thu | Tiền bán hàng | Tổng tiền khách trả hoặc cam kết trả | Chưa nói doanh nghiệp khỏe | 1.000 khách trả 99.000đ | Gọi doanh thu là lợi nhuận | Sau doanh thu còn chi phí gì? |\n| Biên lợi nhuận gộp | Phần còn lại sau giá vốn | Mỗi đơn còn bao nhiêu trước chi phí bán và quản lý | Không gian để doanh nghiệp thở | Bán 1 triệu, giá vốn 600k, biên 40% | Bỏ qua cloud/AI | Chi phí trực tiếp đã tính đủ chưa? |\n| CAC | Chi phí có khách mới | Tốn bao nhiêu để có một người mua | Đo tăng trưởng có đắt không | Tổng sales+ads/khách mới | Chỉ tính ads | Nếu tắt khuyến mãi, CAC thật còn bao nhiêu? |\n| LTV | Giá trị vòng đời khách | Một khách tạo bao nhiêu lợi nhuận trong thời gian ở lại | Đo giá trị dài hạn | Khách trả 12 tháng và có biên 70% | Tính doanh thu trọn đời nhưng quên chi phí | LTV có lớn hơn CAC không? |\n| Dòng tiền | Tiền thật vào ra | Tiền trong ví doanh nghiệp | Quyết định sống còn | Thu trước trả sau tốt cho dòng tiền | Lợi nhuận giấy nhưng thiếu tiền mặt | Tháng này tiền vào có đủ tiền ra không? |\n\n## Khung tư duy trực quan\n\n```text\nGiá bán\n- Giá vốn\n= Lợi nhuận gộp\n- CAC\n- Chi phí hỗ trợ/vận hành\n= Giá trị kinh tế trên mỗi khách\n```\n\n## Ví dụ đời thường\n\nMột người bán bánh thu 10 triệu/ngày nghe rất tốt. Nhưng nếu nguyên liệu, thuê mặt bằng, nhân công, giao hàng, bánh hỏng và khuyến mãi hết 9,8 triệu, lợi nhuận chỉ còn 200.000 đồng. Nếu còn phải trả nợ máy móc mỗi tháng, dòng tiền có thể vẫn căng.\n\n## Use case 1: Công ty mới\n\nNếu app AI giáo dục thu 99.000 đồng/tháng, khách ở lại 2 tháng, doanh thu là 198.000 đồng. Nếu biên lợi nhuận gộp sau cloud và hỗ trợ là 70%, lợi nhuận gộp chỉ khoảng 138.600 đồng. Nếu CAC là 300.000 đồng, mỗi khách mới đang âm trước cả chi phí đội ngũ.\n\nStartup có 4 hướng:\n\n- Tăng retention.\n- Tăng giá hoặc bán gói cao hơn.\n- Giảm CAC bằng kênh giới thiệu/đối tác.\n- Đổi phân khúc có willingness to pay cao hơn.\n\n## Use case 2: Công ty đã có\n\nLoa thông minh bán một lần nhưng có chi phí định kỳ. Công ty cần tính tổng chi phí trong vòng đời thiết bị:\n\n- Giá vốn phần cứng.\n- Chiết khấu đại lý.\n- Cloud/AI mỗi tháng.\n- OTA và bảo trì phần mềm.\n- Hỗ trợ kỹ thuật.\n- Bảo hành đổi trả.\n\nNếu biên phần cứng không đủ bù chi phí 3 năm, công ty cần mô hình dịch vụ, gói premium, bán kèm thiết bị khác hoặc giới hạn tính năng tốn chi phí.\n\n## Lỗi người mới thường mắc\n\n- Tưởng có doanh thu là có lời.\n- Không tính CAC đầy đủ.\n- Không tính chi phí hỗ trợ và vận hành định kỳ.\n- Không phân biệt lợi nhuận trên giấy với tiền mặt.\n- Giảm giá để tăng đơn nhưng làm biên lợi nhuận âm.\n- Không tính thời gian hoàn vốn.\n\n## Bài tập ứng dụng\n\nTính unit economics:\n\n| Chỉ số | Giá trị | Ghi chú/giả định |\n|---|---:|---|\n| Giá bán |  |  |\n| Giá vốn |  |  |\n| Biên lợi nhuận gộp |  |  |\n| CAC |  |  |\n| Số tháng khách ở lại |  |  |\n| LTV |  |  |\n| Chi phí hỗ trợ |  |  |\n| Chi phí vận hành định kỳ |  |  |\n| Thời gian hoàn vốn |  |  |\n\n## Bài tập review\n\nReview câu sau:\n\n> \"Chúng tôi đang tăng trưởng tốt vì doanh thu tháng này gấp đôi tháng trước.\"\n\n| Nội dung review | Nhận xét |\n|---|---|\n| Biên lợi nhuận có tăng không? |  |\n| CAC có thay đổi không? |  |\n| Dòng tiền tháng này thế nào? |  |\n| Khách mới có ở lại không? |  |\n| Tăng trưởng này có bền không? |  |\n\n## Tiêu chí đánh giá\n\n| Mức | Biểu hiện |\n|---|---|\n| Yếu | Chỉ nêu doanh thu, không tính chi phí |\n| Đạt | Có giá bán, giá vốn, CAC và doanh thu cơ bản |\n| Tốt | Tính được biên, LTV, payback và rủi ro dòng tiền |\n| Xuất sắc | Chỉ ra mô hình càng tăng càng lời hay lỗ, kịch bản cải thiện và giả thuyết tài chính cần kiểm chứng |\n\n## Checklist tự review\n\n- Tôi có phân biệt doanh thu, lợi nhuận và dòng tiền không?\n- CAC đã tính đủ sales, marketing, khuyến mãi và công cụ chưa?\n- LTV dựa trên retention thật hay giả định?\n- Chi phí định kỳ đã được tính chưa?\n- Nếu tăng gấp 10 khách, tiền mặt có chịu nổi không?\n\n## Hành động nhỏ trong 30-90 phút\n\nLấy một sản phẩm bạn biết và ước lượng unit economics bằng số gần đúng. Không cần chính xác tuyệt đối, nhưng phải ghi rõ giả định nào là chưa có dữ liệu.\n\n"},{"sourcePath":"Kinh doanh/10_tang_truong_ben_vung.md","title":"Bài 10. Tăng trưởng bền vững","category":"business","categoryLabel":"Kinh doanh","order":11,"sha256":"1abe21e76803f35be139147a14fa0cb886f949c42ce02b04dccd213cd0efaeaf","lineCount":151,"headings":[{"level":1,"text":"Bài 10. Tăng trưởng bền vững","id":"bài-10-tăng-trưởng-bền-vững"},{"level":2,"text":"Mục tiêu học tập","id":"mục-tiêu-học-tập"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động nhỏ trong 30-90 phút","id":"hành-động-nhỏ-trong-30-90-phút"}],"rawMarkdown":"# Bài 10. Tăng trưởng bền vững\n\n## Mục tiêu học tập\n\nSau bài này, người học có thể:\n\n- Giải thích tăng trưởng đến từ những nguồn nào.\n- Phân biệt tăng trưởng do giá trị thật với tăng trưởng mua bằng tiền.\n- Hiểu retention, referral, upsell, conversion và growth loop.\n- Thiết kế growth engine sơ bộ cho một doanh nghiệp.\n\n## Câu hỏi bản chất\n\n> Tăng trưởng đến từ đâu và có bền không?\n\n## Tình huống mở bài\n\nStartup AI giáo dục có 1.000 người dùng đăng ký sau một chiến dịch quảng cáo. Nhưng sau 30 ngày, chỉ 12% học đều. Đội ngũ phân vân có nên tiếp tục đổ tiền quảng cáo để tăng người dùng hay dừng lại sửa sản phẩm.\n\nNếu khách không ở lại, tăng trưởng đầu vào chỉ làm lỗ nhanh hơn.\n\n## Nguyên lý first principles\n\nTăng trưởng bền vững phải dựa trên giá trị thật, khả năng thu tiền và năng lực vận hành.\n\nTăng trưởng có thể đến từ:\n\n- Có thêm khách hàng mới.\n- Tăng tỷ lệ chuyển đổi.\n- Tăng giá trị đơn hàng.\n- Tăng tần suất mua lại.\n- Giảm tỷ lệ rời bỏ.\n- Tăng giới thiệu tự nhiên.\n- Bán thêm sản phẩm liên quan.\n- Mở rộng thị trường mới.\n\n## Kiến thức nền chi tiết\n\nTăng trưởng không phải lúc nào cũng tốt. Nếu sản phẩm chưa tạo giá trị, càng tăng khách càng tăng thất vọng. Nếu unit economics âm, càng tăng doanh thu càng tăng lỗ. Nếu vận hành chưa ổn, càng tăng đơn càng tăng lỗi. Vì vậy câu hỏi đúng không phải chỉ là \"làm sao tăng nhanh\", mà là \"tăng thứ gì, dựa trên cơ chế nào, và có phá vỡ hệ thống không\".\n\nAcquisition là có khách mới. Conversion là tỷ lệ khách đi từ quan tâm sang hành động mong muốn. Retention là khách có quay lại không. Upsell là bán gói cao hơn hoặc sản phẩm bổ sung. Referral là khách giới thiệu khách khác. Một doanh nghiệp khỏe thường không chỉ dựa vào acquisition trả tiền, mà có sự kết hợp giữa giá trị sản phẩm, retention, truyền miệng, kênh bán và kinh tế đơn vị.\n\nGrowth loop là vòng tăng trưởng tự nuôi. Ví dụ khách dùng sản phẩm, nhận giá trị, chia sẻ kết quả với người khác, người khác đăng ký, dữ liệu tăng lên, sản phẩm tốt hơn, lại tạo thêm chia sẻ. Không phải doanh nghiệp nào cũng có growth loop mạnh, nhưng tư duy vòng lặp giúp tránh phụ thuộc hoàn toàn vào quảng cáo.\n\nTăng trưởng cũng phải phù hợp giai đoạn. Giai đoạn chưa rõ product-market fit nên tăng trưởng để học, không phải để tối đa hóa quy mô. Giai đoạn đã rõ giá trị và unit economics hợp lý mới nên mở rộng kênh, tăng ngân sách, tuyển sales hoặc nhân rộng thị trường.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Câu hỏi kiểm tra |\n|---|---|---|---|---|---|---|\n| Acquisition | Có khách/người dùng mới | Đưa người lạ vào hệ thống | Đầu vào của tăng trưởng | 100 phụ huynh đăng ký dùng thử | Mua lead không đúng khách | Khách mới có đúng phân khúc không? |\n| Conversion | Tỷ lệ chuyển bước | Bao nhiêu người làm hành động tiếp theo | Đo sức thuyết phục của hành trình | 20% dùng thử trả tiền | Chỉ đo lượt xem | Bước nào đang rơi nhiều nhất? |\n| Retention | Khách quay lại/dùng tiếp | Khách có còn thấy giá trị không | Tín hiệu giá trị thật | Trẻ học 5/7 ngày mỗi tuần | Nhiều đăng ký nhưng bỏ sau 1 ngày | Khách có lý do quay lại không? |\n| Referral | Giới thiệu tự nhiên | Khách kéo thêm khách | Tăng trưởng nhờ niềm tin | Phụ huynh giới thiệu nhóm lớp | Ép chia sẻ để nhận quà | Khách có tự hào khi giới thiệu không? |\n| Growth loop | Vòng lặp tăng trưởng | Một hành vi tạo đầu vào cho vòng tiếp theo | Tăng trưởng có cơ chế tự nuôi | Báo cáo tiến bộ được phụ huynh chia sẻ | Mỗi tháng lại mua ads từ đầu | Vòng lặp có thật hay chỉ là mong muốn? |\n\n## Khung tư duy trực quan\n\n```text\nKhách mới -> Kích hoạt -> Nhận giá trị -> Quay lại -> Trả tiền thêm/Giới thiệu -> Khách mới\n```\n\n## Ví dụ đời thường\n\nMột lớp học yoga tăng trưởng bền khi học viên đi đều, thấy khỏe hơn, rủ bạn bè, mua gói dài hơn và giáo viên vẫn giữ chất lượng. Nếu chỉ giảm giá để có học viên mới nhưng người cũ bỏ lớp, đó không phải tăng trưởng khỏe.\n\n## Use case 1: Công ty mới\n\nStartup AI giáo dục có retention 12% sau 30 ngày. Việc cần làm không phải tăng quảng cáo ngay, mà là hiểu vì sao 88% không dùng đều:\n\n- Trẻ thấy bài khó hay chán?\n- Phụ huynh quên nhắc?\n- Báo cáo không đủ thuyết phục?\n- Giá trị chỉ xuất hiện sau quá lâu?\n- Onboarding chưa giúp trẻ bắt đầu dễ?\n\nGrowth engine khả thi ban đầu:\n\n| Nguồn tăng trưởng | Cơ chế | Chỉ số |\n|---|---|---|\n| Phụ huynh giới thiệu | Báo cáo tiến bộ dễ chia sẻ | Số lời giới thiệu/phụ huynh |\n| Retention | Lộ trình 10 phút/ngày vừa sức | Ngày học trong tuần |\n| Upsell | Gói hỗ trợ chuyên sâu | Tỷ lệ nâng cấp |\n\n## Use case 2: Công ty đã có\n\nLoa thông minh có thể tăng trưởng gián tiếp cho hệ sinh thái:\n\n- Giúp đại lý demo smart home hấp dẫn hơn.\n- Tăng tỷ lệ khách mua thêm công tắc, cảm biến, rèm, camera.\n- Tăng sự gắn bó của khách đã lắp hệ sinh thái.\n- Tạo dữ liệu câu lệnh để cải thiện sản phẩm.\n\nDo đó chỉ số tăng trưởng không chỉ là số loa bán ra, mà còn là giá trị đơn hàng smart home, tỷ lệ nâng cấp, tỷ lệ khách dùng giọng nói hằng tuần và số lỗi hỗ trợ.\n\n## Lỗi người mới thường mắc\n\n- Tăng acquisition khi retention thấp.\n- Nhầm lượt đăng ký với tăng trưởng thật.\n- Không tính chi phí để tăng trưởng.\n- Không nhìn năng lực vận hành khi mở rộng.\n- Tưởng viral là kế hoạch, không thiết kế cơ chế chia sẻ.\n- Mở rộng thị trường mới trước khi thắng thị trường đầu tiên.\n\n## Bài tập ứng dụng\n\nThiết kế growth engine:\n\n| Nguồn tăng trưởng | Cơ chế | Chỉ số đo | Rủi ro | Hành động cải thiện |\n|---|---|---|---|---|\n| Khách hàng mới |  |  |  |  |\n| Chuyển đổi |  |  |  |  |\n| Mua lại/duy trì |  |  |  |  |\n| Bán thêm |  |  |  |  |\n| Giới thiệu |  |  |  |  |\n\n## Bài tập review\n\nReview câu sau:\n\n> \"Retention chưa tốt nhưng cứ tăng quảng cáo để có nhiều người dùng hơn, sau đó sản phẩm sẽ tự cải thiện.\"\n\n| Nội dung review | Nhận xét |\n|---|---|\n| Rủi ro tài chính là gì? |  |\n| Rủi ro thương hiệu là gì? |  |\n| Cần đo retention thế nào? |  |\n| Nên sửa gì trước khi tăng ads? |  |\n| Khi nào mới nên mở rộng? |  |\n\n## Tiêu chí đánh giá\n\n| Mức | Biểu hiện |\n|---|---|\n| Yếu | Chỉ nói tăng doanh thu/người dùng, không có cơ chế |\n| Đạt | Nêu được vài nguồn tăng trưởng và chỉ số cơ bản |\n| Tốt | Phân tích acquisition, conversion, retention, referral và rủi ro |\n| Xuất sắc | Thiết kế growth engine có vòng lặp, điều kiện mở rộng và liên kết với tài chính/vận hành |\n\n## Checklist tự review\n\n- Tăng trưởng đang đến từ nguồn nào?\n- Khách có nhận giá trị và quay lại không?\n- CAC và LTV có cho phép mở rộng không?\n- Vận hành có chịu được tăng trưởng không?\n- Có vòng lặp nào tự nuôi hay phải mua tăng trưởng mãi?\n\n## Hành động nhỏ trong 30-90 phút\n\nVẽ funnel hoặc growth loop cho sản phẩm của bạn. Ghi chỉ số cho từng bước và đánh dấu bước yếu nhất cần cải thiện trong 7 ngày tới.\n\n"},{"sourcePath":"Kinh doanh/11_quan_tri_rui_ro.md","title":"Bài 11. Vì sao doanh nghiệp thất bại?","category":"business","categoryLabel":"Kinh doanh","order":12,"sha256":"d2b64a32a92bd7b92e284892a68ccfff22540ad7b0365a147864e050d9ce221f","lineCount":148,"headings":[{"level":1,"text":"Bài 11. Vì sao doanh nghiệp thất bại?","id":"bài-11-vì-sao-doanh-nghiệp-thất-bại"},{"level":2,"text":"Mục tiêu học tập","id":"mục-tiêu-học-tập"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động nhỏ trong 30-90 phút","id":"hành-động-nhỏ-trong-30-90-phút"}],"rawMarkdown":"# Bài 11. Vì sao doanh nghiệp thất bại?\n\n## Mục tiêu học tập\n\nSau bài này, người học có thể:\n\n- Nhìn rủi ro như một phần bắt buộc của kinh doanh, không phải điều bi quan.\n- Phân loại rủi ro nhu cầu, trả tiền, sản phẩm, kênh, tài chính, vận hành, thương hiệu, pháp lý và dữ liệu.\n- Xác định giả thuyết nguy hiểm nhất.\n- Lập risk register và kế hoạch kiểm chứng.\n\n## Câu hỏi bản chất\n\n> Điều gì có thể làm một doanh nghiệp tốt trên giấy thất bại ngoài thị trường?\n\n## Tình huống mở bài\n\nStartup gọi vốn, tuyển đội ngũ, xây app đầy đủ trong 12 tháng. Khi ra mắt, phụ huynh tải app nhưng trẻ không học đều và ít người trả tiền. Công ty smart home launch loa thông minh rộng rãi, nhưng sản phẩm nhận lệnh chưa ổn, đại lý bị khách phàn nàn, đội hỗ trợ quá tải.\n\nCả hai trường hợp đều không thất bại vì thiếu nỗ lực. Họ thất bại vì rủi ro quan trọng không được kiểm chứng sớm.\n\n## Nguyên lý first principles\n\nRủi ro lớn nhất thường nằm ở giả định nếu sai thì toàn bộ kế hoạch sụp.\n\nCác nhóm rủi ro chính:\n\n1. Không có nhu cầu thật.\n2. Khách hàng không trả tiền.\n3. Sản phẩm không đủ tốt.\n4. Kênh bán không hiệu quả.\n5. Chi phí cao hơn doanh thu.\n6. Vận hành không theo kịp tăng trưởng.\n7. Thương hiệu bị tổn hại.\n8. Pháp lý và dữ liệu.\n9. Con người và tổ chức.\n\n## Kiến thức nền chi tiết\n\nKinh doanh luôn có rủi ro vì doanh nghiệp ra quyết định dưới điều kiện thiếu dữ liệu. Không thể loại bỏ hết rủi ro, nhưng có thể giảm rủi ro bằng cách gọi tên giả định, ưu tiên giả định nguy hiểm nhất và thiết kế thử nghiệm nhỏ trước khi đầu tư lớn.\n\nRủi ro không giống vấn đề đã xảy ra. Rủi ro là điều có thể xảy ra và nếu xảy ra sẽ gây tác động. Quản trị rủi ro tốt không đợi sự cố mới phản ứng. Nó hỏi trước: điều gì có thể sai, dấu hiệu sớm là gì, khả năng xảy ra ra sao, tác động lớn thế nào, ai theo dõi, và phương án xử lý là gì.\n\nGiả thuyết nguy hiểm nhất không phải lúc nào cũng là giả thuyết kỹ thuật khó nhất. Với startup, giả thuyết nguy hiểm có thể là phụ huynh không sẵn sàng trả tiền, trẻ không dùng đều, hoặc kênh có khách quá đắt. Với công ty đã có, giả thuyết nguy hiểm có thể là sản phẩm mới làm hỏng niềm tin thương hiệu, đại lý không bán đúng kỳ vọng, hoặc chi phí hỗ trợ vượt dự tính.\n\nThử nghiệm giảm rủi ro phải nhỏ nhưng thật. Phỏng vấn giúp hiểu ngôn ngữ và động lực, nhưng không đủ chứng minh hành vi mua. Landing page giúp đo quan tâm, nhưng không đủ chứng minh retention. Dùng thử 14 ngày giúp đo hành vi, nhưng vẫn cần xem khách có trả tiền không. Mỗi loại thử nghiệm trả lời một phần câu hỏi.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Câu hỏi kiểm tra |\n|---|---|---|---|---|---|---|\n| Rủi ro | Điều có thể sai và gây tác động | Việc chưa xảy ra nhưng cần chuẩn bị | Quản trị sự bất định | Phụ huynh không trả tiền sau dùng thử | \"Có nhiều đối thủ\" nhưng không phân tích tác động | Nếu xảy ra, kế hoạch hỏng thế nào? |\n| Giả thuyết nguy hiểm nhất | Giả định nếu sai sẽ làm kế hoạch sụp | Điều cần kiểm chứng trước nhất | Ưu tiên học trước khi đầu tư lớn | Trẻ không học đều dù app tốt | Kiểm chứng màu giao diện trước | Giả định nào sai thì không nên làm tiếp? |\n| Dấu hiệu sớm | Tín hiệu cảnh báo trước khi rủi ro nặng | Đèn báo cần chú ý | Giúp phản ứng sớm | Tỷ lệ hoàn thành ngày 3 thấp | Chỉ nhìn doanh thu cuối tháng | Dấu hiệu nào xuất hiện trước sự cố? |\n| Risk register | Bảng quản lý rủi ro | Danh sách rủi ro, tác động, owner, cách xử lý | Biến lo lắng thành hệ thống | Bảng rủi ro sản phẩm, tài chính, vận hành | Ghi rủi ro trong đầu | Ai theo dõi và xử lý? |\n\n## Khung tư duy trực quan\n\n```text\nGiả định -> Rủi ro nếu sai -> Dấu hiệu sớm -> Thử nghiệm nhỏ -> Quyết định\n```\n\n## Ví dụ đời thường\n\nMở quán cà phê không chỉ rủi ro là \"không có khách\". Rủi ro cụ thể hơn: khách khu vực không uống mức giá này, giờ cao điểm phục vụ chậm, chi phí thuê quá cao, nhân viên pha không ổn định, đối thủ gần đó có tệp khách trung thành. Mỗi rủi ro cần cách kiểm chứng khác nhau.\n\n## Use case 1: Công ty mới\n\nRisk register ban đầu của startup AI giáo dục:\n\n| Rủi ro | Dấu hiệu sớm | Thử nghiệm |\n|---|---|---|\n| Phụ huynh không đau đủ | Phỏng vấn chỉ nói \"hay\" nhưng không kể hành động đã làm | Phỏng vấn 20 phụ huynh có con yếu toán |\n| Trẻ không dùng đều | Hoàn thành dưới 3/7 ngày | Dùng thử 14 ngày |\n| Không trả tiền | Ít phụ huynh chọn gói trả phí | Đề nghị trả tiền sau dùng thử |\n| CAC quá cao | Lead rẻ nhưng không đúng khách | Test 2-3 kênh nhỏ |\n\n## Use case 2: Công ty đã có\n\nRisk register ban đầu của loa thông minh:\n\n| Rủi ro | Dấu hiệu sớm | Phương án |\n|---|---|---|\n| Nhận lệnh không ổn | Tỷ lệ lỗi theo câu lệnh cao | Giới hạn phạm vi sell-ready |\n| Đại lý hứa quá mức | Khiếu nại về tính năng chưa công bố | Đào tạo và tài liệu bán hàng |\n| Hỗ trợ quá tải | Ticket tăng sau lắp đặt | Launch theo batch nhỏ |\n| Ảnh hưởng thương hiệu | Review tiêu cực về trải nghiệm cơ bản | Dừng mở rộng, hotfix, truyền thông rõ phạm vi |\n\n## Lỗi người mới thường mắc\n\n- Không viết giả định ra giấy.\n- Kiểm chứng điều dễ thay vì điều nguy hiểm.\n- Hỏi ý kiến thay vì đo hành vi.\n- Đầu tư lớn trước khi có tín hiệu thị trường.\n- Không có tiêu chí dừng, tiếp tục hoặc đổi hướng.\n- Xem rủi ro là chuyện của sau này.\n\n## Bài tập ứng dụng\n\nLập risk register:\n\n| Rủi ro | Nguyên nhân | Tác động | Khả năng xảy ra | Mức độ nghiêm trọng | Dấu hiệu sớm | Phương án xử lý | Owner |\n|---|---|---|---|---|---|---|---|\n|  |  |  |  |  |  |  |  |\n|  |  |  |  |  |  |  |  |\n|  |  |  |  |  |  |  |  |\n\nKế hoạch kiểm chứng:\n\n| Giả thuyết nguy hiểm | Thử nghiệm nhỏ | Dữ liệu cần thu | Tiêu chí đúng/sai | Quyết định sau thử nghiệm |\n|---|---|---|---|---|\n|  |  |  |  |  |\n\n## Bài tập review\n\nReview quyết định:\n\n> \"Cứ xây sản phẩm hoàn chỉnh trước, ra mắt rồi thị trường sẽ cho phản hồi.\"\n\n| Nội dung review | Nhận xét |\n|---|---|\n| Giả thuyết nguy hiểm nào chưa kiểm chứng? |  |\n| Chi phí nếu sai là gì? |  |\n| Có thử nghiệm nhỏ hơn không? |  |\n| Dấu hiệu sớm cần đo là gì? |  |\n| Nên dừng, tiếp tục hay đổi hướng khi nào? |  |\n\n## Tiêu chí đánh giá\n\n| Mức | Biểu hiện |\n|---|---|\n| Yếu | Nêu rủi ro chung chung, không có tác động hoặc xử lý |\n| Đạt | Có danh sách rủi ro và phương án cơ bản |\n| Tốt | Có phân loại, dấu hiệu sớm, thử nghiệm và owner |\n| Xuất sắc | Xác định đúng giả thuyết nguy hiểm nhất, thiết kế thử nghiệm nhỏ, tiêu chí quyết định rõ |\n\n## Checklist tự review\n\n- Giả định nào nếu sai sẽ làm kế hoạch sụp?\n- Tôi có thể kiểm chứng giả định đó trong 7-30 ngày không?\n- Dấu hiệu sớm nào cần theo dõi?\n- Ai chịu trách nhiệm theo dõi rủi ro?\n- Tôi có tiêu chí dừng, tiếp tục hoặc đổi hướng không?\n\n## Hành động nhỏ trong 30-90 phút\n\nViết 10 giả định quan trọng trong kế hoạch kinh doanh của bạn. Chọn 1 giả định nguy hiểm nhất và thiết kế thử nghiệm nhỏ nhất để kiểm chứng trong 7 ngày.\n\n"},{"sourcePath":"Kinh doanh/12_do_an_cuoi_khoa.md","title":"Bài 12. Đồ án cuối khóa","category":"business","categoryLabel":"Kinh doanh","order":13,"sha256":"83edb06a1dd8e385f7445934034a43f14327dd2aed06bab7f564b9919fb2b119","lineCount":129,"headings":[{"level":1,"text":"Bài 12. Đồ án cuối khóa","id":"bài-12-đồ-án-cuối-khóa"},{"level":2,"text":"Mục tiêu đồ án","id":"mục-tiêu-đồ-án"},{"level":2,"text":"Đề bài 1: Công ty mới","id":"đề-bài-1-công-ty-mới"},{"level":2,"text":"Đề bài 2: Công ty đã có","id":"đề-bài-2-công-ty-đã-có"},{"level":2,"text":"Mẫu cấu trúc bài nộp","id":"mẫu-cấu-trúc-bài-nộp"},{"level":2,"text":"Tóm tắt một trang","id":"tóm-tắt-một-trang"},{"level":2,"text":"Kế hoạch kiểm chứng 30 ngày cho công ty mới","id":"kế-hoạch-kiểm-chứng-30-ngày-cho-công-ty-mới"},{"level":2,"text":"Kế hoạch cải tiến 90 ngày cho công ty đã có","id":"kế-hoạch-cải-tiến-90-ngày-cho-công-ty-đã-có"},{"level":2,"text":"Rubric đánh giá đồ án","id":"rubric-đánh-giá-đồ-án"},{"level":2,"text":"Checklist hoàn thiện trước khi nộp","id":"checklist-hoàn-thiện-trước-khi-nộp"},{"level":2,"text":"Quyết định đề xuất","id":"quyết-định-đề-xuất"}],"rawMarkdown":"# Bài 12. Đồ án cuối khóa\n\n## Mục tiêu đồ án\n\nĐồ án cuối khóa buộc người học tổng hợp toàn bộ giáo trình thành một bản kế hoạch kinh doanh có thể đem đi thảo luận, kiểm chứng hoặc triển khai thử. Mục tiêu không phải viết một tài liệu đẹp, mà là chứng minh người học biết đặt câu hỏi đúng, phân tích thực tế, nhìn rủi ro và thiết kế bước đi nhỏ tiếp theo.\n\nNgười học chọn một trong hai đề bài:\n\n1. Xây kế hoạch kinh doanh cho công ty mới.\n2. Xây kế hoạch kinh doanh cho công ty đã có muốn launch sản phẩm/dịch vụ mới.\n\n## Đề bài 1: Công ty mới\n\nChọn một ý tưởng kinh doanh mới và xây bản kế hoạch gồm:\n\n| Phần | Nội dung cần có |\n|---|---|\n| 1. Vấn đề khách hàng | Khách hàng là ai, đau ở đâu, bối cảnh nào, đang làm gì thay thế |\n| 2. Khách hàng mục tiêu | Người dùng, người trả tiền, người ảnh hưởng |\n| 3. Thị trường ban đầu | Phân khúc ưu tiên, lý do chọn, kênh tiếp cận |\n| 4. Giải pháp/MVP | Giá trị cốt lõi, tính năng cần có, giả thuyết cần kiểm chứng |\n| 5. Mô hình doanh thu | Cách thu tiền, giá, chi phí chính, biên sơ bộ |\n| 6. Lợi thế cạnh tranh | Vì sao khách chọn mình, đối thủ và hành vi thay thế |\n| 7. Go-to-market | Kế hoạch tiếp cận 30 ngày, thông điệp, offer, chỉ số |\n| 8. Vận hành | Quy trình giao giá trị đầu tiên, hỗ trợ, xử lý lỗi |\n| 9. Tài chính sơ bộ | Unit economics, CAC/LTV giả định, dòng tiền cần chú ý |\n| 10. Rủi ro | Risk register và thử nghiệm kiểm chứng |\n\n## Đề bài 2: Công ty đã có\n\nChọn một công ty đang hoạt động và một sản phẩm/dịch vụ mới để phân tích:\n\n| Phần | Nội dung cần có |\n|---|---|\n| 1. Lý do chiến lược | Sản phẩm mới giúp gì cho công ty hoặc hệ sinh thái |\n| 2. Khách hàng phù hợp | Nhóm khách hiện hữu hoặc phân khúc mới phù hợp nhất |\n| 3. Giá trị bổ sung | Sản phẩm mới tạo thêm kết quả, tiện ích hoặc niềm tin nào |\n| 4. Mô hình bán hàng | Bán riêng, bán kèm, thuê bao, dịch vụ hay đối tác |\n| 5. Lợi thế hiện hữu | Thương hiệu, kênh, dữ liệu, năng lực, hệ sinh thái |\n| 6. Rủi ro thương hiệu/vận hành | Sản phẩm có thể làm tổn hại điều gì |\n| 7. Điều kiện launch | Tiêu chí sell-ready, demo-ready, internal-only |\n| 8. Kế hoạch bán có kiểm soát | Nhóm khách đầu tiên, đại lý, hỗ trợ, dữ liệu cần thu |\n| 9. Chỉ số sau launch | Doanh số, usage, lỗi, hỗ trợ, NPS, upsell |\n| 10. Kế hoạch cải tiến 90 ngày | Vòng phản hồi, ưu tiên sửa lỗi, điều kiện mở rộng |\n\n## Mẫu cấu trúc bài nộp\n\n```text\n# Tên kế hoạch kinh doanh\n\n## 1. Tóm tắt một trang\n## 2. Khách hàng và vấn đề\n## 3. Thị trường ban đầu\n## 4. Sản phẩm, giá trị và MVP\n## 5. Mô hình kinh doanh\n## 6. Lợi thế cạnh tranh\n## 7. Go-to-market\n## 8. Vận hành\n## 9. Tài chính sơ bộ\n## 10. Rủi ro và kế hoạch kiểm chứng\n## 11. Quyết định đề xuất\n```\n\n## Tóm tắt một trang\n\n| Câu hỏi | Câu trả lời ngắn |\n|---|---|\n| Doanh nghiệp/sản phẩm là gì? |  |\n| Khách hàng mục tiêu đầu tiên là ai? |  |\n| Vấn đề đủ đau là gì? |  |\n| Giải pháp tạo chuyển đổi nào? |  |\n| Vì sao khách trả tiền? |  |\n| Mô hình doanh thu là gì? |  |\n| Lợi thế cạnh tranh chính là gì? |  |\n| Rủi ro lớn nhất là gì? |  |\n| Thử nghiệm 30 ngày là gì? |  |\n| Quyết định đề xuất là gì? |  |\n\n## Kế hoạch kiểm chứng 30 ngày cho công ty mới\n\n| Tuần | Mục tiêu | Hành động | Dữ liệu cần thu | Tiêu chí quyết định |\n|---|---|---|---|---|\n| 1 | Hiểu vấn đề | Phỏng vấn 15-20 khách mục tiêu | Nỗi đau, cách thay thế, mức chi trả | Có ít nhất 5 mẫu đau rõ |\n| 2 | Kiểm chứng giải pháp | Cho dùng thử MVP nhỏ | Tỷ lệ bắt đầu, hành vi sử dụng | Khách dùng đúng bối cảnh |\n| 3 | Kiểm chứng giá trị | Gửi kết quả/báo cáo, phỏng vấn | Mức độ thấy giá trị, phản hồi | Khách mô tả được lợi ích cụ thể |\n| 4 | Kiểm chứng trả tiền | Đề nghị trả tiền/gia hạn | Tỷ lệ trả tiền, lý do từ chối | Có tín hiệu sẵn sàng chi trả |\n\n## Kế hoạch cải tiến 90 ngày cho công ty đã có\n\n| Giai đoạn | Mục tiêu | Hành động | Chỉ số | Điều kiện mở rộng |\n|---|---|---|---|---|\n| 0-30 ngày | Launch kiểm soát | Chọn nhóm khách đầu tiên, đào tạo kênh, hỗ trợ sát | Lỗi, usage, ticket | Lỗi nghiêm trọng trong ngưỡng kiểm soát |\n| 31-60 ngày | Cải tiến sản phẩm/kênh | Sửa lỗi, cập nhật tài liệu, tinh chỉnh offer | Tỷ lệ dùng, hài lòng đại lý | Đại lý bán đúng kỳ vọng |\n| 61-90 ngày | Mở rộng có điều kiện | Tăng batch khách, thêm kênh, bổ sung tính năng | Doanh số, upsell, support cost | Unit economics và chất lượng đạt chuẩn |\n\n## Rubric đánh giá đồ án\n\n| Tiêu chí | Trọng số | Yếu | Đạt | Tốt | Xuất sắc |\n|---|---:|---|---|---|---|\n| Hiểu vấn đề khách hàng | 20% | Mơ hồ, nói về sản phẩm | Có khách và vấn đề | Có bối cảnh, đau, thay thế | Có insight, bằng chứng, rủi ro |\n| Tư duy thị trường | 15% | Thị trường quá rộng | Có phân khúc | Chọn phân khúc có logic | Có beachhead và đường mở rộng |\n| Mô hình kinh doanh | 15% | Chỉ nêu giá bán | Có cách thu tiền | Có chi phí, biên, kênh | Có unit economics và trade-off |\n| Tính thực tế | 15% | Ý tưởng đẹp nhưng khó làm | Có bước triển khai | Có nguồn lực, timeline | Có thử nghiệm nhỏ và tiêu chí quyết định |\n| Quản trị rủi ro | 10% | Rủi ro chung chung | Có danh sách rủi ro | Có dấu hiệu sớm và xử lý | Có giả thuyết nguy hiểm nhất |\n| Chiến lược GTM | 15% | Chỉ nói quảng bá | Có kênh và thông điệp | Có offer, hỗ trợ, chỉ số | Có loại launch phù hợp và vòng học |\n| Tư duy first principles | 10% | Dựa vào xu hướng | Có câu hỏi gốc | Phân tích nguyên nhân | Ra quyết định từ bản chất và bằng chứng |\n\n## Checklist hoàn thiện trước khi nộp\n\n- Kế hoạch có nói rõ khách hàng đầu tiên, không nói \"mọi người\".\n- Vấn đề khách hàng được mô tả bằng bối cảnh và hành vi thật.\n- Có phân biệt người dùng, người trả tiền và người ảnh hưởng.\n- Có lựa chọn thay thế và đối thủ gián tiếp.\n- MVP kiểm chứng một giả thuyết rõ.\n- Mô hình doanh thu có chi phí chính và biên sơ bộ.\n- GTM có kênh, thông điệp, offer, chỉ số và hỗ trợ.\n- Có risk register và thử nghiệm 30 ngày hoặc 90 ngày.\n- Có tiêu chí dừng, tiếp tục hoặc đổi hướng.\n\n## Quyết định đề xuất\n\nCuối bài nộp, người học phải chọn một trong ba quyết định:\n\n| Quyết định | Khi nào chọn |\n|---|---|\n| Tiếp tục | Có tín hiệu khách hàng, giá trị, trả tiền và rủi ro trong tầm kiểm soát |\n| Đổi hướng | Vấn đề có thật nhưng phân khúc, giải pháp, giá hoặc kênh chưa đúng |\n| Dừng | Vấn đề không đủ đau, khách không trả tiền, hoặc rủi ro cốt lõi quá lớn so với nguồn lực |\n\n"},{"sourcePath":"Kinh doanh/99_phu_luc_bo_cau_hoi_va_mau_bieu.md","title":"Phụ lục. Bộ câu hỏi và mẫu biểu kinh doanh first principles","category":"business","categoryLabel":"Kinh doanh","order":14,"sha256":"7d7378d16b492d5091fa0d1e456ee7a004b70a8f88bbf2ab929ea8bce52ca060","lineCount":213,"headings":[{"level":1,"text":"Phụ lục. Bộ câu hỏi và mẫu biểu kinh doanh first principles","id":"phụ-lục-bộ-câu-hỏi-và-mẫu-biểu-kinh-doanh-first-principles"},{"level":2,"text":"Cách dùng phụ lục","id":"cách-dùng-phụ-lục"},{"level":2,"text":"Bộ câu hỏi first principles","id":"bộ-câu-hỏi-first-principles"},{"level":3,"text":"Về khách hàng","id":"về-khách-hàng"},{"level":3,"text":"Về giá trị","id":"về-giá-trị"},{"level":3,"text":"Về thị trường","id":"về-thị-trường"},{"level":3,"text":"Về tài chính","id":"về-tài-chính"},{"level":3,"text":"Về quyết định","id":"về-quyết-định"},{"level":2,"text":"Mẫu phỏng vấn khách hàng","id":"mẫu-phỏng-vấn-khách-hàng"},{"level":2,"text":"Mẫu customer problem brief","id":"mẫu-customer-problem-brief"},{"level":2,"text":"Mẫu phân tích thị trường ban đầu","id":"mẫu-phân-tích-thị-trường-ban-đầu"},{"level":2,"text":"Mẫu value proposition canvas rút gọn","id":"mẫu-value-proposition-canvas-rút-gọn"},{"level":2,"text":"Mẫu one-page business plan","id":"mẫu-one-page-business-plan"},{"level":2,"text":"Mẫu kế hoạch GTM một trang","id":"mẫu-kế-hoạch-gtm-một-trang"},{"level":2,"text":"Mẫu unit economics","id":"mẫu-unit-economics"},{"level":2,"text":"Mẫu risk register","id":"mẫu-risk-register"},{"level":2,"text":"Mẫu review một ý tưởng kinh doanh","id":"mẫu-review-một-ý-tưởng-kinh-doanh"},{"level":2,"text":"Checklist kiểm định một bài học","id":"checklist-kiểm-định-một-bài-học"}],"rawMarkdown":"# Phụ lục. Bộ câu hỏi và mẫu biểu kinh doanh first principles\n\n## Cách dùng phụ lục\n\nPhụ lục này là bộ công cụ đi kèm toàn bộ giáo trình. Người học có thể dùng để phỏng vấn khách hàng, phân tích ý tưởng, lập kế hoạch, review bài làm hoặc chuẩn bị đồ án cuối khóa.\n\nNguyên tắc sử dụng:\n\n- Không điền cho đủ ô. Mỗi ô phải giúp ra quyết định tốt hơn.\n- Nếu chưa có dữ liệu, ghi rõ là giả thuyết.\n- Với giả thuyết quan trọng, luôn viết cách kiểm chứng.\n- Ưu tiên câu trả lời cụ thể, có bối cảnh, có hành vi thật.\n\n## Bộ câu hỏi first principles\n\n### Về khách hàng\n\n1. Ai là người có vấn đề?\n2. Ai là người dùng sản phẩm?\n3. Ai là người trả tiền?\n4. Ai ảnh hưởng quyết định mua?\n5. Vấn đề xảy ra trong bối cảnh nào?\n6. Vấn đề xảy ra thường xuyên không?\n7. Khách hàng đang giải quyết bằng cách nào?\n8. Cách hiện tại tốn thời gian, tiền bạc, công sức hoặc rủi ro gì?\n9. Điều gì khiến khách phải hành động ngay?\n10. Nếu không giải quyết, hậu quả là gì?\n\n### Về giá trị\n\n1. Sản phẩm giúp khách hàng tiết kiệm gì?\n2. Sản phẩm giúp khách hàng đạt được gì?\n3. Sản phẩm giúp khách hàng tránh rủi ro gì?\n4. Sản phẩm tạo cảm xúc gì?\n5. Giá trị nào là lý do mua chính?\n6. Giá trị nào chỉ là phụ?\n7. Khách biết mình nhận được giá trị bằng bằng chứng nào?\n8. Giá trị này có đủ lớn so với giá, thời gian và rủi ro đổi mới không?\n\n### Về thị trường\n\n1. Nhóm khách hàng đầu tiên là ai?\n2. Vì sao không chọn nhóm khác trước?\n3. Có bao nhiêu người gặp vấn đề này?\n4. Có bao nhiêu người sẵn sàng trả tiền?\n5. Có thể tiếp cận họ qua kênh nào?\n6. Đối thủ trực tiếp là ai?\n7. Đối thủ gián tiếp là gì?\n8. Hành vi thay thế hiện tại là gì?\n9. Nếu thắng nhóm đầu tiên, mở rộng sang nhóm nào?\n\n### Về tài chính\n\n1. Một khách hàng trả bao nhiêu?\n2. Khách trả một lần hay định kỳ?\n3. Giá vốn trực tiếp là gì?\n4. Biên lợi nhuận gộp là bao nhiêu?\n5. Chi phí để có một khách hàng là bao nhiêu?\n6. Khách ở lại bao lâu?\n7. LTV có lớn hơn CAC không?\n8. Chi phí vận hành định kỳ là gì?\n9. Tiền vào có kịp tiền ra không?\n10. Càng bán nhiều có càng lời không?\n\n### Về quyết định\n\n1. Giả thuyết nguy hiểm nhất là gì?\n2. Điều gì cần kiểm chứng trước?\n3. Thử nghiệm nhỏ nhất có thể làm là gì?\n4. Chỉ số nào chứng minh giả thuyết đúng/sai?\n5. Khi nào nên tiếp tục?\n6. Khi nào nên đổi hướng?\n7. Khi nào nên dừng?\n8. Nếu có thêm 30 ngày, nên học điều gì quan trọng nhất?\n\n## Mẫu phỏng vấn khách hàng\n\n| Nhóm câu hỏi | Câu hỏi cụ thể | Ghi chú |\n|---|---|---|\n| Bối cảnh | Gần đây anh/chị gặp tình huống này khi nào? | Tìm sự kiện thật, không hỏi chung chung |\n| Hành vi hiện tại | Anh/chị đang giải quyết bằng cách nào? | Hành vi thật quan trọng hơn ý kiến |\n| Mức độ đau | Việc này gây tốn kém, phiền hoặc rủi ro gì? | Tìm chi phí cụ thể |\n| Lựa chọn thay thế | Anh/chị đã thử cách nào khác chưa? | Xác định cạnh tranh thật |\n| Quyết định mua | Khi chọn giải pháp, anh/chị quan tâm điều gì nhất? | Tìm tiêu chí mua |\n| Trả tiền | Anh/chị đã từng trả tiền cho vấn đề này chưa? | Tránh hỏi \"có mua không\" quá sớm |\n| Bằng chứng giá trị | Điều gì khiến anh/chị tin giải pháp có hiệu quả? | Tìm proof cần có |\n\n## Mẫu customer problem brief\n\n| Mục | Nội dung |\n|---|---|\n| Khách hàng mục tiêu |  |\n| Người dùng |  |\n| Người trả tiền |  |\n| Bối cảnh xảy ra vấn đề |  |\n| Nỗi đau chính |  |\n| Tần suất xảy ra |  |\n| Cách giải quyết hiện tại |  |\n| Vì sao cách hiện tại chưa đủ tốt |  |\n| Chuyển đổi mong muốn |  |\n| Bằng chứng khách nhận giá trị |  |\n| Giả thuyết cần kiểm chứng |  |\n\n## Mẫu phân tích thị trường ban đầu\n\n| Phân khúc | Vấn đề chính | Khả năng chi trả | Dễ tiếp cận | Mức độ cạnh tranh | Khả năng mở rộng | Ưu tiên |\n|---|---|---|---|---|---|---|\n|  |  |  |  |  |  |  |\n|  |  |  |  |  |  |  |\n|  |  |  |  |  |  |  |\n\n## Mẫu value proposition canvas rút gọn\n\n| Thành phần | Nội dung |\n|---|---|\n| Khách hàng mục tiêu |  |\n| Việc khách cần làm |  |\n| Nỗi đau |  |\n| Mong muốn |  |\n| Giải pháp |  |\n| Tính năng cốt lõi |  |\n| Bằng chứng giá trị |  |\n| Lý do chọn mình |  |\n\n## Mẫu one-page business plan\n\n| Phần | Nội dung |\n|---|---|\n| Ý tưởng kinh doanh |  |\n| Khách hàng đầu tiên |  |\n| Vấn đề đủ đau |  |\n| Giải pháp/MVP |  |\n| Giá trị khác biệt |  |\n| Mô hình doanh thu |  |\n| Chi phí chính |  |\n| Kênh tiếp cận |  |\n| Chỉ số thành công ban đầu |  |\n| Rủi ro lớn nhất |  |\n| Thử nghiệm 30 ngày |  |\n\n## Mẫu kế hoạch GTM một trang\n\n| Thành phần | Nội dung |\n|---|---|\n| Khách hàng mục tiêu đầu tiên |  |\n| Vấn đề chính |  |\n| Thông điệp chính |  |\n| Offer |  |\n| Kênh tiếp cận |  |\n| Cách bán |  |\n| Dùng thử/demo |  |\n| Hỗ trợ sau bán |  |\n| Chỉ số đo lường |  |\n| Rủi ro |  |\n| Kế hoạch cải tiến |  |\n\n## Mẫu unit economics\n\n| Chỉ số | Giá trị | Ghi chú/giả định |\n|---|---:|---|\n| Giá bán |  |  |\n| Số lần/tháng khách trả tiền |  |  |\n| Giá vốn |  |  |\n| Biên lợi nhuận gộp |  |  |\n| CAC |  |  |\n| Số tháng khách ở lại |  |  |\n| LTV |  |  |\n| Chi phí hỗ trợ |  |  |\n| Chi phí vận hành định kỳ |  |  |\n| Thời gian hoàn vốn |  |  |\n\n## Mẫu risk register\n\n| Rủi ro | Nguyên nhân | Tác động | Khả năng xảy ra | Mức độ nghiêm trọng | Dấu hiệu sớm | Phương án xử lý | Owner |\n|---|---|---|---|---|---|---|---|\n|  |  |  |  |  |  |  |  |\n|  |  |  |  |  |  |  |  |\n|  |  |  |  |  |  |  |  |\n\n## Mẫu review một ý tưởng kinh doanh\n\n| Nội dung review | Nhận xét |\n|---|---|\n| Khách hàng có rõ không? |  |\n| Vấn đề có đủ đau không? |  |\n| Người trả tiền có rõ không? |  |\n| Lựa chọn thay thế là gì? |  |\n| Giải pháp tạo chuyển đổi nào? |  |\n| Mô hình doanh thu có hợp lý không? |  |\n| Chi phí chính đã được tính chưa? |  |\n| Lợi thế cạnh tranh là gì? |  |\n| Rủi ro lớn nhất là gì? |  |\n| Thử nghiệm nhỏ nhất là gì? |  |\n\n## Checklist kiểm định một bài học\n\n| Tiêu chí | Đạt/Chưa đạt | Ghi chú |\n|---|---|---|\n| Có câu hỏi bản chất |  |  |\n| Có tình huống mở bài |  |  |\n| Có nguyên lý first principles |  |  |\n| Có kiến thức nền chi tiết |  |  |\n| Có thuật ngữ cần hiểu sâu |  |  |\n| Có khung tư duy trực quan |  |  |\n| Có ví dụ đời thường |  |  |\n| Có 2 use case xuyên suốt |  |  |\n| Có lỗi phổ biến |  |  |\n| Có bài tập ứng dụng |  |  |\n| Có bài tập review |  |  |\n| Có rubric 4 mức |  |  |\n| Có checklist tự review |  |  |\n| Có hành động nhỏ 30-90 phút |  |  |\n\n"},{"sourcePath":"Marketing/00_tong_quan_giao_trinh_marketing_first_principles.md","title":"Giáo Trình Marketing First Principles","category":"marketing","categoryLabel":"Marketing","order":1,"sha256":"8910212eae0e9eaceaad54984a1804b7c4f29c86a217dd8e275b074717b11fb9","lineCount":104,"headings":[{"level":1,"text":"Giáo Trình Marketing First Principles","id":"giáo-trình-marketing-first-principles"},{"level":2,"text":"Tên giáo trình","id":"tên-giáo-trình"},{"level":2,"text":"Tinh thần giáo trình","id":"tinh-thần-giáo-trình"},{"level":2,"text":"Đối tượng học viên","id":"đối-tượng-học-viên"},{"level":2,"text":"Chuẩn đầu ra","id":"chuẩn-đầu-ra"},{"level":2,"text":"Cách học","id":"cách-học"},{"level":2,"text":"Hai use case xuyên suốt","id":"hai-use-case-xuyên-suốt"},{"level":3,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":3,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Bản đồ giáo trình","id":"bản-đồ-giáo-trình"},{"level":2,"text":"Nguyên tắc đánh giá xuyên suốt","id":"nguyên-tắc-đánh-giá-xuyên-suốt"}],"rawMarkdown":"# Giáo Trình Marketing First Principles\n\n## Tên giáo trình\n\n**Marketing từ gốc: Hiểu khách hàng, xây niềm tin, tạo nhu cầu và tăng trưởng trong thời đại AI**\n\n## Tinh thần giáo trình\n\nGiáo trình này không xem marketing là chạy quảng cáo, làm content, thiết kế poster, seeding hay tăng follower. Những việc đó chỉ là công cụ. Bản chất của marketing là giúp đúng người **biết**, **hiểu**, **tin**, **muốn**, **mua**, **dùng đúng**, **quay lại** và **giới thiệu** giá trị mà doanh nghiệp tạo ra.\n\nNếu bỏ hết thuật ngữ, marketing tồn tại vì một thực tế đơn giản: sản phẩm tốt không tự được khách hàng hiểu đúng. Khách hàng bận rộn, có thói quen cũ, có lựa chọn thay thế, có nỗi sợ bị lừa, có giới hạn tiền bạc và có rất ít kiên nhẫn để nghe doanh nghiệp giải thích. Marketing tốt không làm cho doanh nghiệp ồn ào hơn; marketing tốt làm cho giá trị trở nên rõ hơn, đáng tin hơn và dễ hành động hơn.\n\n## Đối tượng học viên\n\n- Người mới học marketing và chưa có nền tảng kinh doanh.\n- Founder, chủ doanh nghiệp nhỏ, nhân sự product, sales, R&D cần hiểu marketing từ bản chất.\n- Marketer muốn thoát khỏi tư duy chỉ chạy kênh, chỉ làm nội dung hoặc chỉ tối ưu chỉ số ngắn hạn.\n- Công ty đã có sản phẩm muốn launch sản phẩm mới, tái định vị hoặc tăng trưởng bền vững hơn.\n\n## Chuẩn đầu ra\n\nSau giáo trình, người học có thể:\n\n1. Phân biệt marketing với quảng cáo, content, sales, branding và chăm sóc khách hàng.\n2. Phân tích insight từ bối cảnh, nỗi đau, mong muốn, nỗi sợ và rào cản hành động.\n3. Xây định vị rõ: dành cho ai, giải quyết vấn đề gì, khác gì và bằng chứng là gì.\n4. Viết thông điệp theo 3 tầng: tính năng, lợi ích, chuyển đổi.\n5. Thiết kế hành trình khách hàng từ chưa biết đến mua, dùng, quay lại và giới thiệu.\n6. Chọn kênh theo hành vi khách hàng, không theo trào lưu.\n7. Lập campaign brief có mục tiêu, offer, nội dung, kênh, KPI, rủi ro và kế hoạch tối ưu.\n8. Kết hợp brand marketing và performance marketing.\n9. Thiết kế onboarding, CRM và retention sau bán.\n10. Dùng AI để tăng tốc nghiên cứu, viết, phân tích và tối ưu nhưng có kiểm duyệt.\n11. Xây kế hoạch marketing hoàn chỉnh có thể đem đi thảo luận, kiểm chứng hoặc triển khai thử.\n\n## Cách học\n\nMỗi bài nên học theo 5 bước:\n\n| Bước | Cách làm | Đầu ra |\n|---|---|---|\n| 1 | Đọc câu hỏi bản chất và tình huống mở bài | Hiểu vấn đề thật |\n| 2 | Đọc nguyên lý và kiến thức nền | Nắm cơ chế, không chỉ công thức |\n| 3 | So sánh 2 use case xuyên suốt | Thấy khác biệt giữa công ty mới và công ty đã có |\n| 4 | Làm bài tập ứng dụng và bài tập review | Tạo artifact cụ thể |\n| 5 | Làm hành động 30-90 phút | Kiểm chứng bằng dữ liệu nhỏ |\n\n## Hai use case xuyên suốt\n\n### Use case 1: Công ty mới\n\nMột startup muốn xây dựng **nền tảng học tập cá nhân hóa bằng AI cho học sinh tiểu học**. Sản phẩm giúp phụ huynh hiểu con đang yếu phần nào, nhận lộ trình học mỗi ngày và theo dõi tiến bộ rõ ràng.\n\n| Thành phần | Nội dung |\n|---|---|\n| Bối cảnh | Chưa có thương hiệu, chưa có khách hàng thật, sản phẩm còn ở giai đoạn thử nghiệm |\n| Mục tiêu | Tìm nhóm phụ huynh đầu tiên sẵn sàng dùng thử và trả tiền |\n| Ràng buộc | Ít ngân sách, chưa có bằng chứng hiệu quả, phụ huynh lo ngại về AI và dữ liệu trẻ em |\n| Mâu thuẫn | Nói về AI thì mới lạ nhưng dễ gây nghi ngờ; nói về nỗi đau học tập thì gần hơn nhưng kém hào nhoáng |\n| Dữ liệu hiện có | Demo hoạt động, một số phụ huynh tò mò, trẻ học không đều |\n| Dữ liệu thiếu | Ai đau nhất, ai trả tiền, giá nào chấp nhận được, thông điệp nào tạo hành động |\n| Quyết định | Kiểm chứng insight, định vị, offer dùng thử và kênh tiếp cận đầu tiên |\n\n### Use case 2: Công ty đã có\n\nMột công ty smart home Việt Nam đã có thương hiệu, đại lý, showroom và khách hàng hiện hữu. Công ty muốn launch **loa thông minh trợ lý ảo tiếng Việt** để tăng trải nghiệm điều khiển nhà thông minh.\n\n| Thành phần | Nội dung |\n|---|---|\n| Bối cảnh | Đã có niềm tin thương hiệu nhưng sản phẩm mới còn cần quản trị kỳ vọng |\n| Mục tiêu | Launch có kiểm soát, tạo hứng thú, giúp đại lý bán đúng và thu feedback |\n| Ràng buộc | Một số tính năng chưa hoàn hảo, khách hàng kỳ vọng cao vì nghe đến AI |\n| Mâu thuẫn | Launch mạnh tạo tiếng vang nhưng dễ overpromise; launch hẹp an toàn hơn nhưng ít hiệu ứng thị trường |\n| Dữ liệu hiện có | Tệp khách smart home, hệ thống đại lý, demo một số tình huống tốt |\n| Dữ liệu thiếu | Nhóm khách đầu tiên phù hợp, phạm vi claim an toàn, mức độ sẵn sàng của đại lý |\n| Quyết định | Chọn định vị, thông điệp, sales kit, demo script và quy trình feedback sau launch |\n\n## Bản đồ giáo trình\n\n```text\nBản chất marketing\n-> Insight khách hàng\n-> Phân khúc và định vị\n-> Hành trình khách hàng\n-> Thông điệp\n-> Content\n-> Kênh\n-> Chiến dịch\n-> Brand trust\n-> Performance\n-> CRM và retention\n-> AI marketing\n-> Đồ án kế hoạch marketing hoàn chỉnh\n```\n\n## Nguyên tắc đánh giá xuyên suốt\n\n| Mức | Biểu hiện |\n|---|---|\n| Yếu | Nhắc lại thuật ngữ, viết chung chung, thiếu bằng chứng |\n| Đạt | Dùng đúng khung cơ bản, có đầu ra rõ |\n| Tốt | Có logic, có ví dụ, thấy được rủi ro và trade-off |\n| Xuất sắc | Có insight sâu, quyết định cụ thể, thử nghiệm nhỏ và tiêu chí học hỏi rõ |\n\n"},{"sourcePath":"Marketing/01_marketing_la_gi.md","title":"Bài 1. Marketing Là Gì?","category":"marketing","categoryLabel":"Marketing","order":2,"sha256":"b1c4a2dbca34708af0cbbab6f597ab6befeb56c3210417e86cc9d82f9279c4ff","lineCount":154,"headings":[{"level":1,"text":"Bài 1. Marketing Là Gì?","id":"bài-1-marketing-là-gì"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":3,"text":"Cơ chế vận hành","id":"cơ-chế-vận-hành"},{"level":3,"text":"Ví dụ đúng và sai","id":"ví-dụ-đúng-và-sai"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 1. Marketing Là Gì?\n\n## Câu hỏi bản chất\n\n> Marketing có phải là quảng cáo không?\n\n## Tình huống mở bài\n\nLinh và Nam làm một app AI giúp học sinh tiểu học luyện toán mỗi ngày. Demo chạy được, giao diện đẹp, bài tập cá nhân hóa theo năng lực. Nhóm đăng vài bài lên Facebook với thông điệp \"Nền tảng AI học tập thông minh cho trẻ em\", nhưng chỉ có vài lượt quan tâm. Một số phụ huynh hỏi app có an toàn không, có làm trẻ phụ thuộc máy không, có thật sự giúp con tiến bộ không. Nhóm băn khoăn: có nên chạy quảng cáo mạnh hơn, thuê KOL giáo dục, hay viết lại thông điệp?\n\nQuyết định cần đưa ra: marketing nên bắt đầu từ công cụ quảng cáo hay từ việc làm rõ phụ huynh cần hiểu và tin điều gì?\n\n## Vì sao bài này quan trọng\n\nNgười mới thường nghĩ marketing là làm cho nhiều người biết đến sản phẩm. Điều đó chưa đủ. Nếu khách hàng biết nhưng không hiểu, hiểu nhưng không tin, tin nhưng không thấy liên quan, thấy liên quan nhưng không biết bước tiếp theo, marketing vẫn thất bại. Bài này đặt nền cho toàn bộ giáo trình: marketing là hệ thống chuyển giá trị thật thành nhận thức, niềm tin và hành động của khách hàng.\n\n## Nguyên lý first principles\n\nMarketing là cầu nối giữa **giá trị doanh nghiệp tạo ra** và **nhận thức của khách hàng về giá trị đó**.\n\nMột sản phẩm có thể tốt, nhưng khách hàng không tự nhiên biết nó phù hợp với mình. Họ đang có thói quen cũ, giải pháp thay thế, nỗi sợ mất tiền, nỗi sợ bị làm phiền và rất ít thời gian để tìm hiểu. Vì vậy marketing phải giải quyết 6 nhiệm vụ:\n\n1. Làm khách hàng nhận ra vấn đề.\n2. Làm khách hàng hiểu giải pháp.\n3. Làm khách hàng tin thương hiệu.\n4. Làm khách hàng muốn thử hoặc mua.\n5. Làm khách hàng sử dụng đúng.\n6. Làm khách hàng quay lại và giới thiệu.\n\nNếu làm sai, doanh nghiệp thường đổ lỗi cho kênh: \"Facebook không hiệu quả\", \"TikTok không hợp\", \"khách không hiểu sản phẩm\". Nếu làm đúng, doanh nghiệp biết rõ khách đang kẹt ở bước nào: chưa biết vấn đề, chưa tin giải pháp, chưa thấy cấp bách, chưa hiểu giá, hay chưa có trải nghiệm đủ tốt.\n\n## Kiến thức nền chi tiết\n\nMarketing xuất hiện vì thị trường không tự vận hành theo kiểu \"sản phẩm tốt sẽ tự bán\". Khách hàng không mua chỉ vì sản phẩm có tính năng. Họ mua khi thấy một vấn đề liên quan đến mình, tin rằng giải pháp đáng thử, cảm thấy rủi ro chấp nhận được và biết cách hành động.\n\nMarketing khác quảng cáo. Quảng cáo là một cách đưa thông điệp đến khách hàng. Marketing rộng hơn: nghiên cứu khách hàng, chọn phân khúc, định vị, thiết kế thông điệp, tạo nội dung, chọn kênh, xây niềm tin, hỗ trợ bán hàng, đo hiệu quả, chăm sóc sau mua và học từ phản hồi.\n\nMarketing cũng khác sales. Sales thường tập trung vào tương tác trực tiếp để chốt cơ hội cụ thể. Marketing tạo điều kiện để sales dễ hơn: khách hiểu vấn đề hơn, tin thương hiệu hơn, biết vì sao nên cân nhắc sản phẩm hơn. Trong công ty nhỏ, một người có thể làm cả hai việc, nhưng về bản chất hai chức năng khác nhau.\n\nMarketing không chỉ phục vụ doanh thu ngắn hạn. Nếu chỉ ép chuyển đổi, doanh nghiệp có thể bán được vài đơn nhưng làm hỏng niềm tin dài hạn. Marketing tốt phải giữ cân bằng giữa tạo nhu cầu, chuyển đổi và bảo vệ kỳ vọng.\n\n### Cơ chế vận hành\n\n```text\nGiá trị thật\n-> Hiểu khách hàng\n-> Định vị rõ\n-> Thông điệp dễ hiểu\n-> Bằng chứng đáng tin\n-> Kênh phù hợp\n-> Hành động mua/dùng\n-> Trải nghiệm sau mua\n-> Niềm tin và giới thiệu\n```\n\n### Ví dụ đúng và sai\n\n| Tình huống | Cách nghĩ yếu | Cách nghĩ tốt hơn |\n|---|---|---|\n| App AI học tập ít người dùng thử | Chạy ads nhiều hơn | Kiểm tra phụ huynh đã thấy vấn đề, tin app và hiểu bước dùng thử chưa |\n| Loa thông minh mới launch | Gọi là trợ lý AI cho mọi nhà | Nói rõ trải nghiệm điều khiển nhà thông minh bằng tiếng Việt trong các tình huống đã ổn định |\n| Content ít tương tác | Đăng nhiều bài hơn | Xem nội dung có giải quyết câu hỏi thật của khách hàng không |\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Marketing | Quá trình tạo nhận thức, niềm tin và hành động quanh giá trị | Làm khách hiểu đúng và muốn hành động với thứ mình tạo ra | Kết nối giá trị thật với quyết định của khách hàng | Viết thông điệp giúp phụ huynh hiểu con yếu gì và thử bài test | Chỉ đăng poster khuyến mãi | Quảng cáo, sales |\n| Advertising | Quảng cáo trả phí hoặc truyền thông có chủ đích | Mua hoặc dùng vị trí để đưa thông điệp đến người khác | Một công cụ phân phối thông điệp | Chạy ads cho landing page đã có offer rõ | Chạy ads khi chưa biết khách hàng là ai | Marketing |\n| Value proposition | Lời hứa giá trị | Khách được gì đáng để quan tâm | Nối vấn đề của khách với lợi ích khác biệt | \"Biết con yếu phần nào sau 15 phút\" | \"Ứng dụng AI hiện đại\" | Tính năng |\n| Trust | Niềm tin | Mức độ khách dám thử trước khi tự kiểm chứng hết | Giảm rủi ro cảm nhận | Có chuyên gia kiểm duyệt, case thật, chính sách dữ liệu rõ | Hứa hiệu quả nhưng không có bằng chứng | Branding |\n\n## Khung tư duy trực quan\n\n```text\nKhách chưa biết -> Khách nhận ra -> Khách hiểu -> Khách tin -> Khách muốn -> Khách mua -> Khách dùng đúng -> Khách quay lại\n```\n\n## Ví dụ đời thường\n\nMột quán ăn mới trong hẻm không chỉ cần món ngon. Khách cần biết quán tồn tại, hiểu quán bán món gì, tin vệ sinh và chất lượng, thấy giá hợp lý, biết đường đến, có trải nghiệm tốt và muốn quay lại. Tấm biển, lời giới thiệu, review, thái độ phục vụ, hình ảnh món ăn và cách xử lý khi khách phàn nàn đều là một phần của marketing.\n\n## Use case 1: Công ty mới\n\nStartup AI giáo dục không nên bắt đầu bằng câu \"chúng tôi có AI\". Phụ huynh không mua AI; họ mua cảm giác hiểu con hơn, bớt lo hơn và có cách hỗ trợ con thực tế hơn. Thông điệp yếu là \"Nền tảng AI học tập cá nhân hóa\". Thông điệp tốt hơn là \"Biết con đang yếu phần nào sau 15 phút, nhận lộ trình học 10 phút mỗi ngày để con tiến bộ từng tuần\".\n\nQuyết định marketing đầu tiên nên là xác định phụ huynh cần tin điều gì trước khi cho con dùng thử: dữ liệu an toàn, bài học phù hợp, không thay cha mẹ, có báo cáo dễ hiểu và có kết quả nhỏ trong 7 ngày.\n\n## Use case 2: Công ty đã có\n\nCông ty smart home đã có uy tín, nên marketing không chỉ tạo hứng thú mà còn phải bảo vệ niềm tin cũ. Nếu gọi loa là \"trợ lý AI cho mọi gia đình\", khách có thể kỳ vọng nó trả lời mọi câu hỏi như các nền tảng quốc tế. Nếu năng lực tốt nhất hiện tại là điều khiển đèn, rèm, điều hòa, camera bằng tiếng Việt trong hệ sinh thái smart home, thông điệp nên tập trung vào phạm vi đó.\n\nThông điệp phù hợp hơn: \"Điều khiển nhà thông minh bằng tiếng Việt tự nhiên hơn, tiện hơn cho cả gia đình\".\n\n## Lỗi người mới thường mắc\n\n- Nghĩ marketing là chạy quảng cáo.\n- Nói quá nhiều về sản phẩm, quá ít về vấn đề của khách hàng.\n- Tưởng khách biết đến là sẽ mua.\n- Chạy kênh trước khi thông điệp rõ.\n- Hứa quá năng lực sản phẩm để tạo chú ý.\n- Tách marketing khỏi trải nghiệm sau mua.\n\n## Bài tập ứng dụng\n\nChọn một sản phẩm bạn biết và viết bản mô tả nhiệm vụ marketing:\n\n| Nhiệm vụ | Khách cần hiểu/tin/hành động gì? | Nội dung hoặc trải nghiệm cần có |\n|---|---|---|\n| Nhận ra vấn đề |  |  |\n| Hiểu giải pháp |  |  |\n| Tin thương hiệu |  |  |\n| Muốn thử/mua |  |  |\n| Dùng đúng |  |  |\n| Quay lại/giới thiệu |  |  |\n\n## Bài tập review\n\nReview thông điệp: \"Sản phẩm của chúng tôi là nền tảng AI hiện đại giúp tối ưu học tập cho trẻ em\".\n\n| Câu hỏi review | Nhận xét |\n|---|---|\n| Khách hàng cụ thể là ai? |  |\n| Vấn đề có rõ không? |  |\n| Kết quả mong muốn có cụ thể không? |  |\n| Có bằng chứng niềm tin không? |  |\n| Có hành động tiếp theo không? |  |\n| Nên sửa thế nào? |  |\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Đồng nhất marketing với quảng cáo hoặc content |\n| Đạt | Nêu được marketing gồm nhiều nhiệm vụ trước và sau mua |\n| Tốt | Chỉ ra khách đang kẹt ở bước nào trong hành trình hiểu, tin, mua |\n| Xuất sắc | Đề xuất được hành động kiểm chứng nhỏ để cải thiện nhận thức, niềm tin hoặc chuyển đổi |\n\n## Checklist tự review\n\n1. Tôi có đang nói về vấn đề thật của khách hay chỉ nói về sản phẩm?\n2. Tôi có biết khách cần tin điều gì trước khi mua không?\n3. Tôi có phân biệt marketing, quảng cáo và sales không?\n4. Tôi có biết nhiệm vụ marketing sau khi khách mua là gì không?\n5. Tôi có thể đo khách đang kẹt ở bước nào không?\n\n## Hành động 30-90 phút\n\nLấy một thông điệp hiện có của một sản phẩm, phỏng vấn nhanh 3 người trong nhóm khách hàng mục tiêu và hỏi: họ hiểu sản phẩm giải quyết vấn đề gì, họ có tin không, họ cần thêm bằng chứng gì, và bước tiếp theo có rõ không.\n\n## Liên hệ với bài trước và bài sau\n\nBài này là nền tảng. Bài sau đi sâu vào insight khách hàng, vì nếu không hiểu khách nghĩ gì, sợ gì và muốn gì, mọi hoạt động marketing phía sau chỉ là phỏng đoán.\n\n"},{"sourcePath":"Marketing/02_insight_khach_hang.md","title":"Bài 2. Insight Khách Hàng","category":"marketing","categoryLabel":"Marketing","order":3,"sha256":"27022bcaac08f594e3cc7c9e6a04faf4630601eef3256de3f7c97e8bf37f302f","lineCount":139,"headings":[{"level":1,"text":"Bài 2. Insight Khách Hàng","id":"bài-2-insight-khách-hàng"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 2. Insight Khách Hàng\n\n## Câu hỏi bản chất\n\n> Khách hàng thật sự nghĩ gì nhưng chưa nói ra?\n\n## Tình huống mở bài\n\nMột phụ huynh nói: \"Tôi muốn con tự giác học hơn\". Nếu dừng ở câu này, startup AI giáo dục có thể làm thêm tính năng nhắc học. Nhưng khi hỏi sâu hơn, phụ huynh nói họ không biết con yếu ở đâu, không biết chọn tài liệu nào, sợ ép con quá mức và thấy có lỗi vì không có thời gian kèm con. Câu nói bề mặt là \"con chưa tự giác\"; vấn đề sâu hơn là phụ huynh thiếu dữ liệu, thiếu phương pháp và thiếu cảm giác kiểm soát.\n\n## Vì sao bài này quan trọng\n\nInsight là nền của định vị, thông điệp, nội dung, kênh và offer. Nếu insight sai, chiến dịch có thể đẹp nhưng không chạm. Người mới thường lấy nhân khẩu học hoặc mong muốn chung chung làm insight. \"Phụ huynh muốn con học tốt\" chưa phải insight; đó là điều gần như phụ huynh nào cũng muốn.\n\n## Nguyên lý first principles\n\nInsight là sự thật sâu về động lực, nỗi sợ, mong muốn hoặc mâu thuẫn chi phối hành vi khách hàng. Insight tốt giải thích vì sao khách hành động hoặc không hành động.\n\n```text\nBối cảnh -> Điều khách nói -> Điều khách thật sự lo -> Rào cản -> Mong muốn sâu -> Insight -> Thông điệp\n```\n\n## Kiến thức nền chi tiết\n\nKhách hàng không luôn nói ra lý do thật. Họ có thể không biết cách diễn đạt, ngại thừa nhận, hoặc chỉ nói điều xã hội chấp nhận được. Vì vậy insight không được lấy bằng cách hỏi \"anh/chị có thích không?\" rồi tin ngay. Cần quan sát bối cảnh, hành vi thay thế, cảm xúc, mâu thuẫn và quyết định thật.\n\nInsight khác nhu cầu. Nhu cầu là thứ khách muốn đạt được. Insight giải thích vì sao nhu cầu đó quan trọng trong bối cảnh cụ thể. Insight cũng khác opinion. Opinion là ý kiến, có thể thay đổi nhanh và không dẫn tới hành động. Insight phải giúp doanh nghiệp ra quyết định tốt hơn: chọn thông điệp, thiết kế offer, xây bằng chứng, chọn kênh hoặc cải thiện sản phẩm.\n\nMột insight mạnh thường có 3 phần:\n\n```text\nTôi muốn ...\nNhưng tôi lo/gặp cản trở ...\nVì vậy tôi cần ...\n```\n\nVí dụ: \"Tôi muốn đồng hành cùng con học toán, nhưng tôi không có thời gian và không biết con yếu ở đâu, vì vậy tôi cần một cách đơn giản để hiểu tình trạng học của con mỗi tuần\".\n\nInsight có giới hạn. Không phải câu nào nghe sâu cũng đúng. Một insight chỉ đáng tin hơn khi có bằng chứng từ phỏng vấn, quan sát hành vi, dữ liệu sử dụng, phản hồi bán hàng hoặc thử nghiệm nhỏ.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Insight | Sự thật sâu chi phối hành vi | Điều khách thật sự nghĩ, lo, muốn nhưng không luôn nói thẳng | Giải thích nguyên nhân phía sau hành động | Phụ huynh muốn yên tâm vì biết con yếu gì | Phụ huynh có con lớp 3 | Demographic |\n| Need | Nhu cầu | Thứ khách muốn có hoặc muốn giải quyết | Mục tiêu bề mặt hoặc chức năng | Muốn con học tốt hơn | \"Thích AI\" | Insight |\n| Pain point | Nỗi đau | Điều gây khó chịu, mất tiền, mất thời gian hoặc áp lực | Nguồn tạo động lực thay đổi | Không biết con mất gốc phần nào | Muốn app đẹp hơn | Mong muốn |\n| Barrier | Rào cản | Điều khiến khách chưa hành động | Lực giữ khách ở trạng thái cũ | Sợ app thu thập dữ liệu trẻ em | Không thích màu giao diện | Preference |\n\n## Khung tư duy trực quan\n\n| Lớp quan sát | Câu hỏi |\n|---|---|\n| Bối cảnh | Khách đang ở trong hoàn cảnh nào? |\n| Câu nói | Họ nói vấn đề là gì? |\n| Hành vi | Họ đang làm gì thay thế? |\n| Cảm xúc | Họ lo, sợ, tự hào hay áy náy điều gì? |\n| Rào cản | Vì sao họ chưa đổi sang giải pháp mới? |\n| Insight | Sự thật nào giải thích hành vi đó? |\n\n## Ví dụ đời thường\n\nMột người nói họ muốn mua xe máy mới vì xe cũ hao xăng. Nhưng khi hỏi sâu, lý do thật có thể là xe cũ hay hỏng làm họ sợ trễ giờ đón con, và họ muốn cảm giác yên tâm mỗi sáng. Nếu chỉ nói \"tiết kiệm xăng\", thông điệp chưa chạm hết động lực mua.\n\n## Use case 1: Công ty mới\n\nInsight yếu: \"Phụ huynh muốn con học tốt\".\n\nInsight tốt hơn: \"Phụ huynh bận rộn muốn giúp con tiến bộ nhưng không biết con đang yếu ở đâu, sợ chọn sai tài liệu và cảm thấy có lỗi khi không đồng hành đủ\".\n\nHệ quả marketing: thông điệp nên tập trung vào sự yên tâm, báo cáo dễ hiểu và hành động nhỏ mỗi ngày, không chỉ nói app dùng AI.\n\n## Use case 2: Công ty đã có\n\nKhách smart home nói: \"Tôi muốn nhà tiện hơn\". Quan sát sâu hơn thấy người già không dùng app, trẻ em không biết thao tác, chủ nhà muốn cả gia đình đều dùng được. Insight có thể là: \"Chủ nhà muốn smart home không chỉ hiện đại với riêng mình, mà dễ dùng cho mọi thành viên trong gia đình\".\n\nHệ quả marketing: loa thông minh nên được truyền thông như cách làm nhà thông minh thân thiện hơn bằng tiếng Việt, không chỉ là thiết bị AI mới.\n\n## Lỗi người mới thường mắc\n\n- Gọi nhân khẩu học là insight.\n- Tin ngay điều khách nói ở lần hỏi đầu tiên.\n- Nhầm insight với câu slogan hay.\n- Chỉ tìm insight ủng hộ ý tưởng sẵn có.\n- Không kiểm chứng insight bằng hành vi thật.\n\n## Bài tập ứng dụng\n\nĐiền Insight Canvas:\n\n| Thành phần | Nội dung |\n|---|---|\n| Khách hàng |  |\n| Bối cảnh |  |\n| Điều họ nói ra |  |\n| Điều họ thật sự lo |  |\n| Điều họ thật sự muốn |  |\n| Hành vi thay thế |  |\n| Rào cản hành động |  |\n| Insight một câu |  |\n| Gợi ý thông điệp |  |\n\n## Bài tập review\n\nReview insight: \"Người dùng thích sản phẩm tiện lợi, giá rẻ và chất lượng cao\".\n\n| Câu hỏi review | Nhận xét |\n|---|---|\n| Có khách hàng cụ thể không? |  |\n| Có bối cảnh không? |  |\n| Có mâu thuẫn hoặc nỗi sợ không? |  |\n| Có giải thích hành vi không? |  |\n| Cần hỏi thêm gì? |  |\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Chỉ mô tả tuổi, giới tính, sở thích |\n| Đạt | Nêu được vấn đề và mong muốn chính |\n| Tốt | Có bối cảnh, nỗi đau, rào cản và hành vi thay thế |\n| Xuất sắc | Insight dẫn đến quyết định rõ về thông điệp, offer hoặc thử nghiệm |\n\n## Checklist tự review\n\n1. Insight có giải thích được hành vi không?\n2. Tôi có phân biệt điều khách nói và điều khách thật sự lo không?\n3. Tôi có bằng chứng ngoài cảm tính không?\n4. Insight có giúp viết thông điệp tốt hơn không?\n5. Tôi có biết cần kiểm chứng insight bằng cách nào không?\n\n## Hành động 30-90 phút\n\nPhỏng vấn 1 khách hàng tiềm năng. Không hỏi \"anh/chị có thích sản phẩm không\". Hỏi lần gần nhất họ gặp vấn đề, họ đã làm gì, vì sao cách đó chưa đủ tốt, điều gì khiến họ chưa đổi sang giải pháp mới.\n\n## Liên hệ với bài trước và bài sau\n\nBài 1 cho thấy marketing cần làm khách hiểu và tin. Bài này giúp biết khách cần hiểu và tin điều gì. Bài sau dùng insight để chọn phân khúc và định vị.\n\n"},{"sourcePath":"Marketing/03_phan_khuc_va_dinh_vi.md","title":"Bài 3. Phân Khúc Và Định Vị","category":"marketing","categoryLabel":"Marketing","order":4,"sha256":"bfa81e09e0c735e4bc91ff09c65dcc759098a99d934ad395c773dd27236808f1","lineCount":128,"headings":[{"level":1,"text":"Bài 3. Phân Khúc Và Định Vị","id":"bài-3-phân-khúc-và-định-vị"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 3. Phân Khúc Và Định Vị\n\n## Câu hỏi bản chất\n\n> Nếu không thể bán cho tất cả mọi người, ta nên chọn ai trước và muốn họ nhớ mình vì điều gì?\n\n## Tình huống mở bài\n\nStartup AI giáo dục muốn truyền thông cho tất cả phụ huynh có con từ lớp 1 đến lớp 5. Nhóm sợ chọn hẹp thì mất cơ hội. Nhưng khi nói rộng, thông điệp trở nên mơ hồ: \"AI giúp trẻ học tốt hơn\". Phụ huynh có con mất gốc toán lớp 3, phụ huynh muốn luyện thi, phụ huynh chỉ muốn con tự giác và phụ huynh quan tâm tiếng Anh đều nghe câu đó theo cách khác nhau.\n\n## Vì sao bài này quan trọng\n\nKhông chọn khách hàng là một cách chọn tệ. Khi doanh nghiệp nói với tất cả, thường không ai cảm thấy thông điệp dành cho mình. Định vị giúp khách hàng nhớ sản phẩm như một lựa chọn rõ ràng khi họ gặp một vấn đề cụ thể.\n\n## Nguyên lý first principles\n\nKhách hàng không thể nhớ quá nhiều thương hiệu. Họ thường nhớ theo ngữ cảnh: khi gặp vấn đề A, lựa chọn nào hiện lên đầu tiên? Định vị là nỗ lực chiếm một vị trí rõ trong tâm trí khách hàng bằng khách hàng mục tiêu, vấn đề, khác biệt và bằng chứng.\n\n## Kiến thức nền chi tiết\n\nPhân khúc là chia thị trường thành các nhóm có bối cảnh, nhu cầu, hành vi hoặc khả năng chi trả khác nhau. Phân khúc tốt không chỉ dựa trên tuổi, giới tính, thu nhập. Với marketing thực chiến, phân khúc nên dựa trên vấn đề, mức độ đau, tần suất gặp vấn đề, hành vi thay thế, khả năng tiếp cận và khả năng trả tiền.\n\nĐịnh vị là câu trả lời cho câu hỏi: \"Khi khách hàng mục tiêu gặp vấn đề này, họ nên nhớ đến mình như lựa chọn gì?\". Định vị không phải điều doanh nghiệp tự tuyên bố một lần. Nó được tạo bởi thông điệp lặp lại, trải nghiệm thật, bằng chứng, kênh bán và lời kể của khách hàng.\n\nMột positioning statement tốt trả lời:\n\n```text\nDành cho [khách hàng mục tiêu],\nngười đang gặp [vấn đề],\n[sản phẩm] là [danh mục],\ngiúp [lợi ích chính],\nkhác với [lựa chọn thay thế],\nchúng tôi có [khác biệt/bằng chứng].\n```\n\nGiới hạn của định vị là nó phải phù hợp năng lực thật. Định vị quá hẹp có thể làm mất cơ hội sau này, nhưng định vị quá rộng làm giai đoạn đầu không đủ sắc. Doanh nghiệp mới nên ưu tiên nhóm đau rõ và học nhanh. Công ty đã có nên ưu tiên định vị củng cố hệ sinh thái và không phá niềm tin hiện tại.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Segment | Phân khúc | Nhóm khách có vấn đề/hành vi tương tự | Chọn nơi bắt đầu tập trung | Phụ huynh bận có con lớp 3 mất gốc toán | Tất cả phụ huynh | Persona |\n| ICP | Khách hàng lý tưởng | Nhóm phù hợp nhất để bắt đầu | Nơi giá trị, nhu cầu và khả năng mua gặp nhau | Phụ huynh có nhu cầu kèm con nhưng thiếu thời gian | Người dùng bất kỳ | TAM |\n| Positioning | Định vị | Muốn khách nhớ mình là lựa chọn gì | Vị trí trong tâm trí khách khi gặp vấn đề | Trợ lý giúp cha mẹ biết con yếu gì mỗi tuần | Nền tảng AI toàn diện | Slogan |\n| Differentiation | Khác biệt | Điểm làm khách có lý do chọn mình | Khác biệt có giá trị và có bằng chứng | Báo cáo tiến bộ dễ hiểu cho phụ huynh | Có màu giao diện khác | Tính năng phụ |\n\n## Khung tư duy trực quan\n\n| Câu hỏi | Ý nghĩa |\n|---|---|\n| Ai đau nhất? | Chọn phân khúc đầu tiên |\n| Đau vì sao? | Hiểu vấn đề thật |\n| Đang làm gì thay thế? | Nhìn cạnh tranh thật |\n| Vì sao chọn mình? | Xác định khác biệt |\n| Tin bằng gì? | Tạo bằng chứng |\n\n## Ví dụ đời thường\n\nMột quán cà phê không thể cùng lúc là nơi học bài yên tĩnh, nơi tụ tập ồn ào, nơi làm việc chuyên nghiệp và nơi check-in sang trọng. Quán có thể phục vụ nhiều nhóm, nhưng nếu muốn khách nhớ rõ, cần một vị trí chính.\n\n## Use case 1: Công ty mới\n\nĐịnh vị yếu: \"App học tập AI cho học sinh tiểu học\".\n\nĐịnh vị tốt hơn: \"Dành cho phụ huynh bận rộn có con tiểu học cần củng cố nền tảng toán, sản phẩm giúp cha mẹ biết con yếu gì và có lộ trình học 10 phút mỗi ngày, khác với app bài tập đại trà bằng báo cáo tiến bộ dễ hiểu cho phụ huynh\".\n\n## Use case 2: Công ty đã có\n\nNếu định vị loa là \"AI speaker\", khách sẽ so sánh với Google hoặc Alexa. Nếu định vị là \"trợ lý giọng nói tiếng Việt cho hệ sinh thái smart home\", sản phẩm có vị trí rõ hơn và tận dụng lợi thế tích hợp sẵn.\n\n## Lỗi người mới thường mắc\n\n- Chọn phân khúc theo nhân khẩu học quá rộng.\n- Định vị bằng tính năng thay vì vấn đề và kết quả.\n- Cố khác biệt bằng thứ khách không quan tâm.\n- Không nêu bằng chứng.\n- Định vị quá xa năng lực thật.\n\n## Bài tập ứng dụng\n\nViết Positioning Statement:\n\n```text\nDành cho ...\nngười đang gặp ...\nsản phẩm là ...\ngiúp ...\nkhác với ...\nchúng tôi ...\n```\n\n## Bài tập review\n\nReview câu định vị: \"Chúng tôi là nền tảng toàn diện ứng dụng công nghệ hiện đại cho mọi gia đình Việt\".\n\n| Câu hỏi review | Nhận xét |\n|---|---|\n| Khách hàng có cụ thể không? |  |\n| Vấn đề có rõ không? |  |\n| Danh mục có dễ hiểu không? |  |\n| Khác biệt có đáng giá không? |  |\n| Bằng chứng là gì? |  |\n\n## Tiêu chí đánh giá\n\n| Mức độ | Biểu hiện |\n|---|---|\n| Yếu | Muốn bán cho tất cả, định vị chung chung |\n| Đạt | Có khách hàng, vấn đề và lợi ích cơ bản |\n| Tốt | Có khác biệt, lựa chọn thay thế và bằng chứng |\n| Xuất sắc | Định vị sắc, phù hợp năng lực thật và dẫn đến thông điệp/kênh rõ |\n\n## Checklist tự review\n\n1. Tôi có biết nhóm khách đầu tiên là ai không?\n2. Tôi có biết họ đang dùng gì thay thế không?\n3. Định vị có dễ hiểu trong 5 giây không?\n4. Khác biệt có bằng chứng không?\n5. Định vị có phù hợp năng lực thật không?\n\n## Hành động 30-90 phút\n\nViết 3 câu định vị khác nhau cho cùng một sản phẩm, đưa cho 3 người trong nhóm khách hàng mục tiêu, hỏi họ hiểu sản phẩm dành cho ai và giải quyết vấn đề gì.\n\n## Liên hệ với bài trước và bài sau\n\nBài trước tạo insight. Bài này biến insight thành lựa chọn khách hàng và định vị. Bài sau dùng định vị để thiết kế hành trình khách hàng.\n\n"},{"sourcePath":"Marketing/04_hanh_trinh_khach_hang.md","title":"Bài 4. Hành Trình Khách Hàng","category":"marketing","categoryLabel":"Marketing","order":5,"sha256":"2bdefbf051f2ecfa091fd73586e54855e9d9516f7e4827392a82e332754c085a","lineCount":118,"headings":[{"level":1,"text":"Bài 4. Hành Trình Khách Hàng","id":"bài-4-hành-trình-khách-hàng"},{"level":2,"text":"Câu hỏi bản chất","id":"câu-hỏi-bản-chất"},{"level":2,"text":"Tình huống mở bài","id":"tình-huống-mở-bài"},{"level":2,"text":"Vì sao bài này quan trọng","id":"vì-sao-bài-này-quan-trọng"},{"level":2,"text":"Nguyên lý first principles","id":"nguyên-lý-first-principles"},{"level":2,"text":"Kiến thức nền chi tiết","id":"kiến-thức-nền-chi-tiết"},{"level":2,"text":"Thuật ngữ cần hiểu sâu","id":"thuật-ngữ-cần-hiểu-sâu"},{"level":2,"text":"Khung tư duy trực quan","id":"khung-tư-duy-trực-quan"},{"level":2,"text":"Ví dụ đời thường","id":"ví-dụ-đời-thường"},{"level":2,"text":"Use case 1: Công ty mới","id":"use-case-1-công-ty-mới"},{"level":2,"text":"Use case 2: Công ty đã có","id":"use-case-2-công-ty-đã-có"},{"level":2,"text":"Lỗi người mới thường mắc","id":"lỗi-người-mới-thường-mắc"},{"level":2,"text":"Bài tập ứng dụng","id":"bài-tập-ứng-dụng"},{"level":2,"text":"Bài tập review","id":"bài-tập-review"},{"level":2,"text":"Tiêu chí đánh giá","id":"tiêu-chí-đánh-giá"},{"level":2,"text":"Checklist tự review","id":"checklist-tự-review"},{"level":2,"text":"Hành động 30-90 phút","id":"hành-động-30-90-phút"},{"level":2,"text":"Liên hệ với bài trước và bài sau","id":"liên-hệ-với-bài-trước-và-bài-sau"}],"rawMarkdown":"# Bài 4. Hành Trình Khách Hàng\n\n## Câu hỏi bản chất\n\n> Khách hàng cần đi qua những bước tâm lý nào trước khi mua và sau khi mua?\n\n## Tình huống mở bài\n\nMột phụ huynh thấy quảng cáo app AI học toán. Họ thấy thú vị nhưng chưa đăng ký. Tối đó họ lưu bài lại, vài ngày sau đọc review, rồi mới thử bài kiểm tra miễn phí cho con. Sau 7 ngày, nếu không thấy báo cáo tiến bộ rõ, họ hủy. Nhóm marketing ban đầu chỉ đo lượt click nên tưởng chiến dịch tốt, nhưng điểm nghẽn thật nằm ở niềm tin và trải nghiệm dùng thử.\n\n## Vì sao bài này quan trọng\n\nKhách hàng hiếm khi mua ngay sau lần đầu biết đến sản phẩm. Nếu không hiểu hành trình, doanh nghiệp sẽ dùng cùng một thông điệp cho mọi giai đoạn, hoặc tối ưu sai chỉ số.\n\n## Nguyên lý first principles\n\nMua hàng là quá trình thay đổi nhận thức, niềm tin và hành vi. Marketing cần giúp khách đi qua từng trạng thái:\n\n```text\nChưa biết -> Nhận ra vấn đề -> Tìm giải pháp -> So sánh -> Tin -> Mua -> Dùng -> Quay lại -> Giới thiệu\n```\n\n## Kiến thức nền chi tiết\n\nHành trình khách hàng không phải sơ đồ đẹp để trình bày. Nó là công cụ tìm điểm nghẽn. Ở mỗi giai đoạn, khách có câu hỏi khác nhau. Khi chưa biết, họ cần thấy vấn đề liên quan. Khi cân nhắc, họ cần hiểu lựa chọn. Khi sắp mua, họ cần bằng chứng và giảm rủi ro. Sau mua, họ cần thấy giá trị nhanh.\n\nHành trình khác funnel. Funnel thường đo tỷ lệ qua các bước. Journey nhìn sâu hơn vào suy nghĩ, cảm xúc, rào cản, nội dung và trải nghiệm. Hai công cụ nên đi cùng nhau: journey giúp hiểu nguyên nhân, funnel giúp đo kết quả.\n\nVới công ty mới, hành trình thường cần nhiều bước tạo niềm tin vì thương hiệu chưa có uy tín. Với công ty đã có, hành trình có thể tận dụng khách hàng hiện hữu, đại lý, showroom và trải nghiệm demo, nhưng phải quản trị kỳ vọng kỹ hơn.\n\n## Thuật ngữ cần hiểu sâu\n\n| Thuật ngữ | Định nghĩa ngắn | Giải thích đời thường | Bản chất | Ví dụ đúng | Ví dụ sai | Dễ nhầm với |\n|---|---|---|---|---|---|---|\n| Customer Journey | Hành trình khách hàng | Các bước khách đi từ chưa biết đến dùng và quay lại | Quá trình thay đổi nhận thức và hành vi | Map câu hỏi, nội dung, kênh, chỉ số từng giai đoạn | Vẽ sơ đồ nhưng không dùng để quyết định | Funnel |\n| Touchpoint | Điểm chạm | Nơi khách gặp thương hiệu | Mỗi điểm có thể tăng hoặc giảm niềm tin | Ads, landing page, demo, CS | Chỉ tính quảng cáo | Channel |\n| Moment of truth | Khoảnh khắc quyết định | Điểm khách hình thành niềm tin hoặc thất vọng | Trải nghiệm then chốt |
